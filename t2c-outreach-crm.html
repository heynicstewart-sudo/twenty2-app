function handleSalesTranscriptFile(event){
  const file = event.target.files && event.target.files[0];
  event.target.value = '';
  if(!file) return;
  if(file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf')){
    const reader = new FileReader();
    reader.onload = () => {
      const match = String(reader.result).match(/^data:([^;]+);base64,(.*)$/);
      if(match){
        window.__salesTranscriptFile = { mediaType:'application/pdf', base64: match[2], name:file.name };
        const el = document.getElementById('salesTranscriptFilePreview');
        if(el) el.innerHTML = `<span class="tag tag-connected">${esc(file.name)} attached</span> <button class="btn btn-ghost btn-sm" onclick="clearSalesTranscriptFile()"><i class="ti ti-x"></i></button>`;
      }
    };
    reader.readAsDataURL(file);
  } else {
    const reader = new FileReader();
    reader.onload = () => {
      const textEl = document.getElementById('salesTranscriptText');
      if(textEl) textEl.value = String(reader.result);
      window.__salesTranscriptFile = null;
      const el = document.getElementById('salesTranscriptFilePreview');
      if(el) el.innerHTML = `<span class="muted">${esc(file.name)} loaded into the text field</span>`;
    };
    reader.readAsText(file);
  }
}
function clearSalesTranscriptFile(){
  window.__salesTranscriptFile = null;
  const el = document.getElementById('salesTranscriptFilePreview');
  if(el) el.innerHTML = '';
}

async function analyzeSalesTranscript(campaignId){
  const campaign = state.campaigns.find(c => c.id === campaignId);
  if(!campaign) return;
  const text = (document.getElementById('salesTranscriptText')?.value || '').trim();
  const file = window.__salesTranscriptFile;
  if(!text && !file){ toast('Paste a transcript or upload a file first', 'warn'); return; }

  const btn = document.getElementById('analyzeTranscriptBtn');
  const original = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<i class="ti ti-loader-2"></i> Scoring against Strategy...';

  try {
    const res = await fetch(`/api/campaign/${encodeURIComponent(campaign.name)}/sales/analyze-transcript`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        campaignId: campaign.id,
        transcript: file ? undefined : text,
        fileBase64: file ? file.base64 : undefined,
        fileMediaType: file ? file.mediaType : undefined,
        strategy: {
          goal: campaign.goal,
          targetSegmentSummary: campaign.targetSegmentSummary,
          pitchAngle: campaign.pitchAngle,
          objectionHandling: campaign.objectionHandling,
          sequence: campaign.sequence
        }
      })
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || ('Request failed with status '+res.status));

    const analysis = { id: uid('ta'), date: isoDate(TODAY), summary: data.summary||'', scriptAdherence: data.scriptAdherence||'', ctasUsed: data.ctasUsed||[], objectionsRaised: data.objectionsRaised||[] };
    if(!campaign.transcriptAnalyses) campaign.transcriptAnalyses = [];
    campaign.transcriptAnalyses.push(analysis);

    toast('Transcript scored and saved to Airtable', 'success');
    const textEl = document.getElementById('salesTranscriptText');
    if(textEl) textEl.value = '';
    clearSalesTranscriptFile();
    renderPage();
  } catch(err){
    const resultEl = document.getElementById('salesTranscriptResult');
    if(resultEl) resultEl.innerHTML = `<p class="muted" style="font-size:12.5px;">Could not analyse: ${esc(err.message)}</p>`;
    toast('Could not analyse transcript: ' + err.message, 'warn');
    btn.disabled = false;
    btn.innerHTML = original;
  }
}

/* ---- Status transitions + Airtable sync ---- */
// The status badge on the campaign detail header is itself the trigger -
// clicking it opens a small dropdown (same positioned-div pattern as
// showContextMenu/closeContextMenu) offering all four status values;
// picking one writes straight to Airtable via syncCampaignStatusToAirtable,
// same as the single-status transitions this replaced used to.

function toggleCampaignStatusMenu(e, campaignId){
  e.stopPropagation();
  closeCampaignStatusMenu();
  const campaign = state.campaigns.find(c => c.id === campaignId);
  if(!campaign) return;
  const menu = document.createElement('div');
  menu.className = 'ctx-menu';
  menu.id = 'campaignStatusMenu';
  const rect = e.target.closest('.campaign-status').getBoundingClientRect();
  menu.style.left = rect.left + 'px';
  menu.style.top = (rect.bottom + 4) + 'px';
  menu.innerHTML = CAMPAIGN_STATUS_OPTIONS.map(s => `<div class="ctx-item" onclick="setCampaignStatus('${campaignId}','${s}')">${s===campaign.status?'<i class="ti ti-check"></i>':'<span style="width:16px;display:inline-block;"></span>'} ${s}</div>`).join('');
  document.body.appendChild(menu);
  setTimeout(()=>document.addEventListener('click', closeCampaignStatusMenu, { once:true }), 0);
}
function closeCampaignStatusMenu(){ const m = document.getElementById('campaignStatusMenu'); if(m) m.remove(); }

function setCampaignStatus(campaignId, status){
  closeCampaignStatusMenu();
  const campaign = state.campaigns.find(c => c.id === campaignId);
  if(!campaign || campaign.status === status) return;
  campaign.status = status;
  if(status === 'Live') campaign.liveDate = isoDate(TODAY);
  if(status === 'Past') campaign.endedDate = isoDate(TODAY);
  campaign.updatedAt = isoDate(TODAY);
  syncCampaignStatusToAirtable(campaign);
  toast(`Campaign "${campaign.name}" set to ${status}`, 'success');
  renderPage();
}

function confirmDeleteCampaign(campaignId){
  const campaign = state.campaigns.find(c => c.id === campaignId);
  if(!campaign) return;
  const body = `<p style="font-size:13px;">Delete this campaign? This cannot be undone.</p>`;
  const footer = `
    <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary" id="confirmDeleteCampaignBtn" style="background:var(--danger);border-color:var(--danger);" onclick="deleteCampaignConfirmed('${campaignId}')"><i class="ti ti-trash"></i> Delete</button>
  `;
  openModal(`Delete "${esc(campaign.name)}"`, body, footer);
}

async function deleteCampaignConfirmed(campaignId){
  const campaign = state.campaigns.find(c => c.id === campaignId);
  if(!campaign) return;
  const btn = document.getElementById('confirmDeleteCampaignBtn');
  if(btn){ btn.disabled = true; btn.innerHTML = '<i class="ti ti-loader-2"></i> Deleting...'; }
  try {
    const res = await fetch(`/api/campaign/${encodeURIComponent(campaign.name)}`, { method: 'DELETE' });
    const json = await res.json();
    if(!res.ok || !json.success) throw new Error(json.error || 'Delete failed');
    state.campaigns = state.campaigns.filter(c => c.id !== campaignId);
    closeModal();
    toast(`Campaign "${campaign.name}" deleted`, 'success');
    backToCampaignList();
  } catch(err){
    toast('Could not delete campaign: ' + err.message, 'warn');
    if(btn){ btn.disabled = false; btn.innerHTML = '<i class="ti ti-trash"></i> Delete'; }
  }
}

function formatSequenceForAirtable(sequence){
  return CAMPAIGN_STAGE_META.map(([key,label]) => {
    const stage = sequence[key];
    if(!stage) return '';
    return `${label} (${stage.type || 'LinkedIn message'}, ${stage.timing || 'timing not set'}):\n${stage.content || ''}`;
  }).filter(Boolean).join('\n\n');
}

function syncCampaignToAirtable(campaign){
  const contactNames = state.contacts.filter(c => (campaign.contactIds||[]).includes(c.id)).map(c => c.name);
  fetch('/api/airtable/campaign', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      name: campaign.name,
      goal: campaign.goal,
      product: campaign.product || '',
      targetIcp: campaign.targetSegmentSummary,
      contactIds: contactNames,
      sequenceTemplates: formatSequenceForAirtable(campaign.sequence),
      strategyNotes: campaign.strategyBrief,
      pitchAngle: campaign.pitchAngle || '',
      objectionHandling: campaign.objectionHandling || '',
      successMetric: campaign.successMetric || '',
      startDate: campaign.createdAt,
      status: campaign.status,
      ctas: campaign.ctas || ''
    })
  }).catch(err => console.warn('Airtable campaign sync failed:', err.message));
}

// Creates a Campaign Contacts junction row (Airtable) for each contact the
// moment they join a campaign, whether via the Grid tab (linking/creating a
// grid) or the Roadmap tab's Add contacts modal - so every campaign member
// has a Sequence Stage row from day one instead of only once a touch point
// or screenshot happens to create one.
function linkContactsToCampaignAirtable(campaign, contactNames){
  if(!contactNames.length) return;
  fetch(`/api/campaign/${encodeURIComponent(campaign.name)}/contacts/link`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ contactNames })
  }).catch(err => console.warn('Campaign Contacts link sync failed:', err.message));
}

function syncCampaignStatusToAirtable(campaign){
  fetch('/api/campaign/status', {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: campaign.name, status: campaign.status })
  }).catch(err => console.warn('Campaign status sync failed:', err.message));
}

async function loadCalendarEvents(){
  try {

    window.__calendarEvents = json.events;
  } catch(err){
    window.__calendarEvents = { error: err.message };
  }
  if(state.currentPage === 'calendar') renderPage();
}

async function loadRepsCache(){
  try {
    const res = await fetch('/api/reps');
    const json = await res.json();
    if(!res.ok) throw new Error(json.error || ('Request failed with status '+res.status));
    window.__repsCache = json.reps;
  } catch(err){
    window.__repsCache = [];
  }

}

function setCalendarView(view){
  window.__calendarView = view;
  renderPage();
}

function setCalendarAssignee(repId){
  window.__calendarAssigneeFilter = repId || null;
  renderPage();
}

const CALENDAR_ASSIGNEE_PALETTE = ['', 'blue', 'peach', 'grey', 'purple', 'yellow'];
function eventColorByAssignee(assigneeId){
  if(!assigneeId) return 'grey';
  let hash = 0;
  for(let i=0;i<assigneeId.length;i++) hash = (hash * 31 + assigneeId.charCodeAt(i)) >>> 0;
  return CALENDAR_ASSIGNEE_PALETTE[hash % CALENDAR_ASSIGNEE_PALETTE.length];
}

function renderCalendar(){
  const view = window.__calendarView || 'overview';
  const y = state.calYear, m = state.calMonth;
  const first = new Date(y, m, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const monthLabel = first.toLocaleDateString('en-AU',{month:'long', year:'numeric'});
  const cells = [];
  for(let i=0;i<startDow;i++) cells.push(null);
  for(let d=1; d<=daysInMonth; d++) cells.push(d);

  const eventsRaw = window.__calendarEvents;
  const loading = eventsRaw === undefined;
  const errored = eventsRaw && eventsRaw.error;
  let events = loading || errored ? [] : eventsRaw;
  if(view === 'perAssignee' && window.__calendarAssigneeFilter) events = events.filter(ev => ev.assigneeId === window.__calendarAssigneeFilter);

  const reps = window.__repsCache || [];

  return `
  <div class="seq-tabs">
    <div class="seq-tab ${view==='overview'?'active':''}" onclick="setCalendarView('overview')">Overview</div>
    <div class="seq-tab ${view==='perAssignee'?'active':''}" onclick="setCalendarView('perAssignee')">Per assignee</div>
  </div>
  ${view === 'perAssignee' ? `
  <div class="field" style="max-width:260px;margin-bottom:14px;"><label>Rep</label>
    <select onchange="setCalendarAssignee(this.value)">
      <option value="">All reps</option>
      ${reps.map(r=>`<option value="${r.id}" ${window.__calendarAssigneeFilter===r.id?'selected':''}>${esc(r.name)}</option>`).join('')}
    </select>
  </div>` : ''}
  <div class="cal-header">
    <div style="font-size:16px;font-weight:800;">${monthLabel}</div>
    <div class="cal-nav">
      <button class="btn btn-secondary btn-sm" onclick="calNav(-1)"><i class="ti ti-chevron-left"></i></button>
      <button class="btn btn-secondary btn-sm" onclick="calToday()">Today</button>
      <button class="btn btn-secondary btn-sm" onclick="calNav(1)"><i class="ti ti-chevron-right"></i></button>
    </div>
  </div>
  ${loading ? '<div class="muted"><i class="ti ti-loader-2"></i> Loading meetings...</div>' : ''}
  ${errored ? `<div class="muted">Could not load meetings: ${esc(eventsRaw.error)}</div>` : ''}
  <div class="cal-grid">
    ${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}
    ${cells.map(d => {
      if(d===null) return '<div class="cal-cell empty"></div>';
      const dateStr = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const isToday = dateStr === isoDate(TODAY);
      const dayEvents = events.filter(ev => ev.date === dateStr);
      return `<div class="cal-cell ${isToday?'today':''}">
        <div class="cal-date">${d}</div>
        ${dayEvents.map(ev => ev.type === 'reminder' ? `<div class="event-chip reminder-chip" onclick="openReminderConfirm('${ev.reminderId}')"><i class="ti ti-bell" style="font-size:10px;"></i> ${esc((ev.description||'').slice(0,28))}
          <div class="event-tooltip">${esc(ev.description)}<br>${ev.contactName?esc(ev.contactName):(ev.companyName?esc(ev.companyName):'')}${ev.campaignName?' · '+esc(ev.campaignName):''}, ${fmtDate(ev.date)}</div>
        </div>` : `<div class="event-chip ${eventColorByAssignee(ev.assigneeId)}" onclick="openDealNotesModal('${ev.dealId}')">${esc(firstName(ev.contactName))} · ${esc(ev.stage)}
          <div class="event-tooltip">${esc(ev.contactName)} — ${esc(ev.companyName)}<br>${esc(ev.campaignName)} · ${esc(ev.stage)}<br>${ev.assigneeName?esc(ev.assigneeName):'Unassigned'}, ${fmtDate(ev.date)}</div>
        </div>`).join('')}
      </div>`;
    }).join('')}
  </div>
  `;
}

function openDealNotesModal(dealId){
  const ev = (window.__calendarEvents && window.__calendarEvents.find) ? window.__calendarEvents.find(e => e.dealId === dealId) : null;

function calNav(dir){
  state.calMonth += dir;
  if(state.calMonth < 0){ state.calMonth = 11; state.calYear--; }

function calToday(){ state.calMonth = TODAY.getMonth(); state.calYear = TODAY.getFullYear(); renderPage(); }

// Reminders have no notes thread like deals do, so clicking one on the
// calendar gets a small mark-done/delete confirm instead of the full
// openDealNotesModal flow.
function openReminderConfirm(reminderId){
  const ev = (window.__calendarEvents && window.__calendarEvents.find) ? window.__calendarEvents.find(e => e.type === 'reminder' && e.reminderId === reminderId) : null;
  const header = ev ? `
    <div style="margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border);font-size:12.5px;">
      <div><strong>${esc(ev.description)}</strong></div>

    </div>` : '';
  const footer = `
    <button class="btn btn-secondary" onclick="closeModal()">Close</button>

function deleteReminder(reminderId){
  fetch(`/api/reminders/${reminderId}`, { method:'DELETE' }).then(res=>res.json()).then(data=>{
    if(!data.success){ toast('Could not remove reminder', 'warn'); return; }
    closeModal();
    if(Array.isArray(window.__calendarEvents)){
      const i = window.__calendarEvents.findIndex(e => e.type==='reminder' && e.reminderId===reminderId);
      if(i>-1) window.__calendarEvents.splice(i,1);
    }
    toast('Reminder removed', 'success');
    renderPage();
  }).catch(err=>toast('Could not remove reminder: '+err.message,'warn'));
}

function renderAnalytics(){
  const contacts = state.contacts;
  const totalFound = contacts.length;
  const connected = contacts.filter(c=>c.connDate).length;
  const acceptRate = totalFound ? Math.round(connected/totalFound*100) : 0;
  let repliesCount=0, sentCount=0;
  contacts.forEach(c=>{ if(c.thread.m1){sentCount++; if(c.thread.m1.replied) repliesCount++;} if(c.thread.m2){sentCount++; if(c.thread.m2.replied) repliesCount++;} });
  const replyRate = sentCount ? Math.round(repliesCount/sentCount*100) : 0;
  const booked = state.bookings.length;
  const conversionRate = connected ? Math.round(booked/connected*100) : 0;
  const h = computeHealth();
  const dropped = state.deadContacts.length;

  const toneRows = [
    { tone:'Peer to peer', sent: contacts.filter(c=>c.seqId==='seniorLeaders' && (c.thread.m1||c.thread.m2)).length, booked: state.bookings.filter(b=>state.contacts.find(c=>c.id===b.contactId)?.seqId==='seniorLeaders').length },
    { tone:'Warm consultant', sent: contacts.filter(c=>c.seqId==='digitalTech' && (c.thread.m1||c.thread.m2)).length, booked: state.bookings.filter(b=>state.contacts.find(c=>c.id===b.contactId)?.seqId==='digitalTech').length },
    { tone:'Low pressure', sent: 0, booked: 0 }
  ];
  const maxSent = Math.max(1, ...toneRows.map(r=>r.sent));

  const ctaCounts = {};
  CTA_OPTIONS.forEach(o => ctaCounts[o] = state.bookings.filter(b=>b.cta===o).length);

  const serviceCounts = {};
  state.settings.services.forEach(s => serviceCounts[s] = state.bookings.filter(b=>b.service===s).length);
  const maxServiceCount = Math.max(1, ...Object.values(serviceCounts));

  const speedBuckets = { '3':0, '9':0, '10':0 };
  contacts.forEach(c=>{
    if(!c.connReqDate || !c.connDate) return;
    const d = daysBetween(c.connReqDate, c.connDate);
    if(d<=3) speedBuckets['3']++; else if(d<=9) speedBuckets['9']++; else speedBuckets['10']++;
  });
  const maxSpeed = Math.max(1, ...Object.values(speedBuckets));

  return `
  <div class="an-stats">
    <div class="an-stat"><div class="num">${totalFound}</div><div class="label">Total found</div></div>
    <div class="an-stat"><div class="num">${connected}</div><div class="label">Connected</div><div class="sub">${acceptRate}% accept rate</div></div>
    <div class="an-stat"><div class="num">${repliesCount}</div><div class="label">Replies</div><div class="sub">${replyRate}% reply rate</div></div>
    <div class="an-stat"><div class="num">${booked}</div><div class="label">Booked</div><div class="sub">${conversionRate}% conversion</div></div>
    <div class="an-stat"><div class="num">${h.avgDays}d</div><div class="label">Avg days to connect</div></div>
    <div class="an-stat"><div class="num">${dropped}</div><div class="label">Dropped</div></div>
  </div>

  <div class="two-col">
    <div class="card">
      <div class="section-title"><i class="ti ti-message-2"></i> Strategy tally</div>
      ${toneRows.map(r => `
        <div class="bar-row">
          <div class="bar-row-head"><span>${r.tone}</span><span class="muted">${r.sent} sent · ${r.booked} booked</span></div>
          <div class="bar-track"><div class="bar-fill" style="width:${(r.sent/maxSent*100)}%"></div></div>
        </div>
      `).join('')}
    </div>
    <div class="card">
      <div class="section-title"><i class="ti ti-target-arrow"></i> CTA performance</div>
      ${CTA_OPTIONS.map(o => `
        <div class="cta-row"><span>${esc(o)}</span><span class="count-pill ${ctaCounts[o]>0?'has':''}">${ctaCounts[o]}</span></div>
      `).join('')}
    </div>
  </div>

  <div class="two-col">
    <div class="card">
      <div class="section-title"><i class="ti ti-briefcase"></i> Bookings by service</div>
      ${state.settings.services.map(s => `
        <div class="bar-row">
          <div class="bar-row-head"><span>${esc(s)}</span><span class="muted">${serviceCounts[s]}</span></div>
          <div class="bar-track"><div class="bar-fill secondary" style="width:${(serviceCounts[s]/maxServiceCount*100)}%"></div></div>
        </div>
      `).join('')}
    </div>
    <div class="card">
      <div class="section-title"><i class="ti ti-gauge"></i> Connection speed</div>
      <div class="bar-row"><div class="bar-row-head"><span>Within 3 days</span><span class="muted">${speedBuckets['3']}</span></div><div class="bar-track"><div class="bar-fill" style="width:${speedBuckets['3']/maxSpeed*100}%"></div></div></div>
      <div class="bar-row"><div class="bar-row-head"><span>4 to 9 days</span><span class="muted">${speedBuckets['9']}</span></div><div class="bar-track"><div class="bar-fill" style="width:${speedBuckets['9']/maxSpeed*100}%"></div></div></div>
      <div class="bar-row"><div class="bar-row-head"><span>10+ days</span><span class="muted">${speedBuckets['10']}</span></div><div class="bar-track"><div class="bar-fill" style="width:${speedBuckets['10']/maxSpeed*100}%"></div></div></div>
    </div>
  </div>

  <div class="card" style="margin-bottom:16px;">
    <div class="section-title"><i class="ti ti-notes"></i> What converted contacts</div>
    <table style="width:100%;border-collapse:collapse;">
      <thead><tr>
        <th style="text-align:left;padding:8px;font-size:11.5px;color:var(--muted);border-bottom:1px solid var(--border);">Contact</th>
        <th style="text-align:left;padding:8px;font-size:11.5px;color:var(--muted);border-bottom:1px solid var(--border);">Conversion notes</th>
        <th style="text-align:left;padding:8px;font-size:11.5px;color:var(--muted);border-bottom:1px solid var(--border);">CTA used</th>
      </tr></thead>
      <tbody>
      ${state.bookings.length ? state.bookings.map(b => `<tr>
        <td style="padding:8px;border-bottom:1px solid var(--border);font-weight:700;">${esc(b.name)}</td>
        <td style="padding:8px;border-bottom:1px solid var(--border);">${esc((b.notes||'').slice(0,90))}${(b.notes||'').length>90?'…':''}</td>
        <td style="padding:8px;border-bottom:1px solid var(--border);"><span class="pill">${esc(b.cta)}</span></td>
      </tr>`).join('') : '<tr><td colspan="3" class="empty-state">No bookings yet</td></tr>'}
      </tbody>
    </table>
  </div>

  <div class="card">
    <div class="section-title"><i class="ti ti-bulb"></i> Strategy insights</div>
    <div id="analysisResult" style="margin-top:16px;">${state.lastAnalysis ? renderAnalysisBlocks(state.lastAnalysis) : '<span class="muted" style="font-size:12.5px;">Run Engine above to see strategy insights.</span>'}</div>
  </div>
  `;
}

    ],

    ],
    recommendations: [
      "Prioritise a follow-up push on the Digital and Tech sequence to get its first booking.",
      "Set a CTA the moment message 2 goes out, don't leave it until the reply comes in.",
      "Revisit connection requests sitting past 7 days before they hit the 10 day cutoff."
    ]
  });

  const raw = await callAI(prompt, 1000, null);
  let parsed = null;
  if(raw){
    try {
      const jsonMatch = raw.match(/\{[\s\S]*\}/);
      parsed = JSON.parse(jsonMatch ? jsonMatch[0] : raw);
    } catch(e){ parsed = null; }
  }
  if(!parsed) parsed = fallback();

  parsed.runAt = TODAY.toLocaleString('en-AU',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
  parsed.notesCount = state.bookings.filter(b=>b.notes).length;
  state.lastAnalysis = parsed;

  resultEl.innerHTML = renderAnalysisBlocks(parsed);
  toast('Strategy analysis complete', 'success');
}

async function copyIntelDraft(idx){
  const draft = (window.__intelDrafts || [])[idx];
  if(!draft || !draft.draft) return;
  try {
    await navigator.clipboard.writeText(draft.draft);
  } catch(err){
    const ta = document.createElement('textarea');
    ta.value = draft.draft;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  }
  toast('Draft copied to clipboard', 'success');
}

const LEARNING_CONFIG = {
  customers: { endpoint: '/api/learn/customers', btnId: 'learnCustomersBtn', resultId: 'learnCustomersResult', label: 'Customer' },
  deals: { endpoint: '/api/learn/deals', btnId: 'learnDealsBtn', resultId: 'learnDealsResult', label: 'Deal' }

function csvRowsToObjects(rows){
  if(rows.length < 2) return [];
  const headers = rows[0].map(h => h.trim());
  return rows.slice(1).map(row => {
    const obj = {};
    headers.forEach((h,i) => { obj[h || `col${i+1}`] = (row[i] || '').trim(); });
    return obj;
  });
}

function handleLearningUpload(event, kind){
  const file = event.target.files && event.target.files[0];
  event.target.value = '';
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const rows = parseCsv(String(reader.result));
    const records = csvRowsToObjects(rows);
    if(!records.length){ toast('That CSV looks empty', 'warn'); return; }
    runLearningAnalysis(kind, records);
  };
  reader.onerror = () => toast('Could not read that file', 'warn');
  reader.readAsText(file);
}

async function runLearningAnalysis(kind, records){
  const cfg = LEARNING_CONFIG[kind];
  const btn = document.getElementById(cfg.btnId);
  const resultEl = document.getElementById(cfg.resultId);
  const original = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<i class="ti ti-loader-2"></i> Analysing...';
  resultEl.innerHTML = '';

  try {
    const res = await fetch(cfg.endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ records })
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || ('Request failed with status '+res.status));
    renderLearningResult(kind, data, records.length);
    toast(`${cfg.label} analysis complete`, 'success');
  } catch(err){
    resultEl.innerHTML = `<p class="muted" style="font-size:12px;color:#b3413a;">Could not analyse that file: ${esc(err.message)}</p>`;
    toast('Learning upload failed: ' + err.message, 'warn');
  } finally {
    btn.disabled = false;
    btn.innerHTML = original;
  }
}

function learningListSection(title, items){
  if(!Array.isArray(items) || !items.length) return '';
  return `<h5>${esc(title)}</h5><ul>${items.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>`;
}

function renderLearningResult(kind, data, recordCount){
  const cfg = LEARNING_CONFIG[kind];
  const el = document.getElementById(cfg.resultId);
  if(!el) return;
  let html = data.summary ? `<p style="font-size:12.5px;">${esc(data.summary)}</p>` : '';
  if(kind === 'customers'){
    html += learningListSection('Top ICP profiles', data.icpProfiles);
    html += learningListSection('Deal characteristics', data.dealCharacteristics);
    html += learningListSection('Patterns', data.patterns);
  } else {
    html += learningListSection('Product-ICP fit', data.productIcpMatches);
    html += learningListSection('Touch points before close', data.touchPointsBeforeClose);
    html += learningListSection('Best industries', data.bestIndustries);
    html += learningListSection('Seasonal patterns', data.seasonalPatterns);
  }
  html += `<div class="learning-meta muted">Based on ${recordCount} uploaded rows &middot; saved to Airtable Learning Data</div>`;
  el.innerHTML = html;
}

  if(signals.error) return `<div class="muted">Could not load signals: ${esc(signals.error)}</div>`;
  if(!signals.length) return '<div class="empty-state">No new content signals. Keep logging touch points and the system will surface ideas automatically.</div>';
  return signals.map(s => `
    <div class="signal-card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;">
        <div style="flex:1;min-width:220px;">
          <div style="font-weight:700;font-size:13.5px;margin-bottom:4px;">${esc(s.theme)}</div>
          <div class="muted" style="font-size:11.5px;">
            <span class="format-dot ${CONTENT_FORMAT_META[s.suggestedFormat] ? CONTENT_FORMAT_META[s.suggestedFormat].dotClass : ''}"></span>
            Suggested: ${esc(s.suggestedFormat || '—')} &middot; Mentioned by ${s.frequency || (s.relatedContactNames.length + s.relatedCompanyNames.length)} contact${(s.frequency||0)===1?'':'s'}/compan${(s.frequency||0)===1?'y':'ies'}
          </div>
          ${s.relatedContactNames.length || s.relatedCompanyNames.length ? `<div style="margin-top:6px;">
            ${s.relatedContactNames.map(n=>`<span class="pill" style="margin:2px 4px 0 0;">${esc(n)}</span>`).join('')}
            ${s.relatedCompanyNames.map(n=>`<span class="pill" style="background:#fdf4e6;color:#8a6a1f;margin:2px 4px 0 0;">${esc(n)}</span>`).join('')}
          </div>` : ''}
          ${s.suggestedIcpTargets ? `<div class="muted" style="font-size:11px;margin-top:6px;">ICP: ${esc(s.suggestedIcpTargets)}</div>` : ''}
        </div>
        <div style="display:flex;gap:6px;flex-shrink:0;">
          <button class="btn btn-primary btn-sm" onclick="draftFromSignal('${s.id}', ${opts.campaignName ? `'${esc(opts.campaignName)}'` : 'null'})"><i class="ti ti-sparkles"></i> Draft this</button>
          <button class="btn btn-ghost btn-sm" onclick="dismissContentSignal('${s.id}')"><i class="ti ti-x"></i> Dismiss</button>
        </div>
      </div>
    </div>
  `).join('');
}

function renderContentSignalsTab(){
  return `
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
      <div class="section-title" style="margin-bottom:0;"><i class="ti ti-bulb"></i> Content signals</div>
      <button class="btn btn-secondary btn-sm" onclick="runDetectContentSignals()" id="detectSignalsBtn"><i class="ti ti-refresh"></i> Scan now</button>
    </div>
    ${renderContentSignalsList(window.__contentSignals)}
  </div>
  `;
}

async function runDetectContentSignals(){
  const btn = document.getElementById('detectSignalsBtn');
  if(btn){ btn.disabled = true; btn.innerHTML = '<i class="ti ti-loader-2"></i> Scanning...'; }
  try {
    const res = await fetch('/api/content/detect-signals', { method:'POST' });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || 'Request failed');
    toast(data.created ? `${data.created} new signal${data.created===1?'':'s'} found` : 'No new signals right now', 'success');
    window.__contentSignals = undefined;
    window.__homeContentSignals = undefined;
    loadContentSignals();
  } catch(err){
    toast('Could not scan for signals: ' + err.message, 'warn');
    if(btn){ btn.disabled = false; btn.innerHTML = '<i class="ti ti-refresh"></i> Scan now'; }
  }
}

function dismissContentSignal(signalId){
  fetch(`/api/content/signals/${signalId}`, {
    method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ status:'Dismissed' })
  }).then(res=>res.json()).then(data=>{
    if(!data.success){ toast('Could not dismiss signal', 'warn'); return; }
    [window.__contentSignals, window.__homeContentSignals, window.__campaignContentSignals].forEach(list=>{
      if(Array.isArray(list)){ const i = list.findIndex(s=>s.id===signalId); if(i>-1) list.splice(i,1); }
    });
    renderPage();
  }).catch(err=>toast('Could not dismiss signal: '+err.message,'warn'));
}

function draftFromSignal(signalId, campaignName){
  const allLists = [window.__contentSignals, window.__homeContentSignals, window.__campaignContentSignals].filter(Array.isArray);
  let signal = null;
  for(const list of allLists){ signal = list.find(s=>s.id===signalId); if(signal) break; }
  // Only re-navigates the top-level Content page's sub-tab - if this was
  // called from a campaign's Content sub-tab, campaignView/detailTab are
  // untouched, so the modal opens right where the user already is.
  if(state.currentPage !== 'campaigns'){
    state.currentPage = 'content';
    window.__contentSubTab = 'drafts';
  }
  openNewContentDraftModal({ signalId, signalTheme: signal ? signal.theme : '', suggestedFormat: signal ? signal.suggestedFormat : '', campaignName: campaignName || null });
}

/* ---- Draft Centre ---- */

function contentStatusTag(status){
  return `<span class="tag ${CONTENT_STATUS_TAG_CLASS[status]||'tag-pending'}">${esc(status||'Draft')}</span>`;
}

function renderContentDraftsList(drafts, opts){
  opts = opts || {};
  if(!drafts) return '<div class="muted"><i class="ti ti-loader-2"></i> Loading drafts...</div>';
  if(drafts.error) return `<div class="muted">Could not load drafts: ${esc(drafts.error)}</div>`;
  if(!drafts.length) return '<div class="empty-state">No content drafted yet.</div>';
  return `<div class="mini-cards" style="grid-template-columns:repeat(auto-fill,minmax(260px,1fr));">
    ${drafts.map(d => `
      <div class="card" style="text-align:left;cursor:pointer;padding:14px;" onclick="openContentEditor('${d.id}')">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
          <div style="font-weight:700;font-size:13px;flex:1;">${esc(d.title||'Untitled')}</div>
          ${contentStatusTag(d.status)}
        </div>
        <div class="muted" style="font-size:11.5px;margin-top:6px;">
          <span class="format-dot ${CONTENT_FORMAT_META[d.format] ? CONTENT_FORMAT_META[d.format].dotClass : ''}"></span>
          ${esc(CONTENT_FORMAT_META[d.format] ? CONTENT_FORMAT_META[d.format].label : d.format)}
          ${d.campaignName ? ` &middot; ${esc(d.campaignName)}` : ''}
        </div>
        ${d.targetIcp ? `<div class="muted" style="font-size:11px;margin-top:6px;">ICP: ${esc(d.targetIcp.slice(0,60))}${d.targetIcp.length>60?'…':''}</div>` : ''}
        ${d.targetCompanyNames.length ? `<div style="margin-top:6px;">${d.targetCompanyNames.slice(0,3).map(n=>`<span class="pill" style="margin:2px 4px 0 0;">${esc(n)}</span>`).join('')}</div>` : ''}
      </div>
    `).join('')}
  </div>`;
}

function renderContentDraftsTab(){
  if(window.__contentEditorId) return renderContentEditorView(window.__contentDrafts);
  const drafts = window.__contentDrafts;
  const filterFormat = window.__contentDraftFilterFormat || '';
  const filterStatus = window.__contentDraftFilterStatus || '';
  const filtered = Array.isArray(drafts) ? drafts.filter(d => (!filterFormat || d.format===filterFormat) && (!filterStatus || d.status===filterStatus)) : drafts;
  return `
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px;">
      <div class="section-title" style="margin-bottom:0;"><i class="ti ti-notes"></i> Draft Centre</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <select onchange="window.__contentDraftFilterFormat=this.value;renderPage();" style="width:auto;">
          <option value="">All formats</option>
          ${CONTENT_FORMATS.map(f=>`<option value="${f}" ${filterFormat===f?'selected':''}>${CONTENT_FORMAT_META[f].label}</option>`).join('')}
        </select>
        <select onchange="window.__contentDraftFilterStatus=this.value;renderPage();" style="width:auto;">
          <option value="">All statuses</option>
          ${['Draft','Ready','Scheduled','Sent'].map(s=>`<option value="${s}" ${filterStatus===s?'selected':''}>${s}</option>`).join('')}
        </select>
        <button class="btn btn-primary btn-sm" onclick="openNewContentDraftModal({})"><i class="ti ti-plus"></i> New draft</button>
      </div>
    </div>
    ${renderContentDraftsList(filtered)}
  </div>
  `;
}

function openNewContentDraftModal(prefill){
  prefill = prefill || {};
  const campaignOptions = state.campaigns.map(c => `<option value="${esc(c.name)}" ${prefill.campaignName===c.name?'selected':''}>${esc(c.name)}</option>`).join('');
  const body = `
    ${prefill.signalTheme ? `<div class="muted" style="font-size:12px;margin-bottom:10px;"><i class="ti ti-bulb"></i> Drafting from signal: <strong>${esc(prefill.signalTheme)}</strong></div>` : ''}
    <div class="field"><label>Format</label>
      <select id="newDraftFormat">
        ${CONTENT_FORMATS.map(f=>`<option value="${f}" ${(prefill.suggestedFormat||'LinkedIn Post')===f?'selected':''}>${CONTENT_FORMAT_META[f].label}</option>`).join('')}
      </select>
    </div>
    ${!prefill.signalId ? `<div class="field"><label>Topic</label><input id="newDraftTopic" placeholder="What should this be about?"></div>` : `<input type="hidden" id="newDraftTopic" value="">`}
    <div class="field"><label>Campaign (optional)</label>
      <select id="newDraftCampaign"><option value="">— None —</option>${campaignOptions}</select>
    </div>
    <div class="field"><label>Length preference</label>
      <select id="newDraftLength"><option value="">Use account default</option><option value="Short">Short</option><option value="Medium">Medium</option><option value="Long">Long</option></select>
    </div>
  `;
  const footer = `
    <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary" id="createDraftBtn" onclick="createContentDraft('${prefill.signalId||''}')"><i class="ti ti-sparkles"></i> Draft it</button>
  `;
  openModal('New draft', body, footer);
}

async function createContentDraft(signalId){
  const btn = document.getElementById('createDraftBtn');
  const format = document.getElementById('newDraftFormat').value;
  const topic = document.getElementById('newDraftTopic').value.trim();
  const campaignName = document.getElementById('newDraftCampaign').value;
  const lengthPreference = document.getElementById('newDraftLength').value;
  if(!signalId && !topic){ toast('Enter a topic', 'warn'); return; }
  if(btn){ btn.disabled = true; btn.innerHTML = '<i class="ti ti-loader-2"></i> Drafting...'; }
  try {
    const res = await fetch('/api/content/draft', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ format, topic: topic||undefined, signalId: signalId||undefined, campaignName: campaignName||undefined, lengthPreference: lengthPreference||undefined, mode:'new' })
    });
    const data = await res.json();
    if(!res.ok || !data.success) throw new Error(data.error || data.reason || 'Draft failed');
    closeModal();
    toast('Draft created', 'success');
    window.__contentDrafts = undefined;
    window.__campaignContentDrafts = undefined;
    window.__contentSignals = undefined;
    window.__homeContentSignals = undefined;
    window.__campaignContentSignals = undefined;
    await loadContentDrafts();
    openContentEditor(data.contentId);
  } catch(err){
    toast('Could not create draft: ' + err.message, 'warn');
    if(btn){ btn.disabled = false; btn.innerHTML = '<i class="ti ti-sparkles"></i> Draft it'; }
  }
}

/* ---- Editor view ---- */

function openContentEditor(contentId){
  window.__contentEditorId = contentId;
  window.__contentSendToContacts = null;
  renderPage();
}
function closeContentEditor(){
  window.__contentEditorId = null;
  renderPage();
}

function findContentDraftById(drafts, id){
  return Array.isArray(drafts) ? drafts.find(d=>d.id===id) : null;
}

function renderContentEditorView(draftsList){
  const draft = findContentDraftById(draftsList, window.__contentEditorId) || findContentDraftById(window.__campaignContentDrafts, window.__contentEditorId);
  if(!draft) return `<div class="card"><div class="muted">Draft not found.</div><button class="btn btn-secondary btn-sm" style="margin-top:10px;" onclick="closeContentEditor()">Back</button></div>`;

  const signalsPool = [window.__contentSignals, window.__homeContentSignals, window.__campaignContentSignals].find(l => Array.isArray(l) && l.some(s=>s.id===draft.signalId));
  const signal = signalsPool ? signalsPool.find(s=>s.id===draft.signalId) : null;

  if(window.__contentSendToContacts === null){
    const suggested = new Set();
    if(signal) signal.relatedContactNames.forEach(n=>suggested.add(n));
    if(draft.campaignName){
      const campaign = state.campaigns.find(c=>c.name===draft.campaignName);
      if(campaign) campaignContacts(campaign).forEach(c=>suggested.add(c.name));
    }
    window.__contentSendToContacts = [...suggested];
  }

  const voiceNotesEntries = (draft.voiceNotes||'').split('\n\n').filter(Boolean);

  return `
  <div style="margin-bottom:14px;">
    <button class="btn btn-ghost btn-sm" onclick="closeContentEditor()"><i class="ti ti-arrow-left"></i> Back to drafts</button>
  </div>
  <div class="two-col">
    <div class="card">
      <div class="field"><label>Title</label><input id="editorTitle" value="${esc(draft.title)}"></div>
      <div class="field"><label>Body</label><textarea id="editorBody" rows="16">${esc(draft.body)}</textarea></div>
      <div class="field"><label>Target ICP</label><textarea id="editorTargetIcp" rows="2">${esc(draft.targetIcp)}</textarea></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <button class="btn btn-secondary btn-sm" onclick="saveContentEditorFields('${draft.id}')"><i class="ti ti-device-floppy"></i> Save changes</button>
        <button class="btn btn-secondary btn-sm" onclick="regenerateContentDraft('${draft.id}')" id="regenBtn"><i class="ti ti-refresh"></i> Regenerate</button>
        <button class="btn btn-primary btn-sm" onclick="markContentReady('${draft.id}')" id="readyBtn" ${draft.status==='Ready'?'disabled':''}><i class="ti ti-check"></i> ${draft.status==='Ready'?'Ready':'Mark as Ready'}</button>
      </div>
      <div class="field" style="margin-top:14px;"><label>Refine with instructions</label>
        <textarea id="editorRefineInstructions" rows="2" placeholder="e.g. make it shorter, more direct, focus on energy sector"></textarea>
        <button class="btn btn-secondary btn-sm" style="margin-top:8px;" onclick="refineContentDraft('${draft.id}')" id="refineBtn"><i class="ti ti-wand"></i> Refine</button>
      </div>
    </div>
    <div class="card">
      <div class="section-title" style="font-size:13px;margin-bottom:10px;"><i class="ti ti-info-circle"></i> Informed by</div>
      <div style="font-size:12.5px;margin-bottom:10px;">
        <span class="format-dot ${CONTENT_FORMAT_META[draft.format] ? CONTENT_FORMAT_META[draft.format].dotClass : ''}"></span>
        ${esc(CONTENT_FORMAT_META[draft.format] ? CONTENT_FORMAT_META[draft.format].label : draft.format)}
        ${contentStatusTag(draft.status)}
      </div>
      ${draft.campaignName ? `<div style="margin-bottom:8px;"><span class="pill" style="background:#e2f2fa;color:#0d6a96;"><i class="ti ti-rocket" style="font-size:11px;"></i> ${esc(draft.campaignName)}</span></div>` : ''}
      ${signal ? `
        <div class="muted" style="font-size:11.5px;margin-bottom:4px;font-weight:700;">Detected signal</div>
        <div style="font-size:12.5px;margin-bottom:4px;">${esc(signal.theme)}</div>
        <div class="muted" style="font-size:11px;margin-bottom:10px;">Mentioned by ${signal.relatedContactNames.length} contact(s), ${signal.relatedCompanyNames.length} compan${signal.relatedCompanyNames.length===1?'y':'ies'}</div>
      ` : ''}
      ${draft.targetCompanyNames.length ? `<div class="muted" style="font-size:11.5px;margin-bottom:4px;font-weight:700;">Relevant companies</div><div style="margin-bottom:10px;">${draft.targetCompanyNames.map(n=>`<span class="pill" style="margin:2px 4px 0 0;">${esc(n)}</span>`).join('')}</div>` : ''}

      <div class="muted" style="font-size:11.5px;margin-top:14px;margin-bottom:4px;font-weight:700;">Refinement history</div>
      ${voiceNotesEntries.length ? voiceNotesEntries.map(v=>`<div style="font-size:11.5px;padding:6px 0;border-bottom:1px solid var(--border);">${esc(v)}</div>`).join('') : '<div class="muted" style="font-size:11.5px;">No refinements yet.</div>'}

      <div class="muted" style="font-size:11.5px;margin-top:16px;margin-bottom:6px;font-weight:700;">Send to contacts</div>
      <div id="sendToContactsList">${renderSendToContactsList()}</div>
      <div style="display:flex;gap:6px;margin-top:8px;">
        <input id="sendToContactInput" placeholder="Add a contact name" style="flex:1;">
        <button class="btn btn-secondary btn-sm" onclick="addSendToContact()"><i class="ti ti-plus"></i></button>
      </div>
      <button class="btn btn-ghost btn-sm" style="margin-top:8px;" onclick="copySendToContacts()"><i class="ti ti-copy"></i> Copy list</button>
    </div>
  </div>
  `;
}

function renderSendToContactsList(){
  const list = window.__contentSendToContacts || [];
  if(!list.length) return '<div class="muted" style="font-size:11.5px;">No suggested contacts yet - add some below.</div>';
  return list.map((n,i) => `<span class="pill" style="margin:2px 4px 4px 0;">${esc(n)} <i class="ti ti-x" style="cursor:pointer;margin-left:4px;" onclick="removeSendToContact(${i})"></i></span>`).join('');
}
function addSendToContact(){
  const input = document.getElementById('sendToContactInput');
  const val = input.value.trim();
  if(!val) return;
  window.__contentSendToContacts = window.__contentSendToContacts || [];
  window.__contentSendToContacts.push(val);
  input.value = '';
  document.getElementById('sendToContactsList').innerHTML = renderSendToContactsList();
}
function removeSendToContact(i){
  window.__contentSendToContacts.splice(i,1);
  document.getElementById('sendToContactsList').innerHTML = renderSendToContactsList();
}
function copySendToContacts(){
  const text = (window.__contentSendToContacts||[]).join(', ');
  if(navigator.clipboard) navigator.clipboard.writeText(text).then(()=>toast('Copied', 'success')).catch(()=>toast('Could not copy', 'warn'));
}

function updateCachedDraft(contentId, patch){
  [window.__contentDrafts, window.__campaignContentDrafts].forEach(list => {
    if(!Array.isArray(list)) return;
    const d = list.find(x=>x.id===contentId);
    if(d) Object.assign(d, patch);
  });
}

async function saveContentEditorFields(contentId){
  const title = document.getElementById('editorTitle').value.trim();
  const body = document.getElementById('editorBody').value;
  const targetIcp = document.getElementById('editorTargetIcp').value.trim();
  try {
    const res = await fetch('/api/content/draft', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ mode:'save', contentId, title, body, targetIcp })
    });
    const data = await res.json();
    if(!res.ok || !data.success) throw new Error(data.error || 'Save failed');
    updateCachedDraft(contentId, { title, body, targetIcp });
    toast('Saved', 'success');
    renderPage();
  } catch(err){
    toast('Could not save: ' + err.message, 'warn');
  }
}

async function regenerateContentDraft(contentId){
  const btn = document.getElementById('regenBtn');
  if(btn){ btn.disabled = true; btn.innerHTML = '<i class="ti ti-loader-2"></i> Regenerating...'; }
  try {
    const res = await fetch('/api/content/draft', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ mode:'regenerate', contentId })
    });
    const data = await res.json();
    if(!res.ok || !data.success) throw new Error(data.error || 'Regenerate failed');
    updateCachedDraft(contentId, { title:data.title, body:data.body, status:data.status });
    toast('Regenerated', 'success');
    renderPage();
  } catch(err){
    toast('Could not regenerate: ' + err.message, 'warn');
    if(btn){ btn.disabled = false; btn.innerHTML = '<i class="ti ti-refresh"></i> Regenerate'; }
  }
}

async function refineContentDraft(contentId){
  const instructions = document.getElementById('editorRefineInstructions').value.trim();
  if(!instructions){ toast('Enter refinement instructions', 'warn'); return; }
  const btn = document.getElementById('refineBtn');
  if(btn){ btn.disabled = true; btn.innerHTML = '<i class="ti ti-loader-2"></i> Refining...'; }
  try {
    const res = await fetch('/api/content/draft', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ mode:'refine', contentId, refineInstructions: instructions })
    });
    const data = await res.json();
    if(!res.ok || !data.success) throw new Error(data.error || 'Refine failed');
    const timestamp = new Date().toISOString().slice(0,16).replace('T',' ');
    const logLine = `[${timestamp}] (Refine) Refine with instructions: "${instructions}"`;
    [window.__contentDrafts, window.__campaignContentDrafts].forEach(list => {
      if(!Array.isArray(list)) return;
      const d = list.find(x=>x.id===contentId);
      if(d){ d.title = data.title; d.body = data.body; d.voiceNotes = d.voiceNotes ? d.voiceNotes+'\n\n'+logLine : logLine; }
    });
    document.getElementById('editorRefineInstructions').value = '';
    toast('Refined', 'success');
    renderPage();
  } catch(err){
    toast('Could not refine: ' + err.message, 'warn');
    if(btn){ btn.disabled = false; btn.innerHTML = '<i class="ti ti-wand"></i> Refine'; }
  }
}

async function markContentReady(contentId){
  const btn = document.getElementById('readyBtn');
  if(btn){ btn.disabled = true; btn.innerHTML = '<i class="ti ti-loader-2"></i> Saving...'; }
  try {
    const res = await fetch('/api/content/draft', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ mode:'save', contentId, setStatus:'Ready' })
    });
    const data = await res.json();
    if(!res.ok || !data.success) throw new Error(data.error || 'Failed');
    updateCachedDraft(contentId, { status:'Ready' });
    toast('Marked as Ready', 'success');
    renderPage();
  } catch(err){
    toast('Could not mark Ready: ' + err.message, 'warn');
    if(btn){ btn.disabled = false; btn.innerHTML = '<i class="ti ti-check"></i> Mark as Ready'; }
  }
}

/* ---- Calendar ---- */

function contentCalNav(dir){
  window.__contentCalMonth += dir;
  if(window.__contentCalMonth < 0){ window.__contentCalMonth = 11; window.__contentCalYear--; }
  if(window.__contentCalMonth > 11){ window.__contentCalMonth = 0; window.__contentCalYear++; }
  renderPage();
}
function contentCalToday(){ window.__contentCalMonth = TODAY.getMonth(); window.__contentCalYear = TODAY.getFullYear(); renderPage(); }

function renderContentCalendarTab(){
  if(window.__contentCalYear === undefined){ window.__contentCalYear = TODAY.getFullYear(); window.__contentCalMonth = TODAY.getMonth(); }
  const y = window.__contentCalYear, m = window.__contentCalMonth;
  const first = new Date(y, m, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const monthLabel = first.toLocaleDateString('en-AU',{month:'long', year:'numeric'});
  const cells = [];
  for(let i=0;i<startDow;i++) cells.push(null);
  for(let d=1; d<=daysInMonth; d++) cells.push(d);

  const drafts = Array.isArray(window.__contentDrafts) ? window.__contentDrafts.filter(d=>d.targetPublishDate) : [];
  const cadence = window.__contentSettings && !window.__contentSettings.error ? window.__contentSettings.recommendedCadence : '';

  return `
  <div class="card" style="margin-bottom:16px;">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
      <div style="font-size:12.5px;"><i class="ti ti-bulb"></i> ${cadence ? esc(cadence) : 'No posting cadence recommendation yet.'}</div>
      <button class="btn btn-secondary btn-sm" onclick="refreshContentCadence()" id="cadenceBtn"><i class="ti ti-refresh"></i> Refresh recommendation</button>
    </div>
  </div>
  <div class="card">
    <div class="cal-header">
      <div style="font-size:16px;font-weight:800;">${monthLabel}</div>
      <div class="cal-nav">
        <button class="btn btn-secondary btn-sm" onclick="contentCalNav(-1)"><i class="ti ti-chevron-left"></i></button>
        <button class="btn btn-secondary btn-sm" onclick="contentCalToday()">Today</button>

function renderContentPerformanceSummary(posts){
  if(!Array.isArray(posts) || !posts.length) return '';

  function topByAvg(keyFn){
    const buckets = {};
    posts.forEach(p=>{
      const k = keyFn(p);
      if(!k) return;
      if(!buckets[k]) buckets[k] = { sum:0, count:0 };
      buckets[k].sum += p.engagementScore||0;
      buckets[k].count++;
    });
    return Object.entries(buckets).map(([key,v])=>({ key, avg: v.sum/v.count, count: v.count }));
  }

  const topTopics = topByAvg(p=>p.topic).sort((a,b)=>b.avg-a.avg).slice(0,3);
  const bestFormat = topByAvg(p=>p.format).sort((a,b)=>b.avg-a.avg)[0];
  const bestDay = topByAvg(p=> p.date ? new Date(p.date).toLocaleDateString('en-AU',{weekday:'long'}) : null).sort((a,b)=>b.avg-a.avg)[0];
  const ctaEntries = topByAvg(p=>p.ctaUsed);
  const mostUsedCta = ctaEntries.slice().sort((a,b)=>b.count-a.count)[0];
  const bestConvertingCta = ctaEntries.slice().sort((a,b)=>b.avg-a.avg)[0];

  return `
  <div class="mini-cards" style="margin-bottom:16px;">
    <div class="mini-card" style="text-align:left;">
      <div class="label" style="margin-bottom:6px;">Top topics by avg. engagement</div>
      ${topTopics.length ? topTopics.map(t=>`<div style="font-size:12.5px;">${esc(t.key)} <span class="muted">(${t.avg.toFixed(1)})</span></div>`).join('') : '<div class="muted">—</div>'}
    </div>
    <div class="mini-card">
      <div class="num" style="font-size:16px;">${bestFormat?esc(bestFormat.key):'—'}</div>
      <div class="label">Best performing format</div>
    </div>
    <div class="mini-card">
      <div class="num" style="font-size:16px;">${bestDay?esc(bestDay.key):'—'}</div>
      <div class="label">Best day to post</div>
    </div>
    <div class="mini-card" style="text-align:left;">
      <div class="label" style="margin-bottom:6px;">CTA usage</div>
      <div style="font-size:12.5px;">Most used: ${mostUsedCta?esc(mostUsedCta.key):'—'}</div>
      <div style="font-size:12.5px;">Highest engagement: ${bestConvertingCta?esc(bestConvertingCta.key):'—'}</div>
    </div>
  </div>`;
}

function renderContentPerformanceTable(posts){
  if(!posts) return '<div class="muted"><i class="ti ti-loader-2"></i> Loading...</div>';
  if(posts.error) return `<div class="muted">Could not load performance data: ${esc(posts.error)}</div>`;
  if(!posts.length) return '<div class="empty-state">No analysed posts yet. Click "Load my posts" to pull and score the last month.</div>';

  const sort = window.__contentPerfSort || CONTENT_PERF_SORT_DEFAULT;
  const sorted = posts.slice().sort((a,b)=>{
    let av=a[sort.key], bv=b[sort.key];
    if(sort.key==='date'){ av=new Date(av||0).getTime(); bv=new Date(bv||0).getTime(); }
    else if(typeof av==='string' || typeof bv==='string'){ av=(av||'').toString().toLowerCase(); bv=(bv||'').toString().toLowerCase(); }
    if(av<bv) return sort.dir==='asc'?-1:1;
    if(av>bv) return sort.dir==='asc'?1:-1;
    return 0;
  });

  const cols = [
    ['date','Date'],['topic','Topic'],['whatWorked','What Worked'],['format','Format'],
    ['likes','Likes'],['comments','Comments'],['engagementScore','Engagement Score'],['ctaUsed','CTA Used']
  ];

  return `
  <div class="perf-table-wrap">
  <table class="perf-table">
    <thead><tr>${cols.map(([key,label])=>`<th style="cursor:pointer;" onclick="sortContentPerformance('${key}')">${label}${sort.key===key?(sort.dir==='asc'?' &#9650;':' &#9660;'):''}</th>`).join('')}<th></th></tr></thead>
    <tbody>
      ${sorted.map(p=>`
        <tr style="cursor:pointer;" onclick="showContentPerformanceDetail('${p.id}')">
          <td>${p.date ? esc(new Date(p.date).toLocaleDateString('en-AU')) : '—'}</td>
          <td>${esc(p.topic||'—')}</td>
          <td style="max-width:320px;white-space:normal;">${esc(p.whatWorked||'—')}</td>
          <td>${esc(p.format||'—')}</td>
          <td>${p.likes ?? 0}</td>
          <td>${p.comments ?? 0}</td>
          <td>${p.engagementScore ?? 0}</td>
          <td>${esc(p.ctaUsed||'—')}</td>
          <td><span class="muted" style="font-size:12px;text-decoration:underline;" onclick="event.stopPropagation();showContentPerformanceDetail('${p.id}')">View</span></td>
        </tr>
      `).join('')}
    </tbody>
  </table>
  </div>`;
}

// The analysis itself runs server-side as a fire-and-forget background job
// (see runMarcusContentAnalysisJob in search-server.js) so it keeps going
// even if this tab is closed - the POST below just kicks it off and
// returns immediately. Progress is picked up by polling
// /api/trigify/marcus-content-status every 5s until it's no longer running.
async function runMarcusContentAnalysis(forceRefresh){
  try {
    const res = await fetch('/api/trigify/marcus-content-analysis', {
      method:'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ forceRefresh: !!forceRefresh })
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || 'Request failed');
    toast(data.message || 'Analysis started', 'success');
    startMarcusJobPoll();
  } catch(err){
    toast('Could not start analysis: ' + err.message, 'warn');
  }
}

async function checkMarcusJobStatus(){
  try {
    const res = await fetch('/api/trigify/marcus-content-status');
    const data = await res.json();
    window.__marcusJobStatus = data;
    if(data.status === 'running') startMarcusJobPoll();
    else if(state.currentPage === 'content' && window.__contentSubTab === 'performance') renderPage();
  } catch(err){
    console.warn('Could not check Marcus content analysis status:', err.message);
  }
}

function startMarcusJobPoll(){
  if(window.__marcusJobPollTimer) return;
  const tick = async () => {
    try {
      const res = await fetch('/api/trigify/marcus-content-status');
      const data = await res.json();
      window.__marcusJobStatus = data;
      if(state.currentPage === 'content' && window.__contentSubTab === 'performance') renderPage();
      if(data.status !== 'running'){
        clearInterval(window.__marcusJobPollTimer);
        window.__marcusJobPollTimer = null;
        if(data.status === 'complete') toast(`Analysis complete - ${data.savedCount||0} post${data.savedCount===1?'':'s'} saved`, 'success');
        if(data.status === 'error') toast('Analysis failed: ' + (data.error||'unknown error'), 'warn');
        window.__contentPerformance = undefined;
        loadContentPerformance();
      }
    } catch(err){
      console.warn('Could not poll Marcus content analysis status:', err.message);
    }
  };
  tick();
  window.__marcusJobPollTimer = setInterval(tick, 5000);
}

    topicsToAvoid: document.getElementById('csTopicsToAvoid').value.trim(),

  };
  fetch('/api/content/settings', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) })

          <div style="font-weight:700;font-size:13px;">${esc(lm.name)}</div>
          <input style="margin-top:6px;" value="${esc(lm.url)}" onchange="setMagnetUrl(${i},this.value)">
        </div>
      </div>
    `).join('')}
    <button class="btn btn-secondary" onclick="addMagnet()"><i class="ti ti-plus"></i> Add custom lead magnet</button>
  </div>

  <div class="settings-section card">
    <div class="section-title"><i class="ti ti-plug-connected"></i> Integrations</div>
    <div class="field">
      <label>Make webhook URL</label>
      <input id="makeWebhookUrl" placeholder="https://hook.us1.make.com/..." value="${esc((s.integrations && s.integrations.makeWebhookUrl) || '')}">
    </div>
    <p class="muted" style="font-size:12px;margin-bottom:14px;">When a contact is found or updated, T2C Outreach POSTs name, company, domain, LinkedIn URL, state and touch point count to this URL.</p>
    <div class="field">
      <label>Clay API key</label>
      <input id="clayApiKey" type="password" placeholder="clay_..." value="${esc((s.integrations && s.integrations.clayApiKey) || '')}">
    </div>
    <p class="muted" style="font-size:12px;">Stored locally, reserved for future Clay enrichment calls.</p>
  </div>

  <div class="settings-section card">
    <div class="section-title"><i class="ti ti-package"></i> Products</div>
    ${(s.products||[]).map((p,i) => `
      <div class="account-row" style="flex-direction:column;align-items:stretch;gap:10px;">
        <div class="row">
          <div class="field"><label>Name</label><input value="${esc(p.name)}" onchange="setProductField(${i},'name',this.value)"></div>
          <div class="field"><label>Minimum touch points</label><input type="number" min="0" value="${p.minTouchPoints}" onchange="setProductField(${i},'minTouchPoints',this.value)"></div>
        </div>
        <div class="row">
          <div class="field"><label>Target roles (comma separated)</label><input value="${esc((p.targetRoles||[]).join(', '))}" onchange="setProductListField(${i},'targetRoles',this.value)"></div>
          <div class="field"><label>Target industries (comma separated)</label><input value="${esc((p.targetIndustries||[]).join(', '))}" onchange="setProductListField(${i},'targetIndustries',this.value)"></div>
        </div>
        <div class="field"><label>Message angle</label><textarea rows="2" onchange="setProductField(${i},'messageAngle',this.value)">${esc(p.messageAngle)}</textarea></div>
        <button class="btn btn-ghost btn-sm" style="align-self:flex-end;" onclick="removeProduct(${i})"><i class="ti ti-trash"></i> Remove</button>
      </div>
    `).join('')}
    <button class="btn btn-secondary" onclick="addProduct()"><i class="ti ti-plus"></i> Add product</button>
  </div>

  <div style="display:flex;align-items:center;gap:14px;margin-bottom:20px;">
    <button class="btn btn-primary" onclick="saveSettings()"><i class="ti ti-device-floppy"></i> Save settings</button>
    <span class="save-flash" id="saveFlash"><i class="ti ti-circle-check"></i> Settings saved</span>
  </div>

  <div class="settings-section card" style="border-color:#f0c2b0;">
    <div class="section-title"><i class="ti ti-alert-triangle" style="color:var(--danger);"></i> Danger zone</div>
    <p class="muted" style="font-size:12px;margin-bottom:14px;">Permanently clears all contacts, bookings, dead contacts and activity from this browser, and deletes the matching records from Airtable (Contacts, Companies, Touch Points, Campaign Contacts, Deals, Content Signals, Learning Data). Campaigns, Reps, Content Settings and Content are kept. This cannot be undone.</p>
    <button class="btn btn-danger" onclick="confirmResetAllData()"><i class="ti ti-trash"></i> Reset all data</button>
  </div>
  `;
}

function confirmResetAllData(){
  const body = `<p style="font-size:13px;">This will permanently delete all contacts, companies, touch points and related data from Airtable. This cannot be undone. Are you sure?</p>`;
  const footer = `
    <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary" id="confirmResetAllDataBtn" style="background:var(--danger);border-color:var(--danger);" onclick="resetAllDataConfirmed()"><i class="ti ti-trash"></i> Wipe all data</button>
  `;
  openModal('Reset all data', body, footer);
}

async function resetAllDataConfirmed(){
  const btn = document.getElementById('confirmResetAllDataBtn');
  if(btn){ btn.disabled = true; btn.innerHTML = '<i class="ti ti-loader-2"></i> Wiping...'; }
  try {
    const res = await fetch('/api/wipe-data', { method: 'POST' });
    const json = await res.json();
    if(!res.ok || !json.success) throw new Error(json.error || 'Wipe failed');
  } catch(err){
    toast('Could not wipe Airtable data: ' + err.message, 'warn');
    if(btn){ btn.disabled = false; btn.innerHTML = '<i class="ti ti-trash"></i> Wipe all data'; }
    return;
  }
  state.contacts = [];
  state.bookings = [];
  state.deadContacts = [];
  state.activity = [];
  location.reload();
}

function toggleAccountColumn(i, col){
  const acc = state.settings.accounts[i];
  const idx = acc.columns.indexOf(col);
  if(idx>-1) acc.columns.splice(idx,1); else acc.columns.push(col);
}
function removeAccount(i){ state.settings.accounts.splice(i,1); renderPage(); syncPrimaryLinkedInUrl(); }
function addAccount(){
  const name = prompt('LinkedIn account name:');
  if(!name) return;
  const url = prompt('LinkedIn profile URL:', 'https://linkedin.com/in/') || '';
  state.settings.accounts.push({ name, url, columns:[], primary:false });
  renderPage();
  syncPrimaryLinkedInUrl();
}

// Mirrors the Primary LinkedIn account's URL (or the first account, if none
// is marked Primary) to Settings.My LinkedIn URL in Airtable, so the Trigify
// Marcus content search always points at the right profile. Fires on every
// add/delete of a LinkedIn account above - those are the only two places
// the accounts list changes. Silent/non-blocking, same as every other
// background Airtable sync in this app.
function syncPrimaryLinkedInUrl(){
  const accounts = state.settings.accounts || [];
  if(!accounts.length) return;
  const primary = accounts.find(a => a.primary) || accounts[0];
  fetch('/api/settings/linkedin-url', {
    method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ url: primary.url || '' })
  }).catch(err => console.warn('Could not sync primary LinkedIn URL to Airtable:', err.message));
}
function removeService(i){ state.settings.services.splice(i,1); renderPage(); }
function addService(){
  const input = document.getElementById('newServiceInput');
  const val = input.value.trim();
  if(!val) return;
  state.settings.services.push(val);
  renderPage();
}
function toggleMagnet(i){ state.settings.leadMagnets[i].enabled = !state.settings.leadMagnets[i].enabled; renderPage(); }
function setMagnetUrl(i, val){ state.settings.leadMagnets[i].url = val; }
function addMagnet(){
  const name = prompt('Lead magnet name:');
  if(!name) return;
  state.settings.leadMagnets.push({ name, enabled:true, url:'' });
  renderPage();
}

function setProductField(i, field, val){
  state.settings.products[i][field] = field === 'minTouchPoints' ? (parseInt(val) || 0) : val;
}
function setProductListField(i, field, val){
  state.settings.products[i][field] = val.split(',').map(v=>v.trim()).filter(Boolean);
}
function addProduct(){
  const name = prompt('Product name:');
  if(!name) return;
  state.settings.products.push({ id: uid('prod'), name, targetRoles:[], targetIndustries:[], minTouchPoints:0, messageAngle:'' });
  renderPage();
}
function removeProduct(i){ state.settings.products.splice(i,1); renderPage(); }

function saveSettings(){
  const s = state.settings;
  s.timeoutDays = parseInt(document.getElementById('timeoutDays').value) || 10;
  s.timeoutAction = document.getElementById('timeoutAction').value;
  s.strategy.messagesBeforeCta = document.getElementById('strMsgs').value;
  s.strategy.tone = document.getElementById('strTone').value;
  s.strategy.connLength = document.getElementById('strLength').value;
  s.strategy.cadence = document.getElementById('strCadence').value;
  s.strategy.voiceInstructions = document.getElementById('strVoice').value;
  s.integrations.makeWebhookUrl = document.getElementById('makeWebhookUrl').value.trim();
  s.integrations.clayApiKey = document.getElementById('clayApiKey').value.trim();
  const flash = document.getElementById('saveFlash');
  flash.style.display = 'inline-flex';
  setTimeout(()=>{ flash.style.display='none'; }, 2200);
  toast('Settings saved', 'success');
}

/* ===================== ANTHROPIC API WRAPPER ===================== */

async function callAI(promptText, maxTokens, fallbackFn, images){
  try {
    const content = (images || []).map(img => ({
      type: 'image',
      source: { type: 'base64', media_type: img.mediaType, data: img.base64 }
    }));
    content.push({ type: 'text', text: promptText });
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-opus-4-6',
        max_tokens: maxTokens,
        messages: [{ role:'user', content }]
      })
    });
    if(!res.ok) throw new Error('API error '+res.status);
    const data = await res.json();
    const block = data.content && data.content.find(b => b.type === 'text');
    if(!block) throw new Error('No text content in response');
    return block.text.trim();
  } catch(err){
    console.warn('AI call unavailable, using local fallback:', err.message);
    return fallbackFn ? fallbackFn() : null;
  }
}

/* ===================== THEME (light/dark mode) ===================== */

const THEME_STORAGE_KEY = 't2c_theme_mode';

function getThemeMode(){
  try { return localStorage.getItem(THEME_STORAGE_KEY) === 'dark' ? 'dark' : 'light'; }
  catch(e){ return 'light'; }
}

function setThemeMode(mode){
  const normalized = mode === 'dark' ? 'dark' : 'light';
  if(normalized === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  else document.documentElement.removeAttribute('data-theme');
  try { localStorage.setItem(THEME_STORAGE_KEY, normalized); } catch(e){}
  syncThemeToggleIcon();
  if(state.currentPage === 'settings') renderPage();
}

function toggleThemeMode(){
  setThemeMode(getThemeMode() === 'dark' ? 'light' : 'dark');
}

function syncThemeToggleIcon(){
  const icon = document.getElementById('themeToggleIcon');
  if(icon) icon.className = 'ti ' + (getThemeMode() === 'dark' ? 'ti-moon' : 'ti-sun');
}

/* ===================== INIT ===================== */

loadPersistedState();
state = makeReactive(rawState, persistState);
syncThemeToggleIcon();
renderSidebar();
renderPage();

if(state.contacts.length === 0){
  hydrateContactsFromAirtable();
}
</script>
</body>
