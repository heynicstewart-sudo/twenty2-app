/* Touch point type -> spreadsheet count-column mapping. There's no literal
   "Coffee" or "DM" entry in TOUCH_POINT_TYPES, so this maps the closest
   existing types: LinkedIn message -> DMs, Meeting -> Coffee (in-person). */
function touchPointCounts(c){
  const tps = c.touchPoints || [];
  const count = type => tps.filter(t => t.type === type).length;
  return { dms: count('LinkedIn message'), calls: count('Call'), coffee: count('Meeting'), email: count('Email') };
}

function journeyStageLabel(c){
  if(c.thread && c.thread.booked) return 'Booked';
  return (c.state || '').charAt(0).toUpperCase() + (c.state || '').slice(1);
}

function lastContactDate(c){
  const dates = [];
  (c.touchPoints||[]).forEach(tp => { if(tp.date) dates.push(tp.date); });
  if(c.thread){
    if(c.thread.connSent) dates.push(c.thread.connSent);
    if(c.thread.m1 && c.thread.m1.sent) dates.push(c.thread.m1.sent);
    if(c.thread.m2 && c.thread.m2.sent) dates.push(c.thread.m2.sent);
  }
  if(c.connDate) dates.push(c.connDate);
  if(!dates.length) return null;
  return dates.reduce((max, d) => (!max || new Date(d) > new Date(max)) ? d : max, null);
}

function nextMessageDraftFor(c){
  const order = c.thread && !c.thread.connSent ? 'connect'
    : (c.thread && !(c.thread.m1 && c.thread.m1.sent)) ? 'm1'
    : (c.thread && !(c.thread.m2 && c.thread.m2.sent)) ? 'm2'
    : 'cta';
  if(c.generated && c.generated[order]) return c.generated[order];
  const stages = ['cta','m2','m1','connect'];
  for(const key of stages){ if(c.generated && c.generated[key]) return c.generated[key]; }
  return '';
}

// Sequence Stage is per-campaign (Airtable-backed), matching the convention
// used by the Roadmap tab (campaignSequenceStageFor / loadCampaignSequenceStages).
// Only resolvable here when the grid is linked to exactly one campaign.
function gridSequenceStageMap(gridId){
  const camps = campaignsForGrid(gridId);
  if(camps.length !== 1) return null;
  const campaign = camps[0];
  if(!window.__campaignSequenceStages || !window.__campaignSequenceStages[campaign.id]){
    loadCampaignSequenceStages(campaign);
    return {};
  }
  return window.__campaignSequenceStages[campaign.id];
}

function spreadsheetRowData(c, gridId, seqMap){
  const counts = touchPointCounts(c);
  const last = lastContactDate(c);
  const draft = nextMessageDraftFor(c);
  return {
    contact: c,
    name: c.name,
    company: c.company,
    title: c.role,
    journeyStage: journeyStageLabel(c),
    sequenceStage: seqMap ? (seqMap[c.name.trim().toLowerCase()] || '') : '',
    touchPoints: (c.touchPoints||[]).length,
    lastContact: last,
    lastContactDisplay: last ? fmtDate(last) : '—',
    nextDraft: draft,
    nextDraftDisplay: draft ? (draft.length > 60 ? esc(draft.slice(0,60))+'…' : esc(draft)) : '—',
    dms: counts.dms, calls: counts.calls, coffee: counts.coffee, email: counts.email
  };
}

function sortSpreadsheet(gridId, key){
  const current = window.__spreadsheetSort;
  if(current && current.gridId === gridId && current.key === key){
    current.dir = current.dir === 'asc' ? 'desc' : 'asc';
  } else {
    window.__spreadsheetSort = { gridId, key, dir: 'asc' };
  }
  renderPage();
}

function renderContactSpreadsheet(grid){
  const contacts = gridContacts(grid.id);
  const visibleKeys = new Set(gridVisibleColumns(grid.id));
  const columns = SPREADSHEET_COLUMNS.filter(c => visibleKeys.has(c.key));
  const seqMap = gridSequenceStageMap(grid.id);
  let rows = contacts.map(c => spreadsheetRowData(c, grid.id, seqMap));

  const sort = window.__spreadsheetSort;
  if(sort && sort.gridId === grid.id){
    const col = SPREADSHEET_COLUMNS.find(c => c.key === sort.key);
    rows = rows.slice().sort((a,b) => {
      let av = a[sort.key], bv = b[sort.key];
      if(col && col.date){ av = av ? new Date(av).getTime() : -Infinity; bv = bv ? new Date(bv).getTime() : -Infinity; }
      else if(col && col.numeric){ av = av || 0; bv = bv || 0; }
      else { av = (av||'').toString().toLowerCase(); bv = (bv||'').toString().toLowerCase(); }
      if(av < bv) return sort.dir === 'asc' ? -1 : 1;
      if(av > bv) return sort.dir === 'asc' ? 1 : -1;
      return 0;
    });
  }

  if(!columns.length) return '<div class="empty-state">No columns selected — use Columns to pick some.</div>';
  if(!contacts.length) return '<div class="empty-state">No contacts in this grid yet.</div>';

  const campaignName = currentGridCampaignName();

  return `
  <div class="spreadsheet-wrap">
    <table class="spreadsheet-table">
      <thead><tr>
        ${columns.map(c => {
          const isSorted = sort && sort.gridId === grid.id && sort.key === c.key;
          const arrow = isSorted ? (sort.dir === 'asc' ? '▲' : '▼') : '▲';
          return `<th class="${isSorted?'sorted':''}" onclick="sortSpreadsheet('${grid.id}','${c.key}')">${esc(c.label)}<span class="sort-arrow">${arrow}</span></th>`;
        }).join('')}
      </tr></thead>
      <tbody>
        ${rows.map(row => `
          <tr onclick="openContactDrawer('${esc(row.name)}', ${campaignName ? `'${esc(campaignName)}'` : 'null'})">
            ${columns.map(c => {
              if(c.key === 'name') return `<td class="ss-name">${esc(row.name)}</td>`;
              if(c.key === 'nextDraft') return `<td class="ss-draft" title="${esc(row.nextDraft || '')}">${row.nextDraftDisplay}</td>`;
              if(c.numeric) return `<td class="ss-num">${row[c.key]}</td>`;
              if(c.key === 'lastContact') return `<td>${row.lastContactDisplay}</td>`;
              return `<td>${esc((row[c.key]||'—').toString())}</td>`;
            }).join('')}
          </tr>
        `).join('')}
      </tbody>
    </table>
  </div>
  `;
}

function findContact(company, role){
  const gridId = currentGrid().id;
  return state.contacts.find(c => c.gridId === gridId && c.company === company && c.role === role);
}

function renderGridCell(company, role){
  const c = findContact(company, role);
  if(!c){
    return `<td><div class="cell-empty" data-company="${esc(company)}" data-role="${esc(role)}">No match yet</div></td>`;
  }
  const days = daysBetween(c.foundDate);
  const cellClass = c.thread.booked ? 'cell-messaging' : 'cell-'+c.state;
  const stateTagClass = c.thread.booked ? 'tag-booked' : 'tag-'+c.state;
  const stateLabel = c.thread.booked ? 'booked' : c.state;
  return `<td>
    <div class="grid-cell ${cellClass}">
      <div class="cell-name" style="cursor:pointer;" onclick="openContactDrawer('${esc(c.name)}', ${currentGridCampaignName() ? `'${esc(currentGridCampaignName())}'` : 'null'})">${esc(c.name)}${c.url ? ` <a href="${esc(c.url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" title="Open on LinkedIn" style="margin-left:2px;color:var(--blue);"><i class="ti ti-brand-linkedin"></i></a>` : ''}</div>
      <div class="cell-meta">

        <span class="tag ${stateTagClass}">${stateLabel}</span>

    </div>
  </td>`;
}

async function findCompanyLinkedInPages(){
  const grid = currentGrid();
  const btn = document.getElementById('findCompanyLinkedInBtn');
  const original = btn.innerHTML;
  btn.disabled = true;

  let foundCount = 0;
  let searchedCount = 0;
  for(let i=0; i<grid.companies.length; i++){
    const company = grid.companies[i];
    if(grid.companyLinkedIn[company] && grid.companyLinkedIn[company].linkedinUrl) continue;
    searchedCount++;
    btn.innerHTML = `<i class="ti ti-loader-2"></i> Searching ${i+1}/${grid.companies.length}...`;
    try {
      const res = await fetch(`/api/search-company-linkedin?company=${encodeURIComponent(company)}`);
      const data = await res.json();
      if(data.found && data.linkedinUrl){
        grid.companyLinkedIn[company] = { linkedinUrl: data.linkedinUrl, linkedinSlug: data.slug || null };
        foundCount++;
      }
    } catch(err){
      console.warn('Company LinkedIn search failed for', company, err.message);
    }
    if(i < grid.companies.length - 1) await sleep(300);
  }

  btn.disabled = false;
  btn.innerHTML = original;

  if(searchedCount === 0){
    toast('Every company already has a LinkedIn page on file', 'warn');
    return;
  }

  renderPage();
  toast(`Found LinkedIn pages for ${foundCount} of ${searchedCount} companies searched`, foundCount ? 'success' : 'warn');
}

async function fetchLinkedInOrgIds(){
  const grid = currentGrid();
  const btn = document.getElementById('orgIdBtn');
  const companies = Object.keys(grid.companyLinkedIn).filter(name => grid.companyLinkedIn[name] && grid.companyLinkedIn[name].linkedinSlug);
  if(!companies.length){ toast('No companies with a LinkedIn slug on file yet - run "Find LinkedIn pages" first', 'warn'); return; }

  const original = btn.innerHTML;
  btn.disabled = true;

  let foundCount = 0;
  for(let i=0; i<companies.length; i++){
    const companyName = companies[i];
    const slug = grid.companyLinkedIn[companyName].linkedinSlug;
    btn.innerHTML = `<i class="ti ti-loader-2"></i> Looking up ${i+1}/${companies.length}...`;
    try {
      const res = await fetch(`/api/enrich/linkedin-org-id?slug=${encodeURIComponent(slug)}`);
      const data = await res.json();
      if(data.found && data.orgId){
        await fetch('/api/airtable/company/linkedin', {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ companyName, linkedinSlug: data.orgId })
        });
        foundCount++;
      }
    } catch(err){
      console.warn('LinkedIn org ID lookup failed for', companyName, err.message);
    }
    if(i < companies.length - 1) await sleep(500);
  }

  btn.disabled = false;
  btn.innerHTML = original;
  toast(`Found LinkedIn org IDs for ${foundCount} of ${companies.length} companies`, foundCount ? 'success' : 'warn');
}

function parseCsv(text){
  const rows = [];
  let row = [];
  let field = '';
  let inQuotes = false;
  for(let i=0; i<text.length; i++){
    const ch = text[i];
    if(inQuotes){
      if(ch === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      } else {
        field += ch;
      }
      continue;
    }
    if(ch === '"'){ inQuotes = true; }
    else if(ch === ','){ row.push(field); field = ''; }
    else if(ch === '\n'){ row.push(field); rows.push(row); row = []; field = ''; }
    else if(ch === '\r'){ /* skip, \n handles the line break */ }
    else { field += ch; }
  }
  if(field !== '' || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.some(f => f.trim() !== ''));
}

function handleCsvImport(event){
  const file = event.target.files && event.target.files[0];
  event.target.value = '';
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const rows = parseCsv(String(reader.result));
    if(rows.length < 1){ toast('That CSV looks empty', 'warn'); return; }
    openCsvColumnModal(rows);
  };
  reader.onerror = () => toast('Could not read that file', 'warn');
  reader.readAsText(file);
}

function openCsvColumnModal(rows){
  const headers = rows[0];
  const dataRows = rows.slice(1);
  window.__csvImportRows = dataRows;
  const body = `
    <div class="field">

      <select id="csvCompanyColumn">
        ${headers.map((h,i) => `<option value="${i}">${esc(h.trim() || 'Column '+(i+1))}</option>`).join('')}
      </select>
    </div>
    <p class="muted" style="font-size:12px;">${dataRows.length} row${dataRows.length===1?'':'s'} found in this file.</p>
  `;
  const footer = `
    <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary" onclick="confirmCsvImport()"><i class="ti ti-check"></i> Import companies</button>
  `;
  openModal('Import companies from CSV', body, footer);
}

function confirmCsvImport(){
  const grid = currentGrid();
  const colIdx = parseInt(document.getElementById('csvCompanyColumn').value);
  const rows = window.__csvImportRows || [];
  const seen = new Set(grid.companies.map(c => c.toLowerCase()));
  let addedCount = 0;
  rows.forEach(r => {
    const val = (r[colIdx] || '').trim();
    if(!val) return;
    const key = val.toLowerCase();
    if(seen.has(key)) return;
    seen.add(key);
    grid.companies.push(val);
    addedCount++;
  });
  if(addedCount) touchGrid(grid.id);
  closeModal();
  if(addedCount) renderPage();
  toast(addedCount + ' compan' + (addedCount===1?'y':'ies') + ' added from CSV', addedCount ? 'success' : 'warn');
}

function sleep(ms){ return new Promise(resolve => setTimeout(resolve, ms)); }

async function runDailySearch(){
  const grid = currentGrid();
  const cols = grid.columns;
  const emptyCells = [];
  grid.companies.forEach(company => cols.forEach(role => { if(!findContact(company, role)) emptyCells.push({company, role}); }));
  if(!emptyCells.length){ toast('No open roles left to search — every cell has a contact','warn'); return; }

  const btn = document.getElementById('runSearchBtn');
  if(btn){ btn.disabled = true; btn.innerHTML = '<i class="ti ti-loader-2"></i> Searching...'; }

  emptyCells.forEach(({company,role}) => {
    const td = document.querySelector(`.cell-empty[data-company="${cssEscape(company)}"][data-role="${cssEscape(role)}"]`);
    if(td) td.outerHTML = `<div class="cell-searching" data-company="${esc(company)}" data-role="${esc(role)}"><i class="ti ti-loader-2"></i>&nbsp;Searching...</div>`;
  });

  let foundCount = 0;
  for(let i=0; i<emptyCells.length; i++){
    const { company, role } = emptyCells[i];
    const cellEl = document.querySelector(`.cell-searching[data-company="${cssEscape(company)}"][data-role="${cssEscape(role)}"]`);
    try {
      const res = await fetch(`${SEARCH_API_URL}?company=${encodeURIComponent(company)}&jobTitle=${encodeURIComponent(role)}`);
      if(!res.ok) throw new Error('Search endpoint returned '+res.status);
      const data = await res.json();
      if(data.found && data.name && data.url){
        const seqId = role === 'Digital and Tech' ? 'digitalTech' : 'seniorLeaders';
        const newContact = {
          id: uid('c'), gridId: grid.id, name: data.name, company, role, url: data.url,
          seqId, state:'found', foundDate: isoDate(TODAY), connReqDate:null, connDate:null, notes:'',
          thread:{ connSent:null, m1:null, m2:null, cta:null, booked:false }, generated:{}, touchPoints:[]
        };
        state.contacts.push(newContact);
        foundCount++;
        touchGrid(grid.id);
        if(cellEl) cellEl.outerHTML = renderGridCellHTML(newContact);
        notifyWebhook(newContact);
      } else {
        if(cellEl) cellEl.outerHTML = `<div class="cell-empty" data-company="${esc(company)}" data-role="${esc(role)}" title="Couldn't find a verified LinkedIn profile — try an alternative search method">No confident match — try again</div>`;
      }
    } catch(err){
      console.warn('Search failed for', company, role, err.message);
      if(cellEl) cellEl.outerHTML = `<div class="cell-empty" data-company="${esc(company)}" data-role="${esc(role)}" title="The search request itself failed — try again">Search error — try again</div>`;
    }
    if(i < emptyCells.length - 1) await sleep(300);
  }

  if(btn){ btn.disabled = false; btn.innerHTML = '<i class="ti ti-search"></i> Run daily search'; }
  document.getElementById('gridNotification').innerHTML = `<div class="card" style="background:#eaf7f0;border-color:#c9e9d7;margin-bottom:14px;"><i class="ti ti-circle-check" style="color:var(--success);"></i> Daily search complete — ${foundCount} new contact${foundCount===1?'':'s'} found across ${emptyCells.length} open roles.</div>`;
  toast(foundCount+' new contacts found', 'success');
}

function addDays(dateStr, days){

}

function notifyWebhook(contact) {
  // Post to Make.com webhook if configured
  const url = ((state.settings.integrations && state.settings.integrations.makeWebhookUrl) || '').trim();
  if (url) {
    const payload = {
      name: contact.name,
      company: contact.company,
      domain: companyDomain(contact.company),
      linkedin_url: contact.url,
      state: contact.state,
      touch_point_count: (contact.touchPoints || []).length

    fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },

    }).catch(err => console.warn('Webhook POST failed:', err.message));

async function syncAllContactsToAirtable(){
  const grid = currentGrid();
  const contacts = gridContacts(grid.id);
  if(!contacts.length){ toast('No contacts to sync yet', 'warn'); return; }

  const btn = document.getElementById('syncAirtableBtn');
  const original = btn.innerHTML;
  btn.disabled = true;

  let syncedCount = 0;
  for(let i=0; i<contacts.length; i++){
    const contact = contacts[i];
    btn.innerHTML = `<i class="ti ti-loader-2"></i> Syncing contact ${i+1}/${contacts.length}...`;
    try {
      const res = await fetch('/api/airtable/contact', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: contact.name,
          company: contact.company,
          role: contact.role,
          linkedinUrl: contact.url,
          state: contact.state,
          icpRoleCategory: contact.role,
          notes: contact.notes || '',
          companyLinkedinUrl: companyLinkedInUrl(contact.company),
          gridName: grid.name
        })
      });
      if(res.ok) syncedCount++;
    } catch(err){
      console.warn('Airtable sync failed for', contact.name, err.message);
    }
    if(i < contacts.length - 1) await sleep(250);
  }

  let companySyncedCount = 0;
  for(let i=0; i<grid.companies.length; i++){
    const company = grid.companies[i];
    btn.innerHTML = `<i class="ti ti-loader-2"></i> Syncing company ${i+1}/${grid.companies.length}...`;
    try {
      const res = await fetch('/api/airtable/company', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: company, gridName: grid.name })
      });
      if(res.ok) companySyncedCount++;
    } catch(err){
      console.warn('Airtable company sync failed for', company, err.message);
    }
    if(i < grid.companies.length - 1) await sleep(250);
  }

  const linkedCompanyNames = Object.keys(grid.companyLinkedIn).filter(name => {
    const entry = grid.companyLinkedIn[name];
    return entry && entry.linkedinUrl && entry.linkedinSlug;
  });
  for(let i=0; i<linkedCompanyNames.length; i++){
    const companyName = linkedCompanyNames[i];
    const entry = grid.companyLinkedIn[companyName];
    btn.innerHTML = `<i class="ti ti-loader-2"></i> Syncing LinkedIn ${i+1}/${linkedCompanyNames.length}...`;
    try {
      await fetch('/api/airtable/company/linkedin', {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ companyName, linkedinUrl: entry.linkedinUrl, linkedinSlug: entry.linkedinSlug })
      });
    } catch(err){
      console.warn('Airtable company LinkedIn sync failed for', companyName, err.message);
    }
    if(i < linkedCompanyNames.length - 1) await sleep(250);
  }

  btn.disabled = false;
  btn.innerHTML = original;
  const allSynced = syncedCount === contacts.length && companySyncedCount === grid.companies.length;
  toast(`${syncedCount} contacts and ${companySyncedCount} companies synced to Airtable`, allSynced ? 'success' : 'warn');
}

const JOURNEY_STAGE_TO_STATE = { 'Identified':'found', 'Connected':'connected', 'Messaging':'messaging', 'Booked':'booked' };

async function hydrateContactsFromAirtable(){
  try {
    const res = await fetch('/api/airtable/contact');
    const records = await res.json();
    if(!res.ok) throw new Error((records && records.error) || ('Request failed with status '+res.status));

    state.contacts = records.map(r => {

        foundDate: isoDate(TODAY),
        connReqDate: null,
        connDate: null,
        notes: f['Notes'] || '',
        thread: { connSent:null, m1:null, m2:null, cta:null, booked:false },
        generated: {},

      };
    });

    renderPage();

function csvField(val){
  const str = String(val ?? '');
  if(/[",\r\n]/.test(str)) return '"' + str.replace(/"/g,'""') + '"';
  return str;
}

const EXPORTABLE_STATES = ['found','opened','connected','messaging','booked'];

function exportContactsCsv(){
  const gridId = currentGrid().id;
  const rows = gridContacts(gridId).filter(c => EXPORTABLE_STATES.includes(c.state) && c.url && c.url.trim());
  if(!rows.length){ toast('No found contacts to export yet', 'warn'); return; }

  const header = ['Name','Company','Domain','LinkedIn URL'];
  const lines = [header.map(csvField).join(',')];
  rows.forEach(c => {
    lines.push([c.name, c.company, companyDomain(c.company), c.url].map(csvField).join(','));
  });
  const csvContent = lines.join('\r\n');

  const filename = `T2C_contacts_${isoDate(TODAY)}.csv`;
  const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);

  toast(rows.length+' contact'+(rows.length===1?'':'s')+' exported to '+filename, 'success');
}

function onConnectionsDragOver(e){

  document.getElementById('dropZoneUpload').classList.add('dragover');

function onConnectionsDragLeave(e){
  document.getElementById('dropZoneUpload').classList.remove('dragover');

function onConnectionsDrop(e){
  e.preventDefault();
  document.getElementById('dropZoneUpload').classList.remove('dragover');
  const files = Array.from(e.dataTransfer.files || []).filter(f => f.type.startsWith('image/'));
  if(files.length) processConnectionsFiles(files);
}
function handleConnectionsUpload(e){
  const files = Array.from(e.target.files || []);
  if(files.length) processConnectionsFiles(files);
  e.target.value = '';
}
function processConnectionsFiles(files){
  window.__connectionsShots = window.__connectionsShots || [];
  let pending = files.length;
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = () => {
      const match = String(reader.result).match(/^data:([^;]+);base64,(.*)$/);
      if(match){
        window.__connectionsShots.push({ name: file.name, mediaType: match[1], base64: match[2] });
      }
      pending--;
      if(pending === 0){
        renderConnectionsShotFiles();
        toast(files.length+' screenshot'+(files.length===1?'':'s')+' attached', 'success');
      }
    };
    reader.readAsDataURL(file);
  });
}
function renderConnectionsShotFiles(){
  const el = document.getElementById('connectionsShotFiles');
  if(!el) return;
  el.innerHTML = (window.__connectionsShots || []).map((f,i) => `<span class="shot-file-chip">${esc(f.name)}<button onclick="removeConnectionsShot(${i})">&times;</button></span>`).join('');
}
function removeConnectionsShot(idx){
  window.__connectionsShots.splice(idx,1);
  renderConnectionsShotFiles();
}

async function readConnectionsScreenshot(){
  const shots = window.__connectionsShots || [];
  const candidates = state.contacts.filter(c => (c.state==='found' || c.state==='opened') && !c.connDate);
  if(!candidates.length){ toast('No pending contacts to match against a screenshot','warn'); return; }

  const btn = document.getElementById('readConnectionsBtn');
  const original = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<i class="ti ti-loader-2"></i> Reading...';

  if(!shots.length){
    demoMatchConnections(candidates);
    btn.disabled = false;
    btn.innerHTML = original;
    return;
  }

  const list = candidates.map(c => `${c.id}: ${c.name} (${c.company})`).join('\n');
  const prompt = `Here is a screenshot of a LinkedIn connections list. Cross-reference the names visible in the screenshot against this list of contacts awaiting connection acceptance:\n${list}\n\nReturn ONLY a JSON array of the contact ids (e.g. ["c4","c9"]) whose names appear in the screenshot as accepted connections. If none appear, return [].`;
  const images = shots.map(f => ({ mediaType: f.mediaType, base64: f.base64 }));
  const raw = await callAI(prompt, 200, null, images);

  btn.disabled = false;
  btn.innerHTML = original;

  if(raw === null){
    demoMatchConnections(candidates);
    return;
  }

  let matchedIds = [];
  try {
    const jsonMatch = raw.match(/\[[\s\S]*\]/);
    matchedIds = JSON.parse(jsonMatch ? jsonMatch[0] : raw);
  } catch(e){ matchedIds = []; }

  const matched = candidates.filter(c => matchedIds.includes(c.id));
  if(!matched.length){
    toast("Couldn't match anyone from that screenshot — try a clearer image", 'warn');
    return;
  }

  markContactsConnected(matched);
  toast(`${matched.length} contact${matched.length===1?'':'s'} matched and marked as connected: ${matched.map(p=>p.name).join(', ')}`, 'success');
  renderPage();
}

function demoMatchConnections(candidates){
  const picks = candidates.slice(0,2);
  markContactsConnected(picks);
  toast(`${picks.length} contacts matched and marked as connected: ${picks.map(p=>p.name).join(', ')}`, 'success');
  renderPage();
}

function markContactsConnected(contacts){
  contacts.forEach(c => {
    c.state = 'connected';
    c.connReqDate = c.connReqDate || isoDate(TODAY);
    c.connDate = isoDate(TODAY);
    c.thread.connSent = isoDate(TODAY);
    state.activity.unshift({ type:'connected', text:`${c.name} (${c.company}) accepted your connection`, date: isoDate(TODAY) });
    notifyWebhook(c);
  });
}

function addTouchPoint(cid) {
  const c = state.contacts.find(x => x.id === cid);
  const date = document.getElementById('tpDate-' + cid).value || isoDate(TODAY);
  const type = document.getElementById('tpType-' + cid).value;
  const methodEl = document.getElementById('tpMethod-' + cid);
  const communicationMethod = methodEl ? methodEl.value : '';
  const outcomeEl = document.getElementById('tpOutcome-' + cid);
  const outcome = outcomeEl ? outcomeEl.value : 'No reply';
  const notes = document.getElementById('tpNotes-' + cid).value.trim();
  const painPointsEl = document.getElementById('tpPainPoints-' + cid);
  const selectedPainPoints = painPointsEl ? Array.from(painPointsEl.querySelectorAll('input:checked')).map(el => el.value) : [];

  if (!c.touchPoints) c.touchPoints = [];
  c.touchPoints.push({ id: uid('tp'), date, type, communicationMethod, outcome, notes, painPoints: selectedPainPoints });

  if (selectedPainPoints.length) {
    if (!c.painPoints) c.painPoints = [];
    selectedPainPoints.forEach(p => { if (!c.painPoints.includes(p)) c.painPoints.push(p); });
  }

  // Sync touch point to Airtable (outcome "Replied" gets flagged on the record server-side)
  fetch('/api/airtable/touchpoint', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      contactName: c.name,
      company: c.company,
      date,
      type,
      notes,
      outcome,
      communicationMethod
    })
  }).catch(err => console.warn('Airtable touch point sync failed:', err.message));

  if (outcome === 'Meeting Booked') {
    trackConversion(c, date, communicationMethod);
  }

  // Default next-touch cadence: 7 days on from this touch point
  const nextTouchDate = addDays(date, 7);
  fetch('/api/airtable/contact/stage', {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      contactName: c.name,
      company: c.company,
      nextTouchDate,
      painPoints: selectedPainPoints
    })
  }).catch(err => console.warn('Airtable next-touch sync failed:', err.message));

  notifyWebhook(c);
  toast('Touch point logged', 'success');
  renderPage();
}

function trackConversion(c, bookedDate, communicationMethod){
  const touchPoints = (c.touchPoints || []).slice().sort((a,b)=>new Date(a.date)-new Date(b.date));
  const firstTouchDate = touchPoints.length ? touchPoints[0].date : bookedDate;
  const campaign = activeCampaignForContact(c);

  fetch('/api/track/conversion', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      contactName: c.name,
      company: c.company,
      icpRole: c.role,
      industry: companyIndustry(c.company),
      campaign: campaign ? campaign.name : '',
      product: campaign ? (campaign.product || '') : '',
      touchPointCount: touchPoints.length,
      daysToConvert: daysBetween(firstTouchDate, bookedDate),
      communicationMethod
    })
  }).catch(err => console.warn('Conversion tracking sync failed:', err.message));
}

function recommendedProducts(c){
  const industry = companyIndustry(c.company);
  const touchCount = (c.touchPoints || []).length;
  return (state.settings.products || []).filter(p => {
    const roles = p.targetRoles || [];
    const industries = p.targetIndustries || [];
    const roleMatch = !roles.length || roles.some(r => r.trim().toLowerCase() === c.role.toLowerCase());
    const industryMatch = !industries.length || industries.some(i => i.trim().toLowerCase() === industry.toLowerCase());
    const touchMatch = touchCount >= (parseInt(p.minTouchPoints) || 0);
    return roleMatch && industryMatch && touchMatch;
  });
}

/* Roadmap drag/drop */
let dragCardId = null;
function initRoadmapDrag(){}
function onCardDragStart(e, id){ dragCardId = id; e.target.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; }
function onCardDragEnd(e){ e.target.classList.remove('dragging'); }
function onColDragOver(e){ e.preventDefault(); }
function onColDrop(e, colKey){
  e.preventDefault();
  if(!dragCardId) return;
  const c = state.contacts.find(x=>x.id===dragCardId);
  if(!c) return;
  const fromCol = getRoadmapColumn(c);
  if(fromCol === colKey){ dragCardId=null; return; }
  const order = ['pending','made','messaging','booked'];
  const forward = order.indexOf(colKey) > order.indexOf(fromCol);

  if(colKey === 'made'){
    c.state = 'connected';
    c.connReqDate = c.connReqDate || isoDate(TODAY);
    c.connDate = isoDate(TODAY);
    c.thread.connSent = isoDate(TODAY);
    state.activity.unshift({ type:'connected', text:`${c.name} (${c.company}) accepted your connection`, date: isoDate(TODAY) });
    notifyWebhook(c);
    renderPage();
  } else if(colKey === 'messaging'){
    if(forward) openGenerateModal(c.id, c.thread.m1 ? 'm2' : 'm1', ()=>renderPage());
    else { c.state='messaging'; renderPage(); }
  } else if(colKey === 'booked'){
    openBookingModal(c.id);
  } else if(colKey === 'pending'){
    c.state = 'found'; c.connDate=null; c.thread.connSent=null;
    renderPage();
  }
  dragCardId = null;
}

// Slide-out contact/company drawer, replacing the old "click a contact

// keeps its click from also opening the drawer); clicking the name/card

function currentGridCampaignName(){
  try {

    return camps.length === 1 ? camps[0].name : null;

function initials(name){
  return (name||'').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase();
}

function openDrawer(bodyHtml){
  closeDrawer();
  const overlay = document.createElement('div');
  overlay.className = 'drawer-overlay';
  overlay.id = 'drawerOverlay';
  overlay.onclick = (e) => { if(e.target === overlay) closeDrawer(); };
  const panel = document.createElement('div');
  panel.className = 'profile-drawer';
  panel.id = 'profileDrawer';
  panel.innerHTML = bodyHtml;
  overlay.appendChild(panel);
  document.body.appendChild(overlay);
  // setTimeout, not requestAnimationFrame - rAF callbacks are throttled/
  // suspended for backgrounded tabs in some browsers, which could leave
  // the drawer stuck off-screen if opened while the tab isn't focused.
  setTimeout(() => panel.classList.add('open'), 10);
}
function closeDrawer(){
  const o = document.getElementById('drawerOverlay');
  if(o) o.remove();
}
function drawerBody(html){
  const panel = document.getElementById('profileDrawer');

/* ---- Toast with undo (adds to, does not replace, toast()) ---- */
function toastWithUndo(message, onUndo){
  const c = document.getElementById('toastContainer');
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<i class="ti ti-calendar-plus"></i><span>${esc(message)}</span> <button class="btn btn-ghost btn-sm" style="margin-left:8px;">Undo</button>`;
  let undone = false;
  el.querySelector('button').onclick = () => { undone = true; onUndo(); el.remove(); };
  c.appendChild(el);
  setTimeout(() => {
    if(!undone){ el.style.transition = 'opacity .3s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }
  }, 5000);
}

const STAGE_META = [
  { key:'connect', label:'Connection request', hint:'Sent on first outreach' },
  { key:'m1', label:'Message 1', hint:'After connection accepted' },
  { key:'m2', label:'Message 2', hint:'Follow-up, no reply yet' },
  { key:'cta', label:'CTA', hint:'Invite to next step' }
];

function renderSequenceEditor(seq){
  return `
  <div class="seq-header">
    <div>
      <input style="font-size:16px;font-weight:800;border:none;padding:2px 0;width:auto;background:transparent;" value="${esc(seq.name)}" onchange="renameSeq('${seq.id}',this.value)">
      <div style="margin-top:8px;">${seq.roles.map(r=>`<span class="pill">${esc(r)}</span>`).join('') || '<span class="muted" style="font-size:12px;">No roles assigned</span>'}</div>
    </div>
    <div class="field" style="max-width:220px;">
      <label>Sender voice</label>
      <select onchange="setSeqVoice('${seq.id}',this.value)">
        ${['Peer to peer','Warm consultant','Low pressure'].map(v=>`<option ${seq.voice===v?'selected':''}>${v}</option>`).join('')}
      </select>
    </div>
  </div>

  <div class="flow">
    ${STAGE_META.map(st => renderFlowNode(seq, st)).join('')}
  </div>

  <div class="flow" style="margin-top:2px;">
    ${STAGE_META.map(st => `
      <div style="${st.key!=='connect'?'margin-left:22px;':''}">
        <div class="dropzone" data-seq="${seq.id}" data-stage="${st.key}" ondragover="onChipDragOver(event)" ondrop="onChipDrop(event,'${seq.id}','${st.key}')">
          ${contactsAtStage(seq.id, st.key).map(c => `<div class="chip" draggable="true" data-id="${c.id}" ondragstart="onChipDragStart(event,'${c.id}')" ondragend="onChipDragEnd(event)">${esc(c.name)}</div>`).join('') || '<span class="muted" style="font-size:11.5px;">No contacts here</span>'}
        </div>
      </div>
    `).join('')}
  </div>
  `;
}

function contactsAtStage(seqId, stageKey){
  return state.contacts.filter(c => c.seqId === seqId && contactStageKey(c) === stageKey);
}
function contactStageKey(c){
  if(c.thread.booked || c.thread.cta) return 'cta';
  if(c.thread.m2) return 'cta';
  if(c.thread.m1) return 'm2';
  if(c.connDate) return 'm1';
  return 'connect';
}

function renderFlowNode(seq, st){
  return `
  <div class="flow-node">
    <div class="flow-node-head stage-${st.key}"><div class="stage-label">${st.label}</div><div class="stage-hint">${st.hint}</div></div>
    <div class="flow-node-body">
      <textarea id="tpl-${seq.id}-${st.key}" onchange="setStageTemplate('${seq.id}','${st.key}',this.value)">${esc(seq.stages[st.key])}</textarea>
    </div>
    <div class="flow-node-foot">
      <button class="btn btn-secondary btn-sm" onclick="generateTemplate('${seq.id}','${st.key}')"><i class="ti ti-sparkles"></i> Generate</button>
      <button class="btn btn-ghost btn-sm" onclick="document.getElementById('tpl-${seq.id}-${st.key}').focus()"><i class="ti ti-edit"></i> Edit</button>
    </div>
  </div>`;
}

function renameSeq(id, val){ state.sequences.find(s=>s.id===id).name = val; }
function setSeqVoice(id, val){ state.sequences.find(s=>s.id===id).voice = val; }
function setStageTemplate(seqId, stageKey, val){ state.sequences.find(s=>s.id===seqId).stages[stageKey] = val; }

async function generateTemplate(seqId, stageKey){
  const seq = state.sequences.find(s=>s.id===seqId);
  const st = STAGE_META.find(s=>s.key===stageKey);
  const btn = event.target.closest('button');
  const original = btn.innerHTML;
  btn.innerHTML = '<i class="ti ti-loader-2"></i> Generating...';
  btn.disabled = true;
  const prompt = `Write a LinkedIn outreach template for the "${st.label}" stage of a sequence targeting ${seq.roles.join(', ') || 'senior leaders'} at WA companies.\n\n${ctaStrategyNote(stageKey)}\n\n${voiceRulesText()}\n\nUse {{first}}, {{company}}, {{role}} as placeholders. Return only the message text.`;
  const result = await callAI(prompt, 300, ()=>localTemplateFallback(seq, stageKey));
  document.getElementById(`tpl-${seqId}-${stageKey}`).value = result;
  seq.stages[stageKey] = result;
  btn.innerHTML = original;
  btn.disabled = false;
  toast('Template generated for '+st.label, 'success');
}

function voiceRulesText(){
  const v = state.settings.strategy;
  return `Voice rules: UK English, no em dashes, ${v.tone.toLowerCase()} tone, one observation and one question per message, 3 to 4 sentences, signed off "Marcus", conditional CTA framing (never pushy). Connection requests should be ${v.connLength.toLowerCase()}. Follow-up cadence is ${v.cadence.toLowerCase()}. ${v.voiceInstructions}`;
}

function messageNumberForStage(stageKey){
  return { m1:1, m2:2, cta:3 }[stageKey] || 0;
}

function ctaStrategyNote(stageKey){
  const n = parseInt(state.settings.strategy.messagesBeforeCta) || 2;
  const num = messageNumberForStage(stageKey);
  if(stageKey === 'cta'){
    return `Strategy: this is the CTA ask (message ${num} in the sequence). Per the outreach strategy the CTA should land by message ${n}, so make the ask directly here${num > n ? ", it's already overdue so don't hold back" : ''}.`;
  }
  if(!num) return '';
  if(num >= n){
    return `Strategy: the outreach strategy says the CTA should be introduced by message ${n}. This is message ${num}, so it's fine to start gently pointing toward the CTA if the moment fits, without being pushy about it.`;
  }
  return `Strategy: the outreach strategy says the CTA shouldn't appear until message ${n}. This is message ${num}, so keep this purely relationship-building, no CTA mention yet.`;
}

function ctaNudgeLine(){
  const magnet = state.settings.leadMagnets.find(m=>m.enabled);
  return magnet ? `By the way, if it's useful I've got a short ${magnet.name} that might be worth a look.` : '';
}

function appendCtaNudge(text, stageKey){
  if(!text || !stageKey || stageKey === 'cta' || stageKey === 'connect') return text;
  const n = parseInt(state.settings.strategy.messagesBeforeCta) || 2;
  if(messageNumberForStage(stageKey) < n) return text;
  const nudge = ctaNudgeLine();
  if(!nudge) return text;
  if(/\n\nMarcus\s*$/.test(text)) return text.replace(/\n\nMarcus\s*$/, `\n\n${nudge}\n\nMarcus`);
  return text + `\n\n${nudge}`;
}

function localTemplateFallback(seq, stageKey){
  const fallbacks = {
    connect: "Hi {{first}}, I work with {{role}}s across WA and came across your profile at {{company}}. Would be good to connect.\n\nMarcus",
    m1: "Thanks for connecting, {{first}}. Curious how things are tracking at {{company}} at the moment. What's top of mind for you right now?\n\nMarcus",
    m2: "No worries if you're flat out, {{first}}. A few {{role}}s I've spoken with lately have found it useful to get a quick outside read on their delivery rhythm. Worth a look for you?\n\nMarcus",
    cta: "If it's useful, {{first}}, I've got a short Change Value Check that gives a clear picture in under 15 minutes, no pitch. Happy to send it through.\n\nMarcus"
  };
  return appendCtaNudge(fallbacks[stageKey], stageKey);
}

/* Sequence chip drag/drop */
let dragChipId = null;
function initSequenceDrag(){}
function onChipDragStart(e, id){ dragChipId = id; e.target.classList.add('dragging'); }
function onChipDragEnd(e){ e.target.classList.remove('dragging'); }
function onChipDragOver(e){ e.preventDefault(); }
function onChipDrop(e, seqId, stageKey){
  e.preventDefault();
  if(!dragChipId) return;
  const c = state.contacts.find(x=>x.id===dragChipId);
  if(!c) return;
  const order = ['connect','m1','m2','cta'];
  const currentStage = contactStageKey(c);
  if(currentStage === stageKey){ dragChipId=null; return; }
  const forward = order.indexOf(stageKey) > order.indexOf(currentStage);
  if(forward){
    openGenerateModal(c.id, stageKey, ()=>renderPage());
  } else {

function screenshotBoxHtml(kind, hint){

function onShotDragOver(e, kind){
  e.preventDefault();
  e.stopPropagation();
  const box = document.getElementById('shotbox-'+kind);
  if(box) box.classList.add('dragover');
}
function onShotDragLeave(e, kind){
  const box = document.getElementById('shotbox-'+kind);
  if(box) box.classList.remove('dragover');
}
function onShotDrop(e, kind){
  e.preventDefault();
  e.stopPropagation();
  const box = document.getElementById('shotbox-'+kind);
  if(box) box.classList.remove('dragover');
  const files = Array.from(e.dataTransfer.files || []).filter(f => f.type.startsWith('image/'));
  if(files.length) processShotFiles(files, kind);
}
function handleScreenshotUpload(event, kind){
  const files = Array.from(event.target.files || []);
  if(files.length) processShotFiles(files, kind);
  event.target.value = '';
}
function processShotFiles(files, kind){
  if(!window.__genCtx) return;
  const arrKey = kind === 'profile' ? 'profileImages' : 'convoImages';
  let pending = files.length;
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = () => {
      const match = String(reader.result).match(/^data:([^;]+);base64,(.*)$/);
      if(match){
        window.__genCtx[arrKey].push({ name: file.name, mediaType: match[1], base64: match[2] });
      }
      pending--;
      if(pending === 0){
        renderShotFiles(kind);
        toast(files.length+' screenshot'+(files.length===1?'':'s')+' attached', 'success');
      }
    };
    reader.readAsDataURL(file);
  });
}
function renderShotFiles(kind){
  const arrKey = kind === 'profile' ? 'profileImages' : 'convoImages';
  const list = (window.__genCtx && window.__genCtx[arrKey]) || [];
  const el = document.getElementById('shotfiles-'+kind);
  if(!el) return;
  el.innerHTML = list.map((f,i) => `<span class="shot-file-chip">${esc(f.name)}<button onclick="removeScreenshot('${kind}',${i})">&times;</button></span>`).join('');
}
function removeScreenshot(kind, idx){
  const arrKey = kind === 'profile' ? 'profileImages' : 'convoImages';
  window.__genCtx[arrKey].splice(idx,1);
  renderShotFiles(kind);
}

async function generateMessageForModal(cid, stageKey){
  const c = state.contacts.find(x=>x.id===cid);
  const seq = state.sequences.find(s=>s.id===c.seqId) || state.sequences[0];
  const st = STAGE_META.find(s=>s.key===stageKey);
  const notes = document.getElementById('genNotes') ? document.getElementById('genNotes').value : c.notes;

  const campaign = activeCampaignForContact(c);
  const campaignStageMap = { m1:'message1', m2:'followUp1', cta:'followUp2' };
  const campaignStage = campaign && campaignStageMap[stageKey] ? campaign.sequence[campaignStageMap[stageKey]] : null;
  const template = (campaignStage && campaignStage.content) ? campaignStage.content : (seq.stages[stageKey] || '');

  const profileImages = (window.__genCtx && window.__genCtx.profileImages) || [];
  const convoImages = (window.__genCtx && window.__genCtx.convoImages) || [];
  const images = [...profileImages, ...convoImages].map(f => ({ mediaType: f.mediaType, base64: f.base64 }));
  let imageNote = '';
  if(profileImages.length) imageNote += ` You've been given ${profileImages.length} screenshot(s) of the contact's LinkedIn profile — read their bio, posts and work history and weave in anything relevant.`;
  if(convoImages.length) imageNote += ` You've also been given ${convoImages.length} screenshot(s) of the conversation so far — read what they actually said and write a reply that responds to it naturally, rather than restating the template.`;
  const campaignNote = campaign ? `\n\nThis contact is part of the active campaign "${campaign.name}" (goal: ${campaign.goal}). Campaign strategy: ${campaign.strategyBrief || 'none recorded'}. Write in line with this strategy.` : '';

  const prompt = `Template for this stage:\n${template}\n\nContact: ${c.name}, ${c.role} at ${c.company}. Sequence stage: ${st.label} (message ${messageNumberForStage(stageKey) || 'n/a'} in the sequence). Profile notes: ${notes || 'none'}.\n\n${ctaStrategyNote(stageKey)}\n\n${voiceRulesText()}${imageNote}${campaignNote}\n\nWrite the actual message for this specific contact, replacing placeholders naturally. Return only the message text.`;
  const result = await callAI(prompt, 400, ()=>fillTemplate(template, c, stageKey), images);
  const out = document.getElementById('genOutput');
  if(out) out.value = result;
}
function fillTemplate(template, c, stageKey){
  const filled = (template || '')
    .replace(/{{first}}/g, firstName(c.name))
    .replace(/{{company}}/g, c.company)
    .replace(/{{role}}/g, c.role);
  return appendCtaNudge(filled, stageKey);
}
function regenerateMessage(cid, stageKey){
  const out = document.getElementById('genOutput');
  if(out) out.value = 'Generating...';
  generateMessageForModal(cid, stageKey);
}
async function copyGeneratedMessage(){
  const out = document.getElementById('genOutput');
  if(!out || !out.value || out.value === 'Generating...') return;
  try {
    await navigator.clipboard.writeText(out.value);
  } catch(err){
    out.focus();
    out.select();
    document.execCommand('copy');
  }
  toast('Message copied to clipboard', 'success');
}
function saveGeneratedMessage(cid, stageKey){
  const c = state.contacts.find(x=>x.id===cid);
  const output = document.getElementById('genOutput').value;
  c.generated[stageKey] = output;
  c.notes = document.getElementById('genNotes').value;
  if(stageKey==='connect'){ c.connReqDate = c.connReqDate || isoDate(TODAY); }
  if(stageKey==='m1'){ c.connDate = c.connDate || isoDate(TODAY); c.thread.connSent = c.thread.connSent || isoDate(TODAY); c.thread.m1 = { sent: isoDate(TODAY), replied:false }; c.state='messaging'; state.activity.unshift({ type:'message', text:`Message 1 sent to ${c.name} (${c.company})`, date: isoDate(TODAY) }); }
  if(stageKey==='m2'){ c.thread.m2 = { sent: isoDate(TODAY), replied:false }; state.activity.unshift({ type:'message', text:`Message 2 sent to ${c.name} (${c.company})`, date: isoDate(TODAY) }); }
  if(stageKey==='cta'){ c.thread.cta = c.thread.cta || CTA_OPTIONS[0]; }
  notifyWebhook(c);
  closeModal();
  toast('Message saved for '+c.name, 'success');
  if(window.__genCtx && window.__genCtx.onDone) window.__genCtx.onDone();
  else renderPage();
}

// Two views: the list (default) and the detail view for one campaign,
// tracked via window.__campaignView ('list' | 'chat' | 'detail'). "Paused"
// was mentioned once in the brief for the detail status pill, but the
// status model was deliberately simplified to exactly Draft/Live/Past in an
// earlier session at explicit user request - kept that 3-status model
// consistent everywhere here rather than reintroducing a 4th status.

const CAMPAIGN_STAGE_META = [['message1','Message 1'],['followUp1','Follow up 1'],['followUp2','Follow up 2']];
const CAMPAIGN_OPENING_MESSAGE = 'Tell me about the campaign you want to run. You can be as detailed or as brief as you like.';
const SEQUENCE_TOUCH_TYPES = ['LinkedIn message','Email','Call'];
const CAMPAIGN_STATUS_CLASS = { Draft:'campaign-status-draft', Live:'campaign-status-active', Paused:'campaign-status-paused', Past:'campaign-status-complete' };
const CAMPAIGN_STATUS_OPTIONS = ['Draft', 'Live', 'Paused', 'Past'];

function renderCampaigns(){
  const view = window.__campaignView || 'list';
  if(view === 'chat') return renderCampaignChatTab();
  if(view === 'detail') return renderCampaignDetail();
  return renderCampaignListView();
}

function campaignMetrics(campaign){
  const contacts = campaignContacts(campaign);
  const contactCount = contacts.length;
  let touchPoints = 0, replies = 0;
  contacts.forEach(c => {
    touchPoints += (c.touchPoints||[]).length;
    if(c.thread.m1 && c.thread.m1.replied) replies++;
    if(c.thread.m2 && c.thread.m2.replied) replies++;
  });
  const bookings = contacts.filter(c => c.thread.booked).length;
  const conversionRate = contactCount ? Math.round((bookings/contactCount)*100) : 0;
  const replyRate = touchPoints ? Math.round((replies/touchPoints)*100) : 0;
  return { contactCount, touchPoints, replies, replyRate, bookings, conversionRate };
}

function campaignContactStatus(c){
  if(c.thread.booked) return 'Booked';
  if((c.thread.m2 && c.thread.m2.replied) || (c.thread.m1 && c.thread.m1.replied)) return 'Replied';
  const lastTouch = lastTouchPointDate(c);
  if(lastTouch && daysBetween(lastTouch) > 14) return 'Unresponsive';
  return 'Active';
}

async function sendCampaignChatMessage(){
  const input = document.getElementById('campaignChatInput');
  const text = input ? input.value.trim() : '';
  if(!text) return;
  const chat = window.__campaignChat;
  chat.messages.push({ role:'user', content:text });
  chat.chips = [];
  renderPage();
  scrollCampaignChatToBottom();

  chat.messages.push({ role:'assistant', content:'...', pending:true });
  renderPage();
  scrollCampaignChatToBottom();
  const sendBtn = document.getElementById('campaignChatSendBtn');
  if(sendBtn) sendBtn.disabled = true;

  try {
    const res = await fetch('/api/campaign/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ conversationHistory: chat.messages.filter(m=>!m.pending).map(m=>({role:m.role, content:m.content})) })
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || ('Request failed with status '+res.status));

    chat.messages.pop();
    chat.messages.push({ role:'assistant', content: data.message });
    chat.chips = data.chips || [];
    chat.ready = !!data.ready;
    chat.progressPercent = typeof data.progressPercent === 'number' ? data.progressPercent : chat.progressPercent;

    renderPage();
    scrollCampaignChatToBottom();

    if(chat.ready) buildCampaignFromChat();
  } catch(err){
    chat.messages.pop();
    chat.messages.push({ role:'assistant', content: "Sorry, I couldn't process that - " + err.message });
    renderPage();
    scrollCampaignChatToBottom();
    toast('Campaign chat error: ' + err.message, 'warn');
  }
}

async function buildCampaignFromChat(){
  const chat = window.__campaignChat;
  chat.progressPercent = 100;
  renderPage();
  scrollCampaignChatToBottom();

  try {
    const res = await fetch('/api/campaign/build', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ conversationHistory: chat.messages.filter(m=>!m.pending).map(m=>({role:m.role, content:m.content})) })
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || ('Request failed with status '+res.status));
    chat.previewCampaign = data;
    renderPage();
    scrollCampaignChatToBottom();
  } catch(err){
    toast('Could not build campaign preview: ' + err.message, 'warn');
  }
}

// Contacts belonging to a campaign are the union of anything explicitly
// added via contactIds (the AI chat builder's matched contacts, or manual
// adds) and anyone sitting on a grid linked to the campaign via gridIds -
// grids are never duplicated, just referenced, so this is a live view, not
// a copy.
function campaignContacts(campaign){
  const ids = new Set(campaign.contactIds || []);
  (campaign.gridIds || []).forEach(gid => gridContacts(gid).forEach(c => ids.add(c.id)));
  return state.contacts.filter(c => ids.has(c.id));
}

// this campaign - this is what makes that data the actual source of truth

// Contacts table (see the search-server.js Context Tab notes for the full
// migration story). Matched to local contacts by name, same convention as
// the rest of this app's Airtable <-> local-state matching.
async function loadCampaignSequenceStages(campaign){
  try {
    const res = await fetch(`/api/campaign/${encodeURIComponent(campaign.name)}/campaign-contacts`);
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || ('Request failed with status '+res.status));
    const map = {};
    (data.rows||[]).forEach(r => { if(r.contactName) map[r.contactName.trim().toLowerCase()] = r.sequenceStage; });
    window.__campaignSequenceStages = window.__campaignSequenceStages || {};
    window.__campaignSequenceStages[campaign.id] = map;
  } catch(err){
    console.warn('Could not load campaign sequence stages:', err.message);
    window.__campaignSequenceStages = window.__campaignSequenceStages || {};
    window.__campaignSequenceStages[campaign.id] = {};
  }
  if(window.__campaignView === 'detail' && window.__campaignDetailId === campaign.id && window.__campaignDetailTab === 'roadmap') renderPage();
  if(state.currentPage === 'grid' && gridViewMode(currentGrid().id) === 'table') renderPage();
}

// Campaign-specific only, never account-wide: everything here is computed
// from campaignContacts(campaign) and campaign.deals, not state.contacts as
// a whole. Charts render via Chart.js once the canvases exist in the DOM -
// see initCampaignAnalyticsCharts(), called from afterRender.

const CAMPAIGN_PERIOD_OPTIONS = [ ['thisWeek','This week'], ['lastWeek','Last week'], ['30d','Last 30 days'], ['60d','Last 60 days'], ['quarter','This quarter'] ];
const LEAD_STATUS_META = [ ['connected','Connected','#0084C5'], ['messaging','Messaging','#FFD05D'], ['warm','Warm','#FF834C'], ['booked','Booked','#44A574'], ['lost','Lost','#c44a2a'] ];

function startOfWeek(d){
  const date = new Date(d); const day = date.getDay();
  date.setDate(date.getDate() + ((day===0?-6:1)-day));
  date.setHours(0,0,0,0);
  return date;
}

function campaignPeriodBounds(periodKey){
  const today = new Date(TODAY); today.setHours(0,0,0,0);
  let start, end;
  if(periodKey === 'thisWeek'){ start = startOfWeek(today); end = today; }
  else if(periodKey === 'lastWeek'){ const ws = startOfWeek(today); end = new Date(ws); end.setDate(end.getDate()-1); start = new Date(ws); start.setDate(start.getDate()-7); }
  else if(periodKey === '30d'){ start = new Date(today); start.setDate(start.getDate()-29); end = today; }
  else if(periodKey === '60d'){ start = new Date(today); start.setDate(start.getDate()-59); end = today; }
  else { const q = Math.floor(today.getMonth()/3); start = new Date(today.getFullYear(), q*3, 1); end = today; }
  end = new Date(end); end.setHours(23,59,59,999);
  const spanMs = end - start;
  const prevEnd = new Date(start); prevEnd.setDate(prevEnd.getDate()-1); prevEnd.setHours(23,59,59,999);
  const prevStart = new Date(prevEnd.getTime() - spanMs);
  return { start, end, prevStart, prevEnd };
}

function inDateRange(dateStr, start, end){
  if(!dateStr) return false;
  const d = new Date(dateStr+'T12:00:00');
  return d >= start && d <= end;
}

function campaignLeadStatus(c){
  if(c.thread.booked) return 'booked';
  if(campaignContactStatus(c) === 'Unresponsive') return 'lost';
  if(c.state === 'messaging'){
    const replied = (c.thread.m1 && c.thread.m1.replied) || (c.thread.m2 && c.thread.m2.replied);
    return replied ? 'warm' : 'messaging';
  }
  if(c.state === 'connected') return 'connected';
  return null;
}

function buildCampaignSeries(campaign, periodKey){
  const { start, end } = campaignPeriodBounds(periodKey);
  const contacts = campaignContacts(campaign);
  const deals = campaign.deals || [];
  const totalDays = Math.round((end-start)/86400000)+1;
  const useDaily = totalDays <= 14;
  const bucketDays = useDaily ? 1 : 7;
  const buckets = [];
  let cursor = new Date(start);
  while(cursor <= end){
    const bEnd = new Date(cursor); bEnd.setDate(bEnd.getDate()+bucketDays-1); bEnd.setHours(23,59,59,999);
    buckets.push({ start:new Date(cursor), end: bEnd > end ? end : bEnd });
    cursor = new Date(cursor); cursor.setDate(cursor.getDate()+bucketDays);
  }
  const labels = buckets.map(b => useDaily ? fmtDateShort(isoDate(b.start)) : `${fmtDateShort(isoDate(b.start))}–${fmtDateShort(isoDate(b.end))}`);
  const contactIds = new Set(contacts.map(c=>c.id));
  const leads = buckets.map(b => contacts.filter(c => inDateRange(c.foundDate, b.start, b.end)).length);
  const meetings = buckets.map(b => state.bookings.filter(bk => contactIds.has(bk.contactId) && inDateRange(bk.date, b.start, b.end)).length);
  const won = buckets.map(b => deals.filter(d => d.outcome === 'won' && inDateRange(d.date, b.start, b.end)).length);
  return { labels, leads, meetings, won };
}

/* -- Section 1: Pipeline progress funnel -- */
// Cumulative "reached this stage or later" counts, not a bucketed
// snapshot of current stage - that's the only way "% moved from M1 to M2"
// is meaningful. Reads the union of each Campaign Contacts row's dated
// Stage History log and its current Sequence Stage (covers rows created
// before Stage History existed). Won/Lost come from Deals, not Sequence
// Stage - there are no Won/Lost stage options, and deal outcomes are the
// real source of truth for those two.
const FUNNEL_STAGE_GROUPS = [
  { key:'connected', label:'Connections Made', stages:['Connected','Message 1 Sent','Pending Reply M1','Ready for Message 2','Message 2 Sent','Pending Reply M2','Ready for Message 3','Message 3 Sent','Pending Reply M3','Meeting Booked'] },
  { key:'m1', label:'Message 1 Sent', stages:['Message 1 Sent','Pending Reply M1','Ready for Message 2','Message 2 Sent','Pending Reply M2','Ready for Message 3','Message 3 Sent','Pending Reply M3','Meeting Booked'] },
  { key:'m2', label:'Message 2 Sent', stages:['Message 2 Sent','Pending Reply M2','Ready for Message 3','Message 3 Sent','Pending Reply M3','Meeting Booked'] },
  { key:'m3', label:'Message 3 Sent', stages:['Message 3 Sent','Pending Reply M3','Meeting Booked'] },
  { key:'meeting', label:'Meetings Booked', stages:['Meeting Booked'] }
];

function reachedStagesFor(cc){
  const set = new Set((cc.stageHistory||[]).map(h=>h.stage));
  if(cc.sequenceStage) set.add(cc.sequenceStage);
  return set;
}

function computeFunnelCounts(data){
  const stageCounts = FUNNEL_STAGE_GROUPS.map(g => ({
    key: g.key, label: g.label,
    count: data.campaignContacts.filter(cc => g.stages.some(s => reachedStagesFor(cc).has(s))).length
  }));
  const won = data.deals.filter(d => d.outcome === 'Won').length;
  const lost = data.deals.filter(d => d.outcome === 'Lost').length;
  return { stageCounts, won, lost };
}

function renderPipelineFunnel(data){
  const { stageCounts, won, lost } = computeFunnelCounts(data);
  const maxCount = Math.max(1, ...stageCounts.map(s=>s.count), won, lost);
  const rows = stageCounts.map((s,i) => {
    const prev = i>0 ? stageCounts[i-1].count : null;
    const conv = (prev !== null && prev > 0) ? Math.round(s.count/prev*100) : null;
    const width = Math.max(4, Math.round(s.count/maxCount*100));
    return `<div class="funnel-row">
      <div class="funnel-label">${s.label}</div>
      <div class="funnel-track"><div class="funnel-fill" style="width:${width}%">${s.count}</div></div>
      <div class="funnel-conv">${conv!==null ? `${conv}% moved from prior` : '—'}</div>
    </div>`;
  }).join('');
  const meetingsCount = stageCounts[stageCounts.length-1].count;
  const wonPct = meetingsCount ? Math.round(won/meetingsCount*100) : 0;
  const lostPct = meetingsCount ? Math.round(lost/meetingsCount*100) : 0;
  return `
  <div class="card" style="margin-bottom:16px;">
    <div class="section-title"><i class="ti ti-filter"></i> Pipeline progress</div>
    <div class="muted" style="font-size:11.5px;margin-bottom:12px;">How many contacts in this campaign have reached each stage, and the conversion rate into it. Won/Lost come from the Sales Log below.</div>
    ${rows}
    <div class="funnel-row"><div class="funnel-label">Won</div><div class="funnel-track"><div class="funnel-fill won" style="width:${Math.max(4,Math.round(won/maxCount*100))}%">${won}</div></div><div class="funnel-conv">${meetingsCount?`${wonPct}% of meetings`:'—'}</div></div>
    <div class="funnel-row"><div class="funnel-label">Lost</div><div class="funnel-track"><div class="funnel-fill lost" style="width:${Math.max(4,Math.round(lost/maxCount*100))}%">${lost}</div></div><div class="funnel-conv">${meetingsCount?`${lostPct}% of meetings`:'—'}</div></div>
  </div>`;
}

/* -- Section 2: Scorecard strip -- */
function computeSalesScorecards(data, period){
  const { start, end, prevStart, prevEnd } = campaignPeriodBounds(period);
  function metricsFor(s, e){
    const connections = [], meetingsBooked = [];
    data.campaignContacts.forEach(cc => {
      (cc.stageHistory||[]).forEach(h => {
        if(h.stage === 'Connected' && inDateRange(h.date, s, e)) connections.push({ cc, date:h.date });
        if(h.stage === 'Meeting Booked' && inDateRange(h.date, s, e)) meetingsBooked.push({ cc, date:h.date });
      });
    });
    const messagesSent = data.touchPoints.filter(tp => tp.type !== 'Inbound Reply' && inDateRange(tp.date, s, e));
    const repliesReceived = data.touchPoints.filter(tp => tp.replied && inDateRange(tp.date, s, e));
    const won = data.deals.filter(d => d.outcome === 'Won' && inDateRange(d.date, s, e));
    const lost = data.deals.filter(d => d.outcome === 'Lost' && inDateRange(d.date, s, e));
    const responseRate = messagesSent.length ? Math.round(repliesReceived.length / messagesSent.length * 100) : 0;

    let daysSum = 0, daysCount = 0;
    connections.forEach(({cc, date}) => {
      const replyDates = data.touchPoints.filter(tp => tp.contactId === cc.contactId && tp.replied && tp.date).map(tp=>tp.date).sort();
      const firstReply = replyDates.find(d => new Date(d) >= new Date(date));
      if(firstReply){
        const diff = Math.round((new Date(firstReply) - new Date(date)) / 86400000);
        if(diff >= 0){ daysSum += diff; daysCount++; }
      }
    });
    const avgDaysToReply = daysCount ? Math.round(daysSum/daysCount*10)/10 : null;

    let touchesSum = 0, touchesCount = 0;
    meetingsBooked.forEach(({cc, date}) => {
      const touchesBefore = data.touchPoints.filter(tp => tp.contactId === cc.contactId && tp.date && new Date(tp.date) <= new Date(date)).length;
      if(touchesBefore){ touchesSum += touchesBefore; touchesCount++; }
    });
    const avgTouchesToBooking = touchesCount ? Math.round(touchesSum/touchesCount*10)/10 : null;

    return { connections: connections.length, messagesSent: messagesSent.length, repliesReceived: repliesReceived.length, meetingsBooked: meetingsBooked.length, won: won.length, lost: lost.length, responseRate, avgDaysToReply, avgTouchesToBooking };
  }
  return { current: metricsFor(start, end), previous: metricsFor(prevStart, prevEnd) };
}

function renderSalesScorecards(data, period){
  const { current, previous } = computeSalesScorecards(data, period);
  const delta = (a,b) => { if(a===null||b===null) return ''; const d = Math.round((a-b)*10)/10; return d===0 ? 'No change vs last period' : (d>0 ? `+${d} vs last period` : `${d} vs last period`); };
  const cards = [
    ['Connections made', current.connections, delta(current.connections, previous.connections)],
    ['Messages sent', current.messagesSent, delta(current.messagesSent, previous.messagesSent)],
    ['Replies received', current.repliesReceived, delta(current.repliesReceived, previous.repliesReceived)],
    ['Meetings booked', current.meetingsBooked, delta(current.meetingsBooked, previous.meetingsBooked)],
    ['Won', current.won, delta(current.won, previous.won)],
    ['Lost', current.lost, delta(current.lost, previous.lost)],
    ['Response rate', current.responseRate + '%', delta(current.responseRate, previous.responseRate)],
    ['Avg days connection \u2192 first reply', current.avgDaysToReply ?? '\u2014', delta(current.avgDaysToReply, previous.avgDaysToReply)],
    ['Avg touches to booking', current.avgTouchesToBooking ?? '\u2014', delta(current.avgTouchesToBooking, previous.avgTouchesToBooking)]
  ];
  return `
  <div class="card" style="margin-bottom:16px;">
    <div class="section-title"><i class="ti ti-chart-bar"></i> Scorecard</div>
    <div class="mini-cards" style="grid-template-columns:repeat(3,1fr);margin-bottom:0;">
      ${cards.map(([label,val,d])=>`<div class="mini-card"><div class="num">${val}</div><div class="label">${label}</div>${d?`<div class="muted" style="font-size:11px;margin-top:4px;">${d}</div>`:''}</div>`).join('')}
    </div>
  </div>`;
}

/* -- Section 3: Conversion intelligence (6 panels) -- */
const HEATMAP_DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const HEATMAP_BUCKETS = ['Morning','Midday','Afternoon','Evening','Late night'];

function renderBestTimeHeatmap(rows){
  if(!rows || !rows.length) return '<div class="empty-state">No message timestamps extracted yet - upload DM screenshots with visible timestamps to build this out.</div>';
  const counts = {};
  let max = 1;
  rows.forEach(r => { counts[`${r.day}|${r.bucket}`] = r.count; if(r.count > max) max = r.count; });
  const cells = ['<div class="hm-head"></div>'];
  HEATMAP_BUCKETS.forEach(b => cells.push(`<div class="hm-head">${b}</div>`));
  HEATMAP_DAYS.forEach(day => {
    cells.push(`<div class="hm-row-label">${day.slice(0,3)}</div>`);
    HEATMAP_BUCKETS.forEach(bucket => {
      const c = counts[`${day}|${bucket}`] || 0;
      const opacity = c ? 0.15 + (c/max)*0.65 : 0;
      cells.push(`<div class="heatmap-cell" style="background:rgba(0,132,197,${opacity})">${c || ''}</div>`);
    });
  });
  return `<div class="heatmap-grid">${cells.join('')}</div>`;
}

      data: { labels: intel.sentimentBreakdown.map(s=>s.sentiment), datasets: [{ data: intel.sentimentBreakdown.map(s=>s.count), backgroundColor:['#44A574','#8a8a8a','#0084C5','#c44a2a'] }] },
      options: { responsive:true, maintainAspectRatio:false, plugins:{ legend:{ position:'bottom', labels:{ boxWidth:10, font:{ size:11 } } } } }
    });

}

/* -- Section 4: Sales log -- */
function dealOutcomeTagClass(outcome){
  const o = (outcome||'').toLowerCase();
  if(o === 'won') return 'tag-won';
  if(o === 'lost') return 'tag-lost';
  if(o === 'started') return 'tag-started';
  return 'tag-pending';
}
function sentimentTagClass(sentiment){
  const s = (sentiment||'').toLowerCase();
  if(s === 'positive') return 'tag-sent-positive';
  if(s === 'cold') return 'tag-sent-cold';
  if(s === 'negative') return 'tag-sent-negative';
  return 'tag-sent-neutral';
}

// Looks in whichever deal list is currently cached - the Sales tab's
// window.__salesData.deals, or window.__calendarEvents when this is
// called from the Sales Calendar's click-to-expand instead.
function findDealById(dealId){
  const fromSales = (window.__salesData && window.__salesData.deals || []).find(d => d.id === dealId);
  if(fromSales) return fromSales;
  const fromCal = (window.__calendarEvents || []).find(e => e.dealId === dealId);
  if(fromCal) return { id: fromCal.dealId, notes: fromCal.notes || '' };
  return null;
}

function toggleDealRow(dealId){
  const row = document.getElementById('dealNotes-'+dealId);
  const chevron = document.getElementById('dealChevron-'+dealId);
  if(!row) return;
  const isHidden = row.style.display === 'none' || !row.style.display;
  row.style.display = isHidden ? 'table-row' : 'none';
  if(chevron) chevron.className = isHidden ? 'ti ti-chevron-down' : 'ti ti-chevron-right';
  if(isHidden){
    const deal = findDealById(dealId);
    const body = row.querySelector('.deal-notes-body');
    if(body && deal) body.innerHTML = renderDealNotesThread(deal);
  }
}

// Deals.Notes is an append-log, same convention as Conversation Context:
// "[timestamp] (Pre-meeting|Post-meeting) note text", blocks separated by
// a blank line.
function parseDealNotes(notesText){
  if(!notesText) return [];
  return notesText.split('\n\n').map(block => {
    const m = block.match(/^\[([^\]]+)\]\s*\(([^)]+)\)\s*([\s\S]*)$/);
    if(m) return { timestamp: m[1], phase: m[2], text: m[3] };
    return { timestamp: '', phase: '', text: block };
  }).filter(n => n.text || n.timestamp);
}

function renderDealNotesThread(deal){
  if(!deal) return '<div class="muted">Deal not found.</div>';
  const notes = parseDealNotes(deal.notes);
  return `
    <div style="max-width:640px;">
      ${notes.length ? notes.map(n => `
        <div style="margin-bottom:10px;padding:8px 10px;background:var(--bg);border-radius:8px;">
          <div style="font-size:11px;font-weight:700;color:var(--muted);margin-bottom:3px;">${esc(n.phase||'Note')}${n.timestamp?` \u00b7 ${esc(n.timestamp)}`:''}</div>
          <div style="font-size:12.5px;">${esc(n.text)}</div>
        </div>`).join('') : '<div class="muted" style="margin-bottom:10px;">No notes yet.</div>'}
      <div class="field"><label>Add a note</label><textarea id="dealNoteText-${deal.id}" rows="2" placeholder="e.g. They mentioned budget in their reply"></textarea></div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-secondary btn-sm" onclick="submitDealNote('${deal.id}','pre')"><i class="ti ti-clock"></i> Add pre-meeting note</button>
        <button class="btn btn-secondary btn-sm" onclick="submitDealNote('${deal.id}','post')"><i class="ti ti-checkbox"></i> Add post-meeting note</button>
      </div>
    </div>`;
}

async function submitDealNote(dealId, phase){
  const textEl = document.getElementById(`dealNoteText-${dealId}`);
  const noteText = textEl ? textEl.value.trim() : '';
  if(!noteText){ toast('Write a note first', 'warn'); return; }
  try {
    const res = await fetch(`/api/deals/${dealId}/notes`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ noteText, phase })
    });
    const json = await res.json();
    if(!res.ok || !json.success) throw new Error(json.error || 'Save failed');

    const salesDeal = window.__salesData && (window.__salesData.deals||[]).find(d => d.id === dealId);
    if(salesDeal) salesDeal.notes = json.notes;
    const calEvent = (window.__calendarEvents||[]).find(e => e.dealId === dealId);
    if(calEvent) calEvent.notes = json.notes;

    const deal = findDealById(dealId);
    const container = textEl.closest('.deal-notes-body') || textEl.closest('.modal-body');
    if(container && deal) container.innerHTML = renderDealNotesThread(deal);
    toast('Note added \u2014 also feeding the contact/company AI Summary in the background', 'success');
  } catch(err){
    toast('Could not save note: ' + err.message, 'warn');
  }
}

async function updateDealField(dealId, field, value){
  const campaign = state.campaigns.find(c => c.id === window.__campaignDetailId);
  if(!campaign) return;
  const body = {};
  if(field === 'outcome') body.outcome = value;
  if(field === 'dealValue') body.dealValue = value ? parseFloat(value) : 0;
  if(field === 'assigneeId') body.assigneeId = value || null;
  try {
    const res = await fetch(`/api/campaign/${encodeURIComponent(campaign.name)}/deals/${dealId}`, {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
    });
    if(!res.ok) throw new Error('Update failed');
    const deal = (window.__salesData && window.__salesData.deals || []).find(d => d.id === dealId);
    if(deal) Object.assign(deal, body.outcome!==undefined?{outcome:body.outcome}:body.dealValue!==undefined?{dealValue:body.dealValue}:{assigneeId:body.assigneeId});
    toast('Deal updated', 'success');
  } catch(err){
    toast('Could not update deal: ' + err.message, 'warn');
    loadSalesOverview(campaign);
  }
}

// Unlike every other write in this app, this one awaits the Airtable save
// before closing the modal - Deals now has no local fallback array to
// render from, so the real save has to land before the UI can show it.
async function confirmAddDeal(){
  const campaign = state.campaigns.find(c => c.id === window.__addDealCampaignId);
  if(!campaign) return;
  const contactId = document.getElementById('dealContactId').value;
  if(!contactId){ toast('Select a contact', 'warn'); return; }
  const sel = document.getElementById('dealContactId');
  const companyId = sel.options[sel.selectedIndex].dataset.companyId || null;
  const outcome = document.getElementById('dealOutcome').value;
  const dealValue = document.getElementById('dealValue').value;
  const assigneeId = document.getElementById('dealAssignee').value || null;
  const sentiment = document.getElementById('dealSentiment').value || null;
  const date = document.getElementById('dealDate').value || isoDate(TODAY);
  const notes = document.getElementById('dealNotes').value.trim();

  const btn = document.getElementById('confirmAddDealBtn');
  if(btn){ btn.disabled = true; btn.innerHTML = '<i class="ti ti-loader-2"></i> Saving...'; }

  try {
    const res = await fetch(`/api/campaign/${encodeURIComponent(campaign.name)}/deals`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ contactId, companyId, outcome, dealValue: dealValue ? parseFloat(dealValue) : 0, assigneeId, notes, date, sentiment })
    });
    const json = await res.json();
    if(!res.ok || !json.success) throw new Error(json.error || 'Save failed');
    closeModal();
    toast('Deal logged', 'success');
    await loadSalesOverview(campaign);
  } catch(err){
    toast('Could not save deal: ' + err.message, 'warn');
    if(btn){ btn.disabled = false; btn.innerHTML = '<i class="ti ti-check"></i> Save deal'; }
  }
}

async function addRep(){

async function deleteRep(repId){

    renderManageRepsModalBody();

    toast('Could not remove rep: ' + err.message, 'warn');
  }
}

/* -- Section 5: Weekly sales report card -- */
function renderWeeklySalesCard(data, period){
  const { current } = computeSalesScorecards(data, period);
  const intel = window.__salesConversionIntel;
  const periodLabel = (CAMPAIGN_PERIOD_OPTIONS.find(([k])=>k===period) || [null, period])[1];
  let topStep = '\u2014';
  if(intel && !intel.error && intel.messageStepToBooking && intel.messageStepToBooking.length){
    const best = intel.messageStepToBooking.slice().sort((a,b)=>b.booked-a.booked)[0];
    if(best && best.booked) topStep = `${best.step} (${best.booked} booked)`;
  }
  let topCta = '\u2014';
  if(intel && !intel.error && intel.ctaToBooking && intel.ctaToBooking.length){
    const best = intel.ctaToBooking.slice().sort((a,b)=>b.bookings-a.bookings)[0];
    if(best && best.bookings) topCta = `${best.cta} (${best.bookings} booked)`;
  }
  return `
  <div class="card" id="weeklySalesCard" style="margin-top:16px;">
    <div class="section-title"><i class="ti ti-report"></i> Weekly sales report card \u2014 ${esc(periodLabel)}</div>
    <div class="mini-cards" style="grid-template-columns:repeat(3,1fr);">
      <div class="mini-card"><div class="num">${current.connections}</div><div class="label">Connections made</div></div>
      <div class="mini-card"><div class="num">${current.messagesSent}</div><div class="label">Messages sent</div></div>
      <div class="mini-card"><div class="num">${current.repliesReceived}</div><div class="label">Replies</div></div>
      <div class="mini-card"><div class="num">${current.meetingsBooked}</div><div class="label">Meetings booked</div></div>
      <div class="mini-card"><div class="num">${current.won}</div><div class="label">Won</div></div>
      <div class="mini-card"><div class="num">${current.lost}</div><div class="label">Lost</div></div>
      <div class="mini-card"><div class="num">${current.responseRate}%</div><div class="label">Response rate</div></div>
      <div class="mini-card"><div class="num" style="font-size:14px;">${esc(topStep)}</div><div class="label">Top converting step</div></div>
      <div class="mini-card"><div class="num" style="font-size:14px;">${esc(topCta)}</div><div class="label">Top performing CTA</div></div>
    </div>
  </div>`;
}

          ${(a.objectionsRaised&&a.objectionsRaised.length) ? `<div style="margin-top:4px;font-size:11.5px;"><strong>Objections:</strong> ${a.objectionsRaised.map(t=>esc(t)).join(', ')}</div>` : ''}
