// Two views: the list (default) and the detail view for one campaign,
// tracked via window.__campaignView ('list' | 'chat' | 'detail'). "Paused"
// was mentioned once in the brief for the detail status pill, but the
// status model was deliberately simplified to exactly Draft/Live/Past in an
// earlier session at explicit user request - kept that 3-status model
// consistent everywhere here rather than reintroducing a 4th status.

const CAMPAIGN_STAGE_META = [['message1','Message 1'],['followUp1','Follow up 1'],['followUp2','Follow up 2']];
const CAMPAIGN_OPENING_MESSAGE = 'Tell me about the campaign you want to run. You can be as detailed or as brief as you like.';
const SEQUENCE_TOUCH_TYPES = ['LinkedIn message','Email','Call'];
const CAMPAIGN_STATUS_CLASS = { Draft:'campaign-status-draft', Live:'campaign-status-active', Paused:'campaign-status-paused', Past:'campaign-status-complete' };
const CAMPAIGN_STATUS_OPTIONS = ['Draft', 'Live', 'Paused', 'Past'];

function renderCampaigns(){
  const view = window.__campaignView || 'list';
  if(view === 'chat') return renderCampaignChatTab();
  if(view === 'detail') return renderCampaignDetail();
  return renderCampaignListView();
}

function campaignMetrics(campaign){
  const contacts = campaignContacts(campaign);
  const contactCount = contacts.length;
  let touchPoints = 0, replies = 0;
  contacts.forEach(c => {
    touchPoints += (c.touchPoints||[]).length;
    if(c.thread.m1 && c.thread.m1.replied) replies++;
    if(c.thread.m2 && c.thread.m2.replied) replies++;
  });
  const bookings = contacts.filter(c => c.thread.booked).length;
  const conversionRate = contactCount ? Math.round((bookings/contactCount)*100) : 0;
  const replyRate = touchPoints ? Math.round((replies/touchPoints)*100) : 0;
  return { contactCount, touchPoints, replies, replyRate, bookings, conversionRate };
}

function campaignContactStatus(c){
  if(c.thread.booked) return 'Booked';
  if((c.thread.m2 && c.thread.m2.replied) || (c.thread.m1 && c.thread.m1.replied)) return 'Replied';
  const lastTouch = lastTouchPointDate(c);
  if(lastTouch && daysBetween(lastTouch) > 14) return 'Unresponsive';
  return 'Active';
}

async function sendCampaignChatMessage(){
  const input = document.getElementById('campaignChatInput');
  const text = input ? input.value.trim() : '';
  if(!text) return;
  const chat = window.__campaignChat;
  chat.messages.push({ role:'user', content:text });
  chat.chips = [];
  renderPage();
  scrollCampaignChatToBottom();

  chat.messages.push({ role:'assistant', content:'...', pending:true });
  renderPage();
  scrollCampaignChatToBottom();
  const sendBtn = document.getElementById('campaignChatSendBtn');
  if(sendBtn) sendBtn.disabled = true;

  try {
    const res = await fetch('/api/campaign/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ conversationHistory: chat.messages.filter(m=>!m.pending).map(m=>({role:m.role, content:m.content})) })
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || ('Request failed with status '+res.status));

    chat.messages.pop();
    chat.messages.push({ role:'assistant', content: data.message });
    chat.chips = data.chips || [];
    chat.ready = !!data.ready;
    chat.progressPercent = typeof data.progressPercent === 'number' ? data.progressPercent : chat.progressPercent;

    renderPage();
    scrollCampaignChatToBottom();

    if(chat.ready) buildCampaignFromChat();
  } catch(err){
    chat.messages.pop();
    chat.messages.push({ role:'assistant', content: "Sorry, I couldn't process that - " + err.message });
    renderPage();
    scrollCampaignChatToBottom();
    toast('Campaign chat error: ' + err.message, 'warn');
  }
}

async function buildCampaignFromChat(){
  const chat = window.__campaignChat;
  chat.progressPercent = 100;
  chat.building = true;
  renderPage();
  scrollCampaignChatToBottom();

  try {
    const res = await fetch('/api/campaign/build', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ conversationHistory: chat.messages.filter(m=>!m.pending).map(m=>({role:m.role, content:m.content})) })
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || ('Request failed with status '+res.status));
    chat.previewCampaign = data;
    // Name, ICP, and goal are all set by this point - gate Save to Draft on
    // the offer step below rather than reintroducing a new build round trip
    // for it.
    chat.offerStep = 'choose';
    chat.offer = null;
  } catch(err){
    toast('Could not build campaign preview: ' + err.message, 'warn');
  } finally {
    chat.building = false;
    renderPage();
    scrollCampaignChatToBottom();
  }
}

  ['effortAndSacrifice', 'What effort is required from them?'],

function renderOfferSetupCard(chat){
  const step = chat.offerStep;
  if(step === 'choose'){
    return `

  }

    return `<div class="card" style="margin-top:14px;"><div class="muted"><i class="ti ti-loader-2"></i> Generating an offer from T2C's past campaign performance...</div></div>`;
  }

      ${o.rationale ? `<p class="muted" style="font-size:11.5px;margin-bottom:10px;"><i class="ti ti-info-circle"></i> ${esc(o.rationale)}</p>` : ''}

      <div class="field"><label>Effort &amp; sacrifice</label><textarea rows="2" oninput="updateOfferField('effortAndSacrifice',this.value)">${esc(o.effortAndSacrifice||'')}</textarea></div>
      <div class="field"><label>Guarantee</label><textarea rows="2" oninput="updateOfferField('guarantee',this.value)">${esc(o.guarantee||'')}</textarea></div>
      <div class="field"><label>Offer summary</label><textarea rows="3" oninput="updateOfferField('summary',this.value)">${esc(o.summary||'')}</textarea></div>

        <button class="btn btn-primary" onclick="acceptOffer()"><i class="ti ti-check"></i> Use this offer</button>

async function chooseOfferPath(path){
  const chat = window.__campaignChat;
  const preview = chat.previewCampaign;
  if(path === 'generate'){
    chat.offerStep = 'generating';
    renderPage();
    scrollCampaignChatToBottom();
    try {
      const res = await fetch('/api/offers/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ icp: preview.targetSegmentSummary || '', goal: preview.goal || '', product: preview.product || '' })
      });
      const data = await res.json();
      if(!res.ok) throw new Error(data.error || ('Request failed with status '+res.status));
      chat.offer = Object.assign({}, data.offer, { rationale: data.rationale || '' });
      chat.offerStep = 'review';
    } catch(err){
      toast('Could not generate offer: ' + err.message, 'warn');
      chat.offerStep = 'choose';
    }
    renderPage();
    scrollCampaignChatToBottom();
  } else {
    chat.offerAnswers = {};
    chat.offerQuestionIndex = 0;
    chat.offerStep = 'building';
    renderPage();
    scrollCampaignChatToBottom();
  }
}

async function submitOfferAnswer(){
  const chat = window.__campaignChat;
  const input = document.getElementById('offerAnswerInput');
  const text = input ? input.value.trim() : '';
  if(!text) return;
  const idx = chat.offerQuestionIndex || 0;
  const [key] = OFFER_QUESTIONS[idx];
  chat.offerAnswers[key] = text;

  if(idx + 1 < OFFER_QUESTIONS.length){
    chat.offerQuestionIndex = idx + 1;
    renderPage();
    scrollCampaignChatToBottom();
    return;
  }

  chat.offerStep = 'generating';
  renderPage();
  scrollCampaignChatToBottom();
  try {
    const res = await fetch('/api/offers/compose', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(chat.offerAnswers)
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || ('Request failed with status '+res.status));
    chat.offer = Object.assign({}, chat.offerAnswers, { summary: data.summary });
  } catch(err){
    toast('Could not compose offer summary: ' + err.message, 'warn');
    chat.offer = Object.assign({}, chat.offerAnswers, { summary: '' });
  }

function saveCampaignToDraft(){
  const chat = window.__campaignChat;
  const preview = chat.previewCampaign;
  if(!preview) return;
  const matchedNames = preview.matchedContactNames || [];
  const contactIds = state.contacts
    .filter(c => matchedNames.some(n => n.trim().toLowerCase() === c.name.trim().toLowerCase()))
    .map(c => c.id);

  let campaign = chat.editingCampaignId ? state.campaigns.find(c => c.id === chat.editingCampaignId) : null;
  if(!campaign){
    campaign = { id: uid('camp'), createdAt: isoDate(TODAY) };
    state.campaigns.push(campaign);
  }
  Object.assign(campaign, {
    name: preview.campaignName || 'Untitled campaign',
    goal: preview.goal || '',
    targetSegmentSummary: preview.targetSegmentSummary || '',
    product: preview.product || campaign.product || '',
    pitchAngle: preview.pitchAngle || '',
    objectionHandling: preview.objectionHandling || '',
    successMetric: preview.successMetric || '',
    contactIds,
    sequence: preview.sequence || {},
    strategyBrief: preview.strategyBrief || '',
    estimatedConversions: preview.estimatedConversions || '',
    conversationHistory: chat.messages.filter(m=>!m.pending),
    status: campaign.status || 'Draft',
    updatedAt: isoDate(TODAY)
  });

  const offerToSave = chat.offer;
  syncCampaignToAirtable(campaign, () => { if(offerToSave) saveOfferForCampaign(campaign, offerToSave); });
  toast(`Campaign "${campaign.name}" saved to Draft with ${contactIds.length} matched contact${contactIds.length===1?'':'s'}`, 'success');
  window.__campaignChat = null;
  openCampaignDetail(campaign.id);
}

// Writes the offer set during campaign creation (or regenerated on the
// Sales tab) to Airtable as this campaign's new Active offer - called only
// once syncCampaignToAirtable's callback confirms campaign.recordId is set,
// since the Offers record must link to a real Campaign record.
function saveOfferForCampaign(campaign, offer){
  if(!campaign.recordId){ console.warn('Cannot save offer - campaign has no Airtable record id yet'); return; }
  fetch('/api/offers/save', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      campaignId: campaign.recordId,
      campaignName: campaign.name,
      icp: campaign.targetSegmentSummary || '',
      goal: campaign.goal || '',
      dreamOutcome: offer.dreamOutcome || '',
      timeToValue: offer.timeToValue || '',
      effortAndSacrifice: offer.effortAndSacrifice || '',
      guarantee: offer.guarantee || '',
      summary: offer.summary || '',
      rationale: offer.rationale || ''
    })
  }).catch(err => console.warn('Offer save failed:', err.message));
}

// added via contactIds (the AI chat builder's matched contacts, or manual

// Sequence Stage now lives on Campaign Contacts (Airtable), filtered to
// this campaign - this is what makes that data the actual source of truth
// for the badge on each Roadmap card, rather than reading it off the
// Contacts table (see the search-server.js Context Tab notes for the full
// migration story). Matched to local contacts by name, same convention as
// the rest of this app's Airtable <-> local-state matching.
async function loadCampaignSequenceStages(campaign){
  try {
    const res = await fetch(`/api/campaign/${encodeURIComponent(campaign.name)}/campaign-contacts`);
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || ('Request failed with status '+res.status));
    const map = {};
    const dateMap = {};
    (data.rows||[]).forEach(r => {
      if(!r.contactName) return;
      const key = r.contactName.trim().toLowerCase();
      map[key] = r.sequenceStage;
      dateMap[key] = r.connectionSentDate || null;
    });
    window.__campaignSequenceStages = window.__campaignSequenceStages || {};
    window.__campaignSequenceStages[campaign.id] = map;
    window.__campaignConnectionSentDates = window.__campaignConnectionSentDates || {};
    window.__campaignConnectionSentDates[campaign.id] = dateMap;
  } catch(err){
    console.warn('Could not load campaign sequence stages:', err.message);
    window.__campaignSequenceStages = window.__campaignSequenceStages || {};
    window.__campaignSequenceStages[campaign.id] = {};
    window.__campaignConnectionSentDates = window.__campaignConnectionSentDates || {};
    window.__campaignConnectionSentDates[campaign.id] = {};
  }
  if(window.__campaignView === 'detail' && window.__campaignDetailId === campaign.id && window.__campaignDetailTab === 'roadmap') renderPage();
  // Both Grid view modes depend on this now - Table already did (sequence
  // stage column), and Grid does too since gridConnectionSentDateFor started
  // backing its day badge with Connection Sent Date.
  if(state.currentPage === 'grid') renderPage();
  if(state.currentPage === 'home') renderPage();
}

// Today's Actions fast-action cards (see getFastActionForCampaignContact)

// contact's card depends on it - loads once per campaign per session,

function ensureTodaysActionsSequenceStagesLoaded(){
  window.__campaignSequenceStages = window.__campaignSequenceStages || {};
  state.campaigns.filter(c => c.status === 'Live').forEach(campaign => {
    if(window.__campaignSequenceStages[campaign.id] === undefined) loadCampaignSequenceStages(campaign);
  });
}

async function aiRedraftSequenceStage(campaignId, stageKey){
  const campaign = state.campaigns.find(c => c.id === campaignId);
  if(!campaign) return;
  const statusEl = document.getElementById('seqEditAiStatus');
  const label = CAMPAIGN_STAGE_META.find(([k])=>k===stageKey)[1];
  if(statusEl) statusEl.textContent = 'Redrafting with the Engine...';

  const currentContent = document.getElementById('seqEditContent').value;
  const currentType = document.getElementById('seqEditType').value;
  const historicalNote = (window.__campaignInsights && window.__campaignInsights.length)
    ? window.__campaignInsights.join(' ')
    : 'no campaign insights run yet for this campaign';

  let result;
  try {
    const res = await fetch('/api/campaign/redraft-stage', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        campaign: { name: campaign.name, goal: campaign.goal, targetSegmentSummary: campaign.targetSegmentSummary, pitchAngle: campaign.pitchAngle, objectionHandling: campaign.objectionHandling, strategyBrief: campaign.strategyBrief },
        stageLabel: label,
        currentType,
        currentContent,
        historicalNote
      })
    });
    const data = await res.json();
    if(!res.ok || !data.success) throw new Error(data.error || 'Request failed');
    result = data.message;
  } catch(err){
    console.warn('Redraft unavailable, using local fallback:', err.message);
    result = currentContent || 'Following up given where things stand - keen to hear how things are tracking.\n\nTwenty2 Collective';
  }
  const contentEl = document.getElementById('seqEditContent');
  if(contentEl) contentEl.value = result;
  if(statusEl) statusEl.textContent = 'Redraft ready — review and Save to keep it.';
}

function renderTimeoutCheckResultHtml(result){
  if(!result.flaggedCount){
    return `<span class="muted" style="font-size:12.5px;">No new timeouts. ${result.totalTimedOut} total timed out on this campaign.</span>`;
  }
  return `<span style="font-size:12.5px;">Flagged ${result.flaggedCount} contact${result.flaggedCount===1?'':'s'} as timed out: ${esc(result.flaggedNames.join(', '))}. ${result.totalTimedOut} total timed out on this campaign.</span>`;
}

async function checkCampaignTimeouts(campaignId){
  const campaign = state.campaigns.find(c => c.id === campaignId);
  if(!campaign) return;
  const btn = document.getElementById('timeoutCheckBtn-'+campaignId);
  const resultEl = document.getElementById('timeoutCheckResult-'+campaignId);
  const original = btn ? btn.innerHTML : '';
  if(btn){ btn.disabled = true; btn.innerHTML = '<i class="ti ti-loader-2"></i> Checking...'; }
  if(resultEl) resultEl.innerHTML = '<span class="muted" style="font-size:12.5px;"><i class="ti ti-loader-2"></i> Checking connection ages...</span>';
  try {
    const res = await fetch(`/api/campaign/${encodeURIComponent(campaign.name)}/check-timeouts`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ timeoutDays: state.settings.timeoutDays })
    });
    const data = await res.json();
    if(!res.ok || !data.success) throw new Error(data.error || 'Request failed');
    window.__timeoutCheckResults = window.__timeoutCheckResults || {};
    window.__timeoutCheckResults[campaignId] = data;
    if(resultEl) resultEl.innerHTML = renderTimeoutCheckResultHtml(data);
    toast(data.flaggedCount ? `${data.flaggedCount} contact${data.flaggedCount===1?'':'s'} flagged as timed out` : 'No new timeouts found', data.flaggedCount ? 'warn' : 'success');
    if(window.__roadmapCampaignId === campaignId) loadCampaignSequenceStages(campaign);
  } catch(err){
    if(resultEl) resultEl.innerHTML = `<span class="muted" style="font-size:12.5px;">Could not check timeouts: ${esc(err.message)}</span>`;
    toast('Could not check timeouts: ' + err.message, 'warn');
  } finally {
    if(btn){ btn.disabled = false; btn.innerHTML = original; }
  }
}

// from campaignContacts(campaign) and campaign.deals, not state.contacts as

// see initCampaignAnalyticsCharts(), called from afterRender.

const CAMPAIGN_PERIOD_OPTIONS = [ ['thisWeek','This week'], ['lastWeek','Last week'], ['30d','Last 30 days'], ['60d','Last 60 days'], ['quarter','This quarter'] ];
const LEAD_STATUS_META = [ ['messaging','Messaging','#FFD05D'], ['warm','Warm','#FF834C'], ['booked','Booked','#44A574'], ['lost','Lost','#c44a2a'] ];

function startOfWeek(d){
  const date = new Date(d); const day = date.getDay();
  date.setDate(date.getDate() + ((day===0?-6:1)-day));
  date.setHours(0,0,0,0);
  return date;
}

function campaignPeriodBounds(periodKey){
  const today = new Date(TODAY); today.setHours(0,0,0,0);
  let start, end;
  if(periodKey === 'thisWeek'){ start = startOfWeek(today); end = today; }
  else if(periodKey === 'lastWeek'){ const ws = startOfWeek(today); end = new Date(ws); end.setDate(end.getDate()-1); start = new Date(ws); start.setDate(start.getDate()-7); }
  else if(periodKey === '30d'){ start = new Date(today); start.setDate(start.getDate()-29); end = today; }
  else if(periodKey === '60d'){ start = new Date(today); start.setDate(start.getDate()-59); end = today; }
  else { const q = Math.floor(today.getMonth()/3); start = new Date(today.getFullYear(), q*3, 1); end = today; }
  end = new Date(end); end.setHours(23,59,59,999);
  const spanMs = end - start;
  const prevEnd = new Date(start); prevEnd.setDate(prevEnd.getDate()-1); prevEnd.setHours(23,59,59,999);
  const prevStart = new Date(prevEnd.getTime() - spanMs);
  return { start, end, prevStart, prevEnd };
}

function inDateRange(dateStr, start, end){
  if(!dateStr) return false;
  const d = new Date(dateStr+'T12:00:00');
  return d >= start && d <= end;
}

function campaignLeadStatus(c){
  if(c.thread.booked) return 'booked';
  if(campaignContactStatus(c) === 'Unresponsive') return 'lost';
  if(c.state === 'messaging'){
    const replied = (c.thread.m1 && c.thread.m1.replied) || (c.thread.m2 && c.thread.m2.replied);
    return replied ? 'warm' : 'messaging';
  }
  return null;
}

function buildCampaignSeries(campaign, periodKey){
  const { start, end } = campaignPeriodBounds(periodKey);
  const contacts = campaignContacts(campaign);
  const deals = campaign.deals || [];
  const totalDays = Math.round((end-start)/86400000)+1;
  const useDaily = totalDays <= 14;
  const bucketDays = useDaily ? 1 : 7;
  const buckets = [];
  let cursor = new Date(start);
  while(cursor <= end){
    const bEnd = new Date(cursor); bEnd.setDate(bEnd.getDate()+bucketDays-1); bEnd.setHours(23,59,59,999);
    buckets.push({ start:new Date(cursor), end: bEnd > end ? end : bEnd });
    cursor = new Date(cursor); cursor.setDate(cursor.getDate()+bucketDays);
  }
  const labels = buckets.map(b => useDaily ? fmtDateShort(isoDate(b.start)) : `${fmtDateShort(isoDate(b.start))}–${fmtDateShort(isoDate(b.end))}`);
  const contactIds = new Set(contacts.map(c=>c.id));
  const leads = buckets.map(b => contacts.filter(c => inDateRange(c.foundDate, b.start, b.end) && campaignLeadStatus(c)).length);
  const meetings = buckets.map(b => state.bookings.filter(bk => contactIds.has(bk.contactId) && inDateRange(bk.date, b.start, b.end)).length);
  const won = buckets.map(b => deals.filter(d => d.outcome === 'won' && inDateRange(d.date, b.start, b.end)).length);
  return { labels, leads, meetings, won };
}

function initCampaignAnalyticsCharts(campaign){
  if(typeof Chart === 'undefined') return;
  window.__campCharts = window.__campCharts || {};
  if(window.__campCharts.line) window.__campCharts.line.destroy();
  if(window.__campCharts.pie) window.__campCharts.pie.destroy();

  const period = window.__campaignAnalyticsPeriod || 'thisWeek';
  const series = buildCampaignSeries(campaign, period);
  const lineEl = document.getElementById('campLineChart');
  if(lineEl){
    window.__campCharts.line = new Chart(lineEl, {
      type: 'line',
      data: {
        labels: series.labels,
        datasets: [
          { label:'Leads', data: series.leads, borderColor:'#0084C5', backgroundColor:'#0084C5', tension:0.3 },
          { label:'Meetings booked', data: series.meetings, borderColor:'#FF834C', backgroundColor:'#FF834C', tension:0.3 },
          { label:'Sales won', data: series.won, borderColor:'#44A574', backgroundColor:'#44A574', tension:0.3 }
        ]
      },
      options: { responsive:true, maintainAspectRatio:false, scales:{ y:{ beginAtZero:true, ticks:{ precision:0 } } }, plugins:{ legend:{ position:'bottom', labels:{ boxWidth:10, font:{ size:11 } } } } }
    });
  }

  const contacts = campaignContacts(campaign);
  const counts = {};
  LEAD_STATUS_META.forEach(([key]) => counts[key] = 0);
  contacts.forEach(c => { const s = campaignLeadStatus(c); if(s) counts[s]++; });
  const pieEl = document.getElementById('campPieChart');
  if(pieEl){
    window.__campCharts.pie = new Chart(pieEl, {
      type: 'pie',
      data: {
        labels: LEAD_STATUS_META.map(([,label])=>label),
        datasets: [{ data: LEAD_STATUS_META.map(([key])=>counts[key]), backgroundColor: LEAD_STATUS_META.map(([,,color])=>color) }]
      },
      options: { responsive:true, maintainAspectRatio:false, plugins:{ legend:{ position:'bottom', labels:{ boxWidth:10, font:{ size:11 } } } } }
    });
  }
}

/* -- Section 1: Pipeline progress funnel -- */
// Cumulative "reached this stage or later" counts, not a bucketed
// snapshot of current stage - that's the only way "% moved from M1 to M2"
// is meaningful. Reads the union of each Campaign Contacts row's dated
// Stage History log and its current Sequence Stage (covers rows created
// before Stage History existed). Won/Lost come from Deals, not Sequence
// Stage - there are no Won/Lost stage options, and deal outcomes are the
// real source of truth for those two.
const FUNNEL_STAGE_GROUPS = [
  { key:'connected', label:'Connections Made', stages:['Connected','Message 1 Sent','Pending Reply M1','Ready for Message 2','Message 2 Sent','Pending Reply M2','Ready for Message 3','Message 3 Sent','Pending Reply M3','Meeting Booked'] },
  { key:'m1', label:'Message 1 Sent', stages:['Message 1 Sent','Pending Reply M1','Ready for Message 2','Message 2 Sent','Pending Reply M2','Ready for Message 3','Message 3 Sent','Pending Reply M3','Meeting Booked'] },
  { key:'m2', label:'Message 2 Sent', stages:['Message 2 Sent','Pending Reply M2','Ready for Message 3','Message 3 Sent','Pending Reply M3','Meeting Booked'] },
  { key:'m3', label:'Message 3 Sent', stages:['Message 3 Sent','Pending Reply M3','Meeting Booked'] },
  { key:'meeting', label:'Meetings Booked', stages:['Meeting Booked'] }
];

function reachedStagesFor(cc){
  const set = new Set((cc.stageHistory||[]).map(h=>h.stage));
  if(cc.sequenceStage) set.add(cc.sequenceStage);
  return set;
}

function computeFunnelCounts(data){
  const stageCounts = FUNNEL_STAGE_GROUPS.map(g => ({
    key: g.key, label: g.label,
    count: data.campaignContacts.filter(cc => g.stages.some(s => reachedStagesFor(cc).has(s))).length
  }));
  const won = data.deals.filter(d => d.outcome === 'Won').length;
  const lost = data.deals.filter(d => d.outcome === 'Lost').length;
  return { stageCounts, won, lost };
}

function renderPipelineFunnel(data){
  const { stageCounts, won, lost } = computeFunnelCounts(data);
  const maxCount = Math.max(1, ...stageCounts.map(s=>s.count), won, lost);
  const rows = stageCounts.map((s,i) => {
    const prev = i>0 ? stageCounts[i-1].count : null;
    const conv = (prev !== null && prev > 0) ? Math.round(s.count/prev*100) : null;
    const width = Math.max(4, Math.round(s.count/maxCount*100));
    return `<div class="funnel-row">
      <div class="funnel-label">${s.label}</div>
      <div class="funnel-track"><div class="funnel-fill" style="width:${width}%">${s.count}</div></div>
      <div class="funnel-conv">${conv!==null ? `${conv}% moved from prior` : '—'}</div>
    </div>`;
  }).join('');
  const meetingsCount = stageCounts[stageCounts.length-1].count;
  const wonPct = meetingsCount ? Math.round(won/meetingsCount*100) : 0;
  const lostPct = meetingsCount ? Math.round(lost/meetingsCount*100) : 0;
  return `
  <div class="card" style="margin-bottom:16px;">
    <div class="section-title"><i class="ti ti-filter"></i> Pipeline progress</div>
    <div class="muted" style="font-size:11.5px;margin-bottom:12px;">How many contacts in this campaign have reached each stage, and the conversion rate into it. Won/Lost come from the Sales Log below.</div>
    ${rows}
    <div class="funnel-row"><div class="funnel-label">Won</div><div class="funnel-track"><div class="funnel-fill won" style="width:${Math.max(4,Math.round(won/maxCount*100))}%">${won}</div></div><div class="funnel-conv">${meetingsCount?`${wonPct}% of meetings`:'—'}</div></div>
    <div class="funnel-row"><div class="funnel-label">Lost</div><div class="funnel-track"><div class="funnel-fill lost" style="width:${Math.max(4,Math.round(lost/maxCount*100))}%">${lost}</div></div><div class="funnel-conv">${meetingsCount?`${lostPct}% of meetings`:'—'}</div></div>
  </div>`;
}

/* -- Section 2: Scorecard strip -- */
function computeSalesScorecards(data, period){
  const { start, end, prevStart, prevEnd } = campaignPeriodBounds(period);
  function metricsFor(s, e){
    const connections = [], meetingsBooked = [];
    data.campaignContacts.forEach(cc => {
      (cc.stageHistory||[]).forEach(h => {
        if(h.stage === 'Connected' && inDateRange(h.date, s, e)) connections.push({ cc, date:h.date });
        if(h.stage === 'Meeting Booked' && inDateRange(h.date, s, e)) meetingsBooked.push({ cc, date:h.date });
      });
    });
    const messagesSent = data.touchPoints.filter(tp => tp.type !== 'Inbound Reply' && inDateRange(tp.date, s, e));
    const repliesReceived = data.touchPoints.filter(tp => tp.replied && inDateRange(tp.date, s, e));
    const won = data.deals.filter(d => d.outcome === 'Won' && inDateRange(d.date, s, e));
    const lost = data.deals.filter(d => d.outcome === 'Lost' && inDateRange(d.date, s, e));
    const responseRate = messagesSent.length ? Math.round(repliesReceived.length / messagesSent.length * 100) : 0;

    let daysSum = 0, daysCount = 0;
    connections.forEach(({cc, date}) => {
      const replyDates = data.touchPoints.filter(tp => tp.contactId === cc.contactId && tp.replied && tp.date).map(tp=>tp.date).sort();
      const firstReply = replyDates.find(d => new Date(d) >= new Date(date));
      if(firstReply){
        const diff = Math.round((new Date(firstReply) - new Date(date)) / 86400000);
        if(diff >= 0){ daysSum += diff; daysCount++; }
      }
    });
    const avgDaysToReply = daysCount ? Math.round(daysSum/daysCount*10)/10 : null;

    let touchesSum = 0, touchesCount = 0;
    meetingsBooked.forEach(({cc, date}) => {
      const touchesBefore = data.touchPoints.filter(tp => tp.contactId === cc.contactId && tp.date && new Date(tp.date) <= new Date(date)).length;
      if(touchesBefore){ touchesSum += touchesBefore; touchesCount++; }
    });
    const avgTouchesToBooking = touchesCount ? Math.round(touchesSum/touchesCount*10)/10 : null;

    return { connections: connections.length, messagesSent: messagesSent.length, repliesReceived: repliesReceived.length, meetingsBooked: meetingsBooked.length, won: won.length, lost: lost.length, responseRate, avgDaysToReply, avgTouchesToBooking };
  }
  return { current: metricsFor(start, end), previous: metricsFor(prevStart, prevEnd) };
}

function renderSalesScorecards(data, period){
  const { current, previous } = computeSalesScorecards(data, period);
  const delta = (a,b) => { if(a===null||b===null) return ''; const d = Math.round((a-b)*10)/10; return d===0 ? 'No change vs last period' : (d>0 ? `+${d} vs last period` : `${d} vs last period`); };
  const cards = [
    ['Connections made', current.connections, delta(current.connections, previous.connections)],
    ['Messages sent', current.messagesSent, delta(current.messagesSent, previous.messagesSent)],
    ['Replies received', current.repliesReceived, delta(current.repliesReceived, previous.repliesReceived)],
    ['Meetings booked', current.meetingsBooked, delta(current.meetingsBooked, previous.meetingsBooked)],
    ['Won', current.won, delta(current.won, previous.won)],
    ['Lost', current.lost, delta(current.lost, previous.lost)],
    ['Response rate', current.responseRate + '%', delta(current.responseRate, previous.responseRate)],
    ['Avg days connection \u2192 first reply', current.avgDaysToReply ?? '\u2014', delta(current.avgDaysToReply, previous.avgDaysToReply)],
    ['Avg touches to booking', current.avgTouchesToBooking ?? '\u2014', delta(current.avgTouchesToBooking, previous.avgTouchesToBooking)]
  ];
  return `
  <div class="card" style="margin-bottom:16px;">
    <div class="section-title"><i class="ti ti-chart-bar"></i> Scorecard</div>
    <div class="mini-cards" style="grid-template-columns:repeat(3,1fr);margin-bottom:0;">
      ${cards.map(([label,val,d])=>`<div class="mini-card"><div class="num">${val}</div><div class="label">${label}</div>${d?`<div class="muted" style="font-size:11px;margin-top:4px;">${d}</div>`:''}</div>`).join('')}
    </div>
  </div>`;
}

/* -- Section 3: Conversion engine (6 panels) -- */
const HEATMAP_DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const HEATMAP_BUCKETS = ['Morning','Midday','Afternoon','Evening','Late night'];

function renderBestTimeHeatmap(rows){
  if(!rows || !rows.length) return '<div class="empty-state">No message timestamps extracted yet - upload DM screenshots with visible timestamps to build this out.</div>';
  const counts = {};
  let max = 1;
  rows.forEach(r => { counts[`${r.day}|${r.bucket}`] = r.count; if(r.count > max) max = r.count; });
  const cells = ['<div class="hm-head"></div>'];
  HEATMAP_BUCKETS.forEach(b => cells.push(`<div class="hm-head">${b}</div>`));
  HEATMAP_DAYS.forEach(day => {
    cells.push(`<div class="hm-row-label">${day.slice(0,3)}</div>`);
    HEATMAP_BUCKETS.forEach(bucket => {
      const c = counts[`${day}|${bucket}`] || 0;
      const opacity = c ? 0.15 + (c/max)*0.65 : 0;
      cells.push(`<div class="heatmap-cell" style="background:rgba(0,132,197,${opacity})">${c || ''}</div>`);
    });
  });
  return `<div class="heatmap-grid">${cells.join('')}</div>`;
}

/* -- Section 4: Sales log -- */
function dealOutcomeTagClass(outcome){
  const o = (outcome||'').toLowerCase();
  if(o === 'won') return 'tag-won';
  if(o === 'lost') return 'tag-lost';
  if(o === 'started') return 'tag-started';
  return 'tag-pending';
}
function sentimentTagClass(sentiment){
  const s = (sentiment||'').toLowerCase();
  if(s === 'positive') return 'tag-sent-positive';
  if(s === 'cold') return 'tag-sent-cold';
  if(s === 'negative') return 'tag-sent-negative';
  return 'tag-sent-neutral';
}

// Looks in whichever deal list is currently cached - the Sales tab's
// window.__salesData.deals, or window.__calendarEvents when this is
// called from the Sales Calendar's click-to-expand instead.
function findDealById(dealId){
  const fromSales = (window.__salesData && window.__salesData.deals || []).find(d => d.id === dealId);
  if(fromSales) return fromSales;
  const fromCal = (window.__calendarEvents || []).find(e => e.dealId === dealId);
  if(fromCal) return { id: fromCal.dealId, notes: fromCal.notes || '' };
  return null;
}

// Deals.Notes is an append-log, same convention as Conversation Context:
// "[timestamp] (Pre-meeting|Post-meeting) note text", blocks separated by
// a blank line.
function parseDealNotes(notesText){
  if(!notesText) return [];
  return notesText.split('\n\n').map(block => {
    const m = block.match(/^\[([^\]]+)\]\s*\(([^)]+)\)\s*([\s\S]*)$/);
    if(m) return { timestamp: m[1], phase: m[2], text: m[3] };
    return { timestamp: '', phase: '', text: block };
  }).filter(n => n.text || n.timestamp);
}

function renderDealNotesThread(deal){
  if(!deal) return '<div class="muted">Deal not found.</div>';
  const notes = parseDealNotes(deal.notes);
  return `
    <div style="max-width:640px;">
      ${notes.length ? notes.map(n => `
        <div style="margin-bottom:10px;padding:8px 10px;background:var(--bg);border-radius:8px;">
          <div style="font-size:11px;font-weight:700;color:var(--muted);margin-bottom:3px;">${esc(n.phase||'Note')}${n.timestamp?` \u00b7 ${esc(n.timestamp)}`:''}</div>
          <div style="font-size:12.5px;">${esc(n.text)}</div>
        </div>`).join('') : '<div class="muted" style="margin-bottom:10px;">No notes yet.</div>'}
      <div class="field"><label>Add a note</label><textarea id="dealNoteText-${deal.id}" rows="2" placeholder="e.g. They mentioned budget in their reply"></textarea></div>
      <div style="display:flex;gap:8px;">

        <button class="btn btn-secondary btn-sm" onclick="submitDealNote('${deal.id}','post')"><i class="ti ti-checkbox"></i> Add post-meeting note</button>

async function submitDealNote(dealId, phase){
  const textEl = document.getElementById(`dealNoteText-${dealId}`);
  const noteText = textEl ? textEl.value.trim() : '';
  if(!noteText){ toast('Write a note first', 'warn'); return; }
  try {
    const res = await fetch(`/api/deals/${dealId}/notes`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ noteText, phase })
    });
    const json = await res.json();
    if(!res.ok || !json.success) throw new Error(json.error || 'Save failed');

    const salesDeal = window.__salesData && (window.__salesData.deals||[]).find(d => d.id === dealId);
    if(salesDeal) salesDeal.notes = json.notes;
    const calEvent = (window.__calendarEvents||[]).find(e => e.dealId === dealId);
    if(calEvent) calEvent.notes = json.notes;

    const deal = findDealById(dealId);
    const container = textEl.closest('.deal-notes-body') || textEl.closest('.modal-body');
    if(container && deal) container.innerHTML = renderDealNotesThread(deal);
    toast('Note added \u2014 also feeding the contact/company Engine Summary in the background', 'success');
  } catch(err){
    toast('Could not save note: ' + err.message, 'warn');
  }
}

async function updateDealField(dealId, field, value){
  const campaign = state.campaigns.find(c => c.id === window.__campaignDetailId);
  if(!campaign) return;
  const body = {};
  if(field === 'outcome') body.outcome = value;
  if(field === 'dealValue') body.dealValue = value ? parseFloat(value) : 0;
  if(field === 'assigneeId') body.assigneeId = value || null;
  try {
    const res = await fetch(`/api/campaign/${encodeURIComponent(campaign.name)}/deals/${dealId}`, {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
    });
    if(!res.ok) throw new Error('Update failed');
    const deal = (window.__salesData && window.__salesData.deals || []).find(d => d.id === dealId);
    if(deal) Object.assign(deal, body.outcome!==undefined?{outcome:body.outcome}:body.dealValue!==undefined?{dealValue:body.dealValue}:{assigneeId:body.assigneeId});
    toast('Deal updated', 'success');
  } catch(err){
    toast('Could not update deal: ' + err.message, 'warn');
    loadSalesOverview(campaign);
  }
}

function renderWeeklySalesCard(data, period){
  const { current } = computeSalesScorecards(data, period);
  const intel = window.__salesConversionIntel;
  const periodLabel = (CAMPAIGN_PERIOD_OPTIONS.find(([k])=>k===period) || [null, period])[1];
  let topStep = '\u2014';
  if(intel && !intel.error && intel.messageStepToBooking && intel.messageStepToBooking.length){
    const best = intel.messageStepToBooking.slice().sort((a,b)=>b.booked-a.booked)[0];
    if(best && best.booked) topStep = `${best.step} (${best.booked} booked)`;
  }
  let topCta = '\u2014';
  if(intel && !intel.error && intel.ctaToBooking && intel.ctaToBooking.length){
    const best = intel.ctaToBooking.slice().sort((a,b)=>b.bookings-a.bookings)[0];
    if(best && best.bookings) topCta = `${best.cta} (${best.bookings} booked)`;
  }
  return `
  <div class="card" id="weeklySalesCard" style="margin-top:16px;">
    <div class="section-title"><i class="ti ti-report"></i> Weekly sales report card \u2014 ${esc(periodLabel)}</div>
    <div class="mini-cards" style="grid-template-columns:repeat(3,1fr);">
      <div class="mini-card"><div class="num">${current.connections}</div><div class="label">Connections made</div></div>
      <div class="mini-card"><div class="num">${current.messagesSent}</div><div class="label">Messages sent</div></div>
      <div class="mini-card"><div class="num">${current.repliesReceived}</div><div class="label">Replies</div></div>
      <div class="mini-card"><div class="num">${current.meetingsBooked}</div><div class="label">Meetings booked</div></div>
      <div class="mini-card"><div class="num">${current.won}</div><div class="label">Won</div></div>
      <div class="mini-card"><div class="num">${current.lost}</div><div class="label">Lost</div></div>
      <div class="mini-card"><div class="num">${current.responseRate}%</div><div class="label">Response rate</div></div>
      <div class="mini-card"><div class="num" style="font-size:14px;">${esc(topStep)}</div><div class="label">Top converting step</div></div>
      <div class="mini-card"><div class="num" style="font-size:14px;">${esc(topCta)}</div><div class="label">Top performing CTA</div></div>

}

function handleSalesTranscriptFile(event){
  const file = event.target.files && event.target.files[0];
  event.target.value = '';
  if(!file) return;
  if(file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf')){
    const reader = new FileReader();
    reader.onload = () => {
      const match = String(reader.result).match(/^data:([^;]+);base64,(.*)$/);
      if(match){
        window.__salesTranscriptFile = { mediaType:'application/pdf', base64: match[2], name:file.name };
        const el = document.getElementById('salesTranscriptFilePreview');
        if(el) el.innerHTML = `<span class="tag tag-connected">${esc(file.name)} attached</span> <button class="btn btn-ghost btn-sm" onclick="clearSalesTranscriptFile()"><i class="ti ti-x"></i></button>`;
      }
    };
    reader.readAsDataURL(file);
  } else {
    const reader = new FileReader();
    reader.onload = () => {
      const textEl = document.getElementById('salesTranscriptText');
      if(textEl) textEl.value = String(reader.result);
      window.__salesTranscriptFile = null;
      const el = document.getElementById('salesTranscriptFilePreview');
      if(el) el.innerHTML = `<span class="muted">${esc(file.name)} loaded into the text field</span>`;
    };
    reader.readAsText(file);
  }
}
function clearSalesTranscriptFile(){
  window.__salesTranscriptFile = null;
  const el = document.getElementById('salesTranscriptFilePreview');
  if(el) el.innerHTML = '';
}

async function analyzeSalesTranscript(campaignId){
  const campaign = state.campaigns.find(c => c.id === campaignId);
  if(!campaign) return;
  const text = (document.getElementById('salesTranscriptText')?.value || '').trim();
  const file = window.__salesTranscriptFile;
  if(!text && !file){ toast('Paste a transcript or upload a file first', 'warn'); return; }

  const btn = document.getElementById('analyzeTranscriptBtn');
  const original = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<i class="ti ti-loader-2"></i> Scoring against Strategy...';

  try {
    const res = await fetch(`/api/campaign/${encodeURIComponent(campaign.name)}/sales/analyze-transcript`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        campaignId: campaign.id,
        transcript: file ? undefined : text,
        fileBase64: file ? file.base64 : undefined,
        fileMediaType: file ? file.mediaType : undefined,
        strategy: {
          goal: campaign.goal,
          targetSegmentSummary: campaign.targetSegmentSummary,
          pitchAngle: campaign.pitchAngle,
          objectionHandling: campaign.objectionHandling,
          sequence: campaign.sequence
        }
      })
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || ('Request failed with status '+res.status));

    const analysis = { id: uid('ta'), date: isoDate(TODAY), summary: data.summary||'', scriptAdherence: data.scriptAdherence||'', ctasUsed: data.ctasUsed||[], objectionsRaised: data.objectionsRaised||[] };
    if(!campaign.transcriptAnalyses) campaign.transcriptAnalyses = [];
    campaign.transcriptAnalyses.push(analysis);

    toast('Transcript scored and saved to Airtable', 'success');
    const textEl = document.getElementById('salesTranscriptText');
    if(textEl) textEl.value = '';
    clearSalesTranscriptFile();
    renderPage();
  } catch(err){
    const resultEl = document.getElementById('salesTranscriptResult');
    if(resultEl) resultEl.innerHTML = `<p class="muted" style="font-size:12.5px;">Could not analyse: ${esc(err.message)}</p>`;
    toast('Could not analyse transcript: ' + err.message, 'warn');
    btn.disabled = false;
    btn.innerHTML = original;
  }
}

/* ---- Status transitions + Airtable sync ---- */
// The status badge on the campaign detail header is itself the trigger -
// clicking it opens a small dropdown (same positioned-div pattern as
// showContextMenu/closeContextMenu) offering all four status values;
// picking one writes straight to Airtable via syncCampaignStatusToAirtable,
// same as the single-status transitions this replaced used to.

function toggleCampaignStatusMenu(e, campaignId){
  e.stopPropagation();
  closeCampaignStatusMenu();
  const campaign = state.campaigns.find(c => c.id === campaignId);
  if(!campaign) return;
  const menu = document.createElement('div');
  menu.className = 'ctx-menu';
  menu.id = 'campaignStatusMenu';
  const rect = e.target.closest('.campaign-status').getBoundingClientRect();
  menu.style.left = rect.left + 'px';
  menu.style.top = (rect.bottom + 4) + 'px';
  menu.innerHTML = CAMPAIGN_STATUS_OPTIONS.map(s => `<div class="ctx-item" onclick="setCampaignStatus('${campaignId}','${s}')">${s===campaign.status?'<i class="ti ti-check"></i>':'<span style="width:16px;display:inline-block;"></span>'} ${s}</div>`).join('');
  document.body.appendChild(menu);
  setTimeout(()=>document.addEventListener('click', closeCampaignStatusMenu, { once:true }), 0);
}
function closeCampaignStatusMenu(){ const m = document.getElementById('campaignStatusMenu'); if(m) m.remove(); }

function setCampaignStatus(campaignId, status){
  closeCampaignStatusMenu();
  const campaign = state.campaigns.find(c => c.id === campaignId);
  if(!campaign || campaign.status === status) return;
  campaign.status = status;
  if(status === 'Live') campaign.liveDate = isoDate(TODAY);
  if(status === 'Past') campaign.endedDate = isoDate(TODAY);
  campaign.updatedAt = isoDate(TODAY);
  syncCampaignStatusToAirtable(campaign);
  toast(`Campaign "${campaign.name}" set to ${status}`, 'success');
  renderPage();
}

}

function formatSequenceForAirtable(sequence){
  return CAMPAIGN_STAGE_META.map(([key,label]) => {
    const stage = sequence[key];
    if(!stage) return '';
    return `${label} (${stage.type || 'LinkedIn message'}, ${stage.timing || 'timing not set'}):\n${stage.content || ''}`;
  }).filter(Boolean).join('\n\n');
}

function syncCampaignToAirtable(campaign, onSynced){
  if(!campaign || !airtableWriteGuard('campaign', { name: campaign.name }, ['name'])) return;

  const sourceContactIds = campaign.contactIds || [];
  const contactNames = state.contacts.filter(c => sourceContactIds.includes(c.id)).map(c => c.name);
  // state.contacts hydrates async from Airtable on load (see
  // hydrateContactsFromAirtable) and starts out empty - if this fires
  // before that resolves, sourceContactIds would resolve to zero names even
  // though the campaign really does have contacts, and the unconditional
  // 'Contact IDs' write below (POST /api/airtable/campaign) would blank out
  // the real value already saved in Airtable. Bail rather than risk that;
  // the caller's next edit will retry the sync once contacts are loaded.
  if(sourceContactIds.length && !contactNames.length){
    console.warn('Airtable campaign sync blocked: contacts not loaded yet, refusing to overwrite Contact IDs with blank for', campaign.name);
    return;
  }

  fetch('/api/airtable/campaign', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      name: campaign.name,
      goal: campaign.goal,
      product: campaign.product || '',
      targetIcp: campaign.targetSegmentSummary,
      contactIds: contactNames,
      gridIds: campaign.gridIds || [],
      sequenceTemplates: formatSequenceForAirtable(campaign.sequence),
      strategyNotes: campaign.strategyBrief,
      pitchAngle: campaign.pitchAngle || '',
      objectionHandling: campaign.objectionHandling || '',
      successMetric: campaign.successMetric || '',
      startDate: campaign.createdAt,
      status: campaign.status,
      ctas: campaign.ctas || ''
    })
  })
    .then(res => res.json())
    // campaign.name is the only handle Airtable-scoped campaign routes
    // (Analytics/Sales tabs) have to find this campaign - if it's ever
    // renamed directly in Airtable (or a redraft-and-resave produces a
    // slightly different AI-generated title), that name drifts out of
    // sync with the cached one here and every fresh lookup by name starts
    // failing with "Campaign not found in Airtable". Caching the stable
    // Airtable record id (same fix already applied to contacts - see
    // syncContactToAirtable) lets those routes resolve the campaign by id
    // first, falling back to name only for campaigns that haven't synced
    // yet.
    .then(data => {
      if(data && data.recordId) campaign.recordId = data.recordId;
      if(onSynced) onSynced(data);
    })
    .catch(err => console.warn('Airtable campaign sync failed:', err.message));
}

// Creates a Campaign Contacts junction row (Airtable) for each contact the
// moment they join a campaign, whether via the Grid tab (linking/creating a
// grid) or the Roadmap tab's Add contacts modal - so every campaign member
// has a Sequence Stage row from day one instead of only once a touch point
// or screenshot happens to create one.
function linkContactsToCampaignAirtable(campaign, contactNames){
  if(!contactNames.length) return;
  fetch(`/api/campaign/${encodeURIComponent(campaign.name)}/contacts/link`, {

    body: JSON.stringify({ contactNames })
  }).catch(err => console.warn('Campaign Contacts link sync failed:', err.message));
}

function syncCampaignStatusToAirtable(campaign){
  const statusFields = { name: campaign.name, status: campaign.status };
  if(!airtableWriteGuard('campaign/status', statusFields, ['name','status'])) return;
  fetch('/api/campaign/status', {

// Status badge: Live campaigns with activity in the last 14 days are On
// Track; Live but stale is Needs Attention; anything not Live (Past) is
// Ended.
function computeCampaignHealth(campaign, data){
  const { stageCounts, won, lost } = computeFunnelCounts(data);
  const connections = stageCounts.find(s=>s.key==='connected').count;
  const meetingsBooked = stageCounts.find(s=>s.key==='meeting').count;
  const messagesSent = data.touchPoints.filter(tp => tp.type !== 'Inbound Reply').length;

  const activityDates = [];
  data.touchPoints.forEach(tp => { if(tp.date) activityDates.push(tp.date); });
  data.deals.forEach(d => { if(d.date) activityDates.push(d.date); });
  data.campaignContacts.forEach(cc => (cc.stageHistory||[]).forEach(h => { if(h.date) activityDates.push(h.date); }));
  const lastActivity = activityDates.length ? activityDates.reduce((a,b) => new Date(a) > new Date(b) ? a : b) : null;
  const recentlyActive = lastActivity !== null && daysBetween(lastActivity) <= 14;

  let statusKey = 'ended', statusLabel = 'Ended';
  if(campaign.status === 'Live'){
    statusKey = recentlyActive ? 'ontrack' : 'attention';
    statusLabel = recentlyActive ? 'On Track' : 'Needs Attention';
  }

  return { id: campaign.id, name: campaign.name, connections, messagesSent, meetingsBooked, won, lost, statusKey, statusLabel };
}

const CALENDAR_ASSIGNEE_PALETTE = ['', 'blue', 'peach', 'grey', 'purple', 'yellow'];
function eventColorByAssignee(assigneeId){
  if(!assigneeId) return 'grey';
  let hash = 0;
  for(let i=0;i<assigneeId.length;i++) hash = (hash * 31 + assigneeId.charCodeAt(i)) >>> 0;
  return CALENDAR_ASSIGNEE_PALETTE[hash % CALENDAR_ASSIGNEE_PALETTE.length];
}

function renderCalendar(){
  const y = state.calYear, m = state.calMonth;
  const first = new Date(y, m, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const monthLabel = first.toLocaleDateString('en-AU',{month:'long', year:'numeric'});
  const cells = [];
  for(let i=0;i<startDow;i++) cells.push(null);
  for(let d=1; d<=daysInMonth; d++) cells.push(d);

  const eventsRaw = window.__calendarEvents;
  const loading = eventsRaw === undefined;
  const errored = eventsRaw && eventsRaw.error;
  let events = loading || errored ? [] : eventsRaw;
  if(window.__calendarAssigneeFilter) events = events.filter(ev => ev.assigneeId === window.__calendarAssigneeFilter);

  const reps = window.__repsCache || [];

  return `
  <div class="field" style="max-width:260px;margin-bottom:14px;"><label>Rep</label>
    <select onchange="setCalendarAssignee(this.value)">
      <option value="">All</option>
      ${reps.map(r=>`<option value="${r.id}" ${window.__calendarAssigneeFilter===r.id?'selected':''}>${esc(r.name)}</option>`).join('')}
    </select>
  </div>
  <div class="cal-header">
    <div style="font-size:16px;font-weight:800;">${monthLabel}</div>
    <div class="cal-nav">
      <button class="btn btn-secondary btn-sm" onclick="calNav(-1)"><i class="ti ti-chevron-left"></i></button>
      <button class="btn btn-secondary btn-sm" onclick="calToday()">Today</button>
      <button class="btn btn-secondary btn-sm" onclick="calNav(1)"><i class="ti ti-chevron-right"></i></button>
    </div>
  </div>
  ${loading ? '<div class="muted"><i class="ti ti-loader-2"></i> Loading meetings...</div>' : ''}
  ${errored ? `<div class="muted">Could not load meetings: ${esc(eventsRaw.error)}</div>` : ''}
  <div class="cal-grid">
    ${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}
    ${cells.map(d => {
      if(d===null) return '<div class="cal-cell empty"></div>';
      const dateStr = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const isToday = dateStr === isoDate(TODAY);
      const dayEvents = events.filter(ev => ev.date === dateStr);
      return `<div class="cal-cell ${isToday?'today':''}">
        <div class="cal-date">${d}</div>
        ${dayEvents.map(ev => ev.type === 'reminder' ? `<div class="event-chip reminder-chip" onclick="openReminderConfirm('${ev.reminderId}')"><i class="ti ti-bell" style="font-size:10px;"></i> ${esc((ev.description||'').slice(0,28))}
          <div class="event-tooltip">${esc(ev.description)}<br>${ev.contactName?esc(ev.contactName):(ev.companyName?esc(ev.companyName):'')}${ev.campaignName?' · '+esc(ev.campaignName):''}, ${fmtDate(ev.date)}</div>
        </div>` : `<div class="event-chip ${eventColorByAssignee(ev.assigneeId)}" onclick="openDealNotesModal('${ev.dealId}')">${esc(firstName(ev.contactName))} · ${esc(ev.stage)}
          <div class="event-tooltip">${esc(ev.contactName)} — ${esc(ev.companyName)}<br>${esc(ev.campaignName)} · ${esc(ev.stage)}<br>${ev.assigneeName?esc(ev.assigneeName):'Unassigned'}, ${fmtDate(ev.date)}</div>
        </div>`).join('')}

    }).join('')}

function renderAnalytics(){
  const contacts = state.contacts;
  const totalFound = contacts.length;
  const connected = contacts.filter(c=>c.connDate).length;
  const acceptRate = totalFound ? Math.round(connected/totalFound*100) : 0;
  let repliesCount=0, sentCount=0;
  contacts.forEach(c=>{ if(c.thread.m1){sentCount++; if(c.thread.m1.replied) repliesCount++;} if(c.thread.m2){sentCount++; if(c.thread.m2.replied) repliesCount++;} });
  const replyRate = sentCount ? Math.round(repliesCount/sentCount*100) : 0;
  const booked = state.bookings.length;
  const conversionRate = connected ? Math.round(booked/connected*100) : 0;
  const h = computeHealth();
  const dropped = state.deadContacts.length;

  const toneRows = [
    { tone:'Peer to peer', sent: contacts.filter(c=>c.seqId==='seniorLeaders' && (c.thread.m1||c.thread.m2)).length, booked: state.bookings.filter(b=>state.contacts.find(c=>c.id===b.contactId)?.seqId==='seniorLeaders').length },
    { tone:'Warm consultant', sent: contacts.filter(c=>c.seqId==='digitalTech' && (c.thread.m1||c.thread.m2)).length, booked: state.bookings.filter(b=>state.contacts.find(c=>c.id===b.contactId)?.seqId==='digitalTech').length },
    { tone:'Low pressure', sent: 0, booked: 0 }
  ];
  const maxSent = Math.max(1, ...toneRows.map(r=>r.sent));

  const ctaCounts = {};
  CTA_OPTIONS.forEach(o => ctaCounts[o] = state.bookings.filter(b=>b.cta===o).length);

  const serviceCounts = {};
  state.settings.services.forEach(s => serviceCounts[s] = state.bookings.filter(b=>b.service===s).length);
  const maxServiceCount = Math.max(1, ...Object.values(serviceCounts));

  const speedBuckets = { '3':0, '9':0, '10':0 };
  contacts.forEach(c=>{
    if(!c.connReqDate || !c.connDate) return;
    const d = daysBetween(c.connReqDate, c.connDate);
    if(d<=3) speedBuckets['3']++; else if(d<=9) speedBuckets['9']++; else speedBuckets['10']++;

  return `

    <div class="an-stat"><div class="num">${booked}</div><div class="label">Booked</div><div class="sub">${conversionRate}% conversion</div></div>
    <div class="an-stat"><div class="num">${h.avgDays}d</div><div class="label">Avg days to connect</div></div>

  </div>

  <div class="two-col">
    <div class="card">
      <div class="section-title"><i class="ti ti-message-2"></i> Strategy tally</div>
      ${toneRows.map(r => `
        <div class="bar-row">
          <div class="bar-row-head"><span>${r.tone}</span><span class="muted">${r.sent} sent · ${r.booked} booked</span></div>
          <div class="bar-track"><div class="bar-fill" style="width:${(r.sent/maxSent*100)}%"></div></div>
        </div>
      `).join('')}
    </div>
    <div class="card">
      <div class="section-title"><i class="ti ti-target-arrow"></i> CTA performance</div>
      ${CTA_OPTIONS.map(o => `
        <div class="cta-row"><span>${esc(o)}</span><span class="count-pill ${ctaCounts[o]>0?'has':''}">${ctaCounts[o]}</span></div>
      `).join('')}
    </div>
  </div>

  <div class="two-col">
    <div class="card">
      <div class="section-title"><i class="ti ti-briefcase"></i> Bookings by service</div>
      ${state.settings.services.map(s => `
        <div class="bar-row">
          <div class="bar-row-head"><span>${esc(s)}</span><span class="muted">${serviceCounts[s]}</span></div>
          <div class="bar-track"><div class="bar-fill secondary" style="width:${(serviceCounts[s]/maxServiceCount*100)}%"></div></div>
        </div>
      `).join('')}
    </div>

async function runAnalysis(){
  const resultEl = document.getElementById('analysisResult');
  if(!resultEl) return;
  resultEl.innerHTML = '<div class="empty-state">Crunching pipeline data...</div>';

  // Same live Airtable-backed data the other three Run Engine steps use -
  // GET /api/intelligence/health (runEngineHealth) and GET /api/track/insights
  // (runTrackInsights) - rather than reading local browser state, which can
  // silently diverge from what's actually in Airtable (see Roadmap tab notes
  // elsewhere in this file on markSent/confirmBooking).
  let engineHealth, insights;
  try {
    const [healthRes, insightsRes] = await Promise.all([
      fetch('/api/intelligence/health'),
      fetch('/api/track/insights')
    ]);
    engineHealth = await healthRes.json();
    if(!healthRes.ok) throw new Error(engineHealth.error || 'Could not load engine health');
    insights = await insightsRes.json();
    if(!insightsRes.ok) throw new Error(insights.error || 'Could not load insights');
  } catch(err){
    console.warn('Could not load live data for strategy analysis:', err.message);
    resultEl.innerHTML = `<div class="empty-state">Could not run analysis: ${esc(err.message)}</div>`;
    toast('Could not run analysis: ' + err.message, 'warn');
    return;
  }

  const fallback = () => ({
    wins: [
      "The Change Value Check is converting: Stuart Williams booked a Workshop directly off it.",
      "Senior Leaders sequence is holding a strong reply rate on message 2 (Heath Harnden, Tenille Frichot both replied).",
      "Connection-to-accept speed is healthy across most of the pipeline, well inside the 10 day window."
    ],
    gaps: [
      "Digital and Tech sequence has no bookings yet despite active conversations with Craig Humphrey and Claire Hall.",
      "Several contacts are sitting in Connection made with no message sent, worth pushing into Messaging.",
      "CTA selection is inconsistent, a few messaging-stage contacts have no CTA logged yet."
    ],
    losses: [
      "Two contacts were archived after 10+ days with no acceptance, both from the Product Owner and Transformation Lead columns.",
      "Hume Saunders is currently flagged and at risk of the same outcome."
    ],
    recommendations: [
      "Prioritise a follow-up push on the Digital and Tech sequence to get its first booking.",
      "Set a CTA the moment message 2 goes out, don't leave it until the reply comes in.",
      "Revisit connection requests sitting past 7 days before they hit the 10 day cutoff."
    ]
  });

  let parsed = null;
  try {
    const res = await fetch('/api/intelligence/strategy-analysis', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ engineHealth, insights })
    });
    const data = await res.json();
    if(!res.ok || !data.success) throw new Error(data.error || 'Request failed');
    parsed = { wins: data.wins, gaps: data.gaps, losses: data.losses, recommendations: data.recommendations };
  } catch(err){
    console.warn('Strategy analysis unavailable, using local fallback:', err.message);
    parsed = fallback();
  }

  parsed.runAt = TODAY.toLocaleString('en-AU',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
  parsed.notesCount = insights.conversionCount ?? 0;
  state.lastAnalysis = parsed;
  syncLastAnalysisToAirtable(parsed);

  resultEl.innerHTML = renderAnalysisBlocks(parsed);
  toast('Strategy analysis complete', 'success');
}

async function copyIntelDraft(idx){
  const draft = (window.__intelDrafts || [])[idx];
  if(!draft || !draft.draft) return;
  try {
    await navigator.clipboard.writeText(draft.draft);
  } catch(err){
    const ta = document.createElement('textarea');
    ta.value = draft.draft;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  }
  toast('Draft copied to clipboard', 'success');
}

const LEARNING_CONFIG = {
  customers: { endpoint: '/api/learn/customers', btnId: 'learnCustomersBtn', resultId: 'learnCustomersResult', label: 'Customer' },
  deals: { endpoint: '/api/learn/deals', btnId: 'learnDealsBtn', resultId: 'learnDealsResult', label: 'Deal' }
};

function csvRowsToObjects(rows){
  if(rows.length < 2) return [];
  const headers = rows[0].map(h => h.trim());
  return rows.slice(1).map(row => {
    const obj = {};
    headers.forEach((h,i) => { obj[h || `col${i+1}`] = (row[i] || '').trim(); });
    return obj;
  });
}

function handleLearningUpload(event, kind){
  const file = event.target.files && event.target.files[0];
  event.target.value = '';
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const rows = parseCsv(String(reader.result));
    const records = csvRowsToObjects(rows);
    if(!records.length){ toast('That CSV looks empty', 'warn'); return; }
    runLearningAnalysis(kind, records);
  };
  reader.onerror = () => toast('Could not read that file', 'warn');
  reader.readAsText(file);
}

async function runLearningAnalysis(kind, records){
  const cfg = LEARNING_CONFIG[kind];
  const btn = document.getElementById(cfg.btnId);
  const resultEl = document.getElementById(cfg.resultId);
  const original = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<i class="ti ti-loader-2"></i> Analysing...';
  resultEl.innerHTML = '';

  try {
    const res = await fetch(cfg.endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ records })
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || ('Request failed with status '+res.status));
    renderLearningResult(kind, data, records.length);
    toast(`${cfg.label} analysis complete`, 'success');
  } catch(err){
    resultEl.innerHTML = `<p class="muted" style="font-size:12px;color:#b3413a;">Could not analyse that file: ${esc(err.message)}</p>`;
    toast('Learning upload failed: ' + err.message, 'warn');
  } finally {
    btn.disabled = false;
    btn.innerHTML = original;
  }
}

function learningListSection(title, items){
  if(!Array.isArray(items) || !items.length) return '';
  return `<h5>${esc(title)}</h5><ul>${items.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>`;
}

function renderLearningResult(kind, data, recordCount){
  const cfg = LEARNING_CONFIG[kind];
  const el = document.getElementById(cfg.resultId);
  if(!el) return;
  let html = data.summary ? `<p style="font-size:12.5px;">${esc(data.summary)}</p>` : '';
  if(kind === 'customers'){
    html += learningListSection('Top ICP profiles', data.icpProfiles);
    html += learningListSection('Deal characteristics', data.dealCharacteristics);
    html += learningListSection('Patterns', data.patterns);
  } else {
    html += learningListSection('Product-ICP fit', data.productIcpMatches);
    html += learningListSection('Touch points before close', data.touchPointsBeforeClose);
    html += learningListSection('Best industries', data.bestIndustries);
    html += learningListSection('Seasonal patterns', data.seasonalPatterns);
  }
  html += `<div class="learning-meta muted">Based on ${recordCount} uploaded rows &middot; saved to Airtable Learning Data</div>`;
  el.innerHTML = html;
}

/* ===================== CONTENT SYSTEM ===================== */
// Data-driven content engine: Signals (recurring themes detected server-
// side from touch points/DM parses/meeting notes/logged signals - see
// detectContentSignals() in search-server.js), Draft Centre (AI-drafted
// content against the account voice profile), Calendar (by Target Publish
// Date), Settings (the voice profile itself). Mirrors the Sales tab's
// "fetch-once-per-tab-open-into-window.__X" lifecycle throughout, and its
// campaign-name-not-id scoping convention (the backend resolves a campaign
// name to its Airtable record id itself, same as sales-overview/deals).

const CONTENT_SUBTABS = [['signals','Signals'],['drafts','Draft Centre'],['calendar','Calendar'],['performance','My Performance'],['seo','SEO'],['settings','Settings']];
const CONTENT_FORMATS = ['LinkedIn Post','Blog','Newsletter'];
const CONTENT_FORMAT_META = {
  'LinkedIn Post': { dotClass:'format-linkedin', label:'LinkedIn' },
  'Blog': { dotClass:'format-blog', label:'Blog' },
  'Newsletter': { dotClass:'format-newsletter', label:'Newsletter' }
};
const CONTENT_STATUS_TAG_CLASS = { Draft:'tag-pending', Ready:'tag-started', Scheduled:'tag-messaging', Sent:'tag-won' };

function setContentSubTab(tab){
  window.__contentEditorId = null;
  window.__contentSubTab = tab;
  renderPage();
}

function renderContent(){
  const tab = window.__contentSubTab || 'signals';
  return `
  <div class="seq-tabs">
    ${CONTENT_SUBTABS.map(([key,label]) => `<div class="seq-tab ${tab===key?'active':''}" onclick="setContentSubTab('${key}')">${label}</div>`).join('')}
  </div>
  ${tab==='signals' ? renderContentSignalsTab() : ''}
  ${tab==='drafts' ? renderContentDraftsTab() : ''}
  ${tab==='calendar' ? renderContentCalendarTab() : ''}
  ${tab==='performance' ? renderContentPerformanceTab() : ''}
  ${tab==='seo' ? renderContentSeoTab() : ''}
  ${tab==='settings' ? renderContentSettingsTab() : ''}
  `;
}

/* ---- Data loading ---- */

async function loadContentSignals(){
  try {
    const res = await fetch('/api/content/signals');
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || 'Request failed');
    window.__contentSignals = data.signals || [];
  } catch(err){
    window.__contentSignals = { error: err.message };
  }
  if(state.currentPage === 'content' && (window.__contentSubTab||'signals') === 'signals') renderPage();
}

  if(state.currentPage === 'content' && ['drafts','calendar'].includes(window.__contentSubTab||'')) renderPage();
}
