// skipAirtableSync lets a caller that already has this contact in Airtable
// (e.g. applyGridSearchResult, whose contact was written server-side by
// /api/grid/run-search) skip the redundant round trip - the webhook still
// fires either way.
function notifyWebhook(contact, opts) {
  // Post to Make.com webhook if configured
  const url = ((state.settings.integrations && state.settings.integrations.makeWebhookUrl) || '').trim();
  if (url) {
    const payload = {
      name: contact.name,
      company: contact.company,
      domain: companyDomain(contact.company),
      linkedin_url: contact.url,
      state: contact.state,
      touch_point_count: (contact.touchPoints || []).length
    };
    fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    }).catch(err => console.warn('Webhook POST failed:', err.message));
  }

  // Sync to Airtable via server proxy
  if (!(opts && opts.skipAirtableSync)) syncContactToAirtable(contact);
}

function syncContactToAirtable(contact) {
  const grid = state.grids.find(g => g.id === contact.gridId);
  const contactFields = {
    name: contact.name,
    company: contact.company,
    role: contact.role,
    linkedinUrl: contact.url,
    state: contact.state,
    icpRoleCategory: contact.role,
    notes: contact.notes || '',
    companyLinkedinUrl: grid ? ((grid.companyLinkedIn[contact.company] && grid.companyLinkedIn[contact.company].linkedinUrl) || '') : '',
    gridName: gridNameForContact(contact),
    apolloTitle: contact.apolloTitle || ''
  };
  // company alone (not name) is allowed blank here - an Apollo result with
  // no organisation on the person's record still needs its own Airtable row
  // so incompleteGridContacts/"Run daily search" can backfill the company
  // later (see the matching note on createOrUpdateAirtableContact,
  // search-server.js).
  if(!airtableWriteGuard('contact', contactFields, ['name'])) return;
  fetch('/api/airtable/contact', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(contactFields)
  })
    .then(res => res.json())
    // contact.id starts out as a local uid('c') placeholder (see
    // runDailySearch) until this sync gives it a real Airtable record id -
    // without this, later Airtable writes for this contact (e.g. dragging
    // its Roadmap card) keep sending the placeholder id and get rejected
    // with 422 INVALID_RECORDS.
    .then(data => { if(data && data.recordId) contact.id = data.recordId; })
    .catch(err => console.warn('Airtable contact sync failed:', err.message));
}

function syncStageToAirtable(contact) {
  const stageFields = {
    contactName: contact.name,
    company: contact.company,
    state: contact.state
  };
  if(!airtableWriteGuard('contact/stage', stageFields, ['contactName'])) return;
  fetch('/api/airtable/contact/stage', {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(stageFields)
  }).catch(err => console.warn('Airtable stage sync failed:', err.message));
}

async function syncAllContactsToAirtable(){
  const grid = currentGrid();
  const contacts = gridContacts(grid.id);
  if(!contacts.length){ toast('No contacts to sync yet', 'warn'); return; }

  const btn = document.getElementById('syncAirtableBtn');
  const original = btn.innerHTML;
  btn.disabled = true;

  let syncedCount = 0;
  for(let i=0; i<contacts.length; i++){
    const contact = contacts[i];
    btn.innerHTML = `<i class="ti ti-loader-2"></i> Syncing contact ${i+1}/${contacts.length}...`;
    const bulkContactFields = {
      name: contact.name,
      company: contact.company,
      role: contact.role,
      linkedinUrl: contact.url,
      state: contact.state,
      icpRoleCategory: contact.role,
      notes: contact.notes || '',
      companyLinkedinUrl: companyLinkedInUrl(contact.company),
      gridName: grid.name
    };
    if(!airtableWriteGuard('contact', bulkContactFields, ['name','company'])) continue;
    try {
      const res = await fetch('/api/airtable/contact', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(bulkContactFields)
      });
      if(res.ok){
        syncedCount++;
        // Same id-repair as syncContactToAirtable - without it, contacts
        // synced only through this button keep their local uid('c')
        // placeholder id and fail later Airtable writes (e.g. Roadmap drag).
        const data = await res.json();
        if(data && data.recordId) contact.id = data.recordId;
      }
    } catch(err){
      console.warn('Airtable sync failed for', contact.name, err.message);
    }
    if(i < contacts.length - 1) await sleep(250);
  }

  let companySyncedCount = 0;
  for(let i=0; i<grid.companies.length; i++){
    const company = grid.companies[i];
    btn.innerHTML = `<i class="ti ti-loader-2"></i> Syncing company ${i+1}/${grid.companies.length}...`;
    const bulkCompanyFields = { name: company, gridName: grid.name };
    if(!airtableWriteGuard('company', bulkCompanyFields, ['name'])) continue;
    try {
      const res = await fetch('/api/airtable/company', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(bulkCompanyFields)
      });
      if(res.ok) companySyncedCount++;
    } catch(err){
      console.warn('Airtable company sync failed for', company, err.message);
    }
    if(i < grid.companies.length - 1) await sleep(250);
  }

  const linkedCompanyNames = Object.keys(grid.companyLinkedIn).filter(name => {
    const entry = grid.companyLinkedIn[name];
    return entry && entry.linkedinUrl && entry.linkedinSlug;
  });
  for(let i=0; i<linkedCompanyNames.length; i++){
    const companyName = linkedCompanyNames[i];
    const entry = grid.companyLinkedIn[companyName];
    btn.innerHTML = `<i class="ti ti-loader-2"></i> Syncing LinkedIn ${i+1}/${linkedCompanyNames.length}...`;
    const bulkLinkedinFields = { companyName, linkedinUrl: entry.linkedinUrl, linkedinSlug: entry.linkedinSlug };
    if(!airtableWriteGuard('company/linkedin', bulkLinkedinFields, ['companyName','linkedinSlug'])) continue;
    try {
      await fetch('/api/airtable/company/linkedin', {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(bulkLinkedinFields)
      });
    } catch(err){
      console.warn('Airtable company LinkedIn sync failed for', companyName, err.message);
    }
    if(i < linkedCompanyNames.length - 1) await sleep(250);
  }

  btn.disabled = false;
  btn.innerHTML = original;
  const allSynced = syncedCount === contacts.length && companySyncedCount === grid.companies.length;
  toast(`${syncedCount} contacts and ${companySyncedCount} companies synced to Airtable`, allSynced ? 'success' : 'warn');
}

// 'Identified' is kept alongside 'Found' for contacts synced before
// mapStateToStage (search-server.js) was fixed to write 'Found' - both mean
// the same local 'found' state.
const JOURNEY_STAGE_TO_STATE = { 'Found':'found', 'Identified':'found', 'Connection Pending':'connectionPending', 'Connected':'connected', 'Messaging':'messaging', 'Booked':'booked' };

// Mirrors the server's parseContactEnrichment (search-server.js) - reads the
// ENRICHMENT_JSON block persisted at the start of Contacts.AI Summary by
// POST /api/enrich/contact and /api/contacts/enrich, so enrichment done from
// either the grid or the contact drawer is visible from raw Airtable data
// everywhere a contact is rendered, not just in the session that ran it.
function parseContactEnrichment(aiSummaryText){
  if(!aiSummaryText) return null;
  const m = aiSummaryText.match(/^ENRICHMENT_JSON:\s*(\{[\s\S]*?\})\n\n/);
  if(!m) return null;
  try { return JSON.parse(m[1]); } catch(e){ return null; }
}

async function hydrateContactsFromAirtable(){
  try {
    const [contactsRes, touchPointsRes] = await Promise.all([
      fetch('/api/airtable/contact'),
      fetch('/api/airtable/touchpoint')
    ]);
    const records = await contactsRes.json();
    if(!contactsRes.ok) throw new Error((records && records.error) || ('Request failed with status '+contactsRes.status));
    // Only a genuine failure (thrown above, caught below) leaves
    // state.contacts untouched - a successful response with zero records
    // is real information (Airtable's Contacts table really is empty) and
    // clears the hardcoded seed contacts the same as any other result.
    if(!Array.isArray(records)) return;

    const touchPointRecords = touchPointsRes.ok ? await touchPointsRes.json() : [];
    const touchPointsByContact = {};
    (Array.isArray(touchPointRecords) ? touchPointRecords : []).forEach(tp => {
      const f = tp.fields || {};
      (f['Contact'] || []).forEach(contactId => {
        if(!touchPointsByContact[contactId]) touchPointsByContact[contactId] = [];
        touchPointsByContact[contactId].push({ id: tp.id, date: f['Date'] || '', type: f['Type'] || '', notes: f['Summary'] || '' });
      });
    });

    window.__enrichmentProfiles = window.__enrichmentProfiles || {};
    state.contacts = records.map(r => {
      const f = r.fields || {};
      const role = f['Job Title'] || '';
      const company = f['Company'] || '';
      const enrichment = parseContactEnrichment(f['AI Summary']);
      if(enrichment) window.__enrichmentProfiles[r.id] = enrichment;
      // A contact's own Grid Name (set at creation - see gridName in
      // syncContactToAirtable/createOrUpdateAirtableContact, search-
      // server.js) is the real source of truth once present: it keeps a
      // contact scoped to the grid it was actually imported for, even if
      // its company also happens to be shared with another grid. Only
      // falls back to the old company-inherited resolution for a contact
      // synced before that field existed - never overwritten retroactively.
      const ownGridNames = (f['Grid Name'] || '').split(',').map(s => s.trim()).filter(Boolean);
      const gridId = ownGridNames.length ? resolveGridIdByName(ownGridNames[0]) : resolveGridIdByCompany(company);
      return {
        id: r.id || uid('c'),
        gridId,
        name: f['Full Name'] || '',
        company: company,
        role: role,
        url: f['LinkedIn URL'] || '',
        seqId: role === 'Digital and Tech' ? 'digitalTech' : 'seniorLeaders',
        state: JOURNEY_STAGE_TO_STATE[f['Journey Stage']] || 'found',
        foundDate: isoDate(TODAY),
        connReqDate: null,
        connDate: null,
        notes: f['Notes'] || '',
        enrichment,
        thread: { connSent:null, m1:null, m2:null, cta:null, booked:false },
        generated: {},
        touchPoints: touchPointsByContact[r.id] || []
      };
    });

    renderPage();
    toast('Contacts loaded from Airtable', 'success');
  } catch(err){
    console.warn('Could not load contacts from Airtable:', err.message);
  }
}

// Replaces grids[].companies/companyLinkedIn wholesale from Airtable's
// Companies table, keyed off each record's "Grid Name" field to place it in
// every matching local grid (creating one if it doesn't exist yet - see
// resolveGridIdByName). "Grid Name" is a comma-separated list, not a single
// value (see findOrCreateCompanyRecord, search-server.js) - a company
// shared across grids (RAC WA, BHP, etc.) needs to land on all of them here,
// or whichever grid isn't first in the list would silently lose it on every
// reload even though the company still very much belongs to it. Companion
// to hydrateContactsFromAirtable above; companies are never read from
// localStorage, see persistState/loadPersistedState.
async function hydrateCompaniesFromAirtable(){
  try {
    const res = await fetch('/api/airtable/company');
    const records = await res.json();
    if(!res.ok || !Array.isArray(records)) return;

    state.grids.forEach(g => { g.companies = []; g.companyLinkedIn = {}; });

    records.forEach(r => {
      const f = r.fields || {};
      const name = f['Company Name'];
      if(!name) return;
      // A genuinely blank Grid Name means this company isn't on any grid
      // yet - it must NOT fall through to resolveGridIdByName('') here,
      // which defaults a falsy name to state.grids[0] and would otherwise
      // silently dump every unassigned company into whichever grid happens
      // to be first in the array.
      const gridNames = (f['Grid Name'] || '').split(',').map(s => s.trim()).filter(Boolean);
      const gridIds = new Set(gridNames.map(resolveGridIdByName));
      gridIds.forEach(gridId => {
        const grid = state.grids.find(g => g.id === gridId);
        if(!grid) return;
        if(!grid.companies.includes(name)) grid.companies.push(name);
        if(f['Company LinkedIn URL'] || f['LinkedIn Company ID']){
          grid.companyLinkedIn[name] = { linkedinUrl: f['Company LinkedIn URL'] || '', linkedinSlug: f['LinkedIn Company ID'] || '' };
        }
      });
    });

    renderPage();
  } catch(err){
    console.warn('Could not load companies from Airtable:', err.message);
  }
}

// Refreshes just one grid's companies/companyLinkedIn from Airtable,
// filtered server-side to that grid's name (?gridName=) - called from
// openGrid/openGridFromCampaign whenever a grid is opened, so it reflects
// Airtable's Companies table as of right now rather than whatever
// hydrateCompaniesFromAirtable's one-time full-table load at app boot
// happened to have. Same wholesale-replace convention as that function;
// renderGridCell/renderGridCellHTML already show every company here with
// its matching contact, or "No match yet" - nothing extra needed for that
// once grid.companies is current.
async function hydrateGridCompaniesFromAirtable(gridId){
  const grid = state.grids.find(g => g.id === gridId);
  if(!grid) return;
  try {
    const res = await fetch(`/api/airtable/company?gridName=${encodeURIComponent(grid.name)}`);
    const records = await res.json();
    if(!res.ok || !Array.isArray(records)) return;

    grid.companies = [];
    grid.companyLinkedIn = {};
    records.forEach(r => {
      const f = r.fields || {};
      const name = f['Company Name'];
      if(!name) return;
      if(!grid.companies.includes(name)) grid.companies.push(name);
      if(f['Company LinkedIn URL'] || f['LinkedIn Company ID']){
        grid.companyLinkedIn[name] = { linkedinUrl: f['Company LinkedIn URL'] || '', linkedinSlug: f['LinkedIn Company ID'] || '' };
      }
    });

    if(state.currentPage === 'grid' && state.currentGridId === gridId) renderPage();
  } catch(err){
    console.warn('Could not load this grid\'s companies from Airtable:', err.message);
  }
}

// Parses the "Message 1 (Type, Timing):\ncontent" blocks formatted by
// formatSequenceForAirtable back into the {message1:{type,content,timing},
// followUp1:{...}, followUp2:{...}} shape the campaign preview/detail UI
// expects. Relies on CAMPAIGN_STAGE_META's labels being the fixed,
// known set this app itself writes - not a general-purpose parser.
function parseSequenceFromAirtable(text){
  const sequence = {};
  if(!text) return sequence;
  const labels = CAMPAIGN_STAGE_META.map(([,label]) => label);
  const escapeRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  CAMPAIGN_STAGE_META.forEach(([key,label], i) => {
    const nextLabels = labels.slice(i+1).map(escapeRe);
    const lookahead = nextLabels.length ? `(?:\\n\\n(?:${nextLabels.join('|')}) \\(|$)` : '$';
    const re = new RegExp(`${escapeRe(label)} \\(([^,]*), ([^)]*)\\):\\n([\\s\\S]*?)${lookahead}`);
    const m = text.match(re);
    if(m) sequence[key] = { type: m[1].trim(), timing: m[2].trim(), content: m[3].trim() };
  });
  return sequence;
}

// Splits the "brief\n\nPitch angle: ...\n\nObjection handling: ..." blob
// written by POST /api/airtable/campaign back into its three parts.
function parseStrategyNotesFromAirtable(text){
  if(!text) return { strategyBrief:'', pitchAngle:'', objectionHandling:'' };
  const pitchMatch = text.match(/\n\nPitch angle: ([\s\S]*?)(?=\n\nObjection handling: |$)/);
  const objMatch = text.match(/\n\nObjection handling: ([\s\S]*)$/);
  let end = text.length;
  if(pitchMatch) end = Math.min(end, pitchMatch.index);
  if(objMatch) end = Math.min(end, objMatch.index);
  return {
    strategyBrief: text.slice(0, end).trim(),
    pitchAngle: pitchMatch ? pitchMatch[1].trim() : '',
    objectionHandling: objMatch ? objMatch[1].trim() : ''
  };
}

// Replaces state.campaigns wholesale from Airtable's Campaigns table. Must
// run after both hydrateContactsFromAirtable and hydrateGridsFromAirtable,
// since "Contact IDs"/"Grid IDs" are stored as comma-joined lists (of
// contact names / grid ids respectively) that can only be resolved back to
// local ids once state.contacts/state.grids are populated. Fields with no
// home on the real Campaigns table (estimatedConversions, the
// campaign-builder chat transcript) come back empty - see the equivalent
// notes on syncCampaignToAirtable/formatSequenceForAirtable. Companion to
// hydrateContactsFromAirtable/hydrateCompaniesFromAirtable/
// hydrateGridsFromAirtable; campaigns are never read from localStorage, see
// persistState/loadPersistedState.
async function hydrateCampaignsFromAirtable(){
  try {
    const res = await fetch('/api/airtable/campaign');
    const records = await res.json();
    if(!res.ok || !Array.isArray(records)) return;

    state.campaigns = records.map(r => {
      const f = r.fields || {};
      const contactNames = (f['Contact IDs'] || '').split(',').map(n => n.trim()).filter(Boolean);
      const contactIds = state.contacts
        .filter(c => contactNames.some(n => n.toLowerCase() === c.name.trim().toLowerCase()))
        .map(c => c.id);
      // Grid ids that no longer exist locally are dropped defensively, same
      // as the campaignGridLinks version this replaced used to do.
      const gridIds = (f['Grid IDs'] || '').split(',').map(id => id.trim()).filter(Boolean)
        .filter(gid => state.grids.some(g => g.id === gid));
      const { strategyBrief, pitchAngle, objectionHandling } = parseStrategyNotesFromAirtable(f['Strategy Notes']);
      return {
        id: r.id,
        recordId: r.id,
        createdAt: f['Start Date'] || isoDate(TODAY),
        updatedAt: f['Start Date'] || isoDate(TODAY),
        name: f['Name'] || 'Untitled campaign',
        goal: f['Goal'] || '',
        product: f['Product'] || '',
        targetSegmentSummary: f['Target ICP'] || '',
        contactIds,
        gridIds,
        sequence: parseSequenceFromAirtable(f['Sequence Templates']),
        strategyBrief,
        pitchAngle,
        objectionHandling,
        successMetric: f['Success Metric'] || '',
        estimatedConversions: '',
        status: f['Status'] || 'Draft',
        ctas: f['CTAs'] || '',
        contentContext: f['Content Context'] || '',
        conversationHistory: []
      };
    });

    renderPage();
  } catch(err){
    console.warn('Could not load campaigns from Airtable:', err.message);
  }
}

function csvField(val){
  const str = String(val ?? '');
  if(/[",\r\n]/.test(str)) return '"' + str.replace(/"/g,'""') + '"';
  return str;
}

const EXPORTABLE_STATES = ['found','opened','connected','messaging','booked'];

function exportContactsCsv(){
  const gridId = currentGrid().id;
  const rows = gridContacts(gridId).filter(c => EXPORTABLE_STATES.includes(c.state) && c.url && c.url.trim());
  if(!rows.length){ toast('No found contacts to export yet', 'warn'); return; }

  const header = ['Name','Company','Domain','LinkedIn URL','Name Confidence'];
  const lines = [header.map(csvField).join(',')];
  rows.forEach(c => {
    const nameConfidence = hasUncertainName(c.name) ? 'Might not be accurate - masked name from Apollo' : '';
    lines.push([c.name, c.company, companyDomain(c.company), c.url, nameConfidence].map(csvField).join(','));
  });
  const csvContent = lines.join('\r\n');

  const filename = `T2C_contacts_${isoDate(TODAY)}.csv`;
  const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);

  toast(rows.length+' contact'+(rows.length===1?'':'s')+' exported to '+filename, 'success');
}

function onConnectionsDragOver(e){
  e.preventDefault();
  document.getElementById('dropZoneUpload').classList.add('dragover');
}
function onConnectionsDragLeave(e){
  document.getElementById('dropZoneUpload').classList.remove('dragover');
}
function onConnectionsDrop(e){
  e.preventDefault();
  document.getElementById('dropZoneUpload').classList.remove('dragover');
  const files = Array.from(e.dataTransfer.files || []).filter(f => f.type.startsWith('image/'));
  if(files.length) processConnectionsFiles(files);
}
function handleConnectionsUpload(e){
  const files = Array.from(e.target.files || []);
  if(files.length) processConnectionsFiles(files);
  e.target.value = '';
}
function processConnectionsFiles(files){
  window.__connectionsShots = window.__connectionsShots || [];
  let pending = files.length;
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = () => {
      const match = String(reader.result).match(/^data:([^;]+);base64,(.*)$/);
      if(match){
        window.__connectionsShots.push({ name: file.name, mediaType: match[1], base64: match[2] });
      }
      pending--;
      if(pending === 0){
        renderConnectionsShotFiles();
        toast(files.length+' screenshot'+(files.length===1?'':'s')+' attached', 'success');
      }
    };
    reader.readAsDataURL(file);
  });
}
function renderConnectionsShotFiles(){
  const el = document.getElementById('connectionsShotFiles');
  if(!el) return;
  el.innerHTML = (window.__connectionsShots || []).map((f,i) => `<span class="shot-file-chip">${esc(f.name)}<button onclick="removeConnectionsShot(${i})">&times;</button></span>`).join('');
}
function removeConnectionsShot(idx){
  window.__connectionsShots.splice(idx,1);
  renderConnectionsShotFiles();
}

async function readConnectionsScreenshot(){
  const shots = window.__connectionsShots || [];
  // 'connectionPending' is the real state a request-sent-awaiting-
  // acceptance contact has once hydrated from Airtable (see
  // JOURNEY_STAGE_TO_STATE) - 'found' is an earlier stage (no request sent
  // yet) and was wrongly included here before, which meant this never
  // matched anyone against a real screenshot. 'opened' stays for the local
  // mock/demo seed data only; real hydration never produces it.
  const candidates = state.contacts.filter(c => (c.state==='connectionPending' || c.state==='opened') && !c.connDate);
  if(!candidates.length){ toast('No pending contacts to match against a screenshot','warn'); return; }

  const btn = document.getElementById('readConnectionsBtn');
  const original = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<i class="ti ti-loader-2"></i> Reading...';

  if(!shots.length){
    demoMatchConnections(candidates);
    btn.disabled = false;
    btn.innerHTML = original;
    return;
  }

  const images = shots.map(f => ({ mediaType: f.mediaType, base64: f.base64 }));
  let matchedIds = [];
  try {
    const res = await fetch('/api/contacts/match-connections-screenshot', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ candidates: candidates.map(c => ({ id: c.id, name: c.name, company: c.company })), images })
    });
    const data = await res.json();
    if(!res.ok || !data.success) throw new Error(data.error || 'Request failed');
    matchedIds = data.matchedIds || [];
  } catch(err){
    console.warn('Screenshot matching unavailable, using local fallback:', err.message);
    btn.disabled = false;
    btn.innerHTML = original;
    demoMatchConnections(candidates);
    return;
  }

  btn.disabled = false;
  btn.innerHTML = original;

  const matched = candidates.filter(c => matchedIds.includes(c.id));
  if(!matched.length){
    toast("Couldn't match anyone from that screenshot — try a clearer image", 'warn');
    return;
  }

  markContactsConnected(matched);
  toast(`${matched.length} contact${matched.length===1?'':'s'} matched and marked as connected: ${matched.map(p=>p.name).join(', ')}`, 'success');
  renderPage();
}

function demoMatchConnections(candidates){
  const picks = candidates.slice(0,2);
  markContactsConnected(picks);
  toast(`${picks.length} contacts matched and marked as connected: ${picks.map(p=>p.name).join(', ')}`, 'success');
  renderPage();
}

function markContactsConnected(contacts){
  contacts.forEach(c => {
    c.state = 'connected';
    c.connReqDate = c.connReqDate || isoDate(TODAY);
    c.connDate = isoDate(TODAY);
    c.thread.connSent = isoDate(TODAY);
    const activityEntry = { type:'connected', text:`${c.name} (${c.company}) accepted your connection`, date: isoDate(TODAY) };
    state.activity.unshift(activityEntry);
    syncActivityToAirtable(activityEntry);
    notifyWebhook(c);

    // Same PATCH the Context tab's LinkedIn Connections CSV upload makes
    // once it matches a contact (runContextConnectionsImport) - without
    // this, a contact matched from this Grid-page screenshot flow only
    // ever looked "Connected" locally: Contacts.Journey Stage and every
    // live Campaign Contacts.Sequence Stage stayed wherever they were,
    // silently diverging from what the app was showing.
    if(isAirtableRecordId(c.id)){
      fetch('/api/context/contact-fields', {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contactId: c.id, journeyStage: 'Connected', sequenceStage: 'Connected' })
      }).catch(err => console.warn('Could not sync Connected stage to Airtable for', c.name, err.message));
    } else {
      console.warn('Skipping Airtable Connected sync - contact has no Airtable record id yet:', c.name);
    }
  });
}

  const seqStage = window.__roadmapCampaignId ? campaignSequenceStageFor(c.name) : '';

  <div class="kcard" draggable="true" id="kcard-${c.id}" data-id="${c.id}" ondragstart="onCardDragStart(event,'${c.id}')" ondragend="onCardDragEnd(event)" oncontextmenu="showContextMenu(event,'${c.id}')">

      <div>

      </div>

      </div>
    </div>

async function enrichContact(cid){
  const c = state.contacts.find(x => x.id === cid);
  if(!c) return;
  const btn = document.getElementById('enrichBtn-' + cid);
  const panel = document.getElementById('enrichPanel-' + cid);
  if(!panel) return;
  const original = btn ? btn.innerHTML : '';
  if(btn){ btn.disabled = true; btn.innerHTML = '<i class="ti ti-loader-2"></i> Enriching...'; }
  panel.style.display = 'block';
  panel.innerHTML = '<div class="muted" style="font-size:12.5px;"><i class="ti ti-loader-2"></i> Researching...</div>';

  try {
    const res = await fetch('/api/enrich/contact', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ linkedinUrl: c.url, name: c.name, company: c.company })
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || ('Request failed with status '+res.status));

    window.__enrichmentProfiles = window.__enrichmentProfiles || {};
    window.__enrichmentProfiles[cid] = data.profile;
    c.enrichment = data.profile;
    panel.innerHTML = renderEnrichmentPanelHtml(cid, data.profile);
    toast('Enrichment complete', 'success');
    regenerateOpenMessageModalIfNeeded(cid);
  } catch(err){
    console.warn('Enrichment failed:', err.message);
    panel.innerHTML = `<div class="muted" style="font-size:12.5px;">Could not enrich this contact: ${esc(err.message)}</div>`;
    toast('Could not enrich contact: ' + err.message, 'warn');
  } finally {
    if(btn){ btn.disabled = false; btn.innerHTML = original; }
  }
}

// "Recent posts" section of the enrichment panel - raw Recent Posts field
// from this contact's Airtable record (populated by
// GET /api/trigify/sync-contact-posts), not part of the AI enrichment call,
// so it's fetched and cached separately in window.__contactRecentPosts.
function isWithinLastDays(dateStr, days){
  if(!dateStr) return false;
  const parsed = new Date(dateStr);
  if(isNaN(parsed)) return false;
  return parsed.getTime() >= Date.now() - days*24*60*60*1000;
}

function renderPostCard(p){
  return `
    <div style="margin-top:6px;padding:8px;border:1px solid var(--border);border-radius:6px;">
      <div class="muted" style="font-size:11px;">${esc(p.date || '')} &middot; ${p.likes||0} likes, ${p.comments||0} comments</div>
      <div style="font-size:12px;margin-top:2px;">${esc(p.text)}</div>
    </div>`;
}

// Splits into a "Recent Posts" list (last 30 days) shown inline, plus a
// collapsible "Older Posts" section for everything before that - applied
// everywhere Recent Posts renders (grid enrichment panel, contact drawer).
function renderRecentPostsCards(posts){
  if(!posts) return '<span class="muted" style="font-size:11.5px;"><i class="ti ti-loader-2"></i> Loading...</span>';
  if(posts.error) return `<span class="muted" style="font-size:11.5px;">Could not load recent posts: ${esc(posts.error)}</span>`;
  if(!posts.length) return '<span class="muted" style="font-size:11.5px;">No recent posts found</span>';

  const recent = posts.filter(p => isWithinLastDays(p.date, 30));
  const older = posts.filter(p => !isWithinLastDays(p.date, 30));

  const recentHtml = recent.length
    ? recent.map(renderPostCard).join('')
    : '<span class="muted" style="font-size:11.5px;">No posts in the last 30 days</span>';

  const olderHtml = older.length ? `<details style="margin-top:8px;">
      <summary style="cursor:pointer;font-size:12px;font-weight:700;color:var(--muted);">Older Posts (${older.length})</summary>
      ${older.map(renderPostCard).join('')}
    </details>` : '';

  return recentHtml + olderHtml;
}

function renderEnrichmentRecentPosts(posts){
  return `
        <div style="margin-top:8px;">
          <div style="font-weight:700;font-size:11.5px;">Recent posts</div>
          <div style="margin-top:2px;">${renderRecentPostsCards(posts)}</div>

}

async function loadContactRecentPosts(cid){
  window.__contactRecentPosts = window.__contactRecentPosts || {};
  window.__contactRecentPosts[cid] = null;
  try {
    const res = await fetch(`/api/contacts/${cid}/recent-posts`);
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || 'Request failed');
    window.__contactRecentPosts[cid] = data.posts || [];
  } catch(err){
    window.__contactRecentPosts[cid] = { error: err.message };
  }
  renderPage();
  const drawerSection = document.getElementById('recentPostsSection');
  if(drawerSection) drawerSection.innerHTML = renderContactDrawerRecentPosts(cid);
}

async function copyEnrichmentProfile(cid){
  const profile = window.__enrichmentProfiles && window.__enrichmentProfiles[cid];
  if(!profile) return;
  const text = ENRICHMENT_FIELDS.map(([key,label]) => `${label}: ${profile[key] || '—'}`).join('\n');
  try {
    await navigator.clipboard.writeText(text);
  } catch(err){
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  }
  toast('Enrichment profile copied to clipboard', 'success');
}

        <button class="btn btn-secondary btn-sm" onclick="event.stopPropagation();openGenerateModal('${c.id}','${key}', ()=>renderPage())"><i class="ti ti-copy"></i> Write &amp; copy message</button>
        <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();markSent('${c.id}','${key}')">Already sent, mark done</button>
      `}
    </div>
  </div>`;
}

const PAIN_POINTS = ['Delivery challenges','Change fatigue','Tooling fragmentation','Capability gaps','Agile adoption','Governance','Certification','Digital transformation','Stakeholder alignment'];
const COMMUNICATION_METHODS = ['LinkedIn message','Email','Call','Meeting','Event invite','Content share'];
const TOUCH_POINT_OUTCOMES = ['No reply','Replied','Meeting Booked','Not interested'];

function renderTouchPoints(c){

function addTouchPoint(cid) {
  const c = state.contacts.find(x => x.id === cid);
  const date = document.getElementById('tpDate-' + cid).value || isoDate(TODAY);
  const type = document.getElementById('tpType-' + cid).value;
  const methodEl = document.getElementById('tpMethod-' + cid);
  const communicationMethod = methodEl ? methodEl.value : '';
  const outcomeEl = document.getElementById('tpOutcome-' + cid);
  const outcome = outcomeEl ? outcomeEl.value : 'No reply';
  const notes = document.getElementById('tpNotes-' + cid).value.trim();
  const painPointsEl = document.getElementById('tpPainPoints-' + cid);
  const selectedPainPoints = painPointsEl ? Array.from(painPointsEl.querySelectorAll('input:checked')).map(el => el.value) : [];

  if (!c.touchPoints) c.touchPoints = [];
  c.touchPoints.push({ id: uid('tp'), date, type, communicationMethod, outcome, notes, painPoints: selectedPainPoints });

  if (selectedPainPoints.length) {
    if (!c.painPoints) c.painPoints = [];
    selectedPainPoints.forEach(p => { if (!c.painPoints.includes(p)) c.painPoints.push(p); });
  }

  // Sync touch point to Airtable (outcome "Replied" gets flagged on the record server-side)
  const manualTpFields = {
    contactName: c.name,
    company: c.company,
    date,
    type,
    notes,
    outcome,
    communicationMethod
  };
  if(airtableWriteGuard('touchpoint', manualTpFields, ['contactName','type'])){
    fetch('/api/airtable/touchpoint', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(manualTpFields)
    }).catch(err => console.warn('Airtable touch point sync failed:', err.message));
  }

  if (outcome === 'Meeting Booked') {
    trackConversion(c, date, communicationMethod);
  }

  // Default next-touch cadence: 7 days on from this touch point
  const nextTouchDate = addDays(date, 7);
  const nextTouchFields = {
    contactName: c.name,
    company: c.company,
    nextTouchDate,
    painPoints: selectedPainPoints
  };
  if(airtableWriteGuard('contact/stage', nextTouchFields, ['contactName'])){
    fetch('/api/airtable/contact/stage', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(nextTouchFields)
    }).catch(err => console.warn('Airtable next-touch sync failed:', err.message));
  }

  notifyWebhook(c);
  toast('Touch point logged', 'success');
  renderPage();
}

function trackConversion(c, bookedDate, communicationMethod){
  const touchPoints = (c.touchPoints || []).slice().sort((a,b)=>new Date(a.date)-new Date(b.date));
  const firstTouchDate = touchPoints.length ? touchPoints[0].date : bookedDate;
  const campaign = activeCampaignForContact(c);

  fetch('/api/track/conversion', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      contactName: c.name,
      company: c.company,
      icpRole: c.role,
      industry: companyIndustry(c.company),
      campaign: campaign ? campaign.name : '',
      product: campaign ? (campaign.product || '') : '',
      touchPointCount: touchPoints.length,
      daysToConvert: daysBetween(firstTouchDate, bookedDate),
      communicationMethod
    })
  }).catch(err => console.warn('Conversion tracking sync failed:', err.message));
}

function recommendedProducts(c){
  const industry = companyIndustry(c.company);
  const touchCount = (c.touchPoints || []).length;
  return (state.settings.products || []).filter(p => {
    const roles = p.targetRoles || [];
    const industries = p.targetIndustries || [];
    const roleMatch = !roles.length || roles.some(r => r.trim().toLowerCase() === c.role.toLowerCase());
    const industryMatch = !industries.length || industries.some(i => i.trim().toLowerCase() === industry.toLowerCase());
    const touchMatch = touchCount >= (parseInt(p.minTouchPoints) || 0);
    return roleMatch && industryMatch && touchMatch;
  });
}

function renderRecommendedProducts(c){
  const matches = recommendedProducts(c);
  return `

}

async function markSent(cid, key){
  const c = state.contacts.find(x=>x.id===cid);
  c.thread[key] = { sent: isoDate(TODAY), replied:false };
  if(c.state !== 'messaging') c.state = 'messaging';
  const activityEntry = { type:'message', text:`${key==='m1'?'Message 1':'Message 2'} sent to ${c.name} (${c.company})`, date: isoDate(TODAY) };
  state.activity.unshift(activityEntry);
  syncActivityToAirtable(activityEntry);
  notifyWebhook(c);
  toast('Marked as sent', 'success');
  renderPage();

  // Same Airtable writes as the Today's Actions "Copy & mark sent" fast-action
  // (POST /api/campaign/:name/contacts/:id/mark-sent): logs a Touch Point tagged
  // to this contact and campaign, advances Sequence Stage on the Campaign
  // Contacts row, and clears its stale Next Message Draft. This button has no
  // drafted message text to log (it exists for messages sent outside the app's
  // generator) so it falls back to whatever was last generated for this stage,
  // or a placeholder noting there's no draft on file.
  const campaign = state.campaigns.find(x => x.id === window.__roadmapCampaignId) || activeCampaignForContact(c);
  if(!campaign) return;
  const message = (c.generated && c.generated[key]) || `${key==='m1'?'Message 1':'Message 2'} to ${c.name} — marked as sent manually, no draft on file.`;
  try {
    const res = await fetch(`/api/campaign/${encodeURIComponent(campaign.name)}/contacts/${cid}/mark-sent`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ message })
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || 'Request failed');
    if(window.__roadmapCampaignId === campaign.id) await loadCampaignSequenceStages(campaign);
  } catch(err){
    console.warn('Could not sync sent message to Airtable:', err.message);
    toast('Marked as sent locally, but could not sync to Airtable: ' + err.message, 'warn');
  }
}
// This used to only flip c.thread[key].replied in local memory and stop
// there - it never told Airtable anything, so Sequence Stage stayed on
// "Message N Sent" forever and the toggle reset on every reload. Now syncs
// to POST /api/campaign/:name/contacts/:id/reply, which advances Sequence
// Stage using the same SEQUENCE_STAGE_ADVANCE table the DM-screenshot flow
// uses, and logs a Touch Point when the answer is "Yes".
async function setReply(cid, key, val){
  const c = state.contacts.find(x=>x.id===cid);
  c.thread[key].replied = val;
  renderPage();

  const campaign = state.campaigns.find(x => x.id === window.__roadmapCampaignId) || activeCampaignForContact(c);
  if(!campaign) return;
  try {
    const res = await fetch(`/api/campaign/${encodeURIComponent(campaign.name)}/contacts/${cid}/reply`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ replied: val })
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || 'Request failed');
    if(window.__roadmapCampaignId === campaign.id) await loadCampaignSequenceStages(campaign);
  } catch(err){
    console.warn('Could not sync reply status to Airtable:', err.message);
    toast('Marked locally, but could not sync reply to Airtable: ' + err.message, 'warn');
  }
}
function setCta(cid, val){
  const c = state.contacts.find(x=>x.id===cid);
  c.thread.cta = val || null;
}

function removeDeadContact(cid){
  const idx = state.contacts.findIndex(c=>c.id===cid);
  if(idx===-1) return;
  const c = state.contacts[idx];
  const deadContact = { name:c.name, company:c.company, role:c.role, days:getPendingDays(c), removed:isoDate(TODAY) };
  state.deadContacts.push(deadContact);
  syncDeadContactToAirtable(deadContact);
  state.contacts.splice(idx,1);
  toast(c.name+' moved to archive','warn');
  renderPage();
}

function syncDeadContactToAirtable(deadContact){
  const fields = { name: deadContact.name, company: deadContact.company, role: deadContact.role, days: deadContact.days, removed: deadContact.removed };
  if(!airtableWriteGuard('dead-contact', fields, ['name','company'])) return;
  fetch('/api/airtable/dead-contact', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(fields)
  }).catch(err => console.warn('Airtable dead contact sync failed:', err.message));
}

// Replaces state.deadContacts wholesale from Airtable's Dead Contacts
// table - same "server is the source of truth" convention as the other
// hydrate*FromAirtable functions. Only a genuine failure (non-OK response,
// or a malformed non-array body) leaves state.deadContacts untouched - a
// successful empty response clears it same as any other result.
async function hydrateDeadContactsFromAirtable(){
  try {
    const res = await fetch('/api/airtable/dead-contact');
    const records = await res.json();
    if(!res.ok || !Array.isArray(records)) return;

    state.deadContacts = records.map(r => {
      const f = r.fields || {};
      return {
        name: f['Name'] || '',
        company: f['Company'] || '',
        role: f['Role'] || '',
        days: typeof f['Days'] === 'number' ? f['Days'] : 0,
        removed: f['Removed'] || ''
      };
    });

    renderPage();
  } catch(err){
    console.warn('Could not load dead contacts from Airtable:', err.message);
  }
}

let dragCardId = null;
function initRoadmapDrag(){}
function onCardDragStart(e, id){ dragCardId = id; e.target.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; }
function onCardDragEnd(e){ e.target.classList.remove('dragging'); }

// Column key -> Airtable Journey Stage value, matching the single-select
// values the rest of the app writes (see mapStateToStage in search-server.js
// and JOURNEY_STAGE_TO_STATE above). There's no "pending" column that maps
// to Identified/found - the board starts at "Connection pending", so that's
// the value synced when a card lands back in that column.
const ROADMAP_COL_TO_JOURNEY_STAGE = { pending:'Connection Pending', made:'Connected', messaging:'Messaging', booked:'Booked' };

// Airtable record ids are always "rec" + 14 alphanumeric chars. A contact
// found via runDailySearch starts with a local uid('c') placeholder instead
// until syncContactToAirtable/syncAllContactsToAirtable replaces it with the
// real id - dragging its card before that sync completes would otherwise
// send the placeholder as contactId and get rejected by Airtable with 422
// INVALID_RECORDS.
function isAirtableRecordId(id){
  return /^rec[A-Za-z0-9]{14}$/.test(id || '');
}

async function syncJourneyStageForColumn(contactId, colKey){
  const journeyStage = ROADMAP_COL_TO_JOURNEY_STAGE[colKey];
  if(!journeyStage) return;
  if(!isAirtableRecordId(contactId)){
    console.warn('Skipping Airtable Journey Stage sync - contact has no Airtable record id yet:', contactId);
    toast('Moved locally, but this contact hasn\'t synced to Airtable yet - press "Sync to Airtable" first.', 'warn');
    return;
  }
  try {
    const res = await fetch('/api/context/contact-fields', {
      method: 'PATCH',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ contactId, journeyStage })
    });
    if(!res.ok){ const data = await res.json().catch(()=>({})); throw new Error(data.error || 'Request failed'); }
  } catch(err){
    console.warn('Could not sync Journey Stage to Airtable:', err.message);
    toast('Moved locally, but could not sync stage to Airtable: ' + err.message, 'warn');
  }
}

async function onColDrop(e, colKey){
  e.preventDefault();
  if(!dragCardId) return;
  const c = state.contacts.find(x=>x.id===dragCardId);
  if(!c) return;
  const fromCol = getRoadmapColumn(c);
  if(fromCol === colKey){ dragCardId=null; return; }
  syncJourneyStageForColumn(c.id, colKey);
  const order = ['pending','made','messaging','booked'];
  const forward = order.indexOf(colKey) > order.indexOf(fromCol);

  if(colKey === 'made'){
    c.state = 'connected';
    c.connReqDate = c.connReqDate || isoDate(TODAY);
    c.connDate = isoDate(TODAY);
    c.thread.connSent = isoDate(TODAY);
    const activityEntry = { type:'connected', text:`${c.name} (${c.company}) accepted your connection`, date: isoDate(TODAY) };
    state.activity.unshift(activityEntry);
    syncActivityToAirtable(activityEntry);
    notifyWebhook(c);
    renderPage();
  } else if(colKey === 'messaging'){
    if(forward) openGenerateModal(c.id, c.thread.m1 ? 'm2' : 'm1', ()=>renderPage());
    else { c.state='messaging'; renderPage(); }
  } else if(colKey === 'booked'){
    openBookingModal(c.id);
  } else if(colKey === 'pending'){
    c.state = 'found'; c.connDate=null; c.thread.connSent=null;
    renderPage();
  }
  dragCardId = null;
}

let __tpRenderCounter = 0;

function touchPointTypeBadgeColors(type){
  const key = (type || '').toLowerCase().trim();
  if(key === 'meeting') return { bg:'#faf0dc', color:'#8a6a1f' };
  if(key.startsWith('linkedin')) return { bg:'#e3edfb', color:'#2d5da8' };
  if(key === 'email') return { bg:'#e2f3e6', color:'#2c7a43' };
  if(key === 'call' || key === 'phone call') return { bg:'#f1e6fa', color:'#7a3fa8' };
  return { bg:'#eeeeee', color:'#666666' };
}

function toggleTouchPointBody(domId, link){
  const container = document.getElementById(domId);
  if(!container) return;
  const shortEl = container.querySelector('.tp-body-short');
  const fullEl = container.querySelector('.tp-body-full');
  if(!shortEl || !fullEl) return;
  const expanded = fullEl.style.display !== 'none';
  fullEl.style.display = expanded ? 'none' : '';
  shortEl.style.display = expanded ? '' : 'none';
  link.textContent = expanded ? 'Show more' : 'Show less';
}

function renderDrawerTouchPoint(tp, campaignName){
  const isOther = !!(campaignName && tp.campaignName && tp.campaignName !== campaignName);
  const domId = `tpBody_${__tpRenderCounter++}`;

  let body = (tp.notes || '').replace(/^\s*\[Campaign:[^\]]*\]\s*/i, '');

  const extracted = [];
  body = body.replace(/^(Objections raised|Next steps agreed|Sentiment):[ \t]*(.*)$/gim, (match, label, value) => {
    extracted.push({ label, value: value.trim() });
    return '';
  }).replace(/\n{2,}/g, '\n').trim();

  const TRUNCATE_LEN = 80;
  const isLong = body.length > TRUNCATE_LEN;
  const shortBody = isLong ? body.slice(0, TRUNCATE_LEN).trim() + '…' : body;
  const badge = touchPointTypeBadgeColors(tp.type);

  return `<div class="tp-item ${isOther?'other':''}">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <span style="display:inline-flex;padding:2px 8px;border-radius:10px;font-size:10.5px;font-weight:700;background:${badge.bg};color:${badge.color};">${esc(tp.type||'Touch point')}</span>
      <span class="muted">${fmtDate(tp.date)}</span>
    </div>
    ${body ? `<div style="margin-top:4px;" id="${domId}">
      <span class="tp-body-short">${esc(shortBody)}</span>
      ${isLong ? `<span class="tp-body-full" style="display:none;">${esc(body)}</span> <a href="#" onclick="event.preventDefault();toggleTouchPointBody('${domId}', this);" style="font-size:11px;font-weight:700;margin-left:2px;">Show more</a>` : ''}
    </div>` : ''}

    ${tp.campaignName ? `<div class="muted" style="font-size:10.5px;margin-top:3px;">${esc(tp.campaignName)}${isOther && tp.relevantToCurrentCampaign ? ' · surfaced: related to this campaign' : ''}</div>` : ''}

}

// Manual-override stages offered on the contact drawer's stage dropdown -
// the finer automatic Sequence Stage vocabulary (Message 1 Sent, Pending
// Reply M1, etc - see SEQUENCE_STAGE_ADVANCE) is advanced by the sequence
// engine itself, not picked by a rep here. "Connection Made" is the drawer
// label for Airtable's "Connected" value, same mapping direction as
// LOGGER_JOURNEY_STAGE_TO_SEQUENCE_STAGE in search-server.js, so a stage set
// from here still reads correctly everywhere else that's Sequence-Stage
// aware (funnel counts, Today's Actions, etc).
const CONTACT_DRAWER_STAGE_OPTIONS = ['Found', 'Connection Pending', 'Connection Made', 'Meeting Booked', 'Lost', 'Excluded'];
const SEQUENCE_STAGE_TO_DRAWER_LABEL = { 'Connected': 'Connection Made' };

// Same Journey Stage colour scheme as the .tag-* classes above (Found=blue,
// Connection pending=amber, Connection made=green, Booked=gold) so the
// drawer's stage dropdown reads as the same colour-coded pill as everywhere
// else the stage shows up, instead of a plain unstyled <select>. Lost/
// Excluded/unknown values fall back to the neutral .tag-sent-neutral grey.
const CONTACT_DRAWER_STAGE_COLORS = {
  'Found': { bg:'#e2f2fa', color:'var(--blue)' },
  'Connection Pending': { bg:'#fdf0d9', color:'var(--warning)' },
  'Connection Made': { bg:'#e3f5eb', color:'var(--success)' },
  'Meeting Booked': { bg:'#fdf3d0', color:'#96751a' },
  'Lost': { bg:'#fbe4e0', color:'#b3413a' },
  'Excluded': { bg:'#f1f1ee', color:'#6b6558' }
};
function contactDrawerStageColor(label){
  return CONTACT_DRAWER_STAGE_COLORS[label] || { bg:'#f1f1ee', color:'#6b6558' };
}

// Replaces the old static Journey Stage/Sequence Stage badges with an
// editable dropdown, scoped to this campaign's Campaign Contacts row (there
// is no campaign-wide "journey stage" concept in Airtable - see the
// gridName/"Grid Name" notes elsewhere in this file for the same
// no-per-grid-field situation). Disabled when the drawer was opened without
// a campaign context, since there's no Campaign Contacts row to write to.
// If the real current stage is one of the finer automatic values not in
// CONTACT_DRAWER_STAGE_OPTIONS, it's shown as an extra disabled option so
// the dropdown never lies about the contact's actual stage.
function renderContactDrawerStageSelect(data, campaignName){
  if(!campaignName){
    return `<select class="stage-select" disabled title="Open this contact from within a campaign to edit stage"><option>No campaign</option></select>`;
  }
  const rawStage = data.sequenceStage || '';
  const currentLabel = rawStage ? (SEQUENCE_STAGE_TO_DRAWER_LABEL[rawStage] || rawStage) : '';
  const isKnown = CONTACT_DRAWER_STAGE_OPTIONS.includes(currentLabel);
  const { bg, color } = contactDrawerStageColor(currentLabel);
  return `<select id="contactStageSelect" class="stage-select" style="background:${bg};color:${color};" onchange="updateContactDrawerStage(this.value)">
    ${!isKnown && currentLabel ? `<option value="${esc(currentLabel)}" selected disabled>${esc(currentLabel)}</option>` : ''}
    ${CONTACT_DRAWER_STAGE_OPTIONS.map(s => `<option value="${esc(s)}" ${s === currentLabel ? 'selected' : ''}>${esc(s)}</option>`).join('')}
  </select>`;
}

async function updateContactDrawerStage(newStage){
  const profile = window.__drawerContactProfile;
  const campaignName = window.__drawerCampaignName;
  if(!profile || !campaignName) return;
  const select = document.getElementById('contactStageSelect');
  if(select){
    select.disabled = true;
    const { bg, color } = contactDrawerStageColor(newStage);
    select.style.background = bg;
    select.style.color = color;
  }
  try {
    const res = await fetch(`/api/campaign/${encodeURIComponent(campaignName)}/contacts/${encodeURIComponent(profile.contact.id)}/stage`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ stage: newStage })
    });
    const data = await res.json();
    if(!res.ok || !data.success) throw new Error(data.error || 'Stage update failed');
    profile.sequenceStage = data.sequenceStage;

    // Grid cells, Roadmap cards and Today's Actions all read Sequence Stage
    // out of this same cache (see gridSequenceStageMap/campaignSequenceStageFor
    // above), not off the drawer's own profile - patch it here too so a
    // stage change made from the drawer shows up everywhere else immediately
    // instead of only after the next full reload/re-fetch.
    const campaign = state.campaigns.find(cp => cp.name === campaignName);
    if(campaign){
      window.__campaignSequenceStages = window.__campaignSequenceStages || {};
      window.__campaignSequenceStages[campaign.id] = window.__campaignSequenceStages[campaign.id] || {};
      window.__campaignSequenceStages[campaign.id][profile.contact.fullName.trim().toLowerCase()] = data.sequenceStage;
      renderPage();
    }

    toast('Stage updated', 'success');
  } catch(err){
    toast('Could not update stage: ' + err.message, 'warn');
    // Re-render from the unchanged profile so the select reverts to the
    // actual stored stage instead of sitting on the failed selection.
    if(document.getElementById('profileDrawer')) drawerBody(renderContactDrawerContent(profile, campaignName));
    return;
  }
  if(select) select.disabled = false;
}

// "Save history" (Conversation History section, contact drawer) - writes the
// pasted thread as its own Touch Point (reusing POST /api/airtable/touchpoint,
// same as every other touch point write in this app) with Type "LinkedIn
// Conversation", linked to this contact and (when opened from within one)
// the current campaign. Claude's summarise-and-fold-into-AI-Summary step
// then reuses POST /api/contacts/update-summary in the background - the
// same call saveContactDrawerNote makes for a plain note - since that's the
// route that actually does the "Claude summarises this and updates AI
// Summary" work; it happens after the touch point write above, not blocking
// the "saved" feedback.
async function saveContactConversationHistory(){
  const input = document.getElementById('contactConvoHistoryInput');
  const threadText = input.value.trim();
  if(!threadText) return;
  const name = window.__drawerContactName;
  const campaignName = window.__drawerCampaignName;
  const btn = document.getElementById('saveContactConvoBtn');
  if(btn){ btn.disabled = true; btn.innerHTML = '<i class="ti ti-loader-2"></i> Saving...'; }
  try {
    const res = await fetch('/api/airtable/touchpoint', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ contactName: name, type: 'LinkedIn Conversation', notes: threadText, campaignName: campaignName || undefined })
    });
    const data = await res.json();
    if(!res.ok || !data.success) throw new Error(data.error || 'Save failed');
    input.value = '';
    toast('Conversation history saved', 'success');

    fetch('/api/contacts/update-summary', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ name, noteText: threadText }) })
      .catch(err => console.warn('Background summary update failed:', err.message));
  } catch(err){
    toast('Could not save conversation history: ' + err.message, 'warn');
  } finally {
    if(btn){ btn.disabled = false; btn.innerHTML = '<i class="ti ti-device-floppy"></i> Save history'; }
  }
}

async function enrichContactDrawer(){
  const btn = document.getElementById('enrichContactBtn');
  const original = btn ? btn.innerHTML : '';
  if(btn){ btn.disabled = true; btn.innerHTML = '<i class="ti ti-loader-2"></i>'; }
  try {
    const profile = window.__drawerContactProfile;
    const res = await fetch('/api/contacts/enrich', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ name: window.__drawerContactName, company: profile ? profile.contact.companyName : '' })
    });
    const data = await res.json();
    if(!res.ok || !data.success) throw new Error(data.error || 'Enrich failed');
    if(profile){
      profile.contact.enrichment = data.profile;
      window.__enrichmentProfiles = window.__enrichmentProfiles || {};
      window.__enrichmentProfiles[profile.contact.id] = data.profile;
      const c = state.contacts.find(x => x.id === profile.contact.id);
      if(c) c.enrichment = data.profile;
    }
    const section = document.getElementById('enrichmentSection');
    if(section && profile) section.innerHTML = renderContactEnrichmentSection(profile.contact);
    toast('Contact enriched', 'success');
    if(profile) regenerateOpenMessageModalIfNeeded(profile.contact.id);
  } catch(err){
    toast('Could not enrich: ' + err.message, 'warn');
  } finally {
    if(btn){ btn.disabled = false; btn.innerHTML = original; }
  }
}

  const campaignName = window.__drawerCampaignName;
  const btn = document.getElementById('saveContactNoteBtn');
  if(btn) btn.disabled = true;
  try {
    const res = await fetch('/api/contacts/notes', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ name, noteText }) });
    const data = await res.json();
    if(!res.ok || !data.success) throw new Error(data.error || 'Save failed');
    const thread = document.getElementById('contactNotesThread');
    if(thread) thread.innerHTML = renderNotesThread(data.notes);
    input.value = '';
    toast('Note saved', 'success');
    if(window.__drawerContactProfile) window.__drawerContactProfile.contact.notes = data.notes;

    // Background - neither call blocks the "note saved" feedback above.
    fetch('/api/contacts/update-summary', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ name, noteText }) })
      .catch(err => console.warn('Background summary update failed:', err.message));

    fetch('/api/contacts/extract-actions', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ name, noteText, campaignName: campaignName || undefined }) })
      .then(res2 => res2.json())
      .then(d2 => {
        (d2.actions || []).forEach(a => {
          toastWithUndo(`Calendar reminder created: ${a.description} — ${fmtDate(a.dueDate)}. Undo?`, () => {
            fetch(`/api/reminders/${a.reminderId}`, { method:'DELETE' }).catch(err => console.warn('Undo delete failed:', err.message));
          });
        });
      })
      .catch(err => console.warn('Extract actions failed:', err.message));
  } catch(err){
    toast('Could not save note: ' + err.message, 'warn');
  } finally {
    if(btn) btn.disabled = false;
  }
}

      })
      .catch(err => console.warn('Extract actions failed:', err.message));
  } catch(err){
    toast('Could not save note: ' + err.message, 'warn');
  } finally {
    if(btn) btn.disabled = false;
  }
}

/* ---- Toast with undo (adds to, does not replace, toast()) ---- */
function toastWithUndo(message, onUndo){
  const c = document.getElementById('toastContainer');
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<i class="ti ti-calendar-plus"></i><span>${esc(message)}</span> <button class="btn btn-ghost btn-sm" style="margin-left:8px;">Undo</button>`;
  let undone = false;
  el.querySelector('button').onclick = () => { undone = true; onUndo(); el.remove(); };
  c.appendChild(el);
  setTimeout(() => {
    if(!undone){ el.style.transition = 'opacity .3s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }
  }, 5000);
}

async function confirmBooking(cid){
  const c = state.contacts.find(x=>x.id===cid);
  const service = document.getElementById('bkService').value;
  const date = document.getElementById('bkDate').value;
  const cta = document.getElementById('bkCta').value;
  const notes = document.getElementById('bkNotes').value;
  c.thread.booked = true;
  c.thread.bookedService = service;
  c.thread.bookedDate = date;
  c.thread.bookedCta = cta;
  c.thread.bookedNotes = notes;
  c.thread.cta = cta;
  c.state = 'messaging';
  const booking = { contactId:c.id, name:c.name, company:c.company, service, date, cta, notes };
  state.bookings.push(booking);
  syncBookingToAirtable(booking);
  const activityEntry = { type:'booked', text:`${c.name} (${c.company}) booked ${service}`, date: isoDate(TODAY) };
  state.activity.unshift(activityEntry);
  syncActivityToAirtable(activityEntry);
  notifyWebhook(c);
  closeModal();
  toast(c.name+' booked for '+service, 'success');
  renderPage();

  // Same Deals + Touch Point writes the Sales tab's "Log a deal" flow makes
  // (POST /api/campaign/:name/deals, POST /api/airtable/touchpoint) - a
  // booking is a won deal, tagged to whichever campaign this contact's
  // Roadmap card belongs to.
  const campaign = state.campaigns.find(x => x.id === window.__roadmapCampaignId) || activeCampaignForContact(c);
  if(!campaign){
    console.warn('Could not sync booking to Airtable: no active campaign found for this contact.');
    return;
  }
  const dealNotes = [notes, cta ? `CTA: ${cta}` : ''].filter(Boolean).join(' — ');
  try {
    const dealRes = await fetch(`/api/campaign/${encodeURIComponent(campaign.name)}/deals`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ contactId: cid, outcome: 'Won', dealValue: 0, notes: dealNotes, date })
    });
    const dealData = await dealRes.json();
    if(!dealRes.ok || !dealData.success) throw new Error(dealData.error || 'Deal save failed');

    const bookingTpFields = {
      contactRecordIds: [cid],
      date, type: 'Meeting',
      notes: `${service} booked${cta ? ' via ' + cta : ''}`,
      outcome: 'Meeting Booked',
      campaignName: campaign.name
    };
    if(!cid) throw new Error('No contact id for this booking');
    if(!airtableWriteGuard('touchpoint', bookingTpFields, ['type'])) throw new Error('Touch point is missing required data');
    const tpRes = await fetch('/api/airtable/touchpoint', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(bookingTpFields)
    });
    const tpData = await tpRes.json();
    if(!tpRes.ok || !tpData.success) throw new Error(tpData.error || 'Touch point save failed');
  } catch(err){
    console.warn('Could not sync booking to Airtable:', err.message);
    toast('Booked locally, but could not sync to Airtable: ' + err.message, 'warn');
  }
}

function syncBookingToAirtable(booking){
  const fields = { contactName: booking.name, company: booking.company, service: booking.service, date: booking.date, cta: booking.cta, notes: booking.notes };
  if(!airtableWriteGuard('booking', fields, ['contactName','company'])) return;
  fetch('/api/airtable/booking', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(fields)
  }).catch(err => console.warn('Airtable booking sync failed:', err.message));
}

async function generateTemplate(seqId, stageKey){
  const seq = state.sequences.find(s=>s.id===seqId);
  const st = STAGE_META.find(s=>s.key===stageKey);
  const btn = event.target.closest('button');
  const original = btn.innerHTML;
  btn.innerHTML = '<i class="ti ti-loader-2"></i> Generating...';
  btn.disabled = true;
  let result;
  try {
    const v = state.settings.strategy;
    const res = await fetch('/api/messages/generate-template', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        stageLabel: st.label,
        roles: seq.roles,
        stageKey,
        messageNumber: messageNumberForStage(stageKey),
        voice: { tone: v.tone, connLength: v.connLength, cadence: v.cadence, voiceInstructions: v.voiceInstructions, messagesBeforeCta: v.messagesBeforeCta }
      })
    });
    const data = await res.json();
    if(!res.ok || !data.success) throw new Error(data.error || 'Request failed');
    result = data.message;
  } catch(err){
    console.warn('Template generation unavailable, using local fallback:', err.message);
    result = localTemplateFallback(seq, stageKey);
  }
  document.getElementById(`tpl-${seqId}-${stageKey}`).value = result;
  seq.stages[stageKey] = result;
  btn.innerHTML = original;
  btn.disabled = false;
  toast('Template generated for '+st.label, 'success');
}

function voiceRulesText(){
  const v = state.settings.strategy;
  return `Voice rules: UK English, no em dashes, ${v.tone.toLowerCase()} tone, one observation and one question per message, 3 to 4 sentences, signed off "Twenty2 Collective", conditional CTA framing (never pushy). Connection requests should be ${v.connLength.toLowerCase()}. Follow-up cadence is ${v.cadence.toLowerCase()}. ${v.voiceInstructions}`;
}

function messageNumberForStage(stageKey){
  return { m1:1, m2:2, cta:3 }[stageKey] || 0;
}

function ctaStrategyNote(stageKey){
  const n = parseInt(state.settings.strategy.messagesBeforeCta) || 2;
  const num = messageNumberForStage(stageKey);
  if(stageKey === 'cta'){
    return `Strategy: this is the CTA ask (message ${num} in the sequence). Per the outreach strategy the CTA should land by message ${n}, so make the ask directly here${num > n ? ", it's already overdue so don't hold back" : ''}.`;
  }
  if(!num) return '';
  if(num >= n){
    return `Strategy: the outreach strategy says the CTA should be introduced by message ${n}. This is message ${num}, so it's fine to start gently pointing toward the CTA if the moment fits, without being pushy about it.`;
  }
  return `Strategy: the outreach strategy says the CTA shouldn't appear until message ${n}. This is message ${num}, so keep this purely relationship-building, no CTA mention yet.`;
}

function ctaNudgeLine(){
  const magnet = state.settings.leadMagnets.find(m=>m.enabled);
  return magnet ? `By the way, if it's useful I've got a short ${magnet.name} that might be worth a look.` : '';
}

function appendCtaNudge(text, stageKey){
  if(!text || !stageKey || stageKey === 'cta' || stageKey === 'connect') return text;
  const n = parseInt(state.settings.strategy.messagesBeforeCta) || 2;
  if(messageNumberForStage(stageKey) < n) return text;
  const nudge = ctaNudgeLine();
  if(!nudge) return text;
  if(/\n\nTwenty2 Collective\s*$/.test(text)) return text.replace(/\n\nTwenty2 Collective\s*$/, `\n\n${nudge}\n\nTwenty2 Collective`);
  return text + `\n\n${nudge}`;
}

function localTemplateFallback(seq, stageKey){
  const fallbacks = {
    connect: "Hi {{first}}, I work with {{role}}s across WA and came across your profile at {{company}}. Would be good to connect.\n\nTwenty2 Collective",
    m1: "Thanks for connecting, {{first}}. Curious how things are tracking at {{company}} at the moment. What's top of mind for you right now?\n\nTwenty2 Collective",
    m2: "No worries if you're flat out, {{first}}. A few {{role}}s I've spoken with lately have found it useful to get a quick outside read on their delivery rhythm. Worth a look for you?\n\nTwenty2 Collective",
    cta: "If it's useful, {{first}}, I've got a short Change Value Check that gives a clear picture in under 15 minutes, no pitch. Happy to send it through.\n\nTwenty2 Collective"
  };
  return appendCtaNudge(fallbacks[stageKey], stageKey);
}

/* Sequence chip drag/drop */
let dragChipId = null;
function initSequenceDrag(){}
function onChipDragStart(e, id){ dragChipId = id; e.target.classList.add('dragging'); }
function onChipDragEnd(e){ e.target.classList.remove('dragging'); }
function onChipDragOver(e){ e.preventDefault(); }
function onChipDrop(e, seqId, stageKey){
  e.preventDefault();
  if(!dragChipId) return;
  const c = state.contacts.find(x=>x.id===dragChipId);
  if(!c) return;
  const order = ['connect','m1','m2','cta'];
  const currentStage = contactStageKey(c);
  if(currentStage === stageKey){ dragChipId=null; return; }
  const forward = order.indexOf(stageKey) > order.indexOf(currentStage);
  if(forward){
    openGenerateModal(c.id, stageKey, ()=>renderPage());
  } else {
    if(stageKey==='connect'){ c.connDate=null; c.thread.connSent=null; c.thread.m1=null; c.thread.m2=null; c.thread.cta=null; c.state='found'; }
    if(stageKey==='m1'){ c.thread.m2=null; c.thread.cta=null; c.state='connected'; }
    if(stageKey==='m2'){ c.thread.cta=null; }
    renderPage();
  }
  dragChipId = null;
}

function screenshotBoxHtml(kind, hint){
  return `
    <div class="shot-box" id="shotbox-${kind}" ondragover="onShotDragOver(event,'${kind}')" ondragleave="onShotDragLeave(event,'${kind}')" ondrop="onShotDrop(event,'${kind}')">

      </button>
      <input type="file" id="shotinput-${kind}" accept="image/*" multiple style="display:none;" onchange="handleScreenshotUpload(event,'${kind}')">
      <div class="shot-files" id="shotfiles-${kind}"></div>
    </div>`;
}

function onShotDragOver(e, kind){
  e.preventDefault();
  e.stopPropagation();
  const box = document.getElementById('shotbox-'+kind);
  if(box) box.classList.add('dragover');
}
function onShotDragLeave(e, kind){
  const box = document.getElementById('shotbox-'+kind);
  if(box) box.classList.remove('dragover');
}
function onShotDrop(e, kind){
  e.preventDefault();
  e.stopPropagation();
  const box = document.getElementById('shotbox-'+kind);
  if(box) box.classList.remove('dragover');
  const files = Array.from(e.dataTransfer.files || []).filter(f => f.type.startsWith('image/'));
  if(files.length) processShotFiles(files, kind);
}
function handleScreenshotUpload(event, kind){
  const files = Array.from(event.target.files || []);
  if(files.length) processShotFiles(files, kind);
  event.target.value = '';
}
function processShotFiles(files, kind){
  if(!window.__genCtx) return;
  const arrKey = kind === 'profile' ? 'profileImages' : 'convoImages';
  let pending = files.length;
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = () => {
      const match = String(reader.result).match(/^data:([^;]+);base64,(.*)$/);
      if(match){
        window.__genCtx[arrKey].push({ name: file.name, mediaType: match[1], base64: match[2] });
      }
      pending--;
      if(pending === 0){
        renderShotFiles(kind);
        toast(files.length+' screenshot'+(files.length===1?'':'s')+' attached', 'success');
      }
    };
    reader.readAsDataURL(file);
  });
}
function renderShotFiles(kind){
  const arrKey = kind === 'profile' ? 'profileImages' : 'convoImages';
  const list = (window.__genCtx && window.__genCtx[arrKey]) || [];
  const el = document.getElementById('shotfiles-'+kind);
  if(!el) return;
  el.innerHTML = list.map((f,i) => `<span class="shot-file-chip">${esc(f.name)}<button onclick="removeScreenshot('${kind}',${i})">&times;</button></span>`).join('');
}
function removeScreenshot(kind, idx){

  window.__genCtx[arrKey].splice(idx,1);

// Calls the server (POST /api/messages/generate) instead of hitting the
// Anthropic API directly from the browser - the old client-side callAI()
// path here had no API key and always failed silently to the local
// template fallback below. The server now owns prompt assembly; this just
// gathers the structured inputs (contact, enrichment, campaign, stage,
// voice settings, screenshots) for it.
async function generateMessageForModal(cid, stageKey){
  const c = state.contacts.find(x=>x.id===cid);
  const seq = state.sequences.find(s=>s.id===c.seqId) || state.sequences[0];
  const st = STAGE_META.find(s=>s.key===stageKey);
  const notes = document.getElementById('genNotes') ? document.getElementById('genNotes').value : c.notes;

  const campaign = activeCampaignForContact(c);
  const campaignStageMap = { m1:'message1', m2:'followUp1', cta:'followUp2' };
  const campaignStage = campaign && campaignStageMap[stageKey] ? campaign.sequence[campaignStageMap[stageKey]] : null;
  const template = (campaignStage && campaignStage.content) ? campaignStage.content : (seq.stages[stageKey] || '');

  const profileImages = (window.__genCtx && window.__genCtx.profileImages) || [];
  const convoImages = (window.__genCtx && window.__genCtx.convoImages) || [];
  const images = [
    ...profileImages.map(f => ({ mediaType: f.mediaType, base64: f.base64, kind: 'profile' })),
    ...convoImages.map(f => ({ mediaType: f.mediaType, base64: f.base64, kind: 'convo' }))
  ];

  const enrichment = (window.__enrichmentProfiles && window.__enrichmentProfiles[cid]) || c.enrichment || null;
  const v = state.settings.strategy;

  let result;
  try {
    const res = await fetch('/api/messages/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contact: { id: c.id, name: c.name, role: c.role, company: c.company, notes: notes || '' },
        enrichment,
        campaign: campaign ? { name: campaign.name, goal: campaign.goal, strategyBrief: campaign.strategyBrief || '' } : null,
        stage: { key: stageKey, label: st.label, messageNumber: messageNumberForStage(stageKey), template },
        voice: { tone: v.tone, connLength: v.connLength, cadence: v.cadence, voiceInstructions: v.voiceInstructions, messagesBeforeCta: v.messagesBeforeCta },
        images
      })
    });
    const data = await res.json();
    if(!res.ok || !data.success) throw new Error(data.error || 'Request failed');
    result = data.message;
  } catch(err){
    console.warn('Message generation unavailable, using local fallback:', err.message);
    result = fillTemplate(template, c, stageKey);
  }
  const out = document.getElementById('genOutput');
  if(out) out.value = result;
  // Baseline for diffing Marcus's edits against at Save & advance time (see
  // saveGeneratedMessage) - reset on every (re)generation so a Regenerate
  // click re-baselines against the new draft, not the one before it.
  if(window.__genCtx) window.__genCtx.originalDraft = result;
}
function fillTemplate(template, c, stageKey){
  const filled = (template || '')
    .replace(/{{first}}/g, firstName(c.name))
    .replace(/{{company}}/g, c.company)
    .replace(/{{role}}/g, c.role);
  return appendCtaNudge(filled, stageKey);
}
function regenerateMessage(cid, stageKey){
  const out = document.getElementById('genOutput');
  if(out) out.value = 'Generating...';
  generateMessageForModal(cid, stageKey);
}
async function copyGeneratedMessage(){
  const out = document.getElementById('genOutput');
  if(!out || !out.value || out.value === 'Generating...') return;
  try {
    await navigator.clipboard.writeText(out.value);
  } catch(err){
    out.focus();
    out.select();
    document.execCommand('copy');
  }
  toast('Message copied to clipboard', 'success');
}
async function saveGeneratedMessage(cid, stageKey){
  const c = state.contacts.find(x=>x.id===cid);
  const output = document.getElementById('genOutput').value;
  c.generated[stageKey] = output;
  c.notes = document.getElementById('genNotes').value;
  if(stageKey==='connect'){ c.connReqDate = c.connReqDate || isoDate(TODAY); }
  if(stageKey==='m1'){ c.connDate = c.connDate || isoDate(TODAY); c.thread.connSent = c.thread.connSent || isoDate(TODAY); c.thread.m1 = { sent: isoDate(TODAY), replied:false }; c.state='messaging'; const activityEntry = { type:'message', text:`Message 1 sent to ${c.name} (${c.company})`, date: isoDate(TODAY) }; state.activity.unshift(activityEntry); syncActivityToAirtable(activityEntry); }
  if(stageKey==='m2'){ c.thread.m2 = { sent: isoDate(TODAY), replied:false }; const activityEntry = { type:'message', text:`Message 2 sent to ${c.name} (${c.company})`, date: isoDate(TODAY) }; state.activity.unshift(activityEntry); syncActivityToAirtable(activityEntry); }
  if(stageKey==='cta'){ c.thread.cta = c.thread.cta || CTA_OPTIONS[0]; }
  const originalDraft = (window.__genCtx && window.__genCtx.originalDraft) || '';
  notifyWebhook(c);
  closeModal();
  toast('Message saved for '+c.name, 'success');
  if(window.__genCtx && window.__genCtx.onDone) window.__genCtx.onDone();
  else renderPage();

  const campaign = state.campaigns.find(x => x.id === window.__roadmapCampaignId) || activeCampaignForContact(c);
  if(!campaign) return;

  // m1/m2 are the two stages this campaign's Sequence Stage actually tracks
  // (see SEQUENCE_STAGE_NEXT in search-server.js) - for those, "Save &
  // advance" needs to do the same Airtable writes as the Today's Actions
  // "Copy & mark sent" fast-action (POST .../mark-sent): log a Touch Point,
  // advance Sequence Stage, and record Final/Original Message + Draft
  // Outcome. It used to only PATCH Next Message Draft, so a message sent
  // this way never advanced Sequence Stage or showed up in the Touch Points
  // history at all - Airtable had no record the send ever happened.
  // connect/cta aren't part of that Sequence Stage vocabulary (connection
  // requests and CTAs are tracked elsewhere), so they keep the old
  // draft-only PATCH.
  if(stageKey === 'm1' || stageKey === 'm2'){
    const draftOutcome = output === originalDraft ? 'Sent verbatim' : 'Sent edited';
    try {
      const res = await fetch(`/api/campaign/${encodeURIComponent(campaign.name)}/contacts/${cid}/mark-sent`, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ message: output, draftOutcome })
      });
      const data = await res.json();
      if(!res.ok) throw new Error(data.error || 'Request failed');
      if(window.__roadmapCampaignId === campaign.id) await loadCampaignSequenceStages(campaign);
    } catch(err){
      console.warn('Could not log sent message to Airtable:', err.message);
      toast('Saved locally, but could not log the send to Airtable: ' + err.message, 'warn');
    }
    return;
  }

  try {
    const res = await fetch(`/api/campaign/${encodeURIComponent(campaign.name)}/contacts/${cid}/draft`, {
      method: 'PATCH',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ message: output })
    });
    const data = await res.json();
    if(!res.ok || !data.success) throw new Error(data.error || 'Request failed');
  } catch(err){
    console.warn('Could not sync draft to Airtable:', err.message);
    toast('Saved locally, but could not sync draft to Airtable: ' + err.message, 'warn');
  }
}
