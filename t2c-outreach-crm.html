<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T2C Outreach</title>
<script>
(function(){
  try {
    var saved = localStorage.getItem('t2c_theme_mode');
    if(saved === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  } catch(e){}
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
:root{
  --bg:#ffffff;
  --surface:#f9f9f9;
  --surface-2:#f3f3f3;
  --card-bg:#f9f9f9;
  --border:#e8e8e8;
  --border-light:#efefef;
  --sidebar-bg:#ffffff;
  --sidebar-text:#111111;
  --sidebar-muted:#999999;
  --sidebar-active-bg:#f0f4ff;
  --sidebar-active-text:#111111;
  --sidebar-active-border:#2563eb;
  --topbar-bg:#ffffff;
  --primary:#2563eb;
  --accent:#2563eb;
  --accent-dim:rgba(37,99,235,0.08);
  --success:#1f7a4f;
  --warning:#a1701c;
  --danger:#c44a2a;
  --muted:#888888;
  --text-dim:#bdbdbd;
  --peach:#FF834C;
  --blue:#0084C5;
  --brown:#532822;
  --yellow:#FFD05D;
  --purple:#6b3fa0;
  --text:#111111;
  --font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --font-size-base:13px;
  --label-size:10px;
  --label-tracking:0.07em;
  --header-weight:600;
  --radius-card:6px;
  --radius-badge:4px;
  --shadow-sm:none;
  --shadow-lg:none;
}
html[data-theme="dark"]{
  --bg:#f5f0eb;
  --surface:#ffffff;
  --surface-2:#faf6f1;
  --card-bg:#ffffff;
  --border:#e8e0d8;
  --border-light:#efe7dd;
  --sidebar-bg:#1a1a2e;
  --sidebar-text:#ffffff;
  --sidebar-muted:rgba(255,255,255,0.5);
  --sidebar-active-bg:#ffffff;
  --sidebar-active-text:#1a1a2e;
  --sidebar-active-border:transparent;
  --topbar-bg:#ffffff;
  --primary:#1a1a2e;
  --accent:#c8a96e;
  --accent-dim:rgba(200,169,110,0.14);
  --success:#44A574;
  --warning:#e8a020;
  --danger:#c44a2a;
  --muted:#8a8070;
  --text-dim:rgba(42,38,32,0.4);
  --peach:#FF834C;
  --blue:#0084C5;
  --brown:#532822;
  --yellow:#FFD05D;
  --purple:#8b5cf6;
  --text:#2a2620;
  --font-family:'Plus Jakarta Sans',sans-serif;
  --font-size-base:14px;
  --label-size:12px;
  --label-tracking:0.02em;
  --header-weight:800;
  --radius-card:14px;
  --radius-badge:20px;
  --shadow-sm:0 2px 10px rgba(0,0,0,.06);
  --shadow-lg:0 10px 30px rgba(0,0,0,.15);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:var(--font-family);
  background:var(--bg);
  color:var(--text);
  font-size:var(--font-size-base);
  line-height:1.35;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none;}
.app{display:flex;min-height:100vh;}

/* Sidebar */
.sidebar{
  width:240px;
  min-width:240px;
  background:var(--sidebar-bg);
  color:var(--sidebar-text);
  display:flex;
  flex-direction:column;
  padding:20px 14px;
  position:sticky;
  top:0;
  height:100vh;
}
.sidebar-logo{display:flex;align-items:center;gap:10px;padding:8px 8px 4px;}
.logo-mark{width:32px;height:32px;min-width:32px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:13px;}
.logo-text{display:flex;flex-direction:column;}
.logo-name{font-size:14px;font-weight:700;color:var(--sidebar-text);line-height:1.2;}
.logo-sub{font-size:11px;color:var(--sidebar-muted);margin-top:2px;}
.sidebar-nav{display:flex;flex-direction:column;gap:2px;margin-top:24px;}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px 10px 9px;border-radius:6px;
  color:var(--sidebar-muted);
  font-weight:600;font-size:13.5px;
  cursor:pointer;
  border:none;border-left:3px solid transparent;background:none;
  width:100%;text-align:left;
}
.nav-item i{font-size:18px;}
.nav-item:hover{color:var(--sidebar-active-text);background:var(--accent-dim);}
.nav-item.active{background:var(--sidebar-active-bg);color:var(--sidebar-active-text);border-left-color:var(--sidebar-active-border);}
.sidebar-footer{margin-top:auto;padding:12px 8px;color:var(--sidebar-muted);font-size:11.5px;border-top:1px solid var(--border-light);padding-top:16px;}

/* Main */
.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  background:var(--topbar-bg);
  border-bottom:1px solid var(--border);
  padding:16px 28px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:20;
}
.topbar-title{font-size:15px;font-weight:var(--header-weight);}
.topbar-user{display:flex;align-items:center;gap:14px;}
.theme-toggle-btn{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;font-size:15px;}
.theme-toggle-btn:hover{color:var(--text);border-color:var(--accent);}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;}
.page{padding:24px 28px 60px;max-width:1500px;}

/* Cards / buttons */
.card{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius-card);padding:18px;}
.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:9px 16px;border-radius:var(--radius-badge);border:1px solid transparent;
  font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;
  transition:opacity .15s;
}
.btn:hover{opacity:0.88;}
.btn i{font-size:16px;}
.btn-primary{background:var(--primary);color:#fff;}
.btn-secondary{background:var(--surface);color:var(--text);border-color:var(--border);}
.btn-accent{background:var(--accent);color:#fff;}
.btn-danger{background:var(--danger);color:#fff;}
.btn-ghost{background:transparent;color:var(--primary);border-color:transparent;padding:6px 10px;}
.btn-sm{padding:6px 10px;font-size:12px;}
.btn:disabled{opacity:0.5;cursor:not-allowed;}

input,select,textarea{
  font-family:inherit;font-size:13px;padding:9px 11px;
  border:1px solid var(--border);border-radius:var(--radius-badge);background:var(--surface);color:var(--text);
  width:100%;
}
textarea{resize:vertical;}
label{font-size:var(--label-size);font-weight:700;color:var(--muted);display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:var(--label-tracking);}
.field{margin-bottom:14px;}
.row{display:flex;gap:12px;}
.row>*{flex:1;}

/* Dashboard */
.stat-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:22px;}
.stat-card{border-radius:var(--radius-card);padding:16px 18px;color:#fff;}
.stat-card .num{font-size:26px;font-weight:800;margin-top:6px;}
.stat-card .label{font-size:12px;font-weight:600;opacity:0.9;}
.two-col{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-bottom:16px;}
.section-title{font-size:13px;font-weight:var(--header-weight);margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.timeline{display:flex;flex-direction:column;gap:14px;}
.timeline-item{display:flex;gap:10px;}
.timeline-dot{width:26px;height:26px;min-width:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;}
.timeline-body .t-text{font-weight:600;font-size:13px;}
.timeline-body .t-time{font-size:11.5px;color:var(--muted);margin-top:2px;}
.delivery-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);}
.delivery-item:last-child{border-bottom:none;}
.mini-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px;}
.mini-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card);padding:16px;text-align:center;}
.mini-card .num{font-size:24px;font-weight:800;color:var(--primary);}
.mini-card .label{font-size:12px;color:var(--muted);margin-top:4px;font-weight:600;}
.health-stat-grid{grid-template-columns:repeat(4,1fr);}
.perf-table-wrap{overflow-x:auto;}
.perf-table{width:100%;border-collapse:collapse;font-size:12.5px;}
.perf-table th{text-align:left;padding:8px 10px;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);border-bottom:1px solid var(--border);white-space:nowrap;}
.perf-table td{padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap;}
.perf-table tr:last-child td{border-bottom:none;}
.perf-table td.perf-name{white-space:normal;font-weight:700;}
.home-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
.home-action-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card);padding:18px;cursor:pointer;transition:border-color .15s,box-shadow .15s;}
.home-action-card:hover{border-color:var(--accent);box-shadow:var(--shadow-sm);}
.home-action-icon{width:38px;height:38px;border-radius:var(--radius-card);display:flex;align-items:center;justify-content:center;font-size:17px;margin-bottom:12px;}
.home-action-title{font-weight:800;font-size:14px;margin-bottom:4px;}
.home-action-desc{font-size:12px;color:var(--muted);}
.home-grid-row{cursor:pointer;}
.home-grid-row:hover{background:var(--surface-2);}
.home-grid-row .grid-delete-btn{opacity:0;transition:opacity .15s;}
.home-grid-row:hover .grid-delete-btn{opacity:1;}
.quick-actions{display:flex;gap:12px;flex-wrap:wrap;}

/* Tags / badges */
.tag{display:inline-flex;align-items:center;padding:3px 9px;border-radius:var(--radius-badge);font-size:11px;font-weight:700;}
.tag-found{background:var(--surface-2);color:var(--muted);}
.tag-opened{background:#fde9d6;color:#a1571c;}
.tag-connected{background:#e3f5eb;color:#1f7a4f;}
.tag-messaging{background:#e2f2fa;color:#0d6a96;}
.tag-booked{background:rgba(139,92,246,0.12);color:var(--purple);}
.tag-won{background:#e3f5eb;color:#1f7a4f;}
.tag-lost{background:#fbe4e0;color:#b3413a;}
.tag-pending{background:#fdf4e6;color:#8a6a1f;}
.tag-started{background:#e2f2fa;color:#0d6a96;}
.tag-sent-positive{background:#e3f5eb;color:#1f7a4f;}
.tag-sent-neutral{background:#f1f1ee;color:#6b6558;}
.tag-sent-cold{background:#e2f2fa;color:#0d6a96;}
.tag-sent-negative{background:#fbe4e0;color:#b3413a;}
.day-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:var(--radius-badge);font-size:11px;font-weight:800;}
.day-green{background:#e3f5eb;color:#1f7a4f;}
.day-amber{background:#fdf0d9;color:#a1701c;}
.day-red{background:#fbe3dc;color:var(--danger);}

/* Grid page */
.toolbar{display:flex;gap:10px;align-items:flex-end;margin-bottom:16px;flex-wrap:wrap;}
.toolbar .field{margin-bottom:0;min-width:220px;}
.grid-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-card);background:var(--surface);}
table.grid-table{border-collapse:collapse;width:100%;min-width:820px;}
.grid-table th{background:var(--surface-2);padding:12px 14px;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:var(--label-tracking);color:var(--muted);border-bottom:1px solid var(--border);white-space:nowrap;}
.grid-table td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:top;min-width:190px;}
.grid-table tr:last-child td{border-bottom:none;}
.company-cell{font-weight:700;white-space:nowrap;}
.grid-cell{border-radius:var(--radius-badge);padding:10px;min-height:64px;}
.cell-found{background:#fdf8ef;}
.cell-opened{background:#fdf1e2;}
.cell-connected{background:#eaf7f0;}
.cell-messaging{background:#e8f4fa;}
.cell-empty{background:var(--surface-2);color:var(--muted);font-size:12px;display:flex;align-items:center;justify-content:center;min-height:64px;}
.cell-searching{background:var(--surface-2);color:var(--muted);font-size:12px;display:flex;align-items:center;justify-content:center;min-height:64px;font-style:italic;}
.cell-name{font-weight:700;font-size:13px;display:flex;align-items:center;gap:4px;}
.cell-meta{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap;}
.legend{display:flex;gap:16px;margin-top:14px;flex-wrap:wrap;}
.legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:600;}
.legend-swatch{width:12px;height:12px;border-radius:4px;}
.dropzone-upload{border:2px dashed var(--border);border-radius:var(--radius-card);padding:26px;text-align:center;color:var(--muted);margin-top:20px;background:var(--surface);transition:border-color .15s,background .15s;}
.dropzone-upload.dragover{border-color:var(--accent);background:var(--accent-dim);}
.shot-box{border:1px dashed var(--border);border-radius:var(--radius-badge);padding:10px;background:var(--surface-2);transition:border-color .15s,background .15s;}
.shot-box.dragover{border-color:var(--accent);background:var(--accent-dim);}
.shot-hint{font-size:11.5px;color:var(--muted);margin-bottom:8px;line-height:1.5;}
.shot-files{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.shot-file-chip{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-badge);padding:3px 6px 3px 10px;font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:6px;}
.shot-file-chip button{background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;line-height:1;}
.status-bar{display:flex;align-items:center;gap:8px;margin-top:16px;font-size:12px;color:var(--muted);}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--success);animation:pulse 1.6s infinite;}
@keyframes pulse{0%{opacity:1;}50%{opacity:.35;}100%{opacity:1;}}

/* Kanban / Roadmap */
.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:start;}
.kanban-col{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-card);padding:12px;min-height:200px;}
.kanban-col-header{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:13px;margin-bottom:10px;padding:0 4px;}
.kanban-col-header .count{background:var(--border);color:var(--muted);border-radius:var(--radius-badge);padding:1px 8px;font-size:11px;}
.kanban-cards{display:flex;flex-direction:column;gap:10px;min-height:60px;}
.kcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card);padding:12px;cursor:grab;}
.kcard.dragging{opacity:0.4;}
.kcard-head{display:flex;justify-content:space-between;align-items:flex-start;cursor:pointer;}
.kcard-name{font-weight:700;font-size:13.5px;}
.kcard-role{font-size:11.5px;color:var(--muted);margin-top:2px;}
.kcard-flag{margin-top:8px;background:#fbe3dc;color:var(--danger);border-radius:var(--radius-badge);padding:6px 8px;font-size:11.5px;display:flex;justify-content:space-between;align-items:center;font-weight:700;}
.thread{margin-top:12px;border-top:1px solid var(--border);padding-top:10px;display:flex;flex-direction:column;gap:10px;}
.thread-step{display:flex;flex-direction:column;gap:6px;background:var(--surface-2);border-radius:var(--radius-badge);padding:10px;}
.thread-step-head{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:12px;}
.thread-step-body{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.check-yes{color:var(--success);}
.reply-toggle{display:flex;gap:6px;}
.reply-btn{padding:4px 9px;border-radius:var(--radius-badge);border:1px solid var(--border);background:var(--surface);font-size:11px;font-weight:700;cursor:pointer;}
.reply-btn.active-yes{background:var(--success);color:#fff;border-color:var(--success);}
.reply-btn.active-no{background:var(--danger);color:#fff;border-color:var(--danger);}
.archive-box{margin-top:26px;}
.archive-toggle{cursor:pointer;font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px;color:var(--muted);}
.tp-badge{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:var(--radius-badge);font-size:10.5px;font-weight:800;background:var(--accent-dim);color:var(--accent);}
.tp-badge i{font-size:11px;}
.tp-timeline{display:flex;flex-direction:column;gap:6px;}
.tp-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-badge);padding:7px 9px;}
.tp-item-head{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;}
.tp-type{font-weight:700;}
.tp-notes{font-size:11.5px;color:var(--muted);margin-top:3px;}
.tp-form{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.tp-form input[type="date"]{width:auto;flex:none;font-size:11.5px;padding:6px 8px;}
.tp-form select{width:auto;flex:none;font-size:11.5px;padding:6px 8px;}
.tp-form input:not([type="date"]){flex:1;min-width:100px;font-size:11.5px;padding:6px 8px;}
.tp-painpoints{display:flex;flex-wrap:wrap;gap:6px 14px;margin:10px 0;padding:10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-badge);}
.todo-item{border:1px solid var(--border);border-radius:var(--radius-card);padding:14px;margin-bottom:10px;background:var(--surface);}
.todo-item:last-child{margin-bottom:0;}
.todo-item-main{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
.todo-item-name{font-weight:700;font-size:14px;}
.todo-item-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.rec-product{background:#eaf7f0;border:1px solid #c9e9d7;border-radius:var(--radius-badge);padding:8px 10px;margin-bottom:6px;}
.rec-product:last-child{margin-bottom:0;}
.rec-product-name{font-weight:700;font-size:12px;color:#1f7a4f;}
.intel-draft{background:#e2f2fa;border:1px solid #bfe0f0;border-radius:var(--radius-card);padding:12px 14px;margin-bottom:12px;}
.intel-draft:last-child{margin-bottom:0;}
.intel-draft-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.intel-draft-name{font-weight:700;font-size:13px;color:#0d6a96;}
.intel-draft-text{font-size:12.5px;white-space:pre-wrap;margin-top:8px;color:var(--text);line-height:1.5;}
.campaign-card-name{font-weight:800;font-size:14.5px;}
.campaign-status{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:var(--radius-badge);font-size:11px;font-weight:800;white-space:nowrap;}
.campaign-status-draft{background:var(--border);color:var(--muted);}
.campaign-status-active{background:#e3f5eb;color:#1f7a4f;}
.campaign-status-complete{background:#e2f2fa;color:#0d6a96;}
.campaign-status-paused{background:#fdf0d5;color:#a1731c;}
.campaign-status.clickable{cursor:pointer;}
.campaign-status.clickable:hover{filter:brightness(0.96);}
.campaign-chat{display:flex;flex-direction:column;gap:10px;max-height:340px;overflow-y:auto;padding-right:2px;}
.campaign-chat-msg{max-width:88%;padding:9px 13px;border-radius:var(--radius-card);font-size:12.5px;line-height:1.5;}
.campaign-chat-msg.assistant{background:var(--surface-2);align-self:flex-start;border-bottom-left-radius:3px;}
.campaign-chat-msg.user{background:var(--primary);color:#fff;align-self:flex-end;border-bottom-right-radius:3px;}
.campaign-chat-progress{margin-bottom:14px;}
.campaign-chat-progress-bar{background:var(--border);border-radius:var(--radius-badge);height:6px;overflow:hidden;}
.campaign-chat-progress-fill{background:var(--accent);height:100%;transition:width .3s;}
.campaign-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
.campaign-chat-input-row{display:flex;gap:8px;margin-top:14px;}
.campaign-chat-input-row input{flex:1;}
.campaign-preview-card{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-card);padding:16px;margin-top:6px;align-self:stretch;max-width:100%;}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(26,26,46,0.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card);max-width:560px;width:100%;max-height:88vh;overflow-y:auto;}
.modal-header{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.modal-header h3{font-size:15px;font-weight:var(--header-weight);}
.modal-close{cursor:pointer;color:var(--muted);font-size:20px;background:none;border:none;}
.modal-body{padding:20px 22px;}
.modal-footer{padding:16px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;}

/* Toast */
.toast-container{position:fixed;top:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:10px;}
.toast{background:var(--primary);color:#fff;padding:12px 18px;border-radius:var(--radius-card);font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:8px;animation:slideIn .2s ease;}
.toast.success{background:var(--success);}
.toast.warn{background:var(--warning);}
@keyframes slideIn{from{transform:translateX(30px);opacity:0;}to{transform:translateX(0);opacity:1;}}

/* Sequences */
.seq-tabs{display:flex;gap:8px;margin-bottom:18px;border-bottom:1px solid var(--border);}
.seq-tab{padding:10px 16px;font-weight:700;font-size:13px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;}
.seq-tab.active{color:var(--primary);border-color:var(--primary);}
.seq-header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:18px;gap:14px;flex-wrap:wrap;}
.pill{display:inline-flex;padding:4px 11px;border-radius:var(--radius-badge);background:#faf0dc;color:#8a6a1f;font-size:11.5px;font-weight:700;margin-right:6px;}
.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:0;align-items:stretch;margin-bottom:6px;}
.flow-3{grid-template-columns:repeat(3,1fr);}
.analytics-stat-grid{grid-template-columns:repeat(6,1fr);}
.flow-node{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card);position:relative;display:flex;flex-direction:column;}
.flow-node + .flow-node{margin-left:22px;}
.flow-node::before{content:'';position:absolute;left:-22px;top:50%;width:22px;height:2px;background:var(--border);}
.flow-node:first-child::before{display:none;}
.flow-node::after{content:'\2192';position:absolute;left:-20px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;}
.flow-node:first-child::after{display:none;}
.flow-node-head{padding:10px 12px;border-bottom:1px solid var(--border);border-radius:var(--radius-card) var(--radius-card) 0 0;border-top:4px solid var(--brown);}
.flow-node-head.stage-connect{border-top-color:var(--brown);}
.flow-node-head.stage-m1{border-top-color:var(--peach);}
.flow-node-head.stage-m2{border-top-color:var(--blue);}
.flow-node-head.stage-cta{border-top-color:var(--success);}
.flow-node-head .stage-label{font-weight:800;font-size:12.5px;}
.flow-node-head .stage-hint{font-size:11px;color:var(--muted);margin-top:2px;}
.flow-node-body{padding:10px;flex:1;}
.flow-node-body textarea{min-height:130px;font-size:12.5px;}
.flow-node-foot{padding:10px;border-top:1px solid var(--border);display:flex;gap:8px;}
.dropzone{margin-top:10px;background:var(--surface-2);border:1px dashed var(--border);border-radius:var(--radius-badge);padding:10px;min-height:56px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;}
.chip{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-badge);padding:6px 12px;font-size:11.5px;font-weight:700;cursor:grab;display:flex;align-items:center;gap:6px;}
.chip.dragging{opacity:0.4;}
.pipeline-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:6px;}
.pipeline-col-title{font-weight:800;font-size:12.5px;margin-bottom:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.02em;}

/* Calendar */
.cal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.cal-nav{display:flex;gap:8px;align-items:center;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;}
.cal-dow{text-align:center;font-size:11.5px;font-weight:800;color:var(--muted);padding-bottom:6px;text-transform:uppercase;}
.cal-cell{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-badge);min-height:96px;padding:8px;}
.cal-cell.empty{background:transparent;border:none;}
.cal-cell.today{border-color:var(--primary);border-width:2px;}
.cal-date{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px;}
.event-chip{background:#e3f5eb;color:#1f7a4f;border-radius:4px;padding:3px 7px;font-size:10.5px;font-weight:700;margin-bottom:4px;cursor:default;position:relative;}
.event-chip.blue{background:#e2f2fa;color:#0d6a96;}
.event-chip.peach{background:#fde4d6;color:#a1571c;}
.event-chip.grey{background:#eee9e2;color:#6b6355;}
.event-chip.purple{background:#efe4f7;color:#6b3fa0;}
.event-chip.yellow{background:#fef3d6;color:#8a6a1f;}
.event-chip.reminder-chip{background:#f1f1ee;color:#6b6558;cursor:pointer;}

/* Profile drawer (contacts + companies) */
.drawer-overlay{position:fixed;inset:0;background:rgba(26,26,46,0.25);z-index:410;}
.profile-drawer{position:fixed;top:0;right:0;height:100vh;width:440px;max-width:92vw;background:var(--surface);border-left:1px solid var(--border);box-shadow:var(--shadow-lg);overflow-y:auto;transform:translateX(100%);transition:transform .25s ease;z-index:411;padding:22px;}
.profile-drawer.open{transform:translateX(0);}
.drawer-close{position:absolute;top:16px;right:16px;cursor:pointer;font-size:20px;color:var(--muted);background:none;border:none;line-height:1;}
.drawer-avatar{width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;flex-shrink:0;}
.drawer-section{margin-top:20px;padding-top:16px;border-top:1px solid var(--border);}
.drawer-section:first-of-type{border-top:none;margin-top:16px;padding-top:0;}
.note-item{padding:8px 0;border-bottom:1px solid var(--border);font-size:12.5px;white-space:pre-wrap;}
.note-item:last-child{border-bottom:none;}
.tp-item{padding:8px 10px;border-radius:var(--radius-badge);font-size:12px;margin-bottom:6px;background:var(--surface-2);}
.tp-item.other{opacity:.75;}
.event-chip:hover .event-tooltip{display:block;}
.event-tooltip{display:none;position:absolute;bottom:120%;left:0;background:var(--primary);color:#fff;padding:8px 10px;border-radius:8px;font-size:11px;white-space:nowrap;z-index:30;font-weight:600;}

/* Analytics */
.an-stats{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:20px;}
.an-stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card);padding:14px;}
.an-stat .num{font-size:20px;font-weight:800;}
.an-stat .label{font-size:11px;color:var(--muted);font-weight:600;margin-top:2px;}
.an-stat .sub{font-size:11px;color:var(--success);font-weight:700;margin-top:2px;}
.bar-row{margin-bottom:12px;}
.bar-row-head{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;margin-bottom:5px;}
.bar-track{background:var(--border);border-radius:var(--radius-badge);height:10px;overflow:hidden;display:flex;}
.bar-fill{background:var(--primary);height:100%;}
.bar-fill.secondary{background:var(--accent);}

/* Sales tab: pipeline funnel + best-time heatmap (no Chart.js type fits either) */
.funnel-row{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
.funnel-label{width:132px;flex-shrink:0;font-size:12px;font-weight:700;}
.funnel-track{flex:1;background:var(--border);border-radius:var(--radius-badge);height:26px;position:relative;overflow:hidden;}
.funnel-fill{background:var(--blue);height:100%;display:flex;align-items:center;justify-content:flex-end;padding-right:10px;color:#fff;font-size:12px;font-weight:800;border-radius:var(--radius-badge);transition:width .3s;}
.funnel-fill.won{background:var(--success);}
.funnel-fill.lost{background:var(--danger);}
.funnel-conv{width:96px;flex-shrink:0;font-size:11px;color:var(--muted);text-align:right;}
.heatmap-grid{display:grid;grid-template-columns:70px repeat(5,1fr);gap:3px;font-size:10.5px;}
.heatmap-grid .hm-head{font-weight:700;text-align:center;color:var(--muted);padding:4px 2px;}
.heatmap-grid .hm-row-label{font-weight:700;padding:6px 4px;display:flex;align-items:center;}
.heatmap-cell{border-radius:4px;padding:6px 2px;text-align:center;font-weight:700;color:var(--primary);min-height:26px;display:flex;align-items:center;justify-content:center;}

/* Content system: signal cards + format colour-coding */
.signal-card{border:1px solid var(--border);border-radius:var(--radius-card);padding:14px;margin-bottom:10px;}
.signal-card:last-child{margin-bottom:0;}
.format-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle;}
.format-linkedin{background:#0084C5;}
.format-blog{background:#44A574;}
.format-newsletter{background:#8b5cf6;}
.cta-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);}
.cta-row:last-child{border-bottom:none;}
.count-pill{background:var(--border);color:var(--muted);border-radius:var(--radius-badge);padding:2px 10px;font-size:11.5px;font-weight:800;}
.count-pill.has{background:#e3f5eb;color:#1f7a4f;}
.analysis-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:14px;}
.analysis-block{border-radius:var(--radius-card);padding:16px;}
.analysis-block.wins{background:#eaf7f0;border:1px solid #c9e9d7;}
.analysis-block.gaps{background:#fdf1e0;border:1px solid #f5dcae;}
.analysis-block.losses{background:#fbe3dc;border:1px solid #f0c2b0;}
.analysis-block.recs{background:#e2f2fa;border:1px solid #bfe0f0;}
.analysis-block h4{display:flex;align-items:center;gap:7px;font-size:13px;margin-bottom:10px;}
.analysis-block ul{padding-left:18px;font-size:12.5px;line-height:1.6;}
.engine-run-card{background:var(--accent-dim);border-color:var(--accent);}
.engine-group-heading{font-size:12.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:26px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:7px;}
.engine-group-heading i{font-size:15px;}
.learning-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
.context-upload-grid{grid-template-columns:repeat(3,1fr);}
.learning-panel{border-radius:var(--radius-card);padding:16px;background:var(--surface-2);border:1px solid var(--border);transition:border-color .15s,background .15s;}
.learning-panel.dragover{border-color:var(--accent);background:var(--accent-dim);}
.learning-panel h4{display:flex;align-items:center;gap:7px;font-size:13px;margin-bottom:6px;}
.learning-result{margin-top:14px;font-size:12.5px;line-height:1.6;}
.learning-result h5{font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);margin:10px 0 4px;}
.learning-result ul{padding-left:18px;}
.learning-meta{font-size:11px;margin-top:10px;}

/* Settings */
.settings-section{margin-bottom:20px;}
.tag-list{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.tag-item{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-badge);padding:6px 8px 6px 14px;font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:8px;}
.tag-item button{background:none;border:none;color:var(--muted);cursor:pointer;font-size:15px;line-height:1;}
.account-row{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--border);border-radius:var(--radius-card);padding:12px 14px;margin-bottom:10px;}
.checkbox-row{display:flex;gap:14px;flex-wrap:wrap;}
.checkbox-item{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;}
.checkbox-item input{width:auto;}
.magnet-row{display:flex;align-items:center;gap:12px;border:1px solid var(--border);border-radius:var(--radius-card);padding:12px 14px;margin-bottom:10px;}
.toggle-switch{width:38px;height:22px;border-radius:20px;background:var(--border);position:relative;cursor:pointer;flex:none;}
.toggle-switch.on{background:var(--success);}
.toggle-switch .knob{width:18px;height:18px;border-radius:50%;background:#fff;position:absolute;top:2px;left:2px;transition:left .15s;}
.toggle-switch.on .knob{left:18px;}
.save-flash{color:var(--success);font-weight:700;font-size:12.5px;display:none;align-items:center;gap:6px;}
.settings-mode-row{display:flex;align-items:center;gap:12px;border:1px solid var(--border);border-radius:var(--radius-card);padding:14px 16px;margin-bottom:10px;}
.settings-mode-options{display:flex;gap:8px;margin-left:auto;}
.mode-opt-btn{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--radius-badge);border:1px solid var(--border);background:var(--surface);color:var(--muted);font-weight:700;font-size:12.5px;cursor:pointer;}
.mode-opt-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}

/* How it works */
.howto-hero{background:var(--primary);color:#fff;border-radius:var(--radius-card);padding:24px 26px;margin-bottom:20px;}
.howto-hero h2{font-size:19px;font-weight:800;margin-bottom:8px;}
.howto-hero p{color:rgba(255,255,255,0.75);font-size:13.5px;max-width:640px;line-height:1.6;}
.pipeline-visual{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:16px;}
.pipeline-visual .arrow{color:var(--muted);font-size:16px;}
.howto-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:20px;}
.howto-item{border:1px solid var(--border);border-radius:var(--radius-card);padding:18px;background:var(--surface);}
.howto-item-head{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
.howto-num{width:30px;height:30px;min-width:30px;border-radius:var(--radius-badge);background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;}
.howto-item h4{font-size:14px;font-weight:800;}
.howto-item p{font-size:12.5px;color:var(--muted);line-height:1.6;}
.howto-item ul{margin-top:8px;padding-left:18px;font-size:12.5px;color:var(--text);line-height:1.7;}
.faq-item{border-bottom:1px solid var(--border);padding:14px 0;}
.faq-item:last-child{border-bottom:none;}
.faq-item h5{font-size:13px;font-weight:800;margin-bottom:4px;}
.faq-item p{font-size:12.5px;color:var(--muted);line-height:1.6;}

/* Context menu */
.ctx-menu{position:fixed;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card);box-shadow:var(--shadow-lg);z-index:300;overflow:hidden;min-width:180px;}
.ctx-item{padding:10px 14px;font-size:12.5px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px;}
.ctx-item:hover{background:var(--surface-2);}

.muted{color:var(--muted);}
.empty-state{padding:30px;text-align:center;color:var(--muted);font-size:13px;}

/* Grid/Table view toggle + spreadsheet table */
.grid-view-toolbar{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-bottom:12px;position:relative;}
.view-toggle{display:inline-flex;border:1px solid var(--border);border-radius:var(--radius-badge);overflow:hidden;}
.view-toggle-btn{display:flex;align-items:center;gap:6px;padding:7px 13px;font-size:12px;font-weight:700;border:none;background:var(--surface);color:var(--muted);cursor:pointer;}
.view-toggle-btn+.view-toggle-btn{border-left:1px solid var(--border);}
.view-toggle-btn.active{background:var(--accent);color:#fff;}
.columns-btn-wrap{position:relative;}
.columns-dropdown{position:absolute;top:calc(100% + 6px);right:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card);box-shadow:var(--shadow-lg);padding:8px;min-width:210px;z-index:50;max-height:320px;overflow-y:auto;}
.columns-dropdown label{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;text-transform:none;letter-spacing:0;color:var(--text);padding:6px 8px;border-radius:4px;cursor:pointer;margin-bottom:0;}
.columns-dropdown label:hover{background:var(--surface-2);}
.columns-dropdown input{width:auto;}
.spreadsheet-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-card);background:var(--surface);}
table.spreadsheet-table{border-collapse:collapse;width:100%;min-width:960px;font-size:12.5px;}
.spreadsheet-table th{background:var(--surface-2);padding:9px 12px;text-align:left;font-size:var(--label-size);text-transform:uppercase;letter-spacing:var(--label-tracking);color:var(--muted);border-bottom:1px solid var(--border);border-right:1px solid var(--border-light);white-space:nowrap;cursor:pointer;user-select:none;}
.spreadsheet-table th:last-child{border-right:none;}
.spreadsheet-table th .sort-arrow{margin-left:4px;opacity:0.5;font-size:10px;}
.spreadsheet-table th.sorted .sort-arrow{opacity:1;color:var(--accent);}
.spreadsheet-table td{padding:8px 12px;border-bottom:1px solid var(--border-light);border-right:1px solid var(--border-light);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px;font-size:12.5px;}
.spreadsheet-table td:last-child{border-right:none;}
.spreadsheet-table tr:last-child td{border-bottom:none;}
.spreadsheet-table tbody tr{cursor:pointer;}
.spreadsheet-table tbody tr:hover td{background:var(--surface-2);}
.spreadsheet-table td.ss-name{font-weight:700;color:var(--text);}
.spreadsheet-table td.ss-num{text-align:right;font-variant-numeric:tabular-nums;}
.spreadsheet-table td.ss-draft{cursor:help;}

@media (max-width:1024px){
  .sidebar{width:76px;min-width:76px;padding:16px 8px;}
  .sidebar .logo-text,.sidebar .nav-item span,.sidebar-footer{display:none;}
  .nav-item{justify-content:center;}
  .stat-grid{grid-template-columns:repeat(2,1fr);}
  .two-col{grid-template-columns:1fr;}
  .mini-cards{grid-template-columns:1fr;}
  .kanban{grid-template-columns:1fr;}
  .flow{grid-template-columns:1fr;}
  .flow-3{grid-template-columns:1fr;}
  .analytics-stat-grid{grid-template-columns:repeat(2,1fr);}
  .flow-node+.flow-node{margin-left:0;margin-top:22px;}
  .flow-node::before,.flow-node::after{display:none;}
  .pipeline-grid{grid-template-columns:1fr;}
  .an-stats{grid-template-columns:repeat(2,1fr);}
  .analysis-grid{grid-template-columns:1fr;}
  .learning-grid{grid-template-columns:1fr;}
  .context-upload-grid{grid-template-columns:1fr;}
  .health-stat-grid{grid-template-columns:repeat(2,1fr);}
  .home-actions{grid-template-columns:repeat(2,1fr);}
  .howto-grid{grid-template-columns:1fr;}
}
</style>
</head>

/* ===================== PERSISTENCE (localStorage) ===================== */
/* `state` is a deep reactive proxy over `rawState` — setting or deleting any
   property anywhere in the tree (state.contacts[0].thread.cta = 'x', array
   push/splice, etc.) saves the whole app to localStorage immediately, so
   nothing needs to remember to call a save function by hand. */

const STORAGE_KEY = 't2c_state';

function persistState(){
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(rawState));
  } catch(err){
    console.warn('Could not save state to localStorage:', err.message);
  }
}

function loadPersistedState(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return false;
    const defaultSettings = rawState.settings;
    const saved = JSON.parse(raw);

    // Migrate pre-multi-grid saves (flat companies/gridColumns/companyLinkedIn,
    // no grids array yet) into a single default grid so nothing is lost.
    if(!saved.grids || !saved.grids.length){
      const migratedGridId = 'grid_wa_market_map';
      const migratedGrid = {
        id: migratedGridId,
        name: 'WA Market Map',
        companies: saved.companies || rawState.grids[0].companies,
        columns: saved.gridColumns || rawState.grids[0].columns,
        companyLinkedIn: saved.companyLinkedIn || {},
        createdAt: rawState.grids[0].createdAt,
        updatedAt: isoDate(TODAY)
      };
      saved.grids = [migratedGrid];
      saved.currentGridId = migratedGridId;
      delete saved.companies;
      delete saved.gridColumns;
      delete saved.companyLinkedIn;
      (saved.contacts || []).forEach(c => { if(!c.gridId) c.gridId = migratedGridId; });
    }

    Object.assign(rawState, saved);
    if(saved.settings){
      rawState.settings = Object.assign({}, defaultSettings, saved.settings, {
        integrations: Object.assign({}, defaultSettings.integrations, saved.settings.integrations),
        products: saved.settings.products || defaultSettings.products
      });
    }
    (rawState.contacts || []).forEach(c => { if(!c.touchPoints) c.touchPoints = []; });
    return true;
  } catch(err){
    console.warn('Could not restore saved state from localStorage:', err.message);
    return false;
  }
}

function makeReactive(target, onChange){
  if(target === null || typeof target !== 'object') return target;
  return new Proxy(target, {
    get(obj, prop, receiver){
      const value = Reflect.get(obj, prop, receiver);
      return (value !== null && typeof value === 'object') ? makeReactive(value, onChange) : value;
    },
    set(obj, prop, value, receiver){
      const result = Reflect.set(obj, prop, value, receiver);
      onChange();
      return result;
    },
    deleteProperty(obj, prop){
      const result = Reflect.deleteProperty(obj, prop);
      onChange();
      return result;
    }
  });
}

/* ===================== UTILITIES ===================== */

function daysBetween(dateStr, endStr){
  if(!dateStr) return null;
  const d1 = new Date(dateStr);
  const d2 = endStr ? new Date(endStr) : TODAY;
  return Math.max(0, Math.round((d2 - d1) / 86400000));
}
function fmtDate(dateStr){
  if(!dateStr) return '—';
  const d = new Date(dateStr);
  return d.toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'});
}
function fmtDateShort(dateStr){
  const d = new Date(dateStr);
  return d.toLocaleDateString('en-AU',{day:'numeric',month:'short'});
}
function relTime(dateStr){
  const days = daysBetween(dateStr);
  if(days === 0) return 'Today';
  if(days === 1) return 'Yesterday';
  return days + ' days ago';
}
function firstName(name){ return name.split(' ')[0]; }
function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,9); }
function esc(str){ return (str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function toast(msg, type){
  const c = document.getElementById('toastContainer');
  const el = document.createElement('div');
  el.className = 'toast' + (type ? ' '+type : '');
  const icon = type==='success' ? 'ti-circle-check' : type==='warn' ? 'ti-alert-triangle' : 'ti-bell';
  el.innerHTML = '<i class="ti '+icon+'"></i><span>'+esc(msg)+'</span>';
  c.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(),300); }, 3400);
}

function dayBadgeClass(days){
  if(days === null) return 'day-green';
  if(days < 7) return 'day-green';
  if(days <= 9) return 'day-amber';
  return 'day-red';
}

function getRoadmapColumn(c){
  if(c.thread.booked) return 'booked';
  if(c.state === 'messaging') return 'messaging';
  if(c.state === 'connected') return 'made';
  return 'pending';
}

function getPendingDays(c){
  if(c.connReqDate) return daysBetween(c.connReqDate);
  return daysBetween(c.foundDate);
}

/* ===================== GRIDS ===================== */
// Each grid is a standalone company x job-title matrix (its own companies,
// columns, and companyLinkedIn map). Contacts stay in the single global
// state.contacts array, each tagged with gridId - Dashboard, Roadmap,
// Sequences, Campaigns, Calendar, Analytics and Intelligence all keep
// working across every contact regardless of which grid it came from.

function currentGrid(){
  return state.grids.find(g => g.id === state.currentGridId) || state.grids[0];
}

function gridContacts(gridId){
  return state.contacts.filter(c => c.gridId === gridId);
}

function gridNameForContact(contact){
  const grid = state.grids.find(g => g.id === contact.gridId);
  return grid ? grid.name : '';
}

function allGridColumns(){
  const set = new Set();
  state.grids.forEach(g => (g.columns || []).forEach(c => set.add(c)));
  return Array.from(set);
}

function touchGrid(gridId){
  const grid = state.grids.find(g => g.id === gridId);
  if(grid) grid.updatedAt = isoDate(TODAY);
}

function createGrid(name){
  const grid = { id: uid('grid'), name, companies: [], columns: [], companyLinkedIn: {}, createdAt: isoDate(TODAY), updatedAt: isoDate(TODAY) };
  state.grids.push(grid);
  return grid;
}

function resolveGridIdByName(name){
  if(!name) return state.grids[0] ? state.grids[0].id : null;
  let grid = state.grids.find(g => g.name.toLowerCase() === name.toLowerCase());
  if(!grid) grid = createGrid(name);
  return grid.id;
}

function openGrid(gridId){
  window.__gridReturnTo = null;
  state.currentGridId = gridId;
  navigate('grid');
}

// Same as openGrid, but remembers which campaign's Grid tab to return to
// when the back button on the Grid page is used, instead of always going Home.
function openGridFromCampaign(gridId, campaignId){
  window.__gridReturnTo = { campaignId };

function gridBackAction(){

    openCampaignDetail(returnTo.campaignId, 'grid');

  }
}

function gridStatus(grid){
  return gridContacts(grid.id).length ? 'Active' : 'Setup';
}

function confirmDeleteGrid(gridId){
  const grid = state.grids.find(g => g.id === gridId);
  if(!grid) return;
  const body = `<p style="font-size:13px;">Delete "${esc(grid.name)}"? This will remove the grid and all its data from the app. This cannot be undone.</p>`;
  const footer = `
    <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary" id="confirmDeleteGridBtn" style="background:var(--danger);border-color:var(--danger);" onclick="deleteGridConfirmed('${gridId}')"><i class="ti ti-trash"></i> Delete</button>
  `;
  openModal(`Delete "${esc(grid.name)}"`, body, footer);
}

async function deleteGridConfirmed(gridId){
  const grid = state.grids.find(g => g.id === gridId);
  if(!grid) return;
  const btn = document.getElementById('confirmDeleteGridBtn');
  if(btn){ btn.disabled = true; btn.innerHTML = '<i class="ti ti-loader-2"></i> Deleting...'; }
  try {
    const contactNames = gridContacts(gridId).map(c => c.name);
    // Only delete Companies not shared with another grid - Airtable has no
    // per-grid concept, so this is the only place that knows the answer.
    const otherGridCompanies = new Set();
    state.grids.forEach(g => { if(g.id !== gridId) g.companies.forEach(c => otherGridCompanies.add(c)); });
    const companyNames = grid.companies.filter(c => !otherGridCompanies.has(c));

    const res = await fetch('/api/grid', {
      method: 'DELETE',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ contactNames, companyNames })
    });
    const json = await res.json();
    if(!res.ok || !json.success) throw new Error(json.error || 'Delete failed');

    state.contacts = state.contacts.filter(c => c.gridId !== gridId);
    state.grids = state.grids.filter(g => g.id !== gridId);
    closeModal();
    toast(`Grid "${grid.name}" deleted`, 'success');
    renderPage();
  } catch(err){
    toast('Could not delete grid: ' + err.message, 'warn');
    if(btn){ btn.disabled = false; btn.innerHTML = '<i class="ti ti-trash"></i> Delete'; }
  }
}

// Context-tab data (window.__contextData) and its logger are shared by two
// spots that are never visible at once: the Intelligence > Context sub-tab
// (untagged) and a campaign's Intelligence tab (tagged via
// window.__ctxCampaignTag, set by renderCampaignIntelligenceTab). Both call
// into the same renderContext()/loadContextData() functions below.
//
// Loads (or reloads) window.__contextData if it's missing, or if it was
// loaded for a different campaign scope than the one currently active -
// Sequence Stage is per-campaign now, so switching from one campaign's
// Intelligence tab to another's (or to/from the untagged top-level Context
// tab) needs a fresh fetch, not the previous campaign's cached rows.
function ensureContextDataLoaded(){
  if(window.__contextDataLoading) return;
  const wantId = window.__ctxCampaignTag ? window.__ctxCampaignTag.id : null;
  // __contextDataScopeId is undefined until the first load attempt ever
  // finishes, so this is also true on that very first call.
  const scopeChanged = window.__contextDataScopeId !== wantId;
  if(scopeChanged || (!window.__contextData && !window.__contextDataError)) loadContextData();
}

function afterRender(page){
  if(page === 'campaigns' && window.__campaignView === 'detail'){
    const tab = window.__campaignDetailTab;
    const campaign = state.campaigns.find(c => c.id === window.__campaignDetailId);
    if(tab === 'roadmap') initRoadmapDrag();
    if(tab === 'intelligence') ensureContextDataLoaded();
    if(tab === 'analytics' && campaign) initCampaignAnalyticsCharts(campaign);
    if(tab === 'sales' && campaign){
      if(window.__salesData === undefined) loadSalesOverview(campaign);
      if(window.__salesConversionIntel === undefined) loadConversionIntelligence(campaign);
      if(window.__salesData && window.__salesConversionIntel) initSalesConversionCharts(window.__salesConversionIntel);
    }
    if(tab === 'content' && campaign){
      if(window.__campaignContentSignals === undefined) loadCampaignContentSignals(campaign);
      if(window.__campaignContentDrafts === undefined) loadCampaignContentDrafts(campaign);
    }
  }
  if(page === 'intelligence' && (window.__intelSubTab||'intelligence') === 'context') ensureContextDataLoaded();
  if(page === 'calendar'){
    if(window.__calendarEvents === undefined) loadCalendarEvents();
    if(window.__repsCache === undefined) loadRepsCache();
  }
  if(page === 'content'){
    const tab = window.__contentSubTab || 'signals';
    if(tab === 'signals' && window.__contentSignals === undefined) loadContentSignals();
    if((tab === 'drafts' || tab === 'calendar') && window.__contentDrafts === undefined) loadContentDrafts();
    if(tab === 'performance' && window.__contentPerformance === undefined) loadContentPerformance();
    if(tab === 'performance' && window.__marcusJobStatus === undefined) checkMarcusJobStatus();
    if(tab === 'settings' && window.__contentSettings === undefined) loadContentSettings();
  }
  if(page === 'home' && window.__homeContentSignals === undefined) loadHomeContentSignals();
}

/* ===================== CONTEXT PAGE ===================== */
// Marcus's primary data input hub. Fetches live from Airtable into
// window.__contextData rather than the reactive state/localStorage model -
// AI Summary, Conversation Context, Sequence Stage and Next Message Draft
// are Airtable-only fields with no equivalent on state.contacts, and
// folding them into the core contact model would be a much larger, riskier
// change than this feature asked for. Journey Stage - which still drives
// Dashboard prioritisation - is never touched by anything in this tab.
// Sequence Stage/Next Message Draft are per-campaign (Campaign Contacts
// junction table, not a field on Contacts) - window.__ctxCampaignTag says
// which campaign's row loadContextData() should fetch, and both come back
// blank when it's null (the untagged top-level Context tab).

const TOUCH_POINT_TYPE_OPTIONS_CONTEXT = ['Coffee','Call','LinkedIn DM','Email','Event','Other'];
const HISTORICAL_UPLOAD_TAGS = ['Past Customer','Past Deal','Conversation History','General Background'];

// silent=true refreshes window.__contextData in the background with no
// re-render at all, so a just-shown result panel (e.g. "3 contacts
// updated") isn't immediately wiped out by a full-page loading skeleton.
// Used after every Section 1/2/3 action; the plain (non-silent) call is
// only for the tab's initial load and the error-state Retry button.
//
// Sequence Stage is now per-campaign (Campaign Contacts junction table),
// so every load is scoped to whichever campaign is active per
// window.__ctxCampaignTag (null for the untagged top-level Context tab).
// window.__contextDataScopeId records which scope the last load attempt
// was for (success or failure) so ensureContextDataLoaded() below can tell
// a stale cross-campaign cache apart from a genuinely fresh one and reload
// rather than reuse it.
async function loadContextData(silent){
  const scopeCampaignId = window.__ctxCampaignTag ? window.__ctxCampaignTag.id : null;
  if(!silent){
    window.__contextDataLoading = true;
    window.__contextDataError = null;
    renderPage();
  }
  try {
    const qs = scopeCampaignId ? '?campaignId='+encodeURIComponent(scopeCampaignId)+'&campaignName='+encodeURIComponent(window.__ctxCampaignTag.name) : '';
    const res = await fetch('/api/context/data'+qs);
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || ('Request failed with status '+res.status));
    window.__contextData = data;
  } catch(err){
    if(!silent) window.__contextDataError = err.message;
    else console.warn('Silent context data refresh failed:', err.message);
  }
  // Recorded after every attempt, success or failure, so ensureContextDataLoaded()
  // can tell "this scope already failed, wait for a manual Retry" apart from
  // "a different scope just became active, worth trying fresh" - both leave
  // window.__contextData falsy, so that alone can't distinguish them.
  if(!silent) window.__contextDataScopeId = scopeCampaignId;
  if(!silent){
    window.__contextDataLoading = false;
    renderPage();
  }
}

function renderContext(){
  if(window.__contextDataLoading){
    return '<div class="card"><div class="muted"><i class="ti ti-loader-2"></i> Loading context data from Airtable...</div></div>';
  }
  if(window.__contextDataError){
    return `<div class="card"><div class="muted">Could not load context data: ${esc(window.__contextDataError)}</div><button class="btn btn-secondary btn-sm" style="margin-top:10px;" onclick="loadContextData()"><i class="ti ti-refresh"></i> Retry</button></div>`;
  }
  if(!window.__contextData){
    return '<div class="card"><div class="empty-state">Loading...</div></div>';
  }
  const campaignTag = window.__ctxCampaignTag;
  return `
  <div class="section-title" style="font-size:20px;margin-bottom:2px;">${campaignTag ? 'Intelligence' : 'Context'}</div>
  <div class="muted" style="margin-bottom:14px;">Marcus's primary data input hub - log touch points, upload context, and keep AI Summaries current.${campaignTag ? ` Everything logged here also tags the record with the <strong>${esc(campaignTag.name)}</strong> campaign, so it shows up at account level and pre-loads intelligence for future similar campaigns.` : ''}</div>
  ${campaignTag ? `<div class="card" style="margin-bottom:16px;background:#e2f2fa;border-color:#bfe0f0;"><span class="pill" style="background:#fff;"><i class="ti ti-rocket" style="font-size:11px;"></i> ${esc(campaignTag.name)}</span> <span class="muted" style="font-size:12px;">Everything saved below is tagged to this campaign.</span></div>` : ''}
  <div id="ctxUpdatingIndicator" class="muted" style="font-size:11.5px;margin-bottom:14px;display:none;"><i class="ti ti-loader-2"></i> Updating AI summaries...</div>
  ${renderTouchPointLogger()}
  ${renderContextUploadSection()}
  ${renderHistoricalUploadSection()}
  `;
}

function initContextLogger(){

function renderTouchPointLogger(){
  if(!window.__ctxLogger) initContextLogger();
  const logger = window.__ctxLogger;
  const data = window.__contextData;
  const contactsForCompany = logger.companyId ? data.contacts.filter(c => c.companyId === logger.companyId) : [];

  return `
  <div class="card" style="margin-bottom:16px;">
    <div class="section-title"><i class="ti ti-message-2"></i> Touch Point Logger</div>
    <div class="toolbar">
      <div class="field"><label>Company</label>
        <select id="ctxCompany" onchange="setContextCompany(this.value)">

          ${data.companies.map(c=>`<option value="${esc(c.id)}" ${logger.companyId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}
        </select>
      </div>
      ${logger.companyId ? `
      <div class="field"><label>Touch point type</label>
        <select id="ctxTouchType" onchange="setContextTouchType(this.value)">
          ${TOUCH_POINT_TYPE_OPTIONS_CONTEXT.map(t=>`<option ${logger.touchType===t?'selected':''}>${t}</option>`).join('')}

      <div class="field"><label>Date</label><input type="date" id="ctxDate" value="${esc(logger.date)}" onchange="setContextDate(this.value)"></div>

        `).join('') : '<span class="muted" style="font-size:12px;">No contacts on file for this company.</span>'}

function renderContextDebriefArea(logger){
  if(logger.mode === 'loading') return '<div class="muted" style="margin-top:12px;font-size:12.5px;"><i class="ti ti-loader-2"></i> Getting questions from Claude...</div>';
  if(logger.mode === 'debrief'){
    return `
    <div style="margin-top:14px;">
      ${logger.debriefQuestions.map((q,i) => `<div class="field"><label>${esc(q)}</label><textarea id="ctxDebriefAnswer-${i}" rows="2"></textarea></div>`).join('')}
      <button class="btn btn-primary btn-sm" onclick="saveContextTouchPoint()" ${logger.saving?'disabled':''}><i class="ti ti-device-floppy"></i> ${logger.saving?'Saving...':'Save touch point'}</button>
    </div>`;
  }
  if(logger.mode === 'notes'){
    return `
    <div style="margin-top:14px;">
      <div class="field"><label>Notes</label><textarea id="ctxNotes" rows="3"></textarea></div>
      <button class="btn btn-primary btn-sm" onclick="saveContextTouchPoint()" ${logger.saving?'disabled':''}><i class="ti ti-device-floppy"></i> ${logger.saving?'Saving...':'Save touch point'}</button>
    </div>`;

function setContextCompany(companyId){
  const l = window.__ctxLogger;
  l.companyId = companyId;
  l.contactIds = [];
  l.mode = null;
  renderPage();
}
function setContextTouchType(type){
  window.__ctxLogger.touchType = type;
  window.__ctxLogger.mode = null;
  renderPage();
}
function setContextOtherType(val){ window.__ctxLogger.otherType = val; }
function setContextDate(val){ window.__ctxLogger.date = val; }
function toggleContextContact(contactId){
  const l = window.__ctxLogger;
  const idx = l.contactIds.indexOf(contactId);
  if(idx === -1) l.contactIds.push(contactId); else l.contactIds.splice(idx,1);
  l.mode = null;
  renderPage();
}
function skipContextDebrief(){
  window.__ctxLogger.mode = 'notes';
  renderPage();
}

async function getContextDebriefQuestions(){
  const l = window.__ctxLogger;
  l.mode = 'loading';
  renderPage();
  try {
    const res = await fetch('/api/context/debrief-questions', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ contactId: l.contactIds[0] })
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || ('Request failed with status '+res.status));
    l.debriefQuestions = data.questions || [];
    l.mode = l.debriefQuestions.length ? 'debrief' : 'notes';
  } catch(err){
    toast('Could not get AI questions: ' + err.message, 'warn');
    l.mode = 'notes';
  }
  renderPage();
}

async function saveContextTouchPoint(){
  const l = window.__ctxLogger;
  const data = window.__contextData;
  const company = data.companies.find(c => c.id === l.companyId);
  const contacts = data.contacts.filter(c => l.contactIds.includes(c.id));
  if(!company || !contacts.length) return;

  const type = l.touchType === 'Other' ? (l.otherType.trim() || 'Other') : l.touchType;
  const date = l.date || isoDate(TODAY);

  let notes = '';
  if(l.mode === 'debrief'){
    notes = l.debriefQuestions.map((q,i) => {
      const ans = (document.getElementById('ctxDebriefAnswer-'+i)?.value || '').trim();
      return ans ? `Q: ${q}\nA: ${ans}` : '';
    }).filter(Boolean).join('\n\n');
  } else {
    notes = (document.getElementById('ctxNotes')?.value || '').trim();
  }

  l.saving = true;
  renderPage();

  try {
    const res = await fetch('/api/airtable/touchpoint', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        contactRecordIds: l.contactIds,
        companyRecordId: l.companyId,
        type, date, notes,
        campaignId: window.__ctxCampaignTag ? window.__ctxCampaignTag.id : undefined,
        campaignName: window.__ctxCampaignTag ? window.__ctxCampaignTag.name : undefined
      })
    });
    const result = await res.json();
    if(!res.ok) throw new Error(result.error || ('Request failed with status '+res.status));

    toast('Touch point logged for ' + contacts.map(c=>c.name).join(', '), 'success');

    showContextUpdatingIndicator();
    fetch('/api/context/update-summaries', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        contactIds: l.contactIds, companyId: l.companyId,
        campaignName: window.__ctxCampaignTag ? window.__ctxCampaignTag.name : undefined
      })
    }).then(() => { hideContextUpdatingIndicator(); loadContextData(true); })
      .catch(() => hideContextUpdatingIndicator());

    initContextLogger();
    renderPage();
  } catch(err){
    l.saving = false;
    toast('Could not save touch point: ' + err.message, 'warn');
    renderPage();
  }
}

// Shared drag-and-drop wiring for the Context tab upload panels below.
// Dropping a file onto the panel puts it into the panel's real hidden
// <input type=file> via DataTransfer and fires 'change' on it, so it goes
// through the exact same handler as clicking "Upload" - no separate
// drop-specific logic to keep in sync with the click-to-upload path.
function dropZoneAttrs(inputId){
  return `ondragover="event.preventDefault();this.classList.add('dragover');" ondragleave="this.classList.remove('dragover');" ondrop="event.preventDefault();this.classList.remove('dragover');handleContextDropZoneFiles('${inputId}',event.dataTransfer);"`;
}
function handleContextDropZoneFiles(inputId, dataTransfer){
  const input = document.getElementById(inputId);
  if(!input || !dataTransfer || !dataTransfer.files || !dataTransfer.files.length) return;
  input.files = dataTransfer.files;
  input.dispatchEvent(new Event('change', { bubbles:true }));
}

function handleContextConnectionsCsv(event){
  const file = event.target.files && event.target.files[0];
  event.target.value = '';
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const rows = parseCsv(String(reader.result));
    if(rows.length < 2){ toast('That CSV looks empty', 'warn'); return; }
    runContextConnectionsImport(rows);
  };
  reader.onerror = () => toast('Could not read that file', 'warn');
  reader.readAsText(file);
}

async function runContextConnectionsImport(rows){
  const resultEl = document.getElementById('ctxConnectionsResult');
  const headers = rows[0].map(h => h.trim().toLowerCase());
  const firstIdx = headers.indexOf('first name');
  const lastIdx = headers.indexOf('last name');
  if(firstIdx === -1 || lastIdx === -1){
    toast('CSV must have "First Name" and "Last Name" columns', 'warn');
    return;
  }

  const contacts = window.__contextData.contacts;
  const byName = {};
  contacts.forEach(c => {
    const key = c.name.trim().toLowerCase();
    (byName[key] = byName[key] || []).push(c);
  });

  const toUpdate = [];
  const flagged = [];
  let skippedOtherStage = 0;

  rows.slice(1).forEach(row => {
    const first = (row[firstIdx]||'').trim();
    const last = (row[lastIdx]||'').trim();
    if(!first && !last) return;
    const fullName = (first+' '+last).trim();
    const matches = byName[fullName.toLowerCase()] || [];
    if(matches.length !== 1){
      flagged.push(`Could not match "${esc(fullName)}" from CSV. No contact updated.`);
      return;
    }
    const contact = matches[0];
    // hasPendingConnection is account-wide (any campaign, not just the
    // active one) - Connection Requested -> Connected is shared across
    // every campaign a contact is in, per Campaign Contacts.
    if(!contact.hasPendingConnection){
      skippedOtherStage++;
      return;
    }
    toUpdate.push(contact);
  });

  if(resultEl) resultEl.innerHTML = `<div class="muted"><i class="ti ti-loader-2"></i> Updating ${toUpdate.length} contact${toUpdate.length===1?'':'s'}...</div>`;

  let updatedCount = 0;
  for(const contact of toUpdate){
    try {
      const res = await fetch('/api/context/contact-fields', {
        method: 'PATCH',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ contactId: contact.id, journeyStage: 'Connected', sequenceStage: 'Connected' })
      });
      if(res.ok) updatedCount++;
    } catch(err){
      console.warn('Connection update failed for', contact.name, err.message);
    }
  }

  if(resultEl){
    resultEl.innerHTML = `
      <p style="font-size:12.5px;font-weight:700;">${updatedCount} contact${updatedCount===1?'':'s'} updated &middot; ${flagged.length} not found</p>
      ${skippedOtherStage ? `<p class="muted" style="font-size:11.5px;margin-top:4px;">${skippedOtherStage} matched but not in "Connection Requested" - skipped.</p>` : ''}
      ${flagged.length ? `<ul style="padding-left:18px;font-size:11.5px;margin-top:6px;">${flagged.map(f=>`<li>${f}</li>`).join('')}</ul>` : ''}
    `;
  }
  toast(`${updatedCount} contacts updated from CSV`, updatedCount ? 'success' : 'warn');
  if(updatedCount) loadContextData(true);
}

function handleContextScreenshotUpload(event){
  const file = event.target.files && event.target.files[0];
  event.target.value = '';
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const match = String(reader.result).match(/^data:([^;]+);base64,(.*)$/);
    if(match){
      window.__ctxScreenshotImage = { mediaType: match[1], base64: match[2] };
      const el = document.getElementById('ctxScreenshotPreview');
      if(el) el.innerHTML = `<span class="tag tag-connected">${esc(file.name)} attached</span> <button class="btn btn-ghost btn-sm" onclick="clearContextScreenshot()"><i class="ti ti-x"></i></button>`;
    }
  };
  reader.readAsDataURL(file);
}
function clearContextScreenshot(){
  window.__ctxScreenshotImage = null;
  const el = document.getElementById('ctxScreenshotPreview');
  if(el) el.innerHTML = '';
}

async function runContextParseScreenshot(){
  const image = window.__ctxScreenshotImage;
  const text = (document.getElementById('ctxScreenshotText')?.value || '').trim();
  if(!image && !text){ toast('Upload a screenshot or paste some text first', 'warn'); return; }

  const resultEl = document.getElementById('ctxScreenshotResult');
  if(resultEl) resultEl.innerHTML = '<div class="muted"><i class="ti ti-loader-2"></i> Reading with Claude...</div>';

  try {
    const res = await fetch('/api/context/parse-screenshot', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        image: image || undefined, text: image ? undefined : text,
        campaignId: window.__ctxCampaignTag ? window.__ctxCampaignTag.id : undefined,
        campaignName: window.__ctxCampaignTag ? window.__ctxCampaignTag.name : undefined
      })
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || ('Request failed with status '+res.status));

    if(!data.success){
      if(resultEl) resultEl.innerHTML = `<p class="muted" style="font-size:12.5px;color:#b3413a;">${esc(data.reason)}</p>`;
      return;
    }

    if(resultEl){
      resultEl.innerHTML = `
        <p style="font-size:12.5px;"><strong>${esc(data.contactName)}</strong> ${data.replied ? '<span class="tag tag-connected">Replied</span>' : '<span class="tag tag-opened">No reply yet</span>'}</p>
        <p style="font-size:12px;margin-top:6px;">${esc(data.messageSummary)}</p>
        ${data.campaignScoped
          ? `<p class="muted" style="font-size:11.5px;margin-top:8px;">Sequence stage in this campaign: ${esc(data.previousStage||'—')} &rarr; ${esc(data.newStage||'—')}</p>`
          : `<p class="muted" style="font-size:11.5px;margin-top:8px;">No campaign active, so sequence stage wasn't advanced - open this from a campaign's Intelligence tab to track that.</p>`}
        ${data.draft ? `<div style="margin-top:10px;"><div style="font-weight:700;font-size:11.5px;">Next message draft</div><textarea readonly rows="4" style="margin-top:4px;">${esc(data.draft)}</textarea></div>` : ''}
      `;
    }
    toast('Conversation parsed and contact updated', 'success');
    const textEl = document.getElementById('ctxScreenshotText');
    if(textEl) textEl.value = '';
    clearContextScreenshot();
    loadContextData(true);
  } catch(err){
    if(resultEl) resultEl.innerHTML = `<p class="muted" style="font-size:12.5px;">Could not parse: ${esc(err.message)}</p>`;
    toast('Could not parse screenshot: ' + err.message, 'warn');
  }
}

function handleContextHistoricalFile(event){
  const file = event.target.files && event.target.files[0];
  event.target.value = '';
  if(!file) return;

  if(file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf')){
    const reader = new FileReader();
    reader.onload = () => {
      const match = String(reader.result).match(/^data:([^;]+);base64,(.*)$/);
      if(match){
        window.__ctxHistFile = { mediaType: 'application/pdf', base64: match[2], name: file.name };
        renderContextHistFilePreview();
      }
    };
    reader.readAsDataURL(file);
  } else {
    const reader = new FileReader();
    reader.onload = () => {
      const textEl = document.getElementById('ctxHistText');
      if(textEl) textEl.value = String(reader.result);
      window.__ctxHistFile = null;
      renderContextHistFilePreview(file.name + ' loaded into the text field');
    };
    reader.readAsText(file);
  }
}
function renderContextHistFilePreview(label){
  const el = document.getElementById('ctxHistFilePreview');
  if(!el) return;
  if(window.__ctxHistFile){
    el.innerHTML = `<span class="tag tag-connected">${esc(window.__ctxHistFile.name)} attached</span> <button class="btn btn-ghost btn-sm" onclick="clearContextHistFile()"><i class="ti ti-x"></i></button>`;
  } else if(label){
    el.innerHTML = `<span class="muted">${esc(label)}</span>`;
  } else {
    el.innerHTML = '';

}
function clearContextHistFile(){

function computeHealth(){
  const withBoth = state.contacts.filter(c=>c.connReqDate && c.connDate);
  const avgDays = withBoth.length ? Math.round(withBoth.reduce((s,c)=>s+daysBetween(c.connReqDate,c.connDate),0)/withBoth.length) : 0;
  let sent=0, replied=0;
  state.contacts.forEach(c=>{
    if(c.thread.m1){ sent++; if(c.thread.m1.replied) replied++; }
    if(c.thread.m2){ sent++; if(c.thread.m2.replied) replied++; }
  });
  const replyRate = sent ? Math.round(replied/sent*100) : 0;
  const connectedCount = state.contacts.filter(c=>c.connDate).length;
  const conversionRate = connectedCount ? Math.round(state.bookings.length/connectedCount*100) : 0;
  return { avgDays, replyRate, conversionRate };
}

function lastTouchPointDate(c){
  const points = c.touchPoints || [];
  if(!points.length) return null;
  return points.reduce((latest, tp) => (!latest || new Date(tp.date) > new Date(latest)) ? tp.date : latest, null);
}

/*
Today's actions rules, checked in priority order (first match wins, one action per contact):
- Booked, delivery >30 days ago, no touch point since delivery -> "Post-delivery check-in"
- Booked but not yet due for the above, no touch point in 21 days -> "Re-engage"
- Connected, no message sent yet, connected >2 days ago -> "Send first message"
- Messaging, last message got a reply but the next stage hasn't been sent in >3 days -> "Reply back"
- Messaging, last message sent has no reply after >5 days -> "Follow up"
- Connected/messaging, no touch point in 21 days -> "Re-engage"
*/
function activeCampaignForContact(c){
  return state.campaigns.find(camp => camp.status === 'Live' && campaignContacts(camp).some(cc => cc.id === c.id)) || null;
}

function getContactAction(c){
  const campaign = activeCampaignForContact(c);
  const natural = getNaturalContactAction(c);
  if(natural){
    if(campaign) natural.campaignName = campaign.name;
    return natural;
  }
  if(campaign){
    const lastTouch = lastTouchPointDate(c);
    const nextStage = c.thread.m2 ? 'cta' : (c.thread.m1 ? 'm2' : (c.connDate ? 'm1' : 'connect'));
    return { type:'Campaign outreach', stage: nextStage, daysSinceTouch: lastTouch ? daysBetween(lastTouch) : null, campaignName: campaign.name };
  }
  return null;
}

function getNaturalContactAction(c){
  if(c.state === 'found' || c.state === 'opened') return null;

  const lastTouch = lastTouchPointDate(c);
  const daysSince = (dateStr) => dateStr ? daysBetween(dateStr) : null;

  if(c.thread.booked){
    if(c.thread.bookedDate){
      const daysSinceDelivery = daysSince(c.thread.bookedDate);
      const touchSinceDelivery = lastTouch && new Date(lastTouch) >= new Date(c.thread.bookedDate);
      if(daysSinceDelivery !== null && daysSinceDelivery > 30 && !touchSinceDelivery){
        return { type:'Post-delivery check-in', stage:'cta', daysSinceTouch: lastTouch ? daysSince(lastTouch) : daysSinceDelivery };
      }
    }
    const days = daysSince(lastTouch || c.thread.bookedDate || c.connDate || c.foundDate);
    if(days !== null && days > 21){
      return { type:'Re-engage', stage:'cta', daysSinceTouch: days };
    }
    return null;
  }

  if(c.state === 'connected' && !c.thread.m1){
    const days = daysSince(c.connDate);
    if(days !== null && days > 2){
      return { type:'Send first message', stage:'m1', daysSinceTouch: lastTouch ? daysSince(lastTouch) : days };
    }
  }

  if(c.state === 'messaging'){
    if(c.thread.m2 && c.thread.m2.replied && !c.thread.cta){
      const days = daysSince(c.thread.m2.sent);
      if(days !== null && days > 3) return { type:'Reply back', stage:'cta', daysSinceTouch: days };
    } else if(c.thread.m1 && c.thread.m1.replied && !c.thread.m2){
      const days = daysSince(c.thread.m1.sent);
      if(days !== null && days > 3) return { type:'Reply back', stage:'m2', daysSinceTouch: days };
    }

    const lastStep = c.thread.m2 || c.thread.m1;
    if(lastStep && !lastStep.replied){
      const days = daysSince(lastTouch || lastStep.sent);
      if(days !== null && days > 5){
        const nextStage = c.thread.m2 ? 'cta' : 'm2';
        return { type:'Follow up', stage: nextStage, daysSinceTouch: days };
      }
    }
  }

  const days = daysSince(lastTouch || c.connDate || c.foundDate);
  if(days !== null && days > 21){
    const nextStage = c.thread.m2 ? 'cta' : (c.thread.m1 ? 'm2' : 'm1');
    return { type:'Re-engage', stage: nextStage, daysSinceTouch: days };
  }

  return null;
}

function computeTodaysActions(){
  return state.contacts
    .map(c => { const action = getContactAction(c); return action ? { contact:c, ...action } : null; })
    .filter(Boolean)
    .sort((a,b) => (b.daysSinceTouch||0) - (a.daysSinceTouch||0));
}

async function generateContactBrief(cid){
  const c = state.contacts.find(x => x.id === cid);
  const action = (window.__todaysActions || {})[cid];
  if(!c || !action) return;

  const method = recommendedMethodForAction(action);
  const panel = document.getElementById('brief-' + cid);
  const btn = document.getElementById('briefBtn-' + cid);
  if(!panel) return;
  const original = btn ? btn.innerHTML : '';
  if(btn){ btn.disabled = true; btn.innerHTML = '<i class="ti ti-loader-2"></i> Generating...'; }
  panel.style.display = 'block';
  panel.innerHTML = '<div class="muted" style="font-size:12.5px;"><i class="ti ti-loader-2"></i> Generating brief...</div>';

  const touchHistory = (c.touchPoints || []).slice().sort((x,y)=>new Date(x.date)-new Date(y.date))
    .map(tp => `${tp.date} — ${tp.type}${tp.communicationMethod ? ' ('+tp.communicationMethod+')' : ''}: ${tp.notes || 'no notes'}${(tp.painPoints && tp.painPoints.length) ? ' [pain points: '+tp.painPoints.join(', ')+']' : ''}`)
    .join('\n') || 'No touch points logged yet.';

  const isMessage = method === 'LinkedIn message' || method === 'Email';

  const prompt = `Contact: ${c.name}, ${c.role} at ${c.company}.
Journey stage: ${c.state}.
Pain points on file: ${(c.painPoints && c.painPoints.length) ? c.painPoints.join(', ') : 'none logged'}.
Today's recommended action: ${action.type}.
Recommended communication method: ${method}.

Full touch point history:
${touchHistory}

${isMessage
  ? `Write a ready-to-send ${method === 'LinkedIn message' ? 'LinkedIn message' : 'email'} for this contact given the above. ${voiceRulesText()} Return only the message text.`
  : `Write a short prep brief for a ${method.toLowerCase()} with this contact. Return 3-4 bullet points covering what to cover, what to reference from the history above, and what to avoid. Return only the bullet points, one per line, each starting with "- ".`}`;

  const result = await callAI(prompt, 400, () => localBriefFallback(c, action, method, isMessage));

  window.__contactBriefs = window.__contactBriefs || {};
  window.__contactBriefs[cid] = { result, isMessage, method };
  panel.innerHTML = renderBriefPanelHtml(cid, result, isMessage);
  if(btn){ btn.disabled = false; btn.innerHTML = original; }

  const date = isoDate(TODAY);
  const tpType = TOUCH_POINT_TYPES.includes(method) ? method : 'LinkedIn message';
  if(!c.touchPoints) c.touchPoints = [];
  c.touchPoints.push({ id: uid('tp'), date, type: tpType, communicationMethod: method, notes: 'AI-generated brief', painPoints: [], aiBrief: result });

  fetch('/api/airtable/touchpoint', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      contactName: c.name,
      company: c.company,
      date,
      type: tpType,
      notes: 'AI-generated brief',
      outcome: 'No reply',
      communicationMethod: method,
      aiBrief: result
    })
  }).catch(err => console.warn('Airtable brief sync failed:', err.message));

  toast('Brief generated', 'success');
}

function localBriefFallback(c, action, method, isMessage){
  const painPoint = (c.painPoints && c.painPoints[0]) || null;
  if(isMessage){
    const opener = painPoint
      ? `Last time we touched on ${painPoint.toLowerCase()}, keen to hear how that is tracking.`
      : `Keen to hear how things are tracking on your end.`;
    return `Hi ${firstName(c.name)}, following up given where things are with ${c.company}. ${opener}\n\nMarcus`;
  }
  return [
    `- Cover: where things stand since the last touch point and next steps for ${c.company}.`,
    `- Reference: ${painPoint ? painPoint.toLowerCase() : 'their current priorities'}, which came up in an earlier conversation.`,
    `- Avoid: being pushy about next steps if they have not engaged much yet.`,
    `- Aim: leave with a clear next step or date to follow up.`
  ].join('\n');
}

function renderBriefPanelHtml(cid, text, isMessage){
  return `
    <div class="intel-draft">
      <div class="intel-draft-head">
        <div class="intel-draft-name">${isMessage ? 'Drafted message' : 'Call brief'}</div>
        <button class="btn btn-secondary btn-sm" onclick="copyContactBrief('${cid}')"><i class="ti ti-copy"></i> Copy</button>
      </div>
      <div class="intel-draft-text">${esc(text)}</div>
    </div>`;
}

async function copyContactBrief(cid){
  const entry = window.__contactBriefs && window.__contactBriefs[cid];
  if(!entry || !entry.result) return;
  try {
    await navigator.clipboard.writeText(entry.result);
  } catch(err){
    const ta = document.createElement('textarea');
    ta.value = entry.result;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  }
  toast('Brief copied to clipboard', 'success');
}

function toggleGridColumn(gridId, key){
