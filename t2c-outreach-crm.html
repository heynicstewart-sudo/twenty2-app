/* Touch point type -> spreadsheet count-column mapping. There's no literal
   "Coffee" or "DM" entry in TOUCH_POINT_TYPES, so this maps the closest
   existing types: LinkedIn message -> DMs, Meeting -> Coffee (in-person). */
function touchPointCounts(c){
  const tps = c.touchPoints || [];
  const count = type => tps.filter(t => t.type === type).length;
  return { dms: count('LinkedIn message'), calls: count('Call'), coffee: count('Meeting'), email: count('Email') };
}

function journeyStageLabel(c){
  if(c.thread && c.thread.booked) return 'Booked';
  return (c.state || '').charAt(0).toUpperCase() + (c.state || '').slice(1);
}

function lastContactDate(c){
  const dates = [];
  (c.touchPoints||[]).forEach(tp => { if(tp.date) dates.push(tp.date); });
  if(c.thread){
    if(c.thread.connSent) dates.push(c.thread.connSent);
    if(c.thread.m1 && c.thread.m1.sent) dates.push(c.thread.m1.sent);
    if(c.thread.m2 && c.thread.m2.sent) dates.push(c.thread.m2.sent);
  }
  if(c.connDate) dates.push(c.connDate);
  if(!dates.length) return null;
  return dates.reduce((max, d) => (!max || new Date(d) > new Date(max)) ? d : max, null);
}

function nextMessageDraftFor(c){
  const order = c.thread && !c.thread.connSent ? 'connect'
    : (c.thread && !(c.thread.m1 && c.thread.m1.sent)) ? 'm1'
    : (c.thread && !(c.thread.m2 && c.thread.m2.sent)) ? 'm2'
    : 'cta';
  if(c.generated && c.generated[order]) return c.generated[order];
  const stages = ['cta','m2','m1','connect'];
  for(const key of stages){ if(c.generated && c.generated[key]) return c.generated[key]; }
  return '';
}

// Resolves the single campaign a grid is linked to (if any) and kicks off
// loading its Sequence Stage / Connection Sent Date maps (Airtable's
// Campaign Contacts - see loadCampaignSequenceStages) if they aren't cached
// yet. Called once per render from renderGridViewArea, so both view modes
// share one fetch instead of each cell/row triggering its own -
// gridSequenceStageMap and gridConnectionSentDateFor below just read
// whatever's cached so far.
function ensureGridCampaignDataLoaded(gridId){
  const camps = campaignsForGrid(gridId);
  if(camps.length !== 1) return null;
  const campaign = camps[0];
  if(!window.__campaignSequenceStages || !window.__campaignSequenceStages[campaign.id]) loadCampaignSequenceStages(campaign);
  return campaign;
}

// Sequence Stage is per-campaign (Airtable-backed), matching the convention
// used by the Roadmap tab (campaignSequenceStageFor / loadCampaignSequenceStages).
// Only resolvable here when the grid is linked to exactly one campaign.
function gridSequenceStageMap(gridId){
  const camps = campaignsForGrid(gridId);
  if(camps.length !== 1) return null;
  const campaign = camps[0];
  return window.__campaignSequenceStages ? (window.__campaignSequenceStages[campaign.id] || {}) : {};
}

// Sequence Stage "Excluded" means a contact was deliberately removed from
// this grid's linked campaign (see confirmSkipContact/handleSkipContact).
// That used to only splice the contact out of state.contacts client-side,
// so it silently reappeared in the grid after the next
// hydrateGridsFromAirtable/page refresh since Airtable's Contacts row (and
// the contact itself) still exists - only its per-campaign Sequence Stage
// is "Excluded". Filtering on the live Airtable-backed map here (same one
// gridCellState/gridSequenceStageMap read) keeps it hidden across refreshes.
// Only resolvable when the grid is linked to exactly one campaign, same
// convention as gridSequenceStageMap - a grid with no single linked
// campaign has no "Excluded" concept to filter on.
function isContactExcludedFromGrid(c){
  const seqMap = gridSequenceStageMap(c.gridId);
  if(!seqMap) return false;
  return seqMap[c.name.trim().toLowerCase()] === 'Excluded';
}

function spreadsheetRowData(c, gridId, seqMap){
  const counts = touchPointCounts(c);
  const last = lastContactDate(c);
  const draft = nextMessageDraftFor(c);
  return {
    contact: c,
    name: c.name,
    company: c.company,
    title: c.role,
    journeyStage: journeyStageLabel(c),
    sequenceStage: seqMap ? (seqMap[c.name.trim().toLowerCase()] || '') : '',
    touchPoints: (c.touchPoints||[]).length,
    lastContact: last,
    lastContactDisplay: last ? fmtDate(last) : '—',
    nextDraft: draft,
    nextDraftDisplay: draft ? (draft.length > 60 ? esc(draft.slice(0,60))+'…' : esc(draft)) : '—',
    dms: counts.dms, calls: counts.calls, coffee: counts.coffee, email: counts.email
  };
}

function sortSpreadsheet(gridId, key){
  const current = window.__spreadsheetSort;
  if(current && current.gridId === gridId && current.key === key){
    current.dir = current.dir === 'asc' ? 'desc' : 'asc';
  } else {
    window.__spreadsheetSort = { gridId, key, dir: 'asc' };
  }
  renderPage();
}

function renderContactSpreadsheet(grid){
  const contacts = gridContacts(grid.id).filter(c => !isContactExcludedFromGrid(c));
  const visibleKeys = new Set(gridVisibleColumns(grid.id));
  const columns = SPREADSHEET_COLUMNS.filter(c => visibleKeys.has(c.key));
  const seqMap = gridSequenceStageMap(grid.id);
  let rows = contacts.map(c => spreadsheetRowData(c, grid.id, seqMap));

  const sort = window.__spreadsheetSort;
  if(sort && sort.gridId === grid.id){
    const col = SPREADSHEET_COLUMNS.find(c => c.key === sort.key);
    rows = rows.slice().sort((a,b) => {
      let av = a[sort.key], bv = b[sort.key];
      if(col && col.date){ av = av ? new Date(av).getTime() : -Infinity; bv = bv ? new Date(bv).getTime() : -Infinity; }
      else if(col && col.numeric){ av = av || 0; bv = bv || 0; }
      else { av = (av||'').toString().toLowerCase(); bv = (bv||'').toString().toLowerCase(); }
      if(av < bv) return sort.dir === 'asc' ? -1 : 1;
      if(av > bv) return sort.dir === 'asc' ? 1 : -1;
      return 0;
    });
  }

  if(!columns.length) return '<div class="empty-state">No columns selected — use Columns to pick some.</div>';
  if(!contacts.length) return '<div class="empty-state">No contacts in this grid yet.</div>';

  const campaignName = currentGridCampaignName();

  return `
  <div class="spreadsheet-wrap">
    <table class="spreadsheet-table">
      <thead><tr>
        ${columns.map(c => {
          const isSorted = sort && sort.gridId === grid.id && sort.key === c.key;
          const arrow = isSorted ? (sort.dir === 'asc' ? '▲' : '▼') : '▲';
          return `<th class="${isSorted?'sorted':''}" onclick="sortSpreadsheet('${grid.id}','${c.key}')">${esc(c.label)}<span class="sort-arrow">${arrow}</span></th>`;
        }).join('')}
      </tr></thead>
      <tbody>
        ${rows.map(row => `
          <tr onclick="openContactDrawer('${esc(row.name)}', ${campaignName ? `'${esc(campaignName)}'` : 'null'})">
            ${columns.map(c => {
              if(c.key === 'name') return `<td class="ss-name">${esc(row.name)}</td>`;
              if(c.key === 'nextDraft') return `<td class="ss-draft" title="${esc(row.nextDraft || '')}">${row.nextDraftDisplay}</td>`;
              if(c.numeric) return `<td class="ss-num">${row[c.key]}</td>`;
              if(c.key === 'lastContact') return `<td>${row.lastContactDisplay}</td>`;
              return `<td>${esc((row[c.key]||'—').toString())}</td>`;
            }).join('')}
          </tr>
        `).join('')}
      </tbody>
    </table>
  </div>
  `;
}

// Ignores a contact whose Sequence Stage is "Excluded" (see
// isContactExcludedFromGrid) so that company/role slot reads as unfilled -
// lets runDailySearch, which decides which cells to search off of
// !findContact(...), attempt a replacement instead of treating the excluded
// row as still occupying the pair. The Excluded person themselves stays
// hidden too (same contract renderGridCell/renderContactSpreadsheet rely on)
// since callers here never see them at all.
// Every non-excluded contact sharing this exact (company, role) slot - a
// company can have more than one contact for the same role (e.g. two Change
// Managers at BHP from an Apollo import), so this is an array, not a single
// match. renderCompanyRows below gives each one its own grid row instead of
// silently hiding all but one.
function contactsForCell(company, role){
  const gridId = currentGrid().id;
  return state.contacts.filter(c => c.gridId === gridId && c.company === company && c.role === role && !isContactExcludedFromGrid(c));
}

function findContact(company, role){
  return contactsForCell(company, role)[0];
}

// Mirrors gridSequenceStageMap's single-linked-campaign resolution, but for
// Connection Sent Date instead of Sequence Stage - used by the Grid page's
// day badge (see gridCellDays below). Kept separate from
// campaignConnectionSentDateFor (used by the Roadmap) since that one reads
// window.__roadmapCampaignId, a campaign-scoped Roadmap concept the Grid
// page doesn't have; this resolves the campaign from the grid itself. Pure
// read, same as gridSequenceStageMap - loading is triggered once per render
// by ensureGridCampaignDataLoaded (see renderGridViewArea), not per cell.
function gridConnectionSentDateFor(gridId, contactName){
  const camps = campaignsForGrid(gridId);
  if(camps.length !== 1) return null;
  const campaign = camps[0];
  const map = window.__campaignConnectionSentDates && window.__campaignConnectionSentDates[campaign.id];
  return map ? (map[contactName.trim().toLowerCase()] || null) : null;
}

// 'found'/'opened' predate a connection request ever going out, so the Grid
// day badge for those still shows days-in-pipeline (days since found).
// Everything from 'connectionPending' onward has an actual Connection Sent
// Date (in Airtable, once the grid's linked campaign's Campaign Contacts
// have loaded - see gridConnectionSentDateFor - falling back to local
// thread/connReqDate state for a grid not linked to exactly one campaign).
const CONNECTION_SENT_STATES = ['connectionPending','connected','messaging','booked'];

function gridCellDays(c){
  const effectiveState = (c.thread && c.thread.booked) ? 'booked' : c.state;
  if(!CONNECTION_SENT_STATES.includes(effectiveState)) return daysBetween(c.foundDate);
  const airtableDate = gridConnectionSentDateFor(c.gridId, c.name);
  if(airtableDate) return daysBetween(airtableDate);
  if(c.thread && c.thread.connSent) return daysBetween(c.thread.connSent);
  if(c.connReqDate) return daysBetween(c.connReqDate);
  return daysBetween(c.foundDate);
}

// Campaign Contacts' Sequence Stage (Airtable) is the source of truth for
// where a contact actually is - normalized here to the Grid's own cell-*/
// tag-* vocabulary (found/connectionPending/connected/messaging/booked).
// Covers the DM-screenshot flow's richer "Pending Reply MN"/"Ready for
// Message N+1" labels (search-server.js SEQUENCE_STAGE_ADVANCE) as
// "messaging" too. Returns null for a stage with no sensible mapping
// (Excluded, Timed Out, or none loaded yet) so callers fall back to c.state.
function sequenceStageToGridState(stage){
  if(!stage) return null;
  if(stage === 'Connected') return 'connected';
  if(stage === 'Connection Pending') return 'connectionPending';
  if(stage === 'Found' || stage === 'Connection Requested') return 'found';
  if(/^Message \d Sent$/.test(stage) || /^Pending Reply/.test(stage) || /^Ready for Message/.test(stage)) return 'messaging';
  return null;
}

// Grid cell status badge/colour - was reading c.state alone, which only
// ever reflects Contacts.Journey Stage as of hydration (see
// JOURNEY_STAGE_TO_STATE) and local client-side mutations, so editing
// Sequence Stage directly in Airtable's Campaign Contacts had no path to
// the Grid view at all, even after a hard refresh. Now prefers the grid's
// linked campaign's live Sequence Stage (same map gridConnectionSentDateFor
// already reads for the day badge), falling back to c.state when the grid
// isn't linked to exactly one campaign or the contact has no Campaign
// Contacts row yet.
function gridCellState(c){
  if(c.thread && c.thread.booked) return 'booked';
  const seqMap = gridSequenceStageMap(c.gridId);
  const seqStage = seqMap ? seqMap[c.name.trim().toLowerCase()] : null;
  return sequenceStageToGridState(seqStage) || c.state;
}

function renderGridCell(company, role, index){
  const c = contactsForCell(company, role)[index || 0];
  if(!c){
    return `<td><div class="cell-empty" data-company="${esc(company)}" data-role="${esc(role)}">No match yet</div></td>`;
  }
  const days = gridCellDays(c);
  const effectiveState = gridCellState(c);
  const cellClass = 'cell-'+effectiveState;
  const stateTagClass = 'tag-'+effectiveState;
  const stateLabel = effectiveState;
  return `<td>
    <div class="grid-cell ${cellClass}">
      <div class="cell-name" style="cursor:pointer;" onclick="openContactDrawer('${esc(c.name)}', ${currentGridCampaignName() ? `'${esc(currentGridCampaignName())}'` : 'null'})">${esc(c.name)}${c.url ? ` <a href="${esc(c.url)}" target="_blank" rel="noopener" onclick="handleContactLinkedInOpened('${c.id}', event)" title="Open on LinkedIn" style="margin-left:2px;color:var(--blue);"><i class="ti ti-brand-linkedin"></i></a>` : ''}</div>
      <div class="cell-meta">
        <span class="day-badge ${dayBadgeClass(days)}">${days}d</span>
        <span class="tag ${stateTagClass}">${stateLabel}</span>
        <button class="btn btn-ghost btn-sm" style="padding:2px 6px;" onclick="handleSkipContact('${c.id}', event)" title="Skip - exclude from this campaign"><i class="ti ti-player-skip-forward"></i></button>
      </div>
    </div>
  </td>`;
}

function addGridColumn(){
  const grid = currentGrid();
  const input = document.getElementById('newColInput');
  const val = input.value.trim();
  if(!val) return;
  if(grid.columns.includes(val)){ toast('Column already exists','warn'); return; }
  grid.columns.push(val);
  touchGrid(grid.id);
  renderPage();
  toast('Column "'+val+'" added','success');
}

function addGridCompany(){
  const grid = currentGrid();
  const input = document.getElementById('newCompanyInput');
  const val = input.value.trim();
  if(!val) return;
  if(grid.companies.includes(val)){ toast('Company already on the grid','warn'); return; }
  grid.companies.push(val);
  touchGrid(grid.id);
  renderPage();
  toast('"'+val+'" added to the grid','success');

  {
    const companyFields = { name: val, gridName: grid.name };

// Same write addGridCompany makes by hand above, but silent and a no-op if
// the company is already on the grid - used by the Apollo import flow so a
// contact whose company isn't on the grid yet still lands in the right row
// immediately, instead of only existing in state.contacts with nowhere to
// display until someone adds the company manually.
function ensureGridCompany(grid, companyName){
  if(!companyName || grid.companies.includes(companyName)) return;
  grid.companies.push(companyName);
  touchGrid(grid.id);

  const companyFields = { name: companyName, gridName: grid.name };
  if(airtableWriteGuard('company', companyFields, ['name'])){
    fetch('/api/airtable/company', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(companyFields)
    }).catch(err => console.warn('Airtable company sync failed:', err.message));
  }
}

function companyLinkedInUrl(company){
  const linkMap = currentGrid().companyLinkedIn;
  return (linkMap[company] && linkMap[company].linkedinUrl) || '';
}

function renderCompanyLinkedInIcon(company){
  const url = companyLinkedInUrl(company);
  if(!url) return '';
  return ` <a href="${esc(url)}" target="_blank" rel="noopener" title="Open ${esc(company)} on LinkedIn" style="margin-left:4px;color:var(--blue);"><i class="ti ti-brand-linkedin"></i></a>`;
}

async function findCompanyLinkedInPages(){
  const grid = currentGrid();
  const btn = document.getElementById('findCompanyLinkedInBtn');
  const original = btn.innerHTML;
  btn.disabled = true;

  let foundCount = 0;
  let searchedCount = 0;
  for(let i=0; i<grid.companies.length; i++){
    const company = grid.companies[i];
    if(grid.companyLinkedIn[company] && grid.companyLinkedIn[company].linkedinUrl) continue;
    searchedCount++;
    btn.innerHTML = `<i class="ti ti-loader-2"></i> Searching ${i+1}/${grid.companies.length}...`;
    try {
      const res = await fetch(`/api/search-company-linkedin?company=${encodeURIComponent(company)}`);
      const data = await res.json();
      if(data.found && data.linkedinUrl){
        grid.companyLinkedIn[company] = { linkedinUrl: data.linkedinUrl, linkedinSlug: data.slug || null };
        foundCount++;
      }
    } catch(err){
      console.warn('Company LinkedIn search failed for', company, err.message);
    }
    if(i < grid.companies.length - 1) await sleep(300);
  }

  btn.disabled = false;
  btn.innerHTML = original;

  if(searchedCount === 0){
    toast('Every company already has a LinkedIn page on file', 'warn');
    return;
  }

  renderPage();
  toast(`Found LinkedIn pages for ${foundCount} of ${searchedCount} companies searched`, foundCount ? 'success' : 'warn');
}

async function fetchLinkedInOrgIds(){
  const grid = currentGrid();
  const btn = document.getElementById('orgIdBtn');
  const companies = Object.keys(grid.companyLinkedIn).filter(name => grid.companyLinkedIn[name] && grid.companyLinkedIn[name].linkedinSlug);
  if(!companies.length){ toast('No companies with a LinkedIn slug on file yet - run "Find LinkedIn pages" first', 'warn'); return; }

  const original = btn.innerHTML;
  btn.disabled = true;

  let foundCount = 0;
  for(let i=0; i<companies.length; i++){
    const companyName = companies[i];
    const slug = grid.companyLinkedIn[companyName].linkedinSlug;
    btn.innerHTML = `<i class="ti ti-loader-2"></i> Looking up ${i+1}/${companies.length}...`;
    try {
      const res = await fetch(`/api/enrich/linkedin-org-id?slug=${encodeURIComponent(slug)}`);
      const data = await res.json();
      if(data.found && data.orgId){
        const linkedinFields = { companyName, linkedinSlug: data.orgId };
        if(airtableWriteGuard('company/linkedin', linkedinFields, ['companyName','linkedinSlug'])){
          await fetch('/api/airtable/company/linkedin', {

          });
          foundCount++;
        }
      }
    } catch(err){
      console.warn('LinkedIn org ID lookup failed for', companyName, err.message);
    }
    if(i < companies.length - 1) await sleep(500);
  }

  btn.disabled = false;
  btn.innerHTML = original;
  toast(`Found LinkedIn org IDs for ${foundCount} of ${companies.length} companies`, foundCount ? 'success' : 'warn');
}

function parseCsv(text){
  const rows = [];
  let row = [];
  let field = '';
  let inQuotes = false;
  for(let i=0; i<text.length; i++){
    const ch = text[i];
    if(inQuotes){
      if(ch === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      } else {
        field += ch;
      }
      continue;
    }
    if(ch === '"'){ inQuotes = true; }
    else if(ch === ','){ row.push(field); field = ''; }
    else if(ch === '\n'){ row.push(field); rows.push(row); row = []; field = ''; }
    else if(ch === '\r'){ /* skip, \n handles the line break */ }
    else { field += ch; }
  }
  if(field !== '' || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.some(f => f.trim() !== ''));
}

function handleCsvImport(event){
  const file = event.target.files && event.target.files[0];
  event.target.value = '';
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const rows = parseCsv(String(reader.result));
    if(rows.length < 1){ toast('That CSV looks empty', 'warn'); return; }
    openCsvColumnModal(rows);
  };
  reader.onerror = () => toast('Could not read that file', 'warn');
  reader.readAsText(file);
}

function openCsvColumnModal(rows){
  const headers = rows[0];
  const dataRows = rows.slice(1);
  window.__csvImportRows = dataRows;
  const optionsHtml = headers.map((h,i) => `<option value="${i}">${esc(h.trim() || 'Column '+(i+1))}</option>`).join('');
  const body = `
    <div class="field">
      <label>Which column contains the company names?</label>
      <select id="csvCompanyColumn">
        ${optionsHtml}
      </select>
    </div>
    <div class="field">
      <label>Which column contains the job title?</label>
      <select id="csvContactColumn">
        <option value="">— None —</option>
        ${optionsHtml}
      </select>
    </div>
    <p class="muted" style="font-size:12px;">${dataRows.length} row${dataRows.length===1?'':'s'} found in this file.</p>
  `;
  const footer = `
    <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary" onclick="confirmCsvImport()"><i class="ti ti-check"></i> Import companies</button>
  `;
  openModal('Import companies from CSV', body, footer);
}

async function confirmCsvImport(){
  const grid = currentGrid();
  const colIdx = parseInt(document.getElementById('csvCompanyColumn').value);
  const jobTitleColValue = document.getElementById('csvContactColumn').value;
  const jobTitleColIdx = jobTitleColValue !== '' ? parseInt(jobTitleColValue) : null;
  const rows = window.__csvImportRows || [];
  const seen = new Set(grid.companies.map(c => c.toLowerCase()));
  const seenColumns = new Set(grid.columns.map(c => c.toLowerCase()));
  const newCompanies = [];
  const newColumns = [];
  rows.forEach(r => {
    const val = (r[colIdx] || '').trim();
    if(val){
      const key = val.toLowerCase();
      if(!seen.has(key)){
        seen.add(key);
        grid.companies.push(val);
        newCompanies.push(val);
      }
    }

    if(jobTitleColIdx === null) return;
    const jobTitle = (r[jobTitleColIdx] || '').trim();
    if(!jobTitle) return;
    const titleKey = jobTitle.toLowerCase();
    if(seenColumns.has(titleKey)) return;
    seenColumns.add(titleKey);
    grid.columns.push(jobTitle);
    newColumns.push(jobTitle);
  });
  const addedCount = newCompanies.length;
  const addedColumnsCount = newColumns.length;
  if(addedCount || addedColumnsCount) touchGrid(grid.id);
  closeModal();
  if(addedCount || addedColumnsCount) renderPage();
  const parts = [];
  if(addedCount) parts.push(addedCount + ' compan' + (addedCount===1?'y':'ies'));
  if(addedColumnsCount) parts.push(addedColumnsCount + ' job title column' + (addedColumnsCount===1?'':'s'));
  toast(parts.length ? parts.join(' and ') + ' added from CSV' : 'Nothing new to add from CSV', parts.length ? 'success' : 'warn');

  // Same Airtable write addGridCompany() does for a single manually-added
  // company (POST /api/airtable/company with Grid Name), just sequenced
  // with a small delay between each - a CSV can add far more companies at
  // once than the single-company input ever would, so firing them all in
  // parallel risks tripping Airtable's rate limit.
  for(let i=0; i<newCompanies.length; i++){
    const csvCompanyFields = { name: newCompanies[i], gridName: grid.name };
    if(!airtableWriteGuard('company', csvCompanyFields, ['name'])) continue;
    try {
      await fetch('/api/airtable/company', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(csvCompanyFields)
      });
    } catch(err){
      console.warn('Airtable company sync failed for', newCompanies[i], err.message);
    }
    if(i < newCompanies.length - 1) await sleep(250);
  }
}

// "Add contact" modal (Grid toolbar) - lets someone add a contact to the
// current grid by hand instead of waiting on Run daily search to find one.
// Two save paths share createManualGridContact below; the difference is
// only whether enrichContact's underlying research call also runs.
function openAddContactModal(){
  const grid = currentGrid();
  const body = `
    <div class="field"><label>Name</label><input id="addContactName" placeholder="e.g. Jane Smith"></div>
    <div class="field"><label>Job title</label><input id="addContactRole" placeholder="e.g. Transformation Lead" list="addContactRoleOptions"></div>
    <datalist id="addContactRoleOptions">${grid.columns.map(c => `<option value="${esc(c)}">`).join('')}</datalist>
    <div class="field"><label>Company</label><input id="addContactCompany" placeholder="e.g. BHP" list="addContactCompanyOptions"></div>
    <datalist id="addContactCompanyOptions">${grid.companies.map(c => `<option value="${esc(c)}">`).join('')}</datalist>

    <p class="muted" style="font-size:12px;">"Search for details" saves the contact, then runs the same research enrichment used elsewhere in the app (needs a LinkedIn URL). "Save manually" just saves what you've typed, no research.</p>

  const footer = `

    <button class="btn btn-primary" id="addContactSearchBtn" onclick="searchContactDetailsConfirmed()"><i class="ti ti-search"></i> Search for details</button>
  `;

}

// Shared by both modal actions below - builds the local contact object
// (same shape applyGridSearchResult uses for a grid-search match) and syncs
// it to Airtable via the existing per-contact upsert (syncContactToAirtable),
// same as every other place a contact enters this app. apolloTitle is
// optional - only the Apollo import flow passes it (Apollo's own verbose
// title, kept separate from `role`, which is the grid column/searched job
// title written to the real Job Title field - see confirmApolloImport).
function createManualGridContact(name, role, company, linkedinUrl, apolloTitle){
  const grid = currentGrid();
  const seqId = role === 'Digital and Tech' ? 'digitalTech' : 'seniorLeaders';
  const contact = {
    id: uid('c'), gridId: grid.id, name, company, role, url: linkedinUrl,
    seqId, state:'found', foundDate: isoDate(TODAY), connReqDate:null, connDate:null, notes:'',
    thread:{ connSent:null, m1:null, m2:null, cta:null, booked:false }, generated:{}, touchPoints:[],
    apolloTitle: apolloTitle || ''
  };
  state.contacts.push(contact);
  touchGrid(grid.id);
  syncContactToAirtable(contact);
  return contact;
}

function readAddContactFields(){
  return {
    name: document.getElementById('addContactName').value.trim(),
    role: document.getElementById('addContactRole').value.trim(),
    company: document.getElementById('addContactCompany').value.trim(),
    url: document.getElementById('addContactUrl').value.trim()
  };
}

function saveManualContactConfirmed(){
  const { name, role, company, url } = readAddContactFields();
  if(!name || !company){ toast('Name and company are required', 'warn'); return; }

  createManualGridContact(name, role, company, url);
  closeModal();
  renderPage();
  toast(name+' added', 'success');
}

// Same research call enrichContact() makes for an already-saved contact
// (see that function below) - just fired right after this one is created
// instead of from its own drawer button. The contact is synced to Airtable
// first so POST /api/enrich/contact's own best-effort persist-back-to-
// Airtable step (it looks the contact up by name) finds a record to attach
// the profile to.
async function searchContactDetailsConfirmed(){
  const { name, role, company, url } = readAddContactFields();
  if(!name || !company){ toast('Name and company are required', 'warn'); return; }
  if(!url){ toast('A LinkedIn URL is required to search for details', 'warn'); return; }

  const btn = document.getElementById('addContactSearchBtn');
  if(btn){ btn.disabled = true; btn.innerHTML = '<i class="ti ti-loader-2"></i> Searching...'; }

  const contact = createManualGridContact(name, role, company, url);

  try {
    const res = await fetch('/api/enrich/contact', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ linkedinUrl: url, name, company })
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || ('Request failed with status '+res.status));

    window.__enrichmentProfiles = window.__enrichmentProfiles || {};
    window.__enrichmentProfiles[contact.id] = data.profile;
    contact.enrichment = data.profile;
    toast(name+' added and enriched', 'success');
  } catch(err){
    console.warn('Enrichment failed:', err.message);
    toast(name+' added, but enrichment failed: ' + err.message, 'warn');
  }

  closeModal();
  renderPage();
  openContactDrawer(name, currentGridCampaignName());
}

/* ---- Search Apollo modal (Grid toolbar) - prospecting search against the
   Apollo people database, distinct from the single-person Serper lookup
   ("Run daily search"/"Search for details" above). Results are reviewed
   and selectively imported via the same createManualGridContact used by
   the manual "Add contact" modal, so an imported contact behaves exactly
   like one typed in by hand - same local shape, same Airtable sync. ---- */

function openApolloSearchModal(){
  window.__apolloResults = [];
  const body = `
    <div class="field"><label>Job title</label><input id="apolloJobTitle" placeholder="e.g. Transformation Lead, Head of Delivery"></div>
    <div class="field"><label>Location</label><input id="apolloLocation" placeholder="e.g. Perth, Australia; Sydney, Australia"></div>
    <div class="field"><label>Industry / keywords</label><input id="apolloKeywords" placeholder="e.g. mining, energy"></div>
    <p class="muted" style="font-size:11.5px;margin-bottom:10px;">Job title accepts a comma-separated list. For multiple locations, separate them with semicolons.</p>
    <button class="btn btn-primary btn-sm" id="apolloSearchBtn" onclick="runApolloSearch()"><i class="ti ti-search"></i> Search Apollo</button>
    <div id="apolloResultsArea" style="margin-top:14px;"></div>
  `;
  const footer = `
    <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary" onclick="confirmApolloImport()"><i class="ti ti-download"></i> Import selected</button>
  `;
  openModal('Search Apollo', body, footer);
}

async function runApolloSearch(){
  const jobTitle = (document.getElementById('apolloJobTitle')?.value || '').trim();
  const location = (document.getElementById('apolloLocation')?.value || '').trim();
  const keywords = (document.getElementById('apolloKeywords')?.value || '').trim();
  if(!jobTitle && !location && !keywords){ toast('Add at least a job title, location or keyword to search', 'warn'); return; }

  const btn = document.getElementById('apolloSearchBtn');
  if(btn){ btn.disabled = true; btn.innerHTML = '<i class="ti ti-loader-2"></i> Searching...'; }
  const resultsEl = document.getElementById('apolloResultsArea');
  if(resultsEl) resultsEl.innerHTML = '<div class="muted"><i class="ti ti-loader-2"></i> Searching Apollo...</div>';

  try {
    const res = await fetch('/api/apollo/search-contacts', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ jobTitle, location, keywords })
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || ('Request failed with status '+res.status));

    window.__apolloResults = data.results || [];
    // Kept for confirmApolloImport - the grid column/Job Title an imported
    // contact should get is what was searched for (e.g. "Change Manager"),
    // not Apollo's own verbose title per-result (see apolloTitle below).
    window.__apolloSearchedJobTitle = jobTitle;
    renderApolloResults();
  } catch(err){
    if(resultsEl) resultsEl.innerHTML = `<p class="muted" style="font-size:12.5px;">Could not search Apollo: ${esc(err.message)}</p>`;
    toast('Apollo search failed: ' + err.message, 'warn');
  } finally {
    if(btn){ btn.disabled = false; btn.innerHTML = '<i class="ti ti-search"></i> Search Apollo'; }
  }
}

function renderApolloResults(){
  const el = document.getElementById('apolloResultsArea');
  if(!el) return;
  const results = window.__apolloResults || [];
  if(!results.length){ el.innerHTML = '<p class="muted" style="font-size:12.5px;">No results. Try broadening the search.</p>'; return; }
  el.innerHTML = `
    <label class="checkbox-item" style="margin-bottom:8px;">
      <input type="checkbox" id="apolloSelectAll" onchange="toggleApolloSelectAll(this.checked)"><span>Select all (${results.length})</span>
    </label>
    <div style="max-height:280px;overflow-y:auto;">
      ${results.map((r,i) => `
        <label class="checkbox-item" style="align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--border);font-weight:400;">
          <input type="checkbox" class="apollo-result-checkbox" value="${i}" style="margin-top:3px;">
          <span>
            <strong>${esc(r.name)}</strong><br>
            <span class="muted" style="font-size:12px;">${esc(r.jobTitle || '—')} &middot; ${esc(r.company || '—')}</span><br>
            ${r.linkedinUrl ? `<a href="${esc(r.linkedinUrl)}" target="_blank" rel="noopener" style="font-size:11.5px;">${esc(r.linkedinUrl)}</a>` : '<span class="muted" style="font-size:11.5px;">No LinkedIn URL found</span>'}
          </span>
        </label>
      `).join('')}
    </div>
  `;
}

function toggleApolloSelectAll(checked){
  document.querySelectorAll('.apollo-result-checkbox').forEach(el => { el.checked = checked; });
}

// Reuses createManualGridContact - same local contact shape and Airtable
// sync as manually typing a contact into "Add contact" above, so an
// imported result behaves identically everywhere else in the app. Job
// Title is written as the grid column/searched title rather than Apollo's
// own verbose title (e.g. "Change Manager, WA Operations Transformation
// Programme") - that goes to the separate Apollo Title field instead, via
// createManualGridContact's apolloTitle param - so the grid's role-based
// matching keeps working the same way it does for every other contact.
function confirmApolloImport(){
  const results = window.__apolloResults || [];
  const checked = Array.from(document.querySelectorAll('.apollo-result-checkbox:checked'))
    .map(el => results[Number(el.value)])
    .filter(Boolean);
  if(!checked.length){ toast('No contacts selected', 'warn'); return; }

  const grid = currentGrid();
  const searchedJobTitle = window.__apolloSearchedJobTitle || '';

  // A company-less result (Apollo returned no organisation for that person)
  // still gets imported - it lands in the grid's "No company yet" row
  // (unassignedGridContacts/renderUnassignedGridRow) instead of a real
  // company row, and becomes a candidate for "Run daily search" to backfill
  // the company later (see the matching note on syncContactToAirtable).
  //
  // Re-running the same Apollo search re-fetches candidates already on this
  // grid too (results aren't deduped against the grid server-side), so
  // skip any result whose name is already here rather than pushing a second
  // local contact object for the same person - createManualGridContact has
  // no create-if-missing check of its own, and Airtable's own dedup (Full
  // Name lookup in createOrUpdateAirtableContact) only stops a second
  // Airtable record, not a second row showing up in this grid.
  let imported = 0, importedNoCompany = 0, alreadyOnGrid = 0, skipped = 0;
  const existingNames = new Set(gridContacts(grid.id).map(c => c.name.trim().toLowerCase()));
  checked.forEach(r => {
    if(!r.name){ skipped++; return; }
    if(existingNames.has(r.name.trim().toLowerCase())){ alreadyOnGrid++; return; }
    if(r.company) ensureGridCompany(grid, r.company);
    else importedNoCompany++;
    createManualGridContact(r.name, searchedJobTitle, r.company || '', r.linkedinUrl || '', r.jobTitle || '');
    existingNames.add(r.name.trim().toLowerCase());
    imported++;
  });

  closeModal();
  renderPage();
  if(imported) toast(`${imported} contact${imported===1?'':'s'} imported from Apollo${importedNoCompany ? ` (${importedNoCompany} without a company yet)` : ''}`, 'success');
  if(alreadyOnGrid) toast(`${alreadyOnGrid} already on this grid - skipped`, 'success');
  if(skipped) toast(`${skipped} skipped - missing name`, 'warn');
}

function sleep(ms){ return new Promise(resolve => setTimeout(resolve, ms)); }

// Which grids currently have a run-search job in flight (client's view of
// the server-side per-grid lock - see runningGridSearchJobs in
// search-server.js). Drives the "Run daily search" button's disabled state
// at render time (see renderGrid) so it stays disabled across navigation
// away from and back to this grid, not just for the duration of the tab
// that started it.
function isGridSearchRunning(gridId){
  return !!(window.__runningGridSearchGridIds && window.__runningGridSearchGridIds.has(gridId));
}
function markGridSearchRunning(gridId){
  window.__runningGridSearchGridIds = window.__runningGridSearchGridIds || new Set();
  window.__runningGridSearchGridIds.add(gridId);
}
function markGridSearchFinished(gridId){
  if(window.__runningGridSearchGridIds) window.__runningGridSearchGridIds.delete(gridId);
}

// Contacts on this grid missing exactly one of company/role - candidates
// for the "fill missing field" half of runDailySearch below. Only contacts
// already synced to Airtable (a real record id) are included, since the
// server patches the missing field straight onto their Contacts record -
// a locally-added contact with no Airtable id yet has nothing to patch.
function incompleteGridContacts(gridId){
  return gridContacts(gridId).filter(c => {
    if(isContactExcludedFromGrid(c)) return false;
    if(!/^rec[A-Za-z0-9]{14}$/.test(c.id)) return false;
    const hasCompany = !!(c.company||'').trim();
    const hasRole = !!(c.role||'').trim();
    return hasCompany !== hasRole;
  });
}

// Daily search now runs server-side (POST /api/grid/run-search) instead of
// this function driving the per-cell search+Airtable-write loop itself -
// the server writes each match to Airtable as it finds it, and this just
// starts the job then polls its status until done, patching grid cells in
// as their results land. See runGridSearchJob in search-server.js.
//
// Two kinds of work go into one job: "newContact" cells search for a brand
// new person to fill an empty (company, role) slot in the matrix (as
// before); "fillMissing" cells search for the missing company or job title
// of a contact that's already on this grid but only has one of the two -
// e.g. an Apollo import that came in with a job title but no company. Both
// share the same job/poll/cancel machinery so there's one progress bar and
// one Cancel button for the whole run.
async function runDailySearch(){
  const grid = currentGrid();
  if(isGridSearchRunning(grid.id)) return;
  const cols = grid.columns;
  const emptyCells = [];
  grid.companies.forEach(company => cols.forEach(role => { if(!findContact(company, role)) emptyCells.push({ kind:'newContact', company, role }); }));

  const fillCells = incompleteGridContacts(grid.id).map(c => ({
    kind: 'fillMissing',
    contactId: c.id,
    name: c.name,
    linkedinUrl: c.url,
    knownCompany: c.company,
    knownRole: c.role,
    missingField: c.company ? 'role' : 'company',
    gridName: grid.name
  }));

  const cells = [...emptyCells, ...fillCells];
  if(!cells.length){ toast('No open roles left to search — every cell has a contact','warn'); return; }

  const btn = document.getElementById('runSearchBtn');
  if(btn){ btn.disabled = true; btn.innerHTML = '<i class="ti ti-loader-2"></i> Searching...'; }

  emptyCells.forEach(({company,role}) => {
    const td = document.querySelector(`.cell-empty[data-company="${cssEscape(company)}"][data-role="${cssEscape(role)}"]`);
    if(td) td.outerHTML = `<div class="cell-searching" data-company="${esc(company)}" data-role="${esc(role)}"><i class="ti ti-loader-2"></i>&nbsp;Searching...</div>`;
  });
  renderGridSearchStatus(0, cells.length, 0, 0, grid.id);

  try {
    const startRes = await fetch('/api/grid/run-search', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      // currentGridCampaignName() only resolves when this grid is linked to
      // exactly one campaign (same convention as gridCellDays/
      // gridSequenceStageMap above) - lets the server link newly-found
      // contacts into that campaign's Campaign Contacts table too.
      body: JSON.stringify({ gridId: grid.id, cells, campaignName: currentGridCampaignName() })
    });
    const startData = await startRes.json();
    // A 409 here means the server's own per-grid lock rejected it (already
    // running for this gridId, possibly started from another tab/session) -
    // surfaces through the same error path as any other start failure.
    if(!startRes.ok || !startData.jobId) throw new Error(startData.error || 'Could not start search');
    markGridSearchRunning(grid.id);
    await pollGridSearchJob(startData.jobId, grid, cells);
  } catch(err){
    console.warn('Grid search failed to start:', err.message);
    resetStuckSearchingCells(emptyCells);
    finishGridSearchUI(grid.id, { status:'error', error: err.message, foundCount:0, filledCount:0, total: cells.length });
  }
}

// Reverts any cell still showing the "Searching..." spinner back to an
// empty cell - used when a job fails before (or without ever) reaching
// every cell, so results never arrive to resolve them via
// applyGridSearchResult.
function resetStuckSearchingCells(cells){
  cells.forEach(({company,role}) => {
    const el = document.querySelector(`.cell-searching[data-company="${cssEscape(company)}"][data-role="${cssEscape(role)}"]`);
    if(el) el.outerHTML = `<div class="cell-empty" data-company="${esc(company)}" data-role="${esc(role)}" title="The search request itself failed — try again">Search error — try again</div>`;
  });
}

// Status shown two places while a search job is running: the Grid page's
// own #gridNotification banner (only present while actually viewing that
// grid) and #gridSearchStatusBar, a fixed element outside #pageContent
// (see body markup) that survives renderPage() swapping pages out, so the
// indicator stays visible if the user navigates away mid-search. Refreshed
// on every poll tick with the latest completed/total/foundCount.
function renderGridSearchStatus(completed, total, foundCount, filledCount, gridId){
  const parts = [];
  if(foundCount) parts.push(`${foundCount} found`);
  if(filledCount) parts.push(`${filledCount} filled`);
  const message = `Searching ${completed} of ${total} — ${parts.length ? parts.join(', ') : '0 found'} so far...`;
  const cancelBtn = `<button class="btn btn-ghost btn-sm" style="margin-left:10px;" onclick="cancelGridSearch('${gridId}')"><i class="ti ti-player-stop"></i> Cancel</button>`;
  const el = document.getElementById('gridNotification');
  if(el) el.innerHTML = `<div class="card" style="margin-bottom:14px;display:flex;align-items:center;"><i class="ti ti-loader-2"></i>&nbsp;${message}${cancelBtn}</div>`;
  const bar = document.getElementById('gridSearchStatusBar');
  if(bar){
    bar.style.display = 'flex';
    bar.innerHTML = `<i class="ti ti-loader-2"></i> ${message}${cancelBtn}`;
  }
}

// Releases the per-grid lock (isGridSearchRunning) and hides the persistent
// status bar - called once a job is done, whether it succeeded, errored, or
// never started at all. If the user is currently looking at this same grid,
// does a full renderPage() rather than just patching #runSearchBtn in place
// - patching alone would leave cells whose result arrived while the user
// was elsewhere (so applyGridSearchResult's .cell-searching target never
// existed to patch) stuck showing "No match yet" even though state.contacts
// already has them; a fresh render reads the grid straight from
// state.contacts instead. A job finishing for a grid that isn't the one
// currently open (or while on a different page entirely) never touches the
// DOM at all here.
//
// job.foundCount is brand-new contacts placed into empty matrix cells;
// job.filledCount is existing contacts that had their missing company or
// job title filled in (see runDailySearch's fillMissing cells) - reported
// separately since neither term alone describes what the other did.
function gridSearchResultSummary(job){
  const parts = [];
  if(job.foundCount) parts.push(`${job.foundCount} new contact${job.foundCount===1?'':'s'} found`);
  if(job.filledCount) parts.push(`${job.filledCount} missing field${job.filledCount===1?'':'s'} filled`);
  return parts.length ? parts.join(', ') : 'nothing new found';
}

function finishGridSearchUI(gridId, job){
  markGridSearchFinished(gridId);

  const bar = document.getElementById('gridSearchStatusBar');
  if(bar){ bar.style.display = 'none'; bar.innerHTML = ''; }

  if(job.status === 'error'){
    toast('Daily search failed: '+(job.error||'unknown error'), 'warn');
  } else if(job.status === 'cancelled'){
    toast(job.error === 'Grid no longer exists' ? 'Search stopped - grid no longer exists' : 'Search cancelled', 'warn');
  } else {
    toast(gridSearchResultSummary(job), 'success');
  }

  if(state.currentPage !== 'grid') return;
  const grid = currentGrid();
  if(!grid || grid.id !== gridId) return;

  renderPage();
  const el = document.getElementById('gridNotification');
  if(!el) return;
  if(job.status === 'error'){
    el.innerHTML = `<div class="card" style="background:#fbe3dc;border-color:#f0c6b8;margin-bottom:14px;"><i class="ti ti-alert-circle" style="color:var(--danger);"></i> Daily search failed — ${esc(job.error||'unknown error')}</div>`;
  } else if(job.status === 'cancelled'){
    el.innerHTML = `<div class="card" style="background:#f5f1e8;border-color:#e5dcc8;margin-bottom:14px;"><i class="ti ti-player-stop"></i> Search stopped — ${esc(job.error === 'Grid no longer exists' ? 'this grid no longer exists' : 'cancelled')}. ${esc(gridSearchResultSummary(job))} before stopping.</div>`;
  } else {
    el.innerHTML = `<div class="card" style="background:#eaf7f0;border-color:#c9e9d7;margin-bottom:14px;"><i class="ti ti-circle-check" style="color:var(--success);"></i> Daily search complete — ${esc(gridSearchResultSummary(job))} across ${job.total} open items.</div>`;
  }
}

// Tells the server to stop a running search job for this grid - see POST
// /api/grid/cancel-search. Doesn't stop anything client-side itself:
// pollGridSearchJob keeps polling as normal and finishGridSearchUI runs
// once the job actually reports status "cancelled" (the cell already in
// flight server-side finishes first), same as a natural completion.
function cancelGridSearch(gridId){
  fetch('/api/grid/cancel-search', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ gridId })
  }).then(res => res.json()).then(data => {
    if(!data.success) toast(data.message || 'Could not cancel search', 'warn');
  }).catch(err => console.warn('Cancel grid search failed:', err.message));
}

// Applies one cell's result from a run-search job's `results` array onto
// the grid - same three outcomes (contact found / no confident match /
// search error) runDailySearch used to render inline. A "fillMissing"
// result (see runDailySearch) patches an existing contact's missing field
// instead, so it's handled separately below.
function applyGridSearchResult(grid, result){
  if(result.kind === 'fillMissing'){ applyFillMissingFieldResult(grid, result); return; }
  const { company, role, found, name, url, recordId, error } = result;
  const cellEl = document.querySelector(`.cell-searching[data-company="${cssEscape(company)}"][data-role="${cssEscape(role)}"]`);
  if(found && name && url){
    const seqId = role === 'Digital and Tech' ? 'digitalTech' : 'seniorLeaders';
    const newContact = {
      // recordId is the Airtable id the server already wrote this contact
      // under - falling back to a local uid only guards against a
      // malformed job result, not the normal path.
      id: recordId || uid('c'), gridId: grid.id, name, company, role, url,
      seqId, state:'found', foundDate: isoDate(TODAY), connReqDate:null, connDate:null, notes:'',
      thread:{ connSent:null, m1:null, m2:null, cta:null, booked:false }, generated:{}, touchPoints:[]
    };
    state.contacts.push(newContact);
    touchGrid(grid.id);
    if(cellEl) cellEl.outerHTML = renderGridCellHTML(newContact);
    // Already written to Airtable server-side by /api/grid/run-search -
    // only the Make.com webhook notification still needs to happen here.
    notifyWebhook(newContact, { skipAirtableSync: true });
  } else if(error){
    if(cellEl) cellEl.outerHTML = `<div class="cell-empty" data-company="${esc(company)}" data-role="${esc(role)}" title="The search request itself failed — try again">Search error — try again</div>`;
  } else {
    if(cellEl) cellEl.outerHTML = `<div class="cell-empty" data-company="${esc(company)}" data-role="${esc(role)}" title="Couldn't find a verified LinkedIn profile — try an alternative search method">No confident match — try again</div>`;
  }
}

// Patches an existing contact's missing company or role in local state once
// the server's found+written a value for it (Airtable itself is already
// patched server-side, same "server writes, client reconciles" split as the
// newContact path above). A found company also gets added to the grid's
// companies list via ensureGridCompany, same as a manual "Add company" or
// an Apollo import - so the contact moves out of the "No company yet" row
// and into its proper matrix cell on the next render. No per-cell DOM patch
// here (unlike newContact) since these contacts don't have a dedicated
// .cell-searching placeholder to replace - the renderPage() at the end of
// finishGridSearchUI picks up the change instead.
function applyFillMissingFieldResult(grid, result){
  const { contactId, missingField, found, value } = result;
  if(!found || !value) return;
  const contact = state.contacts.find(c => c.id === contactId);
  if(!contact) return;
  if(missingField === 'role'){
    contact.role = value;
    if(value === 'Digital and Tech') contact.seqId = 'digitalTech';
  } else {
    contact.company = value;
    ensureGridCompany(grid, value);
  }
  touchGrid(grid.id);
}

// Polls a run-search job until it finishes, applying newly-landed cell
// results and refreshing the status banner on each tick.
async function pollGridSearchJob(jobId, grid, cells){
  const cellKey = c => c.kind === 'fillMissing' ? ('fill:'+c.contactId) : (c.company+'|||'+c.role);
  const seenKeys = new Set();
  const stillSearching = () => cells.filter(c => !seenKeys.has(cellKey(c)));
  for(;;){
    let res, job;
    try {
      res = await fetch(`/api/grid/run-search/${jobId}`);
      job = await res.json();
    } catch(err){
      console.warn('Grid search polling failed:', err.message);
      await sleep(1500);
      continue;
    }

    if(!res.ok){
      resetStuckSearchingCells(stillSearching().filter(c => c.kind !== 'fillMissing'));
      finishGridSearchUI(grid.id, { status:'error', error: job.error || ('status '+res.status), foundCount:0, filledCount:0, total: cells.length });
      return;
    }

    (job.results || []).forEach(r => {
      const key = cellKey(r);
      if(seenKeys.has(key)) return;
      seenKeys.add(key);
      applyGridSearchResult(grid, r);
    });
    renderGridSearchStatus(job.completed, job.total, job.foundCount, job.filledCount || 0, grid.id);

    if(job.status === 'done' || job.status === 'error' || job.status === 'cancelled'){
      if(job.status === 'error' || job.status === 'cancelled') resetStuckSearchingCells(stillSearching().filter(c => c.kind !== 'fillMissing'));
      finishGridSearchUI(grid.id, job);
      return;
    }
    await sleep(1500);
  }
}

// Apollo's plain people-search redacts a person's last name for accounts
// without a paid "reveal" unlock (e.g. "Ta***r" - see /api/apollo/search-
// contacts' last_name_obfuscated handling), and that masked string gets
// stored as this contact's real name, not just shown in a preview. A
// Serper/Google search built from it (searchMissingContactField) can only
// ever guess, since "Ta***r" isn't a real name to match against - flagged
// wherever the name is shown (grid cell, contact drawer, CSV export) so a
// rep knows to verify the identity manually rather than trust it outright.
function hasUncertainName(name){
  return /\*/.test(name || '');
}

function renderGridCellHTML(c){
  const days = gridCellDays(c);
  const effectiveState = gridCellState(c);
  const uncertainName = hasUncertainName(c.name);
  return `<td><div class="grid-cell cell-${effectiveState}">
      <div class="cell-name" style="cursor:pointer;" onclick="openContactDrawer('${esc(c.name)}', ${currentGridCampaignName() ? `'${esc(currentGridCampaignName())}'` : 'null'})">${esc(c.name)}${uncertainName ? ` <i class="ti ti-alert-triangle" style="color:#a1701c;font-size:12px;" title="Name may not be accurate - last name was masked by Apollo, verify manually"></i>` : ''}${c.url ? ` <a href="${esc(c.url)}" target="_blank" rel="noopener" onclick="handleContactLinkedInOpened('${c.id}', event)" title="Open on LinkedIn" style="margin-left:2px;color:var(--blue);"><i class="ti ti-brand-linkedin"></i></a>` : ''}</div>
      <div class="cell-meta">
        <span class="day-badge ${dayBadgeClass(days)}">${days}d</span>
        <span class="tag tag-${effectiveState}">${effectiveState}</span>
        <button class="btn btn-ghost btn-sm" style="padding:2px 6px;" onclick="handleSkipContact('${c.id}', event)" title="Skip - exclude from this campaign"><i class="ti ti-player-skip-forward"></i></button>
      </div>
  </div></td>`.replace('<td><div','<div').replace('</div></td>','</div>');
}
function cssEscape(str){ return str.replace(/"/g,'\\"'); }
function isoDate(d){ return d.toISOString().slice(0,10); }
function addDays(dateStr, days){
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + days);
  return isoDate(d);
}

// Grid toolbar's "Reset" button - warns that this permanently deletes the
// grid's contacts and companies from Airtable, then on confirm wipes them
// (keeping the Grids record itself, unlike confirmDeleteGrid above) so the
// grid comes back empty. Resolves contact/company names the same way
// deleteGridConfirmed does, since Airtable has no per-grid field to filter
// by directly - grid membership only exists in this app's own state.
function resetGrid(){
  const grid = currentGrid();
  const body = `<p style="font-size:13px;">This will permanently delete all contacts and companies in "${esc(grid.name)}" from Airtable. This cannot be undone.</p>`;
  const footer = `
    <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary" id="confirmResetGridBtn" style="background:var(--danger);border-color:var(--danger);" onclick="resetGridConfirmed('${grid.id}')"><i class="ti ti-trash"></i> Delete everything</button>
  `;
  openModal('Reset grid', body, footer);
}

async function resetGridConfirmed(gridId){
  const grid = state.grids.find(g => g.id === gridId);
  if(!grid) return;
  const btn = document.getElementById('confirmResetGridBtn');
  if(btn){ btn.disabled = true; btn.innerHTML = '<i class="ti ti-loader-2"></i> Deleting...'; }
  try {
    const contactNames = gridContacts(gridId).map(c => c.name);
    // Only delete Companies not shared with another grid, same dedup as
    // deleteGridConfirmed - Airtable has no per-grid concept, so this is the
    // only place that knows the answer. Shared ones go in as
    // sharedCompanyNames instead, same reasoning as deleteGridConfirmed.
    const otherGridCompanies = new Set();
    state.grids.forEach(g => { if(g.id !== gridId) g.companies.forEach(c => otherGridCompanies.add(c)); });
    const companyNames = grid.companies.filter(c => !otherGridCompanies.has(c));
    const sharedCompanyNames = grid.companies.filter(c => otherGridCompanies.has(c));

    const res = await fetch(`/api/grids/${encodeURIComponent(gridId)}/contacts`, {
      method: 'DELETE',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ contactNames, companyNames, sharedCompanyNames, gridName: grid.name })
    });
    const json = await res.json();
    if(!res.ok || !json.success) throw new Error(json.error || 'Reset failed');

    state.contacts = state.contacts.filter(c => c.gridId !== gridId);
    grid.companies = [];
    closeModal();
    toast(`Grid "${grid.name}" reset`, 'success');
    renderPage();
  } catch(err){
    toast('Could not reset grid: ' + err.message, 'warn');
    if(btn){ btn.disabled = false; btn.innerHTML = '<i class="ti ti-trash"></i> Delete everything'; }
  }
}
