<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T2C Outreach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
:root{
  --bg:#f5f0eb;
  --sidebar-bg:#1a1a2e;
  --sidebar-text:#ffffff;
  --sidebar-muted:rgba(255,255,255,0.5);
  --sidebar-active-bg:#ffffff;
  --sidebar-active-text:#1a1a2e;
  --topbar-bg:#ffffff;
  --border:#e8e0d8;
  --card-bg:#ffffff;
  --primary:#1a1a2e;
  --accent:#c8a96e;
  --success:#44A574;
  --warning:#e8a020;
  --danger:#c44a2a;
  --muted:#8a8070;
  --peach:#FF834C;
  --blue:#0084C5;
  --brown:#532822;
  --yellow:#FFD05D;
  --text:#2a2620;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Plus Jakarta Sans',sans-serif;
  background:var(--bg);
  color:var(--text);
  font-size:14px;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none;}
.app{display:flex;min-height:100vh;}

/* Sidebar */
.sidebar{
  width:240px;
  min-width:240px;
  background:var(--sidebar-bg);
  color:var(--sidebar-text);
  display:flex;
  flex-direction:column;
  padding:20px 14px;
  position:sticky;
  top:0;
  height:100vh;
}
.sidebar-logo{display:flex;align-items:center;gap:10px;padding:8px 8px 4px;}
.logo-mark{width:32px;height:32px;min-width:32px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:13px;}
.logo-text{display:flex;flex-direction:column;}
.logo-name{font-size:14px;font-weight:700;color:#fff;line-height:1.2;}
.logo-sub{font-size:11px;color:var(--sidebar-muted);margin-top:2px;}
.sidebar-nav{display:flex;flex-direction:column;gap:2px;margin-top:24px;}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;border-radius:10px;
  color:var(--sidebar-muted);
  font-weight:600;font-size:13.5px;
  cursor:pointer;
  border:none;background:none;
  width:100%;text-align:left;
}
.nav-item i{font-size:18px;}
.nav-item:hover{color:#fff;background:rgba(255,255,255,0.06);}
.nav-item.active{background:var(--sidebar-active-bg);color:var(--sidebar-active-text);}
.sidebar-footer{margin-top:auto;padding:12px 8px;color:var(--sidebar-muted);font-size:11.5px;border-top:1px solid rgba(255,255,255,0.08);padding-top:16px;}

/* Main */
.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  background:var(--topbar-bg);
  border-bottom:1px solid var(--border);
  padding:16px 28px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:20;
}
.topbar-title{font-size:18px;font-weight:800;}
.topbar-user{display:flex;align-items:center;gap:10px;}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;}
.page{padding:24px 28px 60px;max-width:1500px;}

/* Cards / buttons */
.card{background:var(--card-bg);border:1px solid var(--border);border-radius:14px;padding:18px;}
.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:9px 16px;border-radius:9px;border:1px solid transparent;
  font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;
  transition:opacity .15s;
}
.btn:hover{opacity:0.88;}
.btn i{font-size:16px;}
.btn-primary{background:var(--primary);color:#fff;}
.btn-secondary{background:#fff;color:var(--primary);border-color:var(--border);}
.btn-accent{background:var(--accent);color:#fff;}
.btn-danger{background:var(--danger);color:#fff;}
.btn-ghost{background:transparent;color:var(--primary);border-color:transparent;padding:6px 10px;}
.btn-sm{padding:6px 10px;font-size:12px;}
.btn:disabled{opacity:0.5;cursor:not-allowed;}

input,select,textarea{
  font-family:inherit;font-size:13px;padding:9px 11px;
  border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--text);
  width:100%;
}
textarea{resize:vertical;}
label{font-size:12px;font-weight:700;color:var(--muted);display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.02em;}
.field{margin-bottom:14px;}
.row{display:flex;gap:12px;}
.row>*{flex:1;}

/* Dashboard */
.stat-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:22px;}
.stat-card{border-radius:14px;padding:16px 18px;color:#fff;}
.stat-card .num{font-size:26px;font-weight:800;margin-top:6px;}
.stat-card .label{font-size:12px;font-weight:600;opacity:0.9;}
.two-col{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-bottom:16px;}
.section-title{font-size:14px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.timeline{display:flex;flex-direction:column;gap:14px;}
.timeline-item{display:flex;gap:10px;}
.timeline-dot{width:26px;height:26px;min-width:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;}
.timeline-body .t-text{font-weight:600;font-size:13px;}
.timeline-body .t-time{font-size:11.5px;color:var(--muted);margin-top:2px;}
.delivery-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);}
.delivery-item:last-child{border-bottom:none;}
.mini-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px;}
.mini-card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px;text-align:center;}
.mini-card .num{font-size:24px;font-weight:800;color:var(--primary);}
.mini-card .label{font-size:12px;color:var(--muted);margin-top:4px;font-weight:600;}
.health-stat-grid{grid-template-columns:repeat(4,1fr);}
.perf-table-wrap{overflow-x:auto;}
.perf-table{width:100%;border-collapse:collapse;font-size:12.5px;}
.perf-table th{text-align:left;padding:8px 10px;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);border-bottom:1px solid var(--border);white-space:nowrap;}
.perf-table td{padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap;}
.perf-table tr:last-child td{border-bottom:none;}
.perf-table td.perf-name{white-space:normal;font-weight:700;}
.home-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
.home-action-card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:18px;cursor:pointer;transition:border-color .15s,box-shadow .15s;}
.home-action-card:hover{border-color:var(--accent);box-shadow:0 2px 10px rgba(0,0,0,.06);}
.home-action-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;margin-bottom:12px;}
.home-action-title{font-weight:800;font-size:14px;margin-bottom:4px;}
.home-action-desc{font-size:12px;color:var(--muted);}
.home-grid-row{cursor:pointer;}
.home-grid-row:hover{background:#faf6f1;}
.quick-actions{display:flex;gap:12px;flex-wrap:wrap;}

/* Tags / badges */
.tag{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;}
.tag-found{background:#fdf4e6;color:#8a6a1f;}
.tag-opened{background:#fde9d6;color:#a1571c;}
.tag-connected{background:#e3f5eb;color:#1f7a4f;}
.tag-messaging{background:#e2f2fa;color:#0d6a96;}
.tag-booked{background:#1a1a2e;color:#fff;}
.day-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:800;}
.day-green{background:#e3f5eb;color:#1f7a4f;}
.day-amber{background:#fdf0d9;color:#a1701c;}
.day-red{background:#fbe3dc;color:var(--danger);}

/* Grid page */
.toolbar{display:flex;gap:10px;align-items:flex-end;margin-bottom:16px;flex-wrap:wrap;}
.toolbar .field{margin-bottom:0;min-width:220px;}
.grid-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:14px;background:#fff;}
table.grid-table{border-collapse:collapse;width:100%;min-width:820px;}
.grid-table th{background:#faf6f1;padding:12px 14px;text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);border-bottom:1px solid var(--border);white-space:nowrap;}
.grid-table td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:top;min-width:190px;}
.grid-table tr:last-child td{border-bottom:none;}
.company-cell{font-weight:700;white-space:nowrap;}
.grid-cell{border-radius:10px;padding:10px;min-height:64px;}
.cell-found{background:#fdf8ef;}
.cell-opened{background:#fdf1e2;}
.cell-connected{background:#eaf7f0;}
.cell-messaging{background:#e8f4fa;}
.cell-empty{background:#fbfaf8;color:var(--muted);font-size:12px;display:flex;align-items:center;justify-content:center;min-height:64px;}
.cell-searching{background:#fbfaf8;color:var(--muted);font-size:12px;display:flex;align-items:center;justify-content:center;min-height:64px;font-style:italic;}
.cell-name{font-weight:700;font-size:13px;display:flex;align-items:center;gap:4px;}
.cell-meta{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap;}
.legend{display:flex;gap:16px;margin-top:14px;flex-wrap:wrap;}
.legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:600;}
.legend-swatch{width:12px;height:12px;border-radius:4px;}
.dropzone-upload{border:2px dashed var(--border);border-radius:14px;padding:26px;text-align:center;color:var(--muted);margin-top:20px;background:#fff;transition:border-color .15s,background .15s;}
.dropzone-upload.dragover{border-color:var(--accent);background:#faf3e8;}
.shot-box{border:1px dashed var(--border);border-radius:10px;padding:10px;background:#faf6f1;transition:border-color .15s,background .15s;}
.shot-box.dragover{border-color:var(--accent);background:#faf3e8;}
.shot-hint{font-size:11.5px;color:var(--muted);margin-bottom:8px;line-height:1.5;}
.shot-files{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.shot-file-chip{background:#fff;border:1px solid var(--border);border-radius:20px;padding:3px 6px 3px 10px;font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:6px;}
.shot-file-chip button{background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;line-height:1;}
.status-bar{display:flex;align-items:center;gap:8px;margin-top:16px;font-size:12px;color:var(--muted);}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--success);animation:pulse 1.6s infinite;}
@keyframes pulse{0%{opacity:1;}50%{opacity:.35;}100%{opacity:1;}}

/* Kanban / Roadmap */
.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:start;}
.kanban-col{background:#faf6f1;border:1px solid var(--border);border-radius:14px;padding:12px;min-height:200px;}
.kanban-col-header{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:13px;margin-bottom:10px;padding:0 4px;}
.kanban-col-header .count{background:var(--border);color:var(--muted);border-radius:20px;padding:1px 8px;font-size:11px;}
.kanban-cards{display:flex;flex-direction:column;gap:10px;min-height:60px;}
.kcard{background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px;cursor:grab;}
.kcard.dragging{opacity:0.4;}
.kcard-head{display:flex;justify-content:space-between;align-items:flex-start;cursor:pointer;}
.kcard-name{font-weight:700;font-size:13.5px;}
.kcard-role{font-size:11.5px;color:var(--muted);margin-top:2px;}
.kcard-flag{margin-top:8px;background:#fbe3dc;color:var(--danger);border-radius:8px;padding:6px 8px;font-size:11.5px;display:flex;justify-content:space-between;align-items:center;font-weight:700;}
.thread{margin-top:12px;border-top:1px solid var(--border);padding-top:10px;display:flex;flex-direction:column;gap:10px;}
.thread-step{display:flex;flex-direction:column;gap:6px;background:#faf6f1;border-radius:10px;padding:10px;}
.thread-step-head{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:12px;}
.thread-step-body{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.check-yes{color:var(--success);}
.reply-toggle{display:flex;gap:6px;}
.reply-btn{padding:4px 9px;border-radius:7px;border:1px solid var(--border);background:#fff;font-size:11px;font-weight:700;cursor:pointer;}
.reply-btn.active-yes{background:var(--success);color:#fff;border-color:var(--success);}
.reply-btn.active-no{background:var(--danger);color:#fff;border-color:var(--danger);}
.archive-box{margin-top:26px;}
.archive-toggle{cursor:pointer;font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px;color:var(--muted);}
.tp-badge{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:20px;font-size:10.5px;font-weight:800;background:#f0e9dc;color:var(--accent);}
.tp-badge i{font-size:11px;}
.tp-timeline{display:flex;flex-direction:column;gap:6px;}
.tp-item{background:#fff;border:1px solid var(--border);border-radius:8px;padding:7px 9px;}
.tp-item-head{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;}
.tp-type{font-weight:700;}
.tp-notes{font-size:11.5px;color:var(--muted);margin-top:3px;}
.tp-form{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.tp-form input[type="date"]{width:auto;flex:none;font-size:11.5px;padding:6px 8px;}
.tp-form select{width:auto;flex:none;font-size:11.5px;padding:6px 8px;}
.tp-form input:not([type="date"]){flex:1;min-width:100px;font-size:11.5px;padding:6px 8px;}
.tp-painpoints{display:flex;flex-wrap:wrap;gap:6px 14px;margin:10px 0;padding:10px;background:#fff;border:1px solid var(--border);border-radius:8px;}
.todo-item{border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;background:#fff;}
.todo-item:last-child{margin-bottom:0;}
.todo-item-main{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
.todo-item-name{font-weight:700;font-size:14px;}
.todo-item-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.rec-product{background:#eaf7f0;border:1px solid #c9e9d7;border-radius:8px;padding:8px 10px;margin-bottom:6px;}
.rec-product:last-child{margin-bottom:0;}
.rec-product-name{font-weight:700;font-size:12px;color:#1f7a4f;}
.intel-draft{background:#e2f2fa;border:1px solid #bfe0f0;border-radius:10px;padding:12px 14px;margin-bottom:12px;}
.intel-draft:last-child{margin-bottom:0;}
.intel-draft-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.intel-draft-name{font-weight:700;font-size:13px;color:#0d6a96;}
.intel-draft-text{font-size:12.5px;white-space:pre-wrap;margin-top:8px;color:var(--text);line-height:1.5;}
.campaign-card-name{font-weight:800;font-size:14.5px;}
.campaign-status{display:inline-flex;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:800;white-space:nowrap;}
.campaign-status-draft{background:var(--border);color:var(--muted);}
.campaign-status-active{background:#e3f5eb;color:#1f7a4f;}
.campaign-status-complete{background:#e2f2fa;color:#0d6a96;}
.campaign-chat{display:flex;flex-direction:column;gap:10px;max-height:340px;overflow-y:auto;padding-right:2px;}
.campaign-chat-msg{max-width:88%;padding:9px 13px;border-radius:12px;font-size:12.5px;line-height:1.5;}
.campaign-chat-msg.assistant{background:#faf6f1;align-self:flex-start;border-bottom-left-radius:3px;}
.campaign-chat-msg.user{background:var(--primary);color:#fff;align-self:flex-end;border-bottom-right-radius:3px;}
.campaign-chat-progress{margin-bottom:14px;}
.campaign-chat-progress-bar{background:var(--border);border-radius:8px;height:6px;overflow:hidden;}
.campaign-chat-progress-fill{background:var(--accent);height:100%;transition:width .3s;}
.campaign-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
.campaign-chat-input-row{display:flex;gap:8px;margin-top:14px;}
.campaign-chat-input-row input{flex:1;}
.campaign-preview-card{background:#faf6f1;border:1px solid var(--border);border-radius:12px;padding:16px;margin-top:6px;align-self:stretch;max-width:100%;}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(26,26,46,0.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal{background:#fff;border-radius:16px;max-width:560px;width:100%;max-height:88vh;overflow-y:auto;}
.modal-header{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.modal-header h3{font-size:16px;font-weight:800;}
.modal-close{cursor:pointer;color:var(--muted);font-size:20px;background:none;border:none;}
.modal-body{padding:20px 22px;}
.modal-footer{padding:16px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;}

/* Toast */
.toast-container{position:fixed;top:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:10px;}
.toast{background:var(--primary);color:#fff;padding:12px 18px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,0.15);display:flex;align-items:center;gap:8px;animation:slideIn .2s ease;}
.toast.success{background:var(--success);}
.toast.warn{background:var(--warning);}
@keyframes slideIn{from{transform:translateX(30px);opacity:0;}to{transform:translateX(0);opacity:1;}}

/* Sequences */
.seq-tabs{display:flex;gap:8px;margin-bottom:18px;border-bottom:1px solid var(--border);}
.seq-tab{padding:10px 16px;font-weight:700;font-size:13px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;}
.seq-tab.active{color:var(--primary);border-color:var(--primary);}
.seq-header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:18px;gap:14px;flex-wrap:wrap;}
.pill{display:inline-flex;padding:4px 11px;border-radius:20px;background:#faf0dc;color:#8a6a1f;font-size:11.5px;font-weight:700;margin-right:6px;}
.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:0;align-items:stretch;margin-bottom:6px;}
.flow-3{grid-template-columns:repeat(3,1fr);}
.analytics-stat-grid{grid-template-columns:repeat(6,1fr);}
.flow-node{background:#fff;border:1px solid var(--border);border-radius:12px;position:relative;display:flex;flex-direction:column;}
.flow-node + .flow-node{margin-left:22px;}
.flow-node::before{content:'';position:absolute;left:-22px;top:50%;width:22px;height:2px;background:var(--border);}
.flow-node:first-child::before{display:none;}
.flow-node::after{content:'\2192';position:absolute;left:-20px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;}
.flow-node:first-child::after{display:none;}
.flow-node-head{padding:10px 12px;border-bottom:1px solid var(--border);border-radius:12px 12px 0 0;border-top:4px solid var(--brown);}
.flow-node-head.stage-connect{border-top-color:var(--brown);}
.flow-node-head.stage-m1{border-top-color:var(--peach);}
.flow-node-head.stage-m2{border-top-color:var(--blue);}
.flow-node-head.stage-cta{border-top-color:var(--success);}
.flow-node-head .stage-label{font-weight:800;font-size:12.5px;}
.flow-node-head .stage-hint{font-size:11px;color:var(--muted);margin-top:2px;}
.flow-node-body{padding:10px;flex:1;}
.flow-node-body textarea{min-height:130px;font-size:12.5px;}
.flow-node-foot{padding:10px;border-top:1px solid var(--border);display:flex;gap:8px;}
.dropzone{margin-top:10px;background:#faf6f1;border:1px dashed var(--border);border-radius:10px;padding:10px;min-height:56px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;}
.chip{background:#fff;border:1px solid var(--border);border-radius:20px;padding:6px 12px;font-size:11.5px;font-weight:700;cursor:grab;display:flex;align-items:center;gap:6px;}
.chip.dragging{opacity:0.4;}
.pipeline-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:6px;}
.pipeline-col-title{font-weight:800;font-size:12.5px;margin-bottom:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.02em;}

/* Calendar */
.cal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.cal-nav{display:flex;gap:8px;align-items:center;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;}

.event-chip.grey{background:#eee9e2;color:#6b6355;}

.an-stat .label{font-size:11px;color:var(--muted);font-weight:600;margin-top:2px;}
.an-stat .sub{font-size:11px;color:var(--success);font-weight:700;margin-top:2px;}
.bar-row{margin-bottom:12px;}
.bar-row-head{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;margin-bottom:5px;}
.bar-track{background:var(--border);border-radius:8px;height:10px;overflow:hidden;display:flex;}
.bar-fill{background:var(--primary);height:100%;}
.bar-fill.secondary{background:var(--accent);}
.cta-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);}
.cta-row:last-child{border-bottom:none;}

.count-pill.has{background:#e3f5eb;color:#1f7a4f;}
.analysis-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:14px;}
.analysis-block{border-radius:12px;padding:16px;}
.analysis-block.wins{background:#eaf7f0;border:1px solid #c9e9d7;}
.analysis-block.gaps{background:#fdf1e0;border:1px solid #f5dcae;}
.analysis-block.losses{background:#fbe3dc;border:1px solid #f0c2b0;}
.analysis-block.recs{background:#e2f2fa;border:1px solid #bfe0f0;}

.analysis-block ul{padding-left:18px;font-size:12.5px;line-height:1.6;}

/* ===================== PERSISTENCE (localStorage) ===================== */
/* `state` is a deep reactive proxy over `rawState` — setting or deleting any
   property anywhere in the tree (state.contacts[0].thread.cta = 'x', array
   push/splice, etc.) saves the whole app to localStorage immediately, so
   nothing needs to remember to call a save function by hand. */

const STORAGE_KEY = 't2c_state';

function persistState(){
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(rawState));
  } catch(err){
    console.warn('Could not save state to localStorage:', err.message);
  }
}

function loadPersistedState(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return false;
    const defaultSettings = rawState.settings;
    const saved = JSON.parse(raw);

    // Migrate pre-multi-grid saves (flat companies/gridColumns/companyLinkedIn,
    // no grids array yet) into a single default grid so nothing is lost.
    if(!saved.grids || !saved.grids.length){
      const migratedGridId = 'grid_wa_market_map';
      const migratedGrid = {
        id: migratedGridId,
        name: 'WA Market Map',
        companies: saved.companies || rawState.grids[0].companies,
        columns: saved.gridColumns || rawState.grids[0].columns,
        companyLinkedIn: saved.companyLinkedIn || {},
        createdAt: rawState.grids[0].createdAt,
        updatedAt: isoDate(TODAY)
      };
      saved.grids = [migratedGrid];
      saved.currentGridId = migratedGridId;
      delete saved.companies;
      delete saved.gridColumns;
      delete saved.companyLinkedIn;
      (saved.contacts || []).forEach(c => { if(!c.gridId) c.gridId = migratedGridId; });
    }

    Object.assign(rawState, saved);
    if(saved.settings){
      rawState.settings = Object.assign({}, defaultSettings, saved.settings, {
        integrations: Object.assign({}, defaultSettings.integrations, saved.settings.integrations),
        products: saved.settings.products || defaultSettings.products
      });
    }
    (rawState.contacts || []).forEach(c => { if(!c.touchPoints) c.touchPoints = []; });
    return true;
  } catch(err){
    console.warn('Could not restore saved state from localStorage:', err.message);
    return false;
  }
}

function makeReactive(target, onChange){
  if(target === null || typeof target !== 'object') return target;
  return new Proxy(target, {
    get(obj, prop, receiver){
      const value = Reflect.get(obj, prop, receiver);
      return (value !== null && typeof value === 'object') ? makeReactive(value, onChange) : value;
    },
    set(obj, prop, value, receiver){
      const result = Reflect.set(obj, prop, value, receiver);
      onChange();
      return result;
    },
    deleteProperty(obj, prop){
      const result = Reflect.deleteProperty(obj, prop);
      onChange();
      return result;
    }
  });
}

function daysBetween(dateStr, endStr){
  if(!dateStr) return null;
  const d1 = new Date(dateStr);
  const d2 = endStr ? new Date(endStr) : TODAY;
  return Math.max(0, Math.round((d2 - d1) / 86400000));
}
function fmtDate(dateStr){
  if(!dateStr) return '—';
  const d = new Date(dateStr);
  return d.toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'});
}
function fmtDateShort(dateStr){
  const d = new Date(dateStr);
  return d.toLocaleDateString('en-AU',{day:'numeric',month:'short'});
}
function relTime(dateStr){
  const days = daysBetween(dateStr);
  if(days === 0) return 'Today';
  if(days === 1) return 'Yesterday';
  return days + ' days ago';
}
function firstName(name){ return name.split(' ')[0]; }
function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,9); }
function esc(str){ return (str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function toast(msg, type){
  const c = document.getElementById('toastContainer');
  const el = document.createElement('div');
  el.className = 'toast' + (type ? ' '+type : '');
  const icon = type==='success' ? 'ti-circle-check' : type==='warn' ? 'ti-alert-triangle' : 'ti-bell';
  el.innerHTML = '<i class="ti '+icon+'"></i><span>'+esc(msg)+'</span>';
  c.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(),300); }, 3400);
}

function dayBadgeClass(days){
  if(days === null) return 'day-green';
  if(days < 7) return 'day-green';
  if(days <= 9) return 'day-amber';
  return 'day-red';
}

function getRoadmapColumn(c){
  if(c.thread.booked) return 'booked';
  if(c.state === 'messaging') return 'messaging';
  if(c.state === 'connected') return 'made';
  return 'pending';
}

function getPendingDays(c){
  if(c.connReqDate) return daysBetween(c.connReqDate);
  return daysBetween(c.foundDate);
}

// columns, and companyLinkedIn map). Contacts stay in the single global
// state.contacts array, each tagged with gridId - Dashboard, Roadmap,

function currentGrid(){
  return state.grids.find(g => g.id === state.currentGridId) || state.grids[0];

function gridContacts(gridId){
  return state.contacts.filter(c => c.gridId === gridId);
}

function gridNameForContact(contact){
  const grid = state.grids.find(g => g.id === contact.gridId);
  return grid ? grid.name : '';
}

function allGridColumns(){
  const set = new Set();
  state.grids.forEach(g => (g.columns || []).forEach(c => set.add(c)));

}

function touchGrid(gridId){
  const grid = state.grids.find(g => g.id === gridId);

  const grid = { id: uid('grid'), name, companies: [], columns: [], companyLinkedIn: {}, createdAt: isoDate(TODAY), updatedAt: isoDate(TODAY) };

function resolveGridIdByName(name){
  if(!name) return state.grids[0] ? state.grids[0].id : null;
  let grid = state.grids.find(g => g.name.toLowerCase() === name.toLowerCase());
  if(!grid) grid = createGrid(name);

// Context-tab data (window.__contextData) and its logger are shared by two
// spots that are never visible at once: the Intelligence > Context sub-tab
// (untagged) and a campaign's Intelligence tab (tagged via
// window.__ctxCampaignTag, set by renderCampaignIntelligenceTab). Both call
// into the same renderContext()/loadContextData() functions below.
//
// Loads (or reloads) window.__contextData if it's missing, or if it was
// loaded for a different campaign scope than the one currently active -
// Sequence Stage is per-campaign now, so switching from one campaign's
// Intelligence tab to another's (or to/from the untagged top-level Context
// tab) needs a fresh fetch, not the previous campaign's cached rows.
function ensureContextDataLoaded(){
  if(window.__contextDataLoading) return;
  const wantId = window.__ctxCampaignTag ? window.__ctxCampaignTag.id : null;
  // __contextDataScopeId is undefined until the first load attempt ever
  // finishes, so this is also true on that very first call.
  const scopeChanged = window.__contextDataScopeId !== wantId;
  if(scopeChanged || (!window.__contextData && !window.__contextDataError)) loadContextData();
}

    if(tab === 'analytics' && campaign) initCampaignAnalyticsCharts(campaign);
  }
  if(page === 'intelligence' && (window.__intelSubTab||'intelligence') === 'context') ensureContextDataLoaded();
}

// Marcus's primary data input hub. Fetches live from Airtable into
// window.__contextData rather than the reactive state/localStorage model -
// AI Summary, Conversation Context, Sequence Stage and Next Message Draft
// are Airtable-only fields with no equivalent on state.contacts, and
// folding them into the core contact model would be a much larger, riskier
// change than this feature asked for. Journey Stage - which still drives
// Dashboard prioritisation - is never touched by anything in this tab.
// Sequence Stage/Next Message Draft are per-campaign (Campaign Contacts
// junction table, not a field on Contacts) - window.__ctxCampaignTag says
// which campaign's row loadContextData() should fetch, and both come back
// blank when it's null (the untagged top-level Context tab).

const TOUCH_POINT_TYPE_OPTIONS_CONTEXT = ['Coffee','Call','LinkedIn DM','Email','Event','Other'];
const HISTORICAL_UPLOAD_TAGS = ['Past Customer','Past Deal','Conversation History','General Background'];

// silent=true refreshes window.__contextData in the background with no
// re-render at all, so a just-shown result panel (e.g. "3 contacts
// updated") isn't immediately wiped out by a full-page loading skeleton.
// Used after every Section 1/2/3 action; the plain (non-silent) call is
// only for the tab's initial load and the error-state Retry button.
//
// Sequence Stage is now per-campaign (Campaign Contacts junction table),
// so every load is scoped to whichever campaign is active per
// window.__ctxCampaignTag (null for the untagged top-level Context tab).
// window.__contextDataScopeId records which scope the last load attempt
// was for (success or failure) so ensureContextDataLoaded() below can tell
// a stale cross-campaign cache apart from a genuinely fresh one and reload
// rather than reuse it.
async function loadContextData(silent){
  const scopeCampaignId = window.__ctxCampaignTag ? window.__ctxCampaignTag.id : null;
  if(!silent){
    window.__contextDataLoading = true;
    window.__contextDataError = null;
    renderPage();
  }
  try {
    const qs = scopeCampaignId ? '?campaignId='+encodeURIComponent(scopeCampaignId)+'&campaignName='+encodeURIComponent(window.__ctxCampaignTag.name) : '';
    const res = await fetch('/api/context/data'+qs);
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || ('Request failed with status '+res.status));
    window.__contextData = data;
  } catch(err){
    if(!silent) window.__contextDataError = err.message;
    else console.warn('Silent context data refresh failed:', err.message);
  }
  // Recorded after every attempt, success or failure, so ensureContextDataLoaded()
  // can tell "this scope already failed, wait for a manual Retry" apart from
  // "a different scope just became active, worth trying fresh" - both leave
  // window.__contextData falsy, so that alone can't distinguish them.
  if(!silent) window.__contextDataScopeId = scopeCampaignId;
  if(!silent){
    window.__contextDataLoading = false;
    renderPage();
  }
}

function renderContext(){
  if(window.__contextDataLoading){
    return '<div class="card"><div class="muted"><i class="ti ti-loader-2"></i> Loading context data from Airtable...</div></div>';
  }
  if(window.__contextDataError){
    return `<div class="card"><div class="muted">Could not load context data: ${esc(window.__contextDataError)}</div><button class="btn btn-secondary btn-sm" style="margin-top:10px;" onclick="loadContextData()"><i class="ti ti-refresh"></i> Retry</button></div>`;
  }
  if(!window.__contextData){
    return '<div class="card"><div class="empty-state">Loading...</div></div>';
  }
  const campaignTag = window.__ctxCampaignTag;
  return `
  <div class="section-title" style="font-size:20px;margin-bottom:2px;">${campaignTag ? 'Intelligence' : 'Context'}</div>
  <div class="muted" style="margin-bottom:14px;">Marcus's primary data input hub - log touch points, upload context, and keep AI Summaries current.${campaignTag ? ` Everything logged here also tags the record with the <strong>${esc(campaignTag.name)}</strong> campaign, so it shows up at account level and pre-loads intelligence for future similar campaigns.` : ''}</div>
  ${campaignTag ? `<div class="card" style="margin-bottom:16px;background:#e2f2fa;border-color:#bfe0f0;"><span class="pill" style="background:#fff;"><i class="ti ti-rocket" style="font-size:11px;"></i> ${esc(campaignTag.name)}</span> <span class="muted" style="font-size:12px;">Everything saved below is tagged to this campaign.</span></div>` : ''}
  <div id="ctxUpdatingIndicator" class="muted" style="font-size:11.5px;margin-bottom:14px;display:none;"><i class="ti ti-loader-2"></i> Updating AI summaries...</div>

function initContextLogger(){

function renderTouchPointLogger(){
  if(!window.__ctxLogger) initContextLogger();
  const logger = window.__ctxLogger;
  const data = window.__contextData;
  const contactsForCompany = logger.companyId ? data.contacts.filter(c => c.companyId === logger.companyId) : [];

  return `
  <div class="card" style="margin-bottom:16px;">

        </select>
      </div>
      ${logger.companyId ? `
      <div class="field"><label>Touch point type</label>
        <select id="ctxTouchType" onchange="setContextTouchType(this.value)">
          ${TOUCH_POINT_TYPE_OPTIONS_CONTEXT.map(t=>`<option ${logger.touchType===t?'selected':''}>${t}</option>`).join('')}
        </select>
      </div>
      ${logger.touchType==='Other' ? `<div class="field"><label>Specify type</label><input id="ctxOtherType" value="${esc(logger.otherType)}" onchange="setContextOtherType(this.value)" placeholder="e.g. Webinar"></div>` : ''}
      <div class="field"><label>Date</label><input type="date" id="ctxDate" value="${esc(logger.date)}" onchange="setContextDate(this.value)"></div>
      ` : ''}
    </div>
    ${logger.companyId ? `
    <div class="field">
      <label>Contacts</label>
      <div class="checkbox-row">
        ${contactsForCompany.length ? contactsForCompany.map(c => `
          <label class="checkbox-item"><input type="checkbox" value="${esc(c.id)}" ${logger.contactIds.includes(c.id)?'checked':''} onchange="toggleContextContact('${c.id}')"> ${esc(c.name)}${c.role?` <span class="muted">(${esc(c.role)})</span>`:''}</label>
        `).join('') : '<span class="muted" style="font-size:12px;">No contacts on file for this company.</span>'}

    ` : ''}
    ${logger.companyId && logger.contactIds.length && !logger.mode ? `
    <div style="display:flex;gap:10px;margin-top:12px;">
      <button class="btn btn-primary btn-sm" onclick="getContextDebriefQuestions()"><i class="ti ti-sparkles"></i> Get AI Questions</button>

    </div>
    ` : ''}

function renderContextDebriefArea(logger){
  if(logger.mode === 'loading') return '<div class="muted" style="margin-top:12px;font-size:12.5px;"><i class="ti ti-loader-2"></i> Getting questions from Claude...</div>';
  if(logger.mode === 'debrief'){
    return `
    <div style="margin-top:14px;">
      ${logger.debriefQuestions.map((q,i) => `<div class="field"><label>${esc(q)}</label><textarea id="ctxDebriefAnswer-${i}" rows="2"></textarea></div>`).join('')}
      <button class="btn btn-primary btn-sm" onclick="saveContextTouchPoint()" ${logger.saving?'disabled':''}><i class="ti ti-device-floppy"></i> ${logger.saving?'Saving...':'Save touch point'}</button>
    </div>`;
  }
  if(logger.mode === 'notes'){
    return `
    <div style="margin-top:14px;">
      <div class="field"><label>Notes</label><textarea id="ctxNotes" rows="3"></textarea></div>
      <button class="btn btn-primary btn-sm" onclick="saveContextTouchPoint()" ${logger.saving?'disabled':''}><i class="ti ti-device-floppy"></i> ${logger.saving?'Saving...':'Save touch point'}</button>
    </div>`;
  }
  return '';
}

function setContextCompany(companyId){
  const l = window.__ctxLogger;
  l.companyId = companyId;
  l.contactIds = [];
  l.mode = null;
  renderPage();
}
function setContextTouchType(type){
  window.__ctxLogger.touchType = type;
  window.__ctxLogger.mode = null;
  renderPage();
}
function setContextOtherType(val){ window.__ctxLogger.otherType = val; }
function setContextDate(val){ window.__ctxLogger.date = val; }
function toggleContextContact(contactId){
  const l = window.__ctxLogger;
  const idx = l.contactIds.indexOf(contactId);
  if(idx === -1) l.contactIds.push(contactId); else l.contactIds.splice(idx,1);
  l.mode = null;
  renderPage();
}
function skipContextDebrief(){
  window.__ctxLogger.mode = 'notes';
  renderPage();
}

async function getContextDebriefQuestions(){
  const l = window.__ctxLogger;
  l.mode = 'loading';
  renderPage();
  try {
    const res = await fetch('/api/context/debrief-questions', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ contactId: l.contactIds[0] })
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || ('Request failed with status '+res.status));
    l.debriefQuestions = data.questions || [];
    l.mode = l.debriefQuestions.length ? 'debrief' : 'notes';
  } catch(err){
    toast('Could not get AI questions: ' + err.message, 'warn');
    l.mode = 'notes';
  }
  renderPage();
}

async function saveContextTouchPoint(){
  const l = window.__ctxLogger;
  const data = window.__contextData;
  const company = data.companies.find(c => c.id === l.companyId);
  const contacts = data.contacts.filter(c => l.contactIds.includes(c.id));
  if(!company || !contacts.length) return;

  const type = l.touchType === 'Other' ? (l.otherType.trim() || 'Other') : l.touchType;
  const date = l.date || isoDate(TODAY);

  let notes = '';
  if(l.mode === 'debrief'){
    notes = l.debriefQuestions.map((q,i) => {
      const ans = (document.getElementById('ctxDebriefAnswer-'+i)?.value || '').trim();
      return ans ? `Q: ${q}\nA: ${ans}` : '';
    }).filter(Boolean).join('\n\n');
  } else {
    notes = (document.getElementById('ctxNotes')?.value || '').trim();
  }

  l.saving = true;
  renderPage();

  try {
    const res = await fetch('/api/airtable/touchpoint', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        contactRecordIds: l.contactIds,
        companyRecordId: l.companyId,
        type, date, notes,
        campaignId: window.__ctxCampaignTag ? window.__ctxCampaignTag.id : undefined,
        campaignName: window.__ctxCampaignTag ? window.__ctxCampaignTag.name : undefined
      })
    });
    const result = await res.json();
    if(!res.ok) throw new Error(result.error || ('Request failed with status '+res.status));

    toast('Touch point logged for ' + contacts.map(c=>c.name).join(', '), 'success');

    showContextUpdatingIndicator();
    fetch('/api/context/update-summaries', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        contactIds: l.contactIds, companyId: l.companyId,
        campaignName: window.__ctxCampaignTag ? window.__ctxCampaignTag.name : undefined
      })
    }).then(() => { hideContextUpdatingIndicator(); loadContextData(true); })
      .catch(() => hideContextUpdatingIndicator());

    initContextLogger();
    renderPage();
  } catch(err){
    l.saving = false;
    toast('Could not save touch point: ' + err.message, 'warn');
    renderPage();
  }
}

function handleContextConnectionsCsv(event){
  const file = event.target.files && event.target.files[0];
  event.target.value = '';
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const rows = parseCsv(String(reader.result));
    if(rows.length < 2){ toast('That CSV looks empty', 'warn'); return; }
    runContextConnectionsImport(rows);
  };
  reader.onerror = () => toast('Could not read that file', 'warn');
  reader.readAsText(file);
}

async function runContextConnectionsImport(rows){
  const resultEl = document.getElementById('ctxConnectionsResult');
  const headers = rows[0].map(h => h.trim().toLowerCase());
  const firstIdx = headers.indexOf('first name');
  const lastIdx = headers.indexOf('last name');
  if(firstIdx === -1 || lastIdx === -1){
    toast('CSV must have "First Name" and "Last Name" columns', 'warn');
    return;
  }

  const contacts = window.__contextData.contacts;
  const byName = {};
  contacts.forEach(c => {
    const key = c.name.trim().toLowerCase();
    (byName[key] = byName[key] || []).push(c);
  });

  const toUpdate = [];
  const flagged = [];
  let skippedOtherStage = 0;

  rows.slice(1).forEach(row => {
    const first = (row[firstIdx]||'').trim();
    const last = (row[lastIdx]||'').trim();
    if(!first && !last) return;
    const fullName = (first+' '+last).trim();
    const matches = byName[fullName.toLowerCase()] || [];
    if(matches.length !== 1){
      flagged.push(`Could not match "${esc(fullName)}" from CSV. No contact updated.`);
      return;
    }
    const contact = matches[0];
    // hasPendingConnection is account-wide (any campaign, not just the
    // active one) - Connection Requested -> Connected is shared across
    // every campaign a contact is in, per Campaign Contacts.
    if(!contact.hasPendingConnection){
      skippedOtherStage++;
      return;
    }
    toUpdate.push(contact);
  });

  if(resultEl) resultEl.innerHTML = `<div class="muted"><i class="ti ti-loader-2"></i> Updating ${toUpdate.length} contact${toUpdate.length===1?'':'s'}...</div>`;

  let updatedCount = 0;
  for(const contact of toUpdate){
    try {
      const res = await fetch('/api/context/contact-fields', {
        method: 'PATCH',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ contactId: contact.id, journeyStage: 'Connected', sequenceStage: 'Connected' })
      });
      if(res.ok) updatedCount++;
    } catch(err){
      console.warn('Connection update failed for', contact.name, err.message);
    }
  }

  if(resultEl){
    resultEl.innerHTML = `
      <p style="font-size:12.5px;font-weight:700;">${updatedCount} contact${updatedCount===1?'':'s'} updated &middot; ${flagged.length} not found</p>
      ${skippedOtherStage ? `<p class="muted" style="font-size:11.5px;margin-top:4px;">${skippedOtherStage} matched but not in "Connection Requested" - skipped.</p>` : ''}
      ${flagged.length ? `<ul style="padding-left:18px;font-size:11.5px;margin-top:6px;">${flagged.map(f=>`<li>${f}</li>`).join('')}</ul>` : ''}
    `;
  }
  toast(`${updatedCount} contacts updated from CSV`, updatedCount ? 'success' : 'warn');
  if(updatedCount) loadContextData(true);
}

/* ===================== TODAY'S ACTIONS (Home) ===================== */

function computeHealth(){
  const withBoth = state.contacts.filter(c=>c.connReqDate && c.connDate);
  const avgDays = withBoth.length ? Math.round(withBoth.reduce((s,c)=>s+daysBetween(c.connReqDate,c.connDate),0)/withBoth.length) : 0;
  let sent=0, replied=0;
  state.contacts.forEach(c=>{
    if(c.thread.m1){ sent++; if(c.thread.m1.replied) replied++; }
    if(c.thread.m2){ sent++; if(c.thread.m2.replied) replied++; }
  });
  const replyRate = sent ? Math.round(replied/sent*100) : 0;
  const connectedCount = state.contacts.filter(c=>c.connDate).length;
  const conversionRate = connectedCount ? Math.round(state.bookings.length/connectedCount*100) : 0;
  return { avgDays, replyRate, conversionRate };
}

function lastTouchPointDate(c){
  const points = c.touchPoints || [];
  if(!points.length) return null;
  return points.reduce((latest, tp) => (!latest || new Date(tp.date) > new Date(latest)) ? tp.date : latest, null);
}

/*
Today's actions rules, checked in priority order (first match wins, one action per contact):
- Booked, delivery >30 days ago, no touch point since delivery -> "Post-delivery check-in"
- Booked but not yet due for the above, no touch point in 21 days -> "Re-engage"
- Connected, no message sent yet, connected >2 days ago -> "Send first message"
- Messaging, last message got a reply but the next stage hasn't been sent in >3 days -> "Reply back"
- Messaging, last message sent has no reply after >5 days -> "Follow up"
- Connected/messaging, no touch point in 21 days -> "Re-engage"
*/
function activeCampaignForContact(c){
  return state.campaigns.find(camp => camp.status === 'Live' && campaignContacts(camp).some(cc => cc.id === c.id)) || null;
}

function getContactAction(c){
  const campaign = activeCampaignForContact(c);
  const natural = getNaturalContactAction(c);
  if(natural){
    if(campaign) natural.campaignName = campaign.name;
    return natural;
  }
  if(campaign){
    const lastTouch = lastTouchPointDate(c);
    const nextStage = c.thread.m2 ? 'cta' : (c.thread.m1 ? 'm2' : (c.connDate ? 'm1' : 'connect'));
    return { type:'Campaign outreach', stage: nextStage, daysSinceTouch: lastTouch ? daysBetween(lastTouch) : null, campaignName: campaign.name };
  }
  return null;
}

function getNaturalContactAction(c){
  if(c.state === 'found' || c.state === 'opened') return null;

  const lastTouch = lastTouchPointDate(c);
  const daysSince = (dateStr) => dateStr ? daysBetween(dateStr) : null;

  if(c.thread.booked){
    if(c.thread.bookedDate){
      const daysSinceDelivery = daysSince(c.thread.bookedDate);
      const touchSinceDelivery = lastTouch && new Date(lastTouch) >= new Date(c.thread.bookedDate);
      if(daysSinceDelivery !== null && daysSinceDelivery > 30 && !touchSinceDelivery){
        return { type:'Post-delivery check-in', stage:'cta', daysSinceTouch: lastTouch ? daysSince(lastTouch) : daysSinceDelivery };
      }
    }
    const days = daysSince(lastTouch || c.thread.bookedDate || c.connDate || c.foundDate);
    if(days !== null && days > 21){
      return { type:'Re-engage', stage:'cta', daysSinceTouch: days };
    }
    return null;
  }

  if(c.state === 'connected' && !c.thread.m1){
    const days = daysSince(c.connDate);
    if(days !== null && days > 2){
      return { type:'Send first message', stage:'m1', daysSinceTouch: lastTouch ? daysSince(lastTouch) : days };
    }
  }

  if(c.state === 'messaging'){
    if(c.thread.m2 && c.thread.m2.replied && !c.thread.cta){
      const days = daysSince(c.thread.m2.sent);
      if(days !== null && days > 3) return { type:'Reply back', stage:'cta', daysSinceTouch: days };
    } else if(c.thread.m1 && c.thread.m1.replied && !c.thread.m2){
      const days = daysSince(c.thread.m1.sent);
      if(days !== null && days > 3) return { type:'Reply back', stage:'m2', daysSinceTouch: days };
    }

    const lastStep = c.thread.m2 || c.thread.m1;
    if(lastStep && !lastStep.replied){
      const days = daysSince(lastTouch || lastStep.sent);
      if(days !== null && days > 5){
        const nextStage = c.thread.m2 ? 'cta' : 'm2';
        return { type:'Follow up', stage: nextStage, daysSinceTouch: days };
      }
    }
  }

  const days = daysSince(lastTouch || c.connDate || c.foundDate);
  if(days !== null && days > 21){
    const nextStage = c.thread.m2 ? 'cta' : (c.thread.m1 ? 'm2' : 'm1');
    return { type:'Re-engage', stage: nextStage, daysSinceTouch: days };
  }

  return null;
}

function computeTodaysActions(){
  return state.contacts
    .map(c => { const action = getContactAction(c); return action ? { contact:c, ...action } : null; })
    .filter(Boolean)
    .sort((a,b) => (b.daysSinceTouch||0) - (a.daysSinceTouch||0));
}

async function generateContactBrief(cid){
  const c = state.contacts.find(x => x.id === cid);
  const action = (window.__todaysActions || {})[cid];
  if(!c || !action) return;

  const method = recommendedMethodForAction(action);
  const panel = document.getElementById('brief-' + cid);
  const btn = document.getElementById('briefBtn-' + cid);
  if(!panel) return;
  const original = btn ? btn.innerHTML : '';
  if(btn){ btn.disabled = true; btn.innerHTML = '<i class="ti ti-loader-2"></i> Generating...'; }
  panel.style.display = 'block';
  panel.innerHTML = '<div class="muted" style="font-size:12.5px;"><i class="ti ti-loader-2"></i> Generating brief...</div>';

  const touchHistory = (c.touchPoints || []).slice().sort((x,y)=>new Date(x.date)-new Date(y.date))
    .map(tp => `${tp.date} — ${tp.type}${tp.communicationMethod ? ' ('+tp.communicationMethod+')' : ''}: ${tp.notes || 'no notes'}${(tp.painPoints && tp.painPoints.length) ? ' [pain points: '+tp.painPoints.join(', ')+']' : ''}`)
    .join('\n') || 'No touch points logged yet.';

  const isMessage = method === 'LinkedIn message' || method === 'Email';

  const prompt = `Contact: ${c.name}, ${c.role} at ${c.company}.
Journey stage: ${c.state}.
Pain points on file: ${(c.painPoints && c.painPoints.length) ? c.painPoints.join(', ') : 'none logged'}.
Today's recommended action: ${action.type}.
Recommended communication method: ${method}.

Full touch point history:
${touchHistory}

${isMessage
  ? `Write a ready-to-send ${method === 'LinkedIn message' ? 'LinkedIn message' : 'email'} for this contact given the above. ${voiceRulesText()} Return only the message text.`
  : `Write a short prep brief for a ${method.toLowerCase()} with this contact. Return 3-4 bullet points covering what to cover, what to reference from the history above, and what to avoid. Return only the bullet points, one per line, each starting with "- ".`}`;

  const result = await callAI(prompt, 400, () => localBriefFallback(c, action, method, isMessage));

  window.__contactBriefs = window.__contactBriefs || {};
  window.__contactBriefs[cid] = { result, isMessage, method };
  panel.innerHTML = renderBriefPanelHtml(cid, result, isMessage);
  if(btn){ btn.disabled = false; btn.innerHTML = original; }

  const date = isoDate(TODAY);
  const tpType = TOUCH_POINT_TYPES.includes(method) ? method : 'LinkedIn message';
  if(!c.touchPoints) c.touchPoints = [];
  c.touchPoints.push({ id: uid('tp'), date, type: tpType, communicationMethod: method, notes: 'AI-generated brief', painPoints: [], aiBrief: result });

  fetch('/api/airtable/touchpoint', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      contactName: c.name,
      company: c.company,
      date,
      type: tpType,
      notes: 'AI-generated brief',
      outcome: 'No reply',
      communicationMethod: method,
      aiBrief: result
    })
  }).catch(err => console.warn('Airtable brief sync failed:', err.message));

  toast('Brief generated', 'success');
}

function localBriefFallback(c, action, method, isMessage){
  const painPoint = (c.painPoints && c.painPoints[0]) || null;
  if(isMessage){
    const opener = painPoint
      ? `Last time we touched on ${painPoint.toLowerCase()}, keen to hear how that is tracking.`
      : `Keen to hear how things are tracking on your end.`;
    return `Hi ${firstName(c.name)}, following up given where things are with ${c.company}. ${opener}\n\nMarcus`;
  }
  return [
    `- Cover: where things stand since the last touch point and next steps for ${c.company}.`,
    `- Reference: ${painPoint ? painPoint.toLowerCase() : 'their current priorities'}, which came up in an earlier conversation.`,
    `- Avoid: being pushy about next steps if they have not engaged much yet.`,
    `- Aim: leave with a clear next step or date to follow up.`
  ].join('\n');
}

function renderBriefPanelHtml(cid, text, isMessage){
  return `
    <div class="intel-draft">
      <div class="intel-draft-head">
        <div class="intel-draft-name">${isMessage ? 'Drafted message' : 'Call brief'}</div>
        <button class="btn btn-secondary btn-sm" onclick="copyContactBrief('${cid}')"><i class="ti ti-copy"></i> Copy</button>
      </div>
      <div class="intel-draft-text">${esc(text)}</div>
    </div>`;
}

async function copyContactBrief(cid){
  const entry = window.__contactBriefs && window.__contactBriefs[cid];
  if(!entry || !entry.result) return;
  try {
    await navigator.clipboard.writeText(entry.result);
  } catch(err){
    const ta = document.createElement('textarea');
    ta.value = entry.result;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  }
  toast('Brief copied to clipboard', 'success');
}

async function findCompanyLinkedInPages(){
  const grid = currentGrid();
  const btn = document.getElementById('findCompanyLinkedInBtn');
  const original = btn.innerHTML;
  btn.disabled = true;

  let foundCount = 0;
  let searchedCount = 0;
  for(let i=0; i<grid.companies.length; i++){
    const company = grid.companies[i];
    if(grid.companyLinkedIn[company] && grid.companyLinkedIn[company].linkedinUrl) continue;
    searchedCount++;
    btn.innerHTML = `<i class="ti ti-loader-2"></i> Searching ${i+1}/${grid.companies.length}...`;
    try {
      const res = await fetch(`/api/search-company-linkedin?company=${encodeURIComponent(company)}`);
      const data = await res.json();
      if(data.found && data.linkedinUrl){
        grid.companyLinkedIn[company] = { linkedinUrl: data.linkedinUrl, linkedinSlug: data.slug || null };
        foundCount++;
      }
    } catch(err){
      console.warn('Company LinkedIn search failed for', company, err.message);
    }
    if(i < grid.companies.length - 1) await sleep(300);
  }

  btn.disabled = false;
  btn.innerHTML = original;

  if(searchedCount === 0){
    toast('Every company already has a LinkedIn page on file', 'warn');
    return;
  }

  renderPage();
  toast(`Found LinkedIn pages for ${foundCount} of ${searchedCount} companies searched`, foundCount ? 'success' : 'warn');

function parseCsv(text){
  const rows = [];
  let row = [];
  let field = '';
  let inQuotes = false;
  for(let i=0; i<text.length; i++){
    const ch = text[i];
    if(inQuotes){
      if(ch === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      } else {
        field += ch;
      }
      continue;
    }
    if(ch === '"'){ inQuotes = true; }
    else if(ch === ','){ row.push(field); field = ''; }
    else if(ch === '\n'){ row.push(field); rows.push(row); row = []; field = ''; }
    else if(ch === '\r'){ /* skip, \n handles the line break */ }
    else { field += ch; }
  }
  if(field !== '' || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.some(f => f.trim() !== ''));
}

function handleCsvImport(event){
  const file = event.target.files && event.target.files[0];
  event.target.value = '';
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const rows = parseCsv(String(reader.result));
    if(rows.length < 1){ toast('That CSV looks empty', 'warn'); return; }
    openCsvColumnModal(rows);
  };
  reader.onerror = () => toast('Could not read that file', 'warn');
  reader.readAsText(file);
}

function openCsvColumnModal(rows){
  const headers = rows[0];
  const dataRows = rows.slice(1);
  window.__csvImportRows = dataRows;
  const body = `
    <div class="field">
      <label>Which column contains the company names?</label>

        ${headers.map((h,i) => `<option value="${i}">${esc(h.trim() || 'Column '+(i+1))}</option>`).join('')}
      </select>
    </div>
    <p class="muted" style="font-size:12px;">${dataRows.length} row${dataRows.length===1?'':'s'} found in this file.</p>
  `;
  const footer = `
    <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary" onclick="confirmCsvImport()"><i class="ti ti-check"></i> Import companies</button>
  `;
  openModal('Import companies from CSV', body, footer);
}

function confirmCsvImport(){
  const grid = currentGrid();
  const colIdx = parseInt(document.getElementById('csvCompanyColumn').value);
  const rows = window.__csvImportRows || [];
  const seen = new Set(grid.companies.map(c => c.toLowerCase()));
  let addedCount = 0;
  rows.forEach(r => {
    const val = (r[colIdx] || '').trim();
    if(!val) return;
    const key = val.toLowerCase();
    if(seen.has(key)) return;
    seen.add(key);
    grid.companies.push(val);
    addedCount++;
  });
  if(addedCount) touchGrid(grid.id);
  closeModal();
  if(addedCount) renderPage();
  toast(addedCount + ' compan' + (addedCount===1?'y':'ies') + ' added from CSV', addedCount ? 'success' : 'warn');
}

function sleep(ms){ return new Promise(resolve => setTimeout(resolve, ms)); }

async function runDailySearch(){
  const grid = currentGrid();
  const cols = grid.columns;
  const emptyCells = [];
  grid.companies.forEach(company => cols.forEach(role => { if(!findContact(company, role)) emptyCells.push({company, role}); }));
  if(!emptyCells.length){ toast('No open roles left to search — every cell has a contact','warn'); return; }

  const btn = document.getElementById('runSearchBtn');
  if(btn){ btn.disabled = true; btn.innerHTML = '<i class="ti ti-loader-2"></i> Searching...'; }

  emptyCells.forEach(({company,role}) => {
    const td = document.querySelector(`.cell-empty[data-company="${cssEscape(company)}"][data-role="${cssEscape(role)}"]`);
    if(td) td.outerHTML = `<div class="cell-searching" data-company="${esc(company)}" data-role="${esc(role)}"><i class="ti ti-loader-2"></i>&nbsp;Searching...</div>`;
  });

  let foundCount = 0;
  for(let i=0; i<emptyCells.length; i++){
    const { company, role } = emptyCells[i];
    const cellEl = document.querySelector(`.cell-searching[data-company="${cssEscape(company)}"][data-role="${cssEscape(role)}"]`);
    try {
      const res = await fetch(`${SEARCH_API_URL}?company=${encodeURIComponent(company)}&jobTitle=${encodeURIComponent(role)}`);
      if(!res.ok) throw new Error('Search endpoint returned '+res.status);
      const data = await res.json();
      if(data.found && data.name && data.url){
        const seqId = role === 'Digital and Tech' ? 'digitalTech' : 'seniorLeaders';
        const newContact = {
          id: uid('c'), gridId: grid.id, name: data.name, company, role, url: data.url,
          seqId, state:'found', foundDate: isoDate(TODAY), connReqDate:null, connDate:null, notes:'',
          thread:{ connSent:null, m1:null, m2:null, cta:null, booked:false }, generated:{}, touchPoints:[]
        };
        state.contacts.push(newContact);
        foundCount++;
        touchGrid(grid.id);
        if(cellEl) cellEl.outerHTML = renderGridCellHTML(newContact);
        notifyWebhook(newContact);
      } else {
        if(cellEl) cellEl.outerHTML = `<div class="cell-empty" data-company="${esc(company)}" data-role="${esc(role)}" title="Couldn't find a verified LinkedIn profile — try an alternative search method">No confident match — try again</div>`;
      }
    } catch(err){
      console.warn('Search failed for', company, role, err.message);

async function syncAllContactsToAirtable(){
  const grid = currentGrid();
  const contacts = gridContacts(grid.id);
  if(!contacts.length){ toast('No contacts to sync yet', 'warn'); return; }

  const btn = document.getElementById('syncAirtableBtn');
  const original = btn.innerHTML;
  btn.disabled = true;

  let syncedCount = 0;
  for(let i=0; i<contacts.length; i++){
    const contact = contacts[i];
    btn.innerHTML = `<i class="ti ti-loader-2"></i> Syncing contact ${i+1}/${contacts.length}...`;
    try {
      const res = await fetch('/api/airtable/contact', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: contact.name,
          company: contact.company,
          role: contact.role,
          linkedinUrl: contact.url,
          state: contact.state,
          icpRoleCategory: contact.role,
          notes: contact.notes || '',
          companyLinkedinUrl: companyLinkedInUrl(contact.company),
          gridName: grid.name
        })
      });
      if(res.ok) syncedCount++;
    } catch(err){
      console.warn('Airtable sync failed for', contact.name, err.message);
    }
    if(i < contacts.length - 1) await sleep(250);
  }

  let companySyncedCount = 0;
  for(let i=0; i<grid.companies.length; i++){
    const company = grid.companies[i];
    btn.innerHTML = `<i class="ti ti-loader-2"></i> Syncing company ${i+1}/${grid.companies.length}...`;
    try {
      const res = await fetch('/api/airtable/company', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: company, gridName: grid.name })
      });
      if(res.ok) companySyncedCount++;
    } catch(err){
      console.warn('Airtable company sync failed for', company, err.message);
    }
    if(i < grid.companies.length - 1) await sleep(250);
  }

  const linkedCompanyNames = Object.keys(grid.companyLinkedIn).filter(name => {
    const entry = grid.companyLinkedIn[name];
    return entry && entry.linkedinUrl && entry.linkedinSlug;
  });
  for(let i=0; i<linkedCompanyNames.length; i++){
    const companyName = linkedCompanyNames[i];
    const entry = grid.companyLinkedIn[companyName];
    btn.innerHTML = `<i class="ti ti-loader-2"></i> Syncing LinkedIn ${i+1}/${linkedCompanyNames.length}...`;
    try {
      await fetch('/api/airtable/company/linkedin', {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ companyName, linkedinUrl: entry.linkedinUrl, linkedinSlug: entry.linkedinSlug })
      });
    } catch(err){
      console.warn('Airtable company LinkedIn sync failed for', companyName, err.message);
    }
    if(i < linkedCompanyNames.length - 1) await sleep(250);
  }

  btn.disabled = false;
  btn.innerHTML = original;
  const allSynced = syncedCount === contacts.length && companySyncedCount === grid.companies.length;
  toast(`${syncedCount} contacts and ${companySyncedCount} companies synced to Airtable`, allSynced ? 'success' : 'warn');
}

const JOURNEY_STAGE_TO_STATE = { 'Identified':'found', 'Connected':'connected', 'Messaging':'messaging', 'Booked':'booked' };

async function hydrateContactsFromAirtable(){
  try {
    const res = await fetch('/api/airtable/contact');
    const records = await res.json();
    if(!res.ok) throw new Error((records && records.error) || ('Request failed with status '+res.status));
    if(!Array.isArray(records) || !records.length) return;

    state.contacts = records.map(r => {
      const f = r.fields || {};
      const role = f['Job Title'] || '';
      return {
        id: r.id || uid('c'),
        gridId: resolveGridIdByName(f['Grid Name']),
        name: f['Full Name'] || '',
        company: f['Company'] || '',
        role: role,
        url: f['LinkedIn URL'] || '',
        seqId: role === 'Digital and Tech' ? 'digitalTech' : 'seniorLeaders',
        state: JOURNEY_STAGE_TO_STATE[f['Journey Stage']] || 'found',
        foundDate: isoDate(TODAY),
        connReqDate: null,
        connDate: null,
        notes: f['Notes'] || '',
        thread: { connSent:null, m1:null, m2:null, cta:null, booked:false },
        generated: {},
        touchPoints: []
      };
    });

    renderPage();
    toast('Contacts loaded from Airtable', 'success');
  } catch(err){
    console.warn('Could not load contacts from Airtable:', err.message);
  }
}

function csvField(val){
  const str = String(val ?? '');
  if(/[",\r\n]/.test(str)) return '"' + str.replace(/"/g,'""') + '"';
  return str;
}

const EXPORTABLE_STATES = ['found','opened','connected','messaging','booked'];

function exportContactsCsv(){
  const gridId = currentGrid().id;
  const rows = gridContacts(gridId).filter(c => EXPORTABLE_STATES.includes(c.state) && c.url && c.url.trim());
  if(!rows.length){ toast('No found contacts to export yet', 'warn'); return; }

  const header = ['Name','Company','Domain','LinkedIn URL'];
  const lines = [header.map(csvField).join(',')];
  rows.forEach(c => {
    lines.push([c.name, c.company, companyDomain(c.company), c.url].map(csvField).join(','));
  });
  const csvContent = lines.join('\r\n');

  const filename = `T2C_contacts_${isoDate(TODAY)}.csv`;
  const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);

  toast(rows.length+' contact'+(rows.length===1?'':'s')+' exported to '+filename, 'success');
}

function onConnectionsDrop(e){
  e.preventDefault();
  document.getElementById('dropZoneUpload').classList.remove('dragover');
  const files = Array.from(e.dataTransfer.files || []).filter(f => f.type.startsWith('image/'));
  if(files.length) processConnectionsFiles(files);

function handleConnectionsUpload(e){
  const files = Array.from(e.target.files || []);
  if(files.length) processConnectionsFiles(files);
  e.target.value = '';

function processConnectionsFiles(files){
  window.__connectionsShots = window.__connectionsShots || [];
  let pending = files.length;
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = () => {
      const match = String(reader.result).match(/^data:([^;]+);base64,(.*)$/);
      if(match){
        window.__connectionsShots.push({ name: file.name, mediaType: match[1], base64: match[2] });
      }
      pending--;
      if(pending === 0){
        renderConnectionsShotFiles();
        toast(files.length+' screenshot'+(files.length===1?'':'s')+' attached', 'success');
      }
    };
    reader.readAsDataURL(file);
  });
}
function renderConnectionsShotFiles(){
  const el = document.getElementById('connectionsShotFiles');
  if(!el) return;
  el.innerHTML = (window.__connectionsShots || []).map((f,i) => `<span class="shot-file-chip">${esc(f.name)}<button onclick="removeConnectionsShot(${i})">&times;</button></span>`).join('');
}
function removeConnectionsShot(idx){
  window.__connectionsShots.splice(idx,1);
  renderConnectionsShotFiles();
}

async function readConnectionsScreenshot(){
  const shots = window.__connectionsShots || [];
  const candidates = state.contacts.filter(c => (c.state==='found' || c.state==='opened') && !c.connDate);
  if(!candidates.length){ toast('No pending contacts to match against a screenshot','warn'); return; }

  const btn = document.getElementById('readConnectionsBtn');
  const original = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<i class="ti ti-loader-2"></i> Reading...';

  if(!shots.length){
    demoMatchConnections(candidates);
    btn.disabled = false;
    btn.innerHTML = original;
    return;
  }

  const list = candidates.map(c => `${c.id}: ${c.name} (${c.company})`).join('\n');
  const prompt = `Here is a screenshot of a LinkedIn connections list. Cross-reference the names visible in the screenshot against this list of contacts awaiting connection acceptance:\n${list}\n\nReturn ONLY a JSON array of the contact ids (e.g. ["c4","c9"]) whose names appear in the screenshot as accepted connections. If none appear, return [].`;
  const images = shots.map(f => ({ mediaType: f.mediaType, base64: f.base64 }));
  const raw = await callAI(prompt, 200, null, images);

  btn.disabled = false;
  btn.innerHTML = original;

  if(raw === null){
    demoMatchConnections(candidates);
    return;
  }

  let matchedIds = [];
  try {
    const jsonMatch = raw.match(/\[[\s\S]*\]/);
    matchedIds = JSON.parse(jsonMatch ? jsonMatch[0] : raw);
  } catch(e){ matchedIds = []; }

  const matched = candidates.filter(c => matchedIds.includes(c.id));
  if(!matched.length){
    toast("Couldn't match anyone from that screenshot — try a clearer image", 'warn');
    return;
  }

  markContactsConnected(matched);
  toast(`${matched.length} contact${matched.length===1?'':'s'} matched and marked as connected: ${matched.map(p=>p.name).join(', ')}`, 'success');
  renderPage();
}

function demoMatchConnections(candidates){
  const picks = candidates.slice(0,2);
  markContactsConnected(picks);
  toast(`${picks.length} contacts matched and marked as connected: ${picks.map(p=>p.name).join(', ')}`, 'success');
  renderPage();
}

function markContactsConnected(contacts){
  contacts.forEach(c => {
    c.state = 'connected';
    c.connReqDate = c.connReqDate || isoDate(TODAY);
    c.connDate = isoDate(TODAY);
    c.thread.connSent = isoDate(TODAY);
    state.activity.unshift({ type:'connected', text:`${c.name} (${c.company}) accepted your connection`, date: isoDate(TODAY) });
    notifyWebhook(c);
  });
}

const COMMUNICATION_METHODS = ['LinkedIn message','Email','Call','Meeting','Event invite','Content share'];

function renderTouchPoints(c){

function addTouchPoint(cid) {
  const c = state.contacts.find(x => x.id === cid);
  const date = document.getElementById('tpDate-' + cid).value || isoDate(TODAY);
  const type = document.getElementById('tpType-' + cid).value;
  const methodEl = document.getElementById('tpMethod-' + cid);
  const communicationMethod = methodEl ? methodEl.value : '';
  const outcomeEl = document.getElementById('tpOutcome-' + cid);
  const outcome = outcomeEl ? outcomeEl.value : 'No reply';
  const notes = document.getElementById('tpNotes-' + cid).value.trim();
  const painPointsEl = document.getElementById('tpPainPoints-' + cid);
  const selectedPainPoints = painPointsEl ? Array.from(painPointsEl.querySelectorAll('input:checked')).map(el => el.value) : [];

  if (!c.touchPoints) c.touchPoints = [];
  c.touchPoints.push({ id: uid('tp'), date, type, communicationMethod, outcome, notes, painPoints: selectedPainPoints });

  if (selectedPainPoints.length) {
    if (!c.painPoints) c.painPoints = [];
    selectedPainPoints.forEach(p => { if (!c.painPoints.includes(p)) c.painPoints.push(p); });
  }

  // Sync touch point to Airtable (outcome "Replied" gets flagged on the record server-side)
  fetch('/api/airtable/touchpoint', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      contactName: c.name,
      company: c.company,
      date,
      type,
      notes,
      outcome,
      communicationMethod
    })
  }).catch(err => console.warn('Airtable touch point sync failed:', err.message));

  if (outcome === 'Meeting Booked') {
    trackConversion(c, date, communicationMethod);
  }

  // Default next-touch cadence: 7 days on from this touch point
  const nextTouchDate = addDays(date, 7);
  fetch('/api/airtable/contact/stage', {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      contactName: c.name,
      company: c.company,
      nextTouchDate,
      painPoints: selectedPainPoints
    })
  }).catch(err => console.warn('Airtable next-touch sync failed:', err.message));

  notifyWebhook(c);
  toast('Touch point logged', 'success');
  renderPage();
}

function trackConversion(c, bookedDate, communicationMethod){
  const touchPoints = (c.touchPoints || []).slice().sort((a,b)=>new Date(a.date)-new Date(b.date));
  const firstTouchDate = touchPoints.length ? touchPoints[0].date : bookedDate;
  const campaign = activeCampaignForContact(c);

  fetch('/api/track/conversion', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      contactName: c.name,
      company: c.company,
      icpRole: c.role,
      industry: companyIndustry(c.company),
      campaign: campaign ? campaign.name : '',
      product: campaign ? (campaign.product || '') : '',
      touchPointCount: touchPoints.length,
      daysToConvert: daysBetween(firstTouchDate, bookedDate),
      communicationMethod
    })
  }).catch(err => console.warn('Conversion tracking sync failed:', err.message));
}

function recommendedProducts(c){
  const industry = companyIndustry(c.company);
  const touchCount = (c.touchPoints || []).length;
  return (state.settings.products || []).filter(p => {
    const roles = p.targetRoles || [];
    const industries = p.targetIndustries || [];
    const roleMatch = !roles.length || roles.some(r => r.trim().toLowerCase() === c.role.toLowerCase());
    const industryMatch = !industries.length || industries.some(i => i.trim().toLowerCase() === industry.toLowerCase());
    const touchMatch = touchCount >= (parseInt(p.minTouchPoints) || 0);
    return roleMatch && industryMatch && touchMatch;
  });
}

function renderRecommendedProducts(c){
  const matches = recommendedProducts(c);
  return `

let dragCardId = null;
function initRoadmapDrag(){}
function onCardDragStart(e, id){ dragCardId = id; e.target.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; }
function onCardDragEnd(e){ e.target.classList.remove('dragging'); }
function onColDragOver(e){ e.preventDefault(); }
function onColDrop(e, colKey){
  e.preventDefault();
  if(!dragCardId) return;
  const c = state.contacts.find(x=>x.id===dragCardId);
  if(!c) return;
  const fromCol = getRoadmapColumn(c);
  if(fromCol === colKey){ dragCardId=null; return; }
  const order = ['pending','made','messaging','booked'];
  const forward = order.indexOf(colKey) > order.indexOf(fromCol);

  if(colKey === 'made'){
    c.state = 'connected';
    c.connReqDate = c.connReqDate || isoDate(TODAY);
    c.connDate = isoDate(TODAY);
    c.thread.connSent = isoDate(TODAY);
    state.activity.unshift({ type:'connected', text:`${c.name} (${c.company}) accepted your connection`, date: isoDate(TODAY) });
    notifyWebhook(c);
    renderPage();
  } else if(colKey === 'messaging'){
    if(forward) openGenerateModal(c.id, c.thread.m1 ? 'm2' : 'm1', ()=>renderPage());
    else { c.state='messaging'; renderPage(); }
  } else if(colKey === 'booked'){
    openBookingModal(c.id);
  } else if(colKey === 'pending'){
    c.state = 'found'; c.connDate=null; c.thread.connSent=null;
    renderPage();
  }
  dragCardId = null;
}

async function generateTemplate(seqId, stageKey){
  const seq = state.sequences.find(s=>s.id===seqId);
  const st = STAGE_META.find(s=>s.key===stageKey);
  const btn = event.target.closest('button');
  const original = btn.innerHTML;
  btn.innerHTML = '<i class="ti ti-loader-2"></i> Generating...';
  btn.disabled = true;
  const prompt = `Write a LinkedIn outreach template for the "${st.label}" stage of a sequence targeting ${seq.roles.join(', ') || 'senior leaders'} at WA companies.\n\n${ctaStrategyNote(stageKey)}\n\n${voiceRulesText()}\n\nUse {{first}}, {{company}}, {{role}} as placeholders. Return only the message text.`;
  const result = await callAI(prompt, 300, ()=>localTemplateFallback(seq, stageKey));
  document.getElementById(`tpl-${seqId}-${stageKey}`).value = result;
  seq.stages[stageKey] = result;
  btn.innerHTML = original;
  btn.disabled = false;
  toast('Template generated for '+st.label, 'success');
}

function voiceRulesText(){
  const v = state.settings.strategy;
  return `Voice rules: UK English, no em dashes, ${v.tone.toLowerCase()} tone, one observation and one question per message, 3 to 4 sentences, signed off "Marcus", conditional CTA framing (never pushy). Connection requests should be ${v.connLength.toLowerCase()}. Follow-up cadence is ${v.cadence.toLowerCase()}. ${v.voiceInstructions}`;
}

function messageNumberForStage(stageKey){
  return { m1:1, m2:2, cta:3 }[stageKey] || 0;
}

function ctaStrategyNote(stageKey){
  const n = parseInt(state.settings.strategy.messagesBeforeCta) || 2;
  const num = messageNumberForStage(stageKey);
  if(stageKey === 'cta'){
    return `Strategy: this is the CTA ask (message ${num} in the sequence). Per the outreach strategy the CTA should land by message ${n}, so make the ask directly here${num > n ? ", it's already overdue so don't hold back" : ''}.`;
  }
  if(!num) return '';
  if(num >= n){
    return `Strategy: the outreach strategy says the CTA should be introduced by message ${n}. This is message ${num}, so it's fine to start gently pointing toward the CTA if the moment fits, without being pushy about it.`;
  }
  return `Strategy: the outreach strategy says the CTA shouldn't appear until message ${n}. This is message ${num}, so keep this purely relationship-building, no CTA mention yet.`;
}

function ctaNudgeLine(){
  const magnet = state.settings.leadMagnets.find(m=>m.enabled);
  return magnet ? `By the way, if it's useful I've got a short ${magnet.name} that might be worth a look.` : '';
}

function appendCtaNudge(text, stageKey){
  if(!text || !stageKey || stageKey === 'cta' || stageKey === 'connect') return text;
  const n = parseInt(state.settings.strategy.messagesBeforeCta) || 2;
  if(messageNumberForStage(stageKey) < n) return text;
  const nudge = ctaNudgeLine();
  if(!nudge) return text;
  if(/\n\nMarcus\s*$/.test(text)) return text.replace(/\n\nMarcus\s*$/, `\n\n${nudge}\n\nMarcus`);
  return text + `\n\n${nudge}`;
}

function localTemplateFallback(seq, stageKey){
  const fallbacks = {
    connect: "Hi {{first}}, I work with {{role}}s across WA and came across your profile at {{company}}. Would be good to connect.\n\nMarcus",
    m1: "Thanks for connecting, {{first}}. Curious how things are tracking at {{company}} at the moment. What's top of mind for you right now?\n\nMarcus",
    m2: "No worries if you're flat out, {{first}}. A few {{role}}s I've spoken with lately have found it useful to get a quick outside read on their delivery rhythm. Worth a look for you?\n\nMarcus",
    cta: "If it's useful, {{first}}, I've got a short Change Value Check that gives a clear picture in under 15 minutes, no pitch. Happy to send it through.\n\nMarcus"
  };
  return appendCtaNudge(fallbacks[stageKey], stageKey);
}

function onChipDrop(e, seqId, stageKey){

  if(!c) return;
  const order = ['connect','m1','m2','cta'];
  const currentStage = contactStageKey(c);

  const forward = order.indexOf(stageKey) > order.indexOf(currentStage);
  if(forward){
    openGenerateModal(c.id, stageKey, ()=>renderPage());
  } else {
    if(stageKey==='connect'){ c.connDate=null; c.thread.connSent=null; c.thread.m1=null; c.thread.m2=null; c.thread.cta=null; c.state='found'; }
    if(stageKey==='m1'){ c.thread.m2=null; c.thread.cta=null; c.state='connected'; }
    if(stageKey==='m2'){ c.thread.cta=null; }
    renderPage();
  }
  dragChipId = null;
}

function screenshotBoxHtml(kind, hint){
