// Distinct Job Title values already on file, from the same state.contacts
// the contact search above reads (no extra fetch needed - it's already
// loaded whenever the Logger tab is usable at all). Feeds both the
// datalist on the job title input and the fuzzy "did you mean" check
// below, so a typo doesn't quietly create a near-duplicate title.
function loggerDistinctJobTitles(){
  const seen = new Set();
  const titles = [];
  state.contacts.forEach(c => {
    const t = (c.role || '').trim();
    if(t && !seen.has(t.toLowerCase())){ seen.add(t.toLowerCase()); titles.push(t); }
  });
  return titles.sort((a,b) => a.localeCompare(b));
}

// Plain Levenshtein edit distance - small and self-contained rather than
// pulling in a fuzzy-match library for one field.
function levenshteinDistance(a, b){
  a = a.toLowerCase(); b = b.toLowerCase();
  const m = a.length, n = b.length;
  if(!m) return n;
  if(!n) return m;
  const dp = Array.from({length: m+1}, () => new Array(n+1).fill(0));
  for(let i=0;i<=m;i++) dp[i][0] = i;
  for(let j=0;j<=n;j++) dp[0][j] = j;
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++){
      dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1] : 1 + Math.min(dp[i-1][j-1], dp[i-1][j], dp[i][j-1]);
    }
  }
  return dp[m][n];
}

// Flags an existing job title that's close-but-not-identical to what was
// just typed (e.g. "Change Mananger" vs an on-file "Change Manager") so the
// rep can correct it before it becomes a near-duplicate value in Airtable.
// Doesn't fire for a short/empty query or an already-exact match (case
// insensitive) - nothing useful to suggest in either case.
function checkLoggerJobTitleSuggestion(){
  const el = document.getElementById('loggerJobTitleSuggestion');
  if(!el) return;
  const typed = (document.getElementById('loggerNewContactRole')?.value || '').trim();
  if(typed.length < 3){ el.innerHTML = ''; return; }

  const existing = loggerDistinctJobTitles();
  if(existing.some(t => t.toLowerCase() === typed.toLowerCase())){ el.innerHTML = ''; return; }

  let best = null, bestSimilarity = 0;
  existing.forEach(t => {
    const distance = levenshteinDistance(typed, t);
    const similarity = 1 - distance / Math.max(typed.length, t.length);
    if(similarity > bestSimilarity){ bestSimilarity = similarity; best = t; }
  });

  el.innerHTML = (best && bestSimilarity >= 0.75)
    ? `<span class="muted">Did you mean <a href="#" onclick="acceptLoggerJobTitleSuggestion('${esc(best).replace(/'/g,"\\'")}');return false;" style="font-weight:700;">${esc(best)}</a>?</span>`
    : '';
}

function acceptLoggerJobTitleSuggestion(title){
  const input = document.getElementById('loggerNewContactRole');
  if(input) input.value = title;
  const el = document.getElementById('loggerJobTitleSuggestion');
  if(el) el.innerHTML = '';
}

// Same create-or-update contact route the Grid "Add contact" modal uses
// (POST /api/airtable/contact) - if the name+company already exists in
// Airtable this just resolves to that existing record rather than
// duplicating it. Job title is required (unlike the Grid's own "Add
// contact" modal) - Logger is meant for fast one-off capture, where a
// blank title is the easiest way for data to get messy fast; if it
// genuinely doesn't match anything on file yet, that's fine, it's created
// as a new value (the create call below already passes typecast:true).
async function loggerCreateInlineContact(){
  const name = (document.getElementById('loggerNewContactName')?.value || '').trim();
  const company = (document.getElementById('loggerNewContactCompany')?.value || '').trim();
  const role = (document.getElementById('loggerNewContactRole')?.value || '').trim();
  const linkedinUrl = (document.getElementById('loggerNewContactUrl')?.value || '').trim();
  if(!name || !company || !role){ toast('Name, company and job title are required', 'warn'); return; }

  try {
    const res = await fetch('/api/airtable/contact', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ name, company, role, linkedinUrl })
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || ('Request failed with status '+res.status));

    if(!state.contacts.some(c => c.id === data.recordId)){
      // Same full shape createManualGridContact uses (gridId resolved from
      // company, same as hydrateContactsFromAirtable does on a real reload)
      // - every other reader of state.contacts (Today's Actions on Home in
      // particular) assumes every contact has thread/state/seqId etc. and
      // throws on one that doesn't, so a partial object here isn't safe
      // even though the Logger itself never reads those fields.
      state.contacts.push({
        id: data.recordId, gridId: resolveGridIdByCompany(company), name, company, role, url: linkedinUrl,
        seqId: role === 'Digital and Tech' ? 'digitalTech' : 'seniorLeaders', state:'found',
        foundDate: isoDate(TODAY), connReqDate:null, connDate:null, notes:'',
        thread:{ connSent:null, m1:null, m2:null, cta:null, booked:false }, generated:{}, touchPoints:[]
      });
    }
    window.__logger.contactId = data.recordId;
    window.__logger.showAddContact = false;
    toast(name + ' added', 'success');

    // Offer the quick "add to campaign" step instead of continuing into
    // touch-point logging for them - see initLogger's showCampaignStep.
    window.__logger.newContactName = name;
    window.__logger.showCampaignStep = true;
    window.__logger.campaignStepCampaignId = '';
    window.__logger.campaignStepStage = 'Found';
    renderPage();
  } catch(err){
    toast('Could not add contact: ' + err.message, 'warn');
  }
}

function handleLoggerConvoUpload(event){
  const file = event.target.files && event.target.files[0];
  event.target.value = '';
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const match = String(reader.result).match(/^data:([^;]+);base64,(.*)$/);
    if(match){
      window.__logger.convoImage = { mediaType: match[1], base64: match[2] };
      const el = document.getElementById('loggerConvoPreview');
      if(el) el.innerHTML = `<span class="tag tag-connected">${esc(file.name)} attached</span> <button class="btn btn-ghost btn-sm" onclick="clearLoggerConvoImage()"><i class="ti ti-x"></i></button>`;
    }
  };
  reader.onerror = () => toast('Could not read that file', 'warn');
  reader.readAsDataURL(file);
}

  window.__logger.convoImage = null;
  const el = document.getElementById('loggerConvoPreview');
  if(el) el.innerHTML = '';
}

async function runLoggerParseConversation(){
  const l = window.__logger;
  const image = l.convoImage;
  const text = (document.getElementById('loggerConvoText')?.value || '').trim();
  if(!image && !text){ toast('Paste some text or upload a screenshot first', 'warn'); return; }
  l.convoText = text;
  l.convoParseError = null;

  const btn = document.getElementById('loggerParseBtn');
  if(btn){ btn.disabled = true; btn.innerHTML = '<i class="ti ti-loader-2"></i> Reading...'; }

  try {
    const res = await fetch('/api/logger/parse-conversation', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ image: image || undefined, text: image ? undefined : text })
    });
    const data = await res.json();
    // A non-ok status here is a setup/input problem (missing API key, no
    // text/image sent) - still toast-worthy. A soft { error: true, message }
    // on an ok response means Claude ran but the extraction itself didn't
    // work out - that gets the friendlier inline treatment instead.
    if(!res.ok) throw new Error(typeof data.error === 'string' ? data.error : ('Request failed with status '+res.status));
    if(data.error){
      l.convoParseError = data.message || "We couldn't read that — try rewording or breaking it into shorter entries";
      renderPage();
      return;
    }

    l.convoParsed = { summary: data.summary, sentiment: data.sentiment, objections: data.objections, nextSteps: data.nextSteps };
    l.convoImage = null;
    renderPage();
  } catch(err){
    toast('Could not parse: ' + err.message, 'warn');
    if(btn){ btn.disabled = false; btn.innerHTML = '<i class="ti ti-sparkles"></i> Parse with the Engine'; }
  }
}

  window.__logger.convoParsed = null;
  renderPage();
}

// Folds whichever type-specific fields were filled in into one notes block,
// same "join whatever has an answer" convention as the Context tab's debrief
// Q&A (saveContextTouchPoint above) - written as-is into Touch Points'
// Summary field via POST /api/airtable/touchpoint; the Claude-generated
// polish then happens in the Contact's AI Summary via
// POST /api/context/update-summaries right after.
function buildLoggerNotesText(typeDef){
  const l = window.__logger;
  const lines = [];
  const val = id => (document.getElementById(id)?.value || '').trim();

  if(typeDef.kind === 'linkedin'){
    if(l.convoParsed){
      const summary = val('loggerLiSummary') || l.convoParsed.summary;
      const sentiment = document.getElementById('loggerLiSentiment')?.value || '';
      const objections = val('loggerLiObjections');
      const nextSteps = val('loggerLiNextSteps');
      if(summary) lines.push(summary);
      if(sentiment) lines.push(`Sentiment: ${sentiment}`);
      if(objections) lines.push(`Objections: ${objections}`);
      if(nextSteps) lines.push(`Next steps: ${nextSteps}`);
    } else {
      const text = val('loggerConvoText');
      if(text) lines.push(text);
    }
  } else if(typeDef.kind === 'call'){
    const howItWent = val('loggerHowItWent');
    const objections = val('loggerObjections');
    const nextSteps = val('loggerNextSteps');
    const sentiment = document.getElementById('loggerSentiment')?.value || '';
    const followUpDate = document.getElementById('loggerFollowUpDate')?.value || '';
    if(howItWent) lines.push(howItWent);
    if(objections) lines.push(`Objections raised: ${objections}`);
    if(nextSteps) lines.push(`Next steps agreed: ${nextSteps}`);
    if(sentiment) lines.push(`Sentiment: ${sentiment}`);
    if(followUpDate) lines.push(`Follow-up date: ${followUpDate}`);
  } else if(typeDef.kind === 'proposal'){
    const offer = val('loggerOffer');
    const valueDiscussed = val('loggerValueDiscussed');
    const decisionTimeline = val('loggerDecisionTimeline');
    const stakeholders = val('loggerStakeholders');
    if(offer) lines.push(`Offer: ${offer}`);
    if(valueDiscussed) lines.push(`Value discussed: ${valueDiscussed}`);
    if(decisionTimeline) lines.push(`Decision timeline: ${decisionTimeline}`);
    if(stakeholders) lines.push(`Stakeholders: ${stakeholders}`);
  } else if(typeDef.kind === 'research'){
    const findings = val('loggerFindings');
    const relevance = val('loggerRelevance');
    if(findings) lines.push(findings);
    if(relevance) lines.push(`Relevance: ${relevance}`);
  }

  const notes = val('loggerNotes');
  if(notes) lines.push(notes);

  return lines.join('\n\n');
}

async function submitLoggerEntry(){
  const l = window.__logger;
  const typeDef = LOGGER_TYPES.find(t => t.key === l.type);
  if(!typeDef || !l.contactId) return;

  const notes = buildLoggerNotesText(typeDef);
  if(!notes.trim()){ toast('Add some detail before saving - notes are empty', 'warn'); return; }

  const campaign = l.campaignId ? state.campaigns.find(c => c.id === l.campaignId) : null;
  let outcome;
  if(typeDef.kind === 'linkedin' && l.convoParsed){
    const sentiment = document.getElementById('loggerLiSentiment')?.value;
    outcome = sentiment ? 'Replied' : 'No reply';
  }

  const payload = {
    contactRecordIds: [l.contactId],
    type: typeDef.airtableType,
    date: l.date || isoDate(TODAY),
    notes,
    outcome,
    campaignId: campaign ? campaign.id : undefined,
    campaignName: campaign ? campaign.name : undefined,
    repId: l.repId || undefined
  };
  if(!airtableWriteGuard('logger-touchpoint', payload, ['type'])) return;

  // Toggled directly on the button rather than via renderPage() - a full
  // re-render would wipe every uncontrolled text/textarea field above (they
  // only exist in the DOM, read by id in buildLoggerNotesText at submit
  // time), which would silently discard everything the rep just typed if
  // the save then fails and they need to retry.
  const btn = document.getElementById('loggerSaveBtn');
  if(btn){ btn.disabled = true; btn.innerHTML = '<i class="ti ti-loader-2"></i> Saving...'; }

  try {
    const res = await fetch('/api/airtable/touchpoint', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || ('Request failed with status '+res.status));

    const contactName = (state.contacts.find(c => c.id === l.contactId) || {}).name || 'contact';
    toast('Touch point logged for ' + contactName, 'success');

    fetch('/api/context/update-summaries', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ contactIds: [l.contactId], campaignName: campaign ? campaign.name : undefined })
    }).catch(err => console.warn('AI Summary refresh failed (non-fatal):', err.message));

    // Logging a touch point tags the Touch Point record itself with the
    // campaign (server-side, in POST /api/airtable/touchpoint) but doesn't
    // by itself enrol the contact in that campaign - reuses the existing
    // "Add contacts" link route (already a no-op if a Campaign Contacts row
    // for this pair exists) so a contact touched under a campaign always
    // ends up tracked in that campaign's Roadmap/funnel too.
    if(campaign){
      fetch(`/api/campaign/${encodeURIComponent(campaign.name)}/contacts/link`, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ contactNames: [contactName] })
      }).catch(err => console.warn('Campaign Contact link failed (non-fatal):', err.message));
    }

    initLogger();
    renderPage();
  } catch(err){
    toast('Could not save touch point: ' + err.message, 'warn');
    if(btn){ btn.disabled = false; btn.innerHTML = '<i class="ti ti-device-floppy"></i> Save touch point'; }
  }
}

function initLoggerConnections(){

// Same restriction readConnectionsScreenshot uses - only a contact whose
// connection request has actually gone out and is still awaiting
// acceptance has anything to update here. On real Airtable-hydrated data
// that's state 'connectionPending' (JOURNEY_STAGE_TO_STATE's mapping for
// Journey Stage "Connection Pending") - 'found' is a stage earlier than
// that (no request sent yet) and was wrongly included before, which meant
// a contact whose request actually IS pending never showed up as a
// candidate at all. 'opened' is kept only for the local mock/demo seed
// data (rawState.contacts), which uses it the same way; real hydration
// never produces that value, so it's a no-op in production.
function loggerConnectionCandidates(){
  return state.contacts.filter(c => (c.state==='connectionPending' || c.state==='opened') && !c.connDate);

function renderLoggerConnShotFiles(){

function handleLoggerConnImageUpload(event){
  const files = Array.from(event.target.files || []);
  event.target.value = '';
  if(!files.length) return;
  const lc = window.__loggerConnections;
  let pending = files.length;
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = () => {
      const match = String(reader.result).match(/^data:([^;]+);base64,(.*)$/);
      if(match) lc.shots.push({ name: file.name, mediaType: match[1], base64: match[2] });
      pending--;
      if(pending === 0){
        const el = document.getElementById('loggerConnShotFiles');
        if(el) el.innerHTML = renderLoggerConnShotFiles();
      }
    };
    reader.onerror = () => toast('Could not read that file', 'warn');
    reader.readAsDataURL(file);
  });
}
function removeLoggerConnShot(idx){
  window.__loggerConnections.shots.splice(idx,1);
  const el = document.getElementById('loggerConnShotFiles');
  if(el) el.innerHTML = renderLoggerConnShotFiles();
}

// Renders whichever of the two independent review steps still needs a
// decision (see runLoggerConnectionsMatch) - either or both can be showing
// at once, since confirming/cancelling one doesn't touch the other. Once
// neither is pending any more, falls back to the accumulated final outcome
// (built incrementally by confirmLoggerConnMatches/confirmLoggerImports as
// each step resolves) or the "found nothing at all" / error case.
function renderLoggerConnResult(){
  const lc = window.__loggerConnections;
  const parts = [];
  if(lc.pendingMatches && lc.pendingMatches.length) parts.push(renderLoggerConnConfirmCard());
  if(lc.pendingImports && lc.pendingImports.length) parts.push(renderLoggerConnImportCard());
  const nothingPending = !(lc.pendingMatches && lc.pendingMatches.length) && !(lc.pendingImports && lc.pendingImports.length);
  if(nothingPending && lc.result) parts.push(renderLoggerConnFinalCard());
  return parts.join('');
}

function renderLoggerConnFinalCard(){
  const result = window.__loggerConnections.result;
  if(result.error) return `<div class="card" style="background:#fbe3dc;border-color:#f0c6b8;margin-top:10px;"><i class="ti ti-alert-circle" style="color:var(--danger);"></i> ${esc(result.error)}</div>`;
  const lines = [];
  if(result.matched && result.matched.length) lines.push(`${result.matched.length} contact${result.matched.length===1?'':'s'} marked as connected: ${result.matched.map(n=>esc(n)).join(', ')}`);
  if(result.imported && result.imported.length) lines.push(`${result.imported.length} new contact${result.imported.length===1?'':'s'} imported: ${result.imported.map(n=>esc(n)).join(', ')}`);
  if(!lines.length) lines.push(result.noneFound ? "Couldn't match anyone from that - try adding more detail or a clearer screenshot" : "Nothing was changed");
  return `<div class="card" style="background:#eaf7f0;border-color:#c9e9d7;margin-top:10px;"><i class="ti ti-circle-check" style="color:var(--success);"></i> ${lines.join(' &middot; ')}</div>`;
}

// Nobody gets marked Connected purely off Claude's read of a screenshot/
// paste - every match is shown here, checked by default, for the rep to

function renderLoggerConnConfirmCard(){
  const pending = window.__loggerConnections.pendingMatches;
  return `
  <div class="card" style="background:#eaf7f0;border-color:#c9e9d7;">
    <div style="font-weight:700;font-size:12.5px;margin-bottom:8px;">${pending.length} contact${pending.length===1?'':'s'} matched - confirm before marking as connected:</div>
    ${pending.map((p,i) => `
      <label style="display:flex;align-items:center;gap:8px;font-size:12.5px;padding:4px 0;">
        <input type="checkbox" ${p.checked?'checked':''} onchange="toggleLoggerConnMatch(${i}, this.checked)">
        <span>${esc(p.name)}${p.company ? ` <span class="muted">(${esc(p.company)})</span>` : ''}</span>

      <button class="btn btn-primary btn-sm" onclick="confirmLoggerConnMatches()"><i class="ti ti-check"></i> Confirm</button>
      <button class="btn btn-secondary btn-sm" onclick="cancelLoggerConnMatches()">Cancel</button>

function toggleLoggerConnMatch(idx, checked){
  const pending = window.__loggerConnections.pendingMatches;
  if(pending && pending[idx]) pending[idx].checked = checked;
}

function confirmLoggerConnMatches(){
  const lc = window.__loggerConnections;
  const toApply = (lc.pendingMatches || []).filter(p => p.checked);
  const contacts = toApply.map(p => state.contacts.find(c => c.id === p.contactId)).filter(Boolean);
  if(contacts.length) markContactsConnected(contacts);
  lc.pendingMatches = null;
  lc.result = lc.result || {};
  lc.result.matched = contacts.map(c => c.name);
  if(contacts.length) toast(`${contacts.length} contact${contacts.length===1?'':'s'} marked as connected`, 'success');

function cancelLoggerConnMatches(){
  const lc = window.__loggerConnections;

// Anyone Claude saw who isn't already a contact anywhere in the CRM (any

// per row (Claude's best guess from their headline, not always right), and
// a single grid choice for the whole batch - either an existing grid or a
// brand new one named right here, so the rep never has to leave this card

function renderLoggerConnImportCard(){
  const lc = window.__loggerConnections;
  const pending = lc.pendingImports;
  const useNewGrid = lc.creatingNewGrid || !state.grids.length;
  return `
  <div class="card" style="background:#e2f2fa;border-color:#bfe0f2;">

          </div>
        </div>

      ${useNewGrid
        ? `<input id="loggerConnNewGridName" placeholder="New grid name" value="${esc(lc.newGridName)}" onchange="updateLoggerNewGridName(this.value)">

      <button class="btn btn-secondary btn-sm" onclick="cancelLoggerImports()">Skip</button>

function toggleLoggerImportRow(idx, checked){

function updateLoggerImportField(idx, field, value){

}
function setLoggerImportGrid(gridId){

function updateLoggerNewGridName(value){

}
function toggleLoggerImportNewGrid(show){
  window.__loggerConnections.creatingNewGrid = show;
  renderPage();
}

// Temporarily points state.currentGridId at the target grid so
// createManualGridContact (which always reads currentGrid()) lands each
// import there, then restores it - importing from Logger shouldn't change
// which grid the rep is actually looking at elsewhere in the app. Adds the
// role as a grid column too, if it's a new one, before creating the
// contact - createManualGridContact's own touchGrid sync needs to see it
// already in place, or the synced Columns field would be one behind.
function confirmLoggerImports(){
  const lc = window.__loggerConnections;
  const toImport = (lc.pendingImports || []).filter(p => p.checked);
  if(!toImport.length){ lc.pendingImports = null; renderPage(); return; }

  let gridId = lc.importGridId;
  if(lc.creatingNewGrid || !state.grids.length){
    const name = (document.getElementById('loggerConnNewGridName')?.value || lc.newGridName || '').trim();
    if(!name){ toast('Name the new grid first', 'warn'); return; }
    gridId = createGrid(name).id;
  }
  const grid = state.grids.find(g => g.id === gridId);
  if(!grid){ toast('Pick a grid first', 'warn'); return; }

  const prevGridId = state.currentGridId;
  state.currentGridId = grid.id;
  const created = toImport.map(p => {
    if(p.role && !grid.columns.includes(p.role)) grid.columns.push(p.role);
    return createManualGridContact(p.name, p.role, p.company, '');
  });
  state.currentGridId = prevGridId;

  lc.pendingImports = null;
  lc.result = lc.result || {};
  lc.result.imported = created.map(c => c.name);

async function runLoggerConnectionsMatch(){
  const lc = window.__loggerConnections;
  const text = (document.getElementById('loggerConnText')?.value || '').trim();
  lc.text = text;
  if(!text && !lc.shots.length){ toast('Paste some names or upload a screenshot first', 'warn'); return; }

  const candidates = loggerConnectionCandidates();

  const btn = document.getElementById('loggerConnMatchBtn');
  if(btn){ btn.disabled = true; btn.innerHTML = '<i class="ti ti-loader-2"></i> Matching...'; }
  lc.result = null;
  lc.pendingMatches = null;
  lc.pendingImports = null;

  try {
    const res = await fetch('/api/contacts/match-connections-screenshot', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        candidates: candidates.map(c => ({ id: c.id, name: c.name, company: c.company })),
        images: lc.shots.length ? lc.shots.map(f => ({ mediaType: f.mediaType, base64: f.base64 })) : undefined,
        text: text || undefined
      })
    });
    const data = await res.json();
    if(!res.ok || !data.success) throw new Error((typeof data.error === 'string' && data.error) || ('Request failed with status '+res.status));

    const matched = candidates.filter(c => (data.matchedIds || []).includes(c.id));
    if(matched.length){
      lc.pendingMatches = matched.map(c => ({ contactId: c.id, name: c.name, company: c.company, checked: true }));
    }

    // Anyone Claude saw who isn't already a contact anywhere in the CRM
    // (any stage, not just the narrow "pending" candidates above - the same
    // fuzzy matcher the AI Assistant flow uses) is offered as a new-contact
    // import instead, so a genuinely new connection doesn't just get
    // silently dropped on the floor.
    const extracted = data.extracted || [];
    const newPeople = extracted.filter(p => !loggerFindBestContactMatch(p.name, p.company));
    if(newPeople.length){
      lc.pendingImports = newPeople.map(p => ({ name: p.name, company: p.company, role: p.role, checked: true }));
      lc.importGridId = state.grids.length ? state.grids[0].id : '';
      lc.creatingNewGrid = !state.grids.length;
      lc.newGridName = '';
    }

    if(!lc.pendingMatches && !lc.pendingImports){
      lc.result = { noneFound: true };
    }

    lc.text = '';
    lc.shots = [];
    renderPage();
  } catch(err){
    lc.result = { error: "We couldn't read that — try rewording or a clearer screenshot" };
    console.warn('Log connections match failed:', err.message);
    renderPage();
  } finally {
    if(btn){ btn.disabled = false; btn.innerHTML = '<i class="ti ti-sparkles"></i> Log connections'; }
  }
}

// Best-guess existing-contact match for one AI-extracted touch point - an
// exact name match first (narrowed by company when both share one), then
// the same Levenshtein fuzzy check the job title suggestion above uses.
// Never auto-applied - the caller surfaces this as a "Did you mean...?"
// suggestion on the confirmation card (see renderLoggerAICard) that the rep
// has to explicitly accept, since a wrong silent match would file the touch
// point against the wrong person. Anything below the similarity floor is
// left unmatched rather than risking a wrong contact.
function loggerFindBestContactMatch(name, company){
  if(!name) return null;
  const typedName = name.trim().toLowerCase();
  const typedCompany = (company || '').trim().toLowerCase();
  if(!typedName) return null;

  const exact = state.contacts.find(c => c.name.trim().toLowerCase() === typedName && (!typedCompany || (c.company||'').toLowerCase() === typedCompany));
  if(exact) return exact;

  let best = null, bestScore = 0;
  state.contacts.forEach(c => {
    const cName = c.name.trim().toLowerCase();
    const distance = levenshteinDistance(typedName, cName);
    const similarity = 1 - distance / Math.max(typedName.length, cName.length);
    const companyBoost = typedCompany && (c.company||'').toLowerCase() === typedCompany ? 0.1 : 0;
    const score = similarity + companyBoost;
    if(score > bestScore){ bestScore = score; best = c; }
  });
  return (best && bestScore >= 0.7) ? best : null;
}

async function runLoggerAIExtract(){
  const ai = window.__loggerAI;
  const text = (document.getElementById('loggerAIDumpText')?.value || '').trim();
  ai.dumpText = text;
  ai.parseError = null;
  if(!text && !ai.dumpImage){ toast('Paste a summary or upload a screenshot first', 'warn'); return; }

  const btn = document.getElementById('loggerAIParseBtn');
  if(btn){ btn.disabled = true; btn.innerHTML = '<i class="ti ti-loader-2"></i> Reading...'; }

  try {
    const res = await fetch('/api/logger/extract-touchpoints', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ text: text || undefined, image: ai.dumpImage || undefined })
    });
    const data = await res.json();
    // Same split as runLoggerParseConversation above: a non-ok status is a
    // setup/input problem (toast), a soft { error: true, message } on an ok
    // response is Claude having run but not produced something usable
    // (friendly inline error instead).
    if(!res.ok) throw new Error(typeof data.error === 'string' ? data.error : ('Request failed with status '+res.status));
    if(data.error){
      ai.parseError = data.message || "We couldn't read that — try rewording or breaking it into shorter entries";
      renderPage();
      return;
    }

    // Belt-and-braces validation on top of the server's own filtering - an
    // item missing a contact name or touch point type isn't something the
    // confirmation card below can do anything useful with, so it's dropped
    // here rather than reaching the UI half-formed.
    const rawResults = data.touchPoints || [];
    const isUsable = r => r && String(r.contactName || '').trim() && String(r.type || '').trim();
    const results = rawResults.filter(isUsable);
    const skippedCount = rawResults.length - results.length;

    if(!results.length){
      toast(skippedCount ? `Found ${skippedCount} entr${skippedCount===1?'y':'ies'} but none had both a contact name and touch point type` : 'No touch points found in that - try adding more detail', 'warn');
      return;
    }
    if(skippedCount) toast(`Skipped ${skippedCount} entr${skippedCount===1?'y':'ies'} missing a contact name or touch point type`, 'warn');

    const validTypes = new Set(LOGGER_TYPES.map(t => t.airtableType));
    ai.extracted = results.map((r, i) => ({
      localId: 'ai_' + i + '_' + Date.now(),
      contactName: r.contactName || '',
      company: r.company || '',
      type: validTypes.has(r.type) ? r.type : 'Call',
      summary: r.summary || '',
      date: r.date || isoDate(TODAY),
      matchedContactId: null,
      suggestedContactId: null,
      suggestionDismissed: false,
      showCreateNew: false,
      campaignId: '',
      confirmed: false
    }));
    ai.extracted.forEach(item => {
      const match = loggerFindBestContactMatch(item.contactName, item.company);
      if(match) item.suggestedContactId = match.id;
    });

    ai.dumpText = '';
    ai.dumpImage = null;
    renderPage();
  } catch(err){
    toast('Could not extract touch points: ' + err.message, 'warn');
  } finally {
    if(btn){ btn.disabled = false; btn.innerHTML = '<i class="ti ti-sparkles"></i> Extract touch points'; }
  }
}

      body: JSON.stringify(payload)
    });
    const data = await res.json();

function computeHealth(){
  const withBoth = state.contacts.filter(c=>c.connReqDate && c.connDate);
  const avgDays = withBoth.length ? Math.round(withBoth.reduce((s,c)=>s+daysBetween(c.connReqDate,c.connDate),0)/withBoth.length) : 0;
  let sent=0, replied=0;
  state.contacts.forEach(c=>{
    if(c.thread.m1){ sent++; if(c.thread.m1.replied) replied++; }
    if(c.thread.m2){ sent++; if(c.thread.m2.replied) replied++; }
  });
  const replyRate = sent ? Math.round(replied/sent*100) : 0;
  const connectedCount = state.contacts.filter(c=>c.connDate).length;
  const conversionRate = connectedCount ? Math.round(state.bookings.length/connectedCount*100) : 0;
  return { avgDays, replyRate, conversionRate };
}

function lastTouchPointDate(c){
  const points = c.touchPoints || [];
  if(!points.length) return null;
  return points.reduce((latest, tp) => (!latest || new Date(tp.date) > new Date(latest)) ? tp.date : latest, null);
}

/*
Today's actions rules, checked in priority order (first match wins, one action per contact):
- Booked, delivery >30 days ago, no touch point since delivery -> "Post-delivery check-in"
- Booked but not yet due for the above, no touch point in 21 days -> "Re-engage"
- Connected, no message sent yet, connected >2 days ago -> "Send first message"
- Messaging, last message got a reply but the next stage hasn't been sent in >3 days -> "Reply back"
- Messaging, last message sent has no reply after >5 days -> "Follow up"
- Connected/messaging, no touch point in 21 days -> "Re-engage"
*/
function activeCampaignForContact(c){
  return state.campaigns.find(camp => camp.status === 'Live' && campaignContacts(camp).some(cc => cc.id === c.id)) || null;
}

// Today's Actions specifically must not use activeCampaignForContact above -
// that treats "sitting on a grid linked to a Live campaign" as belonging to
// it, with no real per-contact record required (by design, so other
// features - Roadmap, generate-message, mark-sent - can act on a contact
// before their first Campaign Contacts row exists). That looseness is
// exactly what let grid contacts with no genuine campaign link leak into
// Today's Actions. This checks the actual Campaign Contacts Airtable table
// instead: window.__campaignSequenceStages[campaign.id] is fetched straight
// from GET /api/campaign/:id/campaign-contacts, which already filters to
// rows whose Campaign field links this specific campaign (see that route in
// search-server.js) - so a hit here means a real record with a valid
// campaign ID exists, not just grid/contactIds membership.
function campaignContactRecordFor(c){
  const key = c.name.trim().toLowerCase();
  for(const camp of state.campaigns){
    if(camp.status !== 'Live') continue;
    const stages = window.__campaignSequenceStages && window.__campaignSequenceStages[camp.id];
    if(stages && Object.prototype.hasOwnProperty.call(stages, key)) return camp;
  }
  return null;
}

function getContactAction(c){
  const campaign = campaignContactRecordFor(c);
  // Today's Actions only ever surfaces contacts with a real Campaign
  // Contacts record linking them to a Live campaign (see
  // campaignContactRecordFor above) - a contact sitting only in a grid, or
  // merely grid/contactIds-linked to a campaign with no Campaign Contacts
  // row yet, gets no card at all, fast or natural. A live campaign fully
  // owns this contact's card while their Sequence Stage is still in the
  // fast-action range; the account-level "natural" actions below (Reply
  // back, Follow up, Re-engage...) only apply once that campaign sequence
  // is exhausted (Meeting Booked/Nurture/Timed Out). A contact genuinely
  // waiting on the other side (connection not yet accepted, or a message
  // sent with no reply yet) shows nothing at all - never a fast action, and
  // never a fallback natural action either, since that reads entirely
  // different local-state fields unrelated to this campaign's real
  // Sequence Stage and would show a stale/wrong action.
  if(!campaign) return null;

  const fastAction = getFastActionForCampaignContact(c, campaign);
  if(fastAction && fastAction.waiting) return null;
  if(fastAction) return fastAction;

  const natural = getNaturalContactAction(c);
  if(natural){
    natural.campaignName = campaign.name;
    return natural;
  }
  return null;
}

// Stages where a connection request or message has gone out but there's
// nothing to do yet - waiting on the other person, not on us. Includes the
// richer reply-gated vocabulary the DM-screenshot flow writes
// (SEQUENCE_STAGE_ADVANCE, search-server.js): "Pending Reply MN" while
// waiting, "Ready for Message N+1" once a reply's been detected (handled
// below, not here, since that IS an action due).
const WAITING_SEQUENCE_STAGES = new Set([
  'Connection Pending',
  'Message 1 Sent', 'Pending Reply M1',
  'Message 2 Sent', 'Pending Reply M2',
  'Message 3 Sent', 'Pending Reply M3'
]);

// "Connected" (connection accepted - see the "Connected" branch of PATCH
// /api/context/contact-fields) is the trigger for message 1; "Ready for
// Message N" (a reply was detected to the previous message) triggers the
// next one. Deliberately does not include "Connection Pending" or
// "Message N Sent" - those are waiting states, listed above.
const SEQUENCE_STAGE_MESSAGE_NUMBER = { 'Connected': 1, 'Ready for Message 2': 2, 'Ready for Message 3': 3 };

// Today's Actions "fast action" card for a contact in a live campaign,
// driven entirely by their per-campaign Sequence Stage (window.
// __campaignSequenceStages, loaded by ensureTodaysActionsSequenceStagesLoaded).
// Returns { waiting: true } for a genuine waiting state (never shown, and
// never falls through to a natural action - see getContactAction), or null
// if the stage map hasn't loaded yet or the sequence is exhausted (Meeting
// Booked/Nurture/Timed Out/etc.), which does allow falling through.
function getFastActionForCampaignContact(c, campaign){
  const stages = window.__campaignSequenceStages && window.__campaignSequenceStages[campaign.id];
  if(!stages) return null;
  const stage = stages[c.name.trim().toLowerCase()] || 'Found';

  if(stage === 'Found'){
    return { type:'Send connection', stageLabel: stage, campaignName: campaign.name, daysSinceTouch: null, isFastAction: true };
  }
  if(WAITING_SEQUENCE_STAGES.has(stage)){
    return { waiting: true };
  }
  const messageNumber = SEQUENCE_STAGE_MESSAGE_NUMBER[stage];
  if(messageNumber){
    return { type:'Generate message', stageLabel: stage, messageNumber, campaignName: campaign.name, daysSinceTouch: null, isFastAction: true };
  }
  return null;
}

function getNaturalContactAction(c){
  if(c.state === 'found' || c.state === 'opened') return null;

  const lastTouch = lastTouchPointDate(c);
  const daysSince = (dateStr) => dateStr ? daysBetween(dateStr) : null;

  if(c.thread.booked){
    if(c.thread.bookedDate){
      const daysSinceDelivery = daysSince(c.thread.bookedDate);
      const touchSinceDelivery = lastTouch && new Date(lastTouch) >= new Date(c.thread.bookedDate);
      if(daysSinceDelivery !== null && daysSinceDelivery > 30 && !touchSinceDelivery){
        return { type:'Post-delivery check-in', stage:'cta', daysSinceTouch: lastTouch ? daysSince(lastTouch) : daysSinceDelivery };
      }
    }
    const days = daysSince(lastTouch || c.thread.bookedDate || c.connDate || c.foundDate);
    if(days !== null && days > 21){
      return { type:'Re-engage', stage:'cta', daysSinceTouch: days };
    }
    return null;
  }

  if(c.state === 'connected' && !c.thread.m1){
    const days = daysSince(c.connDate);
    if(days !== null && days > 2){
      return { type:'Send first message', stage:'m1', daysSinceTouch: lastTouch ? daysSince(lastTouch) : days };
    }
  }

  if(c.state === 'messaging'){
    if(c.thread.m2 && c.thread.m2.replied && !c.thread.cta){
      const days = daysSince(c.thread.m2.sent);
      if(days !== null && days > 3) return { type:'Reply back', stage:'cta', daysSinceTouch: days };
    } else if(c.thread.m1 && c.thread.m1.replied && !c.thread.m2){
      const days = daysSince(c.thread.m1.sent);
      if(days !== null && days > 3) return { type:'Reply back', stage:'m2', daysSinceTouch: days };
    }

    const lastStep = c.thread.m2 || c.thread.m1;
    if(lastStep && !lastStep.replied){
      const days = daysSince(lastTouch || lastStep.sent);
      if(days !== null && days > 5){
        const nextStage = c.thread.m2 ? 'cta' : 'm2';
        return { type:'Follow up', stage: nextStage, daysSinceTouch: days };
      }
    }
  }

  const days = daysSince(lastTouch || c.connDate || c.foundDate);
  if(days !== null && days > 21){
    const nextStage = c.thread.m2 ? 'cta' : (c.thread.m1 ? 'm2' : 'm1');
    return { type:'Re-engage', stage: nextStage, daysSinceTouch: days };
  }

  return null;
}

function computeTodaysActions(){
  const actions = state.contacts
    .map(c => { const action = getContactAction(c); return action ? { contact:c, ...action } : null; })
    .filter(Boolean)
    .sort((a,b) => (b.daysSinceTouch||0) - (a.daysSinceTouch||0));

  // Diagnostic: every contact above is sourced via campaignContactRecordFor,
  // i.e. a real Campaign Contacts Airtable row with a valid Campaign link -
  // never grid/contactIds membership alone. Logs the gap between the two so
  // a regression back to the old grid-sourced behaviour is visible
  // immediately instead of silently reappearing.
  const liveCampaigns = state.campaigns.filter(camp => camp.status === 'Live');
  const gridOrIdMemberIds = new Set();
  liveCampaigns.forEach(camp => campaignContacts(camp).forEach(c => gridOrIdMemberIds.add(c.id)));
  const realRecordMemberIds = new Set();
  liveCampaigns.forEach(camp => {
    const stages = window.__campaignSequenceStages && window.__campaignSequenceStages[camp.id];
    if(!stages) return;
    state.contacts.forEach(c => { if(Object.prototype.hasOwnProperty.call(stages, c.name.trim().toLowerCase())) realRecordMemberIds.add(c.id); });
  });
  const gridOnlyLeakCount = [...gridOrIdMemberIds].filter(id => !realRecordMemberIds.has(id)).length;
  console.log(
    `[Today's Actions] ${actions.length} contact(s) shown - all sourced from real Campaign Contacts records ` +
    `(${realRecordMemberIds.size} contact(s) have one on a Live campaign). ` +
    `${gridOrIdMemberIds.size} contact(s) are grid/contactIds-linked to a Live campaign; ` +
    `${gridOnlyLeakCount} of those have no Campaign Contacts record and are correctly excluded.`,
    actions.map(a => ({ contact: a.contact.name, campaign: a.campaignName || null, type: a.type }))
  );

  return actions;
}

// Today's Actions sub-tabs - filter the same computed actions list by
// what the action actually asks for, rather than recomputing anything.
// 'connection'/'message' key off the action type computeTodaysActions()
// already produced (see getFastActionForCampaignContact/
// getNaturalContactAction above); 'followup' keys off the contact's Sequence
// Stage and touch point history directly (see contactQualifiesForFollowUp
// below) since "no touch point in 14 days" isn't tied to any one action
// type - it can apply regardless of what the card's own action is.
const TODAYS_ACTIONS_TABS = [
  ['connection', 'Send Connection'],
  ['message', 'Send Message'],
  ['followup', 'Follow Up']
];

function todaysActionMatchesTab(a, tabId){
  if(tabId === 'connection') return a.type === 'Send connection';
  if(tabId === 'message') return (a.type === 'Generate message' && a.messageNumber === 1) || a.type === 'Send first message';
  if(tabId === 'followup') return contactQualifiesForFollowUp(a.contact);
  return true;
}

// Follow Up tab: a contact only qualifies once they're past Found/
// Connection Pending (nothing to "follow up" on before a connection is even
// made), and then only if either their most recent real Airtable Touch
// Point is more than 14 days old, or - if none has ever been logged - they
// reached Connection Made (Sequence Stage "Connected") more than 14 days
// ago. c.connDate is the same "since when connected" date
// getNaturalContactAction already reads elsewhere in this file; there's no
// separate per-campaign "connected on" date to prefer over it.
function contactQualifiesForFollowUp(c){
  const campaign = campaignContactRecordFor(c);
  if(!campaign) return false;
  const stages = window.__campaignSequenceStages && window.__campaignSequenceStages[campaign.id];
  const stage = stages ? (stages[c.name.trim().toLowerCase()] || 'Found') : 'Found';
  if(stage === 'Found' || stage === 'Connection Pending') return false;

  const lastTouch = lastTouchPointDate(c);
  if(lastTouch) return daysBetween(lastTouch) > 14;

  if(stage === 'Connected'){
    const days = daysBetween(c.connDate);
    return days !== null && days > 14;
  }
  return false;
}

function setTodaysActionsTab(tab){
  window.__todaysActionsTab = tab;
  renderPage();
}

function renderTodaysActions(){
  const actions = computeTodaysActions();
  const counts = {};
  TODAYS_ACTIONS_TABS.forEach(([key]) => { counts[key] = actions.filter(a => todaysActionMatchesTab(a, key)).length; });

  let activeTab = window.__todaysActionsTab;
  if(!activeTab || !counts.hasOwnProperty(activeTab)){
    const firstWithResults = TODAYS_ACTIONS_TABS.find(([key]) => counts[key] > 0);
    activeTab = firstWithResults ? firstWithResults[0] : TODAYS_ACTIONS_TABS[0][0];
  }
  const filtered = actions.filter(a => todaysActionMatchesTab(a, activeTab));

  // Reset before rendering so "Mark all as done" (which reads this map as a
  // side effect of renderTodaysActionItem) only ever sees the cards actually
  // showing under the active tab, not ones left over from a previous tab.
  window.__todaysActions = {};

  return `
  <div class="card" style="margin-bottom:22px;">
    <div class="section-title" style="display:flex;justify-content:space-between;align-items:center;">
      <span><i class="ti ti-list-check"></i> Today's actions ${actions.length ? `<span class="count-pill has" style="margin-left:6px;">${actions.length}</span>` : ''}</span>
      ${filtered.length ? `<button class="btn btn-secondary btn-sm" id="markAllDoneBtn" onclick="handleMarkAllActionsDone()"><i class="ti ti-checks"></i> Mark all as done</button>` : ''}
    </div>
    <div class="seq-tabs" style="margin-top:12px;">
      ${TODAYS_ACTIONS_TABS.map(([key,label]) => `<div class="seq-tab ${activeTab===key?'active':''}" onclick="setTodaysActionsTab('${key}')">${label} <span class="count-pill ${counts[key]>0?'has':''}" style="margin-left:4px;">${counts[key]}</span></div>`).join('')}
    </div>
    <div id="todaysActionsList">
      ${filtered.length ? filtered.map(a => renderTodaysActionItem(a)).join('') : '<div class="empty-state">Nothing needs attention today — nice work.</div>'}
    </div>
  </div>`;
}

function recommendedMethodForAction(a){
  const map = {
    'Send first message': 'LinkedIn message',
    'Follow up': 'Email or Call',
    'Reply back': 'LinkedIn message',
    'Post-delivery check-in': 'Email',
    'Re-engage': 'Content share'
  };
  return map[a.type] || 'LinkedIn message';
}

        <div class="todo-item-name" style="cursor:pointer;" onclick="openContactDrawer('${esc(c.name)}', ${a.campaignName ? `'${esc(a.campaignName)}'` : 'null'})">${esc(c.name)}</div>
        <div class="muted" style="font-size:12px;">${esc(c.role)} · ${esc(c.company)}</div>
        ${a.campaignName ? `<div style="margin-top:4px;"><span class="pill" style="background:#e2f2fa;color:#0d6a96;"><i class="ti ti-rocket" style="font-size:11px;"></i> ${esc(a.campaignName)}</span></div>` : ''}
      </div>

        <div class="muted" style="font-size:11px;margin-top:2px;">Recommended: ${esc(method)}</div>
      </div>
    </div>
    <div class="todo-item-actions">
      <button class="btn btn-secondary btn-sm" onclick="openGenerateModal('${c.id}','${a.stage}', ()=>renderPage())"><i class="ti ti-copy"></i> Draft message</button>
      <button class="btn btn-ghost btn-sm" onclick="toggleQuickTouchPoint('${c.id}')"><i class="ti ti-target-arrow"></i> Log touch point</button>
      <button class="btn btn-accent btn-sm" id="briefBtn-${c.id}" onclick="generateContactBrief('${c.id}')"><i class="ti ti-sparkles"></i> Generate brief</button>
      <button class="btn btn-ghost btn-sm" onclick="handleMarkActionDone('${c.id}')"><i class="ti ti-check"></i> Mark as done</button>

// Minimal Today's Actions card for a contact whose live campaign Sequence
// Stage drives one specific action - exactly one button, no touch-point
// logger or brief generator clutter, per stage (see WAITING_SEQUENCE_STAGES/
// getFastActionForCampaignContact above for the full state machine):
//   Found               -> Send connection (opens LinkedIn, advances stage)
//   Connection Pending  -> hidden (sent, not yet accepted)
//   Connected           -> Generate message (message 1)
//   Message 1 Sent      -> hidden (waiting for a reply)
//   Ready for Message 2 -> Generate message (message 2, a reply came in)
//   Message 2 Sent      -> hidden (waiting for a reply)
//   Ready for Message 3 -> Generate message (message 3, a reply came in)
// "Generate message" swaps itself for the drafted text plus a single
// "Copy & mark sent" button once clicked (handleGenerateFastMessage).
function renderFastActionCard(a){
  const c = a.contact;
  return `
  <div class="todo-item" id="todaysAction-${c.id}">
    <div class="todo-item-main">
      <div>
        <div class="todo-item-name" style="cursor:pointer;" onclick="openContactDrawer('${esc(c.name)}', '${esc(a.campaignName)}')">${esc(c.name)}</div>
        <div class="muted" style="font-size:12px;">${esc(c.role)} · ${esc(c.company)}</div>
        <div style="margin-top:4px;"><span class="pill" style="background:#e2f2fa;color:#0d6a96;"><i class="ti ti-rocket" style="font-size:11px;"></i> ${esc(a.campaignName)}</span></div>
      </div>
      <div style="text-align:right;">
        <span class="pill" id="actionPill-${c.id}">${esc(a.stageLabel)}</span>
      </div>
    </div>
    <div class="todo-item-actions">
      <div id="fastActionArea-${c.id}" style="display:contents;">
        ${a.type === 'Send connection'
          ? `<a class="btn btn-primary btn-sm" href="${esc(c.url||'#')}" target="_blank" rel="noopener" onclick="handleContactLinkedInOpened('${c.id}')"><i class="ti ti-brand-linkedin"></i> Send connection</a>`
          : `<button class="btn btn-primary btn-sm" onclick="handleGenerateFastMessage('${c.id}')"><i class="ti ti-sparkles"></i> Generate message</button>`}
      </div>
      <button class="btn btn-ghost btn-sm" onclick="handleMarkActionDone('${c.id}')"><i class="ti ti-check"></i> Mark as done</button>
    </div>
  </div>`;
}

// "Mark as done" on a single Today's Actions card - removes it immediately
// (same optimistic-UI convention as handleContactLinkedInOpened) and, in
// the background, stamps Connection Sent Date=today on every one of this
// contact's Campaign Contacts rows via POST /api/context/contact-mark-done.
// Deliberately doesn't touch Sequence/Journey Stage - the card being
// dismissed might be any action type, not just a connection request.
async function handleMarkActionDone(cid){
  const cardEl = document.getElementById('todaysAction-' + cid);
  if(cardEl) cardEl.remove();
  delete (window.__todaysActions || {})[cid];

  try {
    const res = await fetch('/api/context/contact-mark-done', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ contactId: cid })
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || 'Request failed');
  } catch(err){
    console.warn('Could not mark action done:', err.message);
    toast('Marked done locally, but could not sync to Airtable: ' + err.message, 'warn');
  }
}

// "Mark all as done" - clears every currently-rendered Today's Actions card
// at once (window.__todaysActions is populated as a side effect of
// rendering them, see renderTodaysActionItem) and fires the same mark-done
// request as handleMarkActionDone for each, in parallel.
async function handleMarkAllActionsDone(){
  const ids = Object.keys(window.__todaysActions || {});
  if(!ids.length) return;

  ids.forEach(cid => {
    const cardEl = document.getElementById('todaysAction-' + cid);
    if(cardEl) cardEl.remove();
  });
  window.__todaysActions = {};
  const list = document.getElementById('todaysActionsList');
  if(list) list.innerHTML = '<div class="empty-state">Nothing needs attention today — nice work.</div>';
  const markAllBtn = document.getElementById('markAllDoneBtn');
  if(markAllBtn) markAllBtn.remove();

  const results = await Promise.allSettled(ids.map(cid => fetch('/api/context/contact-mark-done', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ contactId: cid })
  }).then(async res => {
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || 'Request failed');
  })));

  const failed = results.filter(r => r.status === 'rejected').length;
  if(failed) toast(`Marked ${ids.length} done locally, but ${failed} couldn't sync to Airtable`, 'warn');
  else toast(`Marked ${ids.length} action${ids.length===1?'':'s'} as done`, 'success');
}

function toggleQuickTouchPoint(cid){
  const el = document.getElementById('quicktp-'+cid);
  if(!el) return;
  el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

// Fires whenever a contact's LinkedIn URL is opened anywhere in the app -
// the Today's Actions "Send connection" link, a Grid cell's LinkedIn icon,
// or any future one (e.g. the Roadmap) - the href already opens their
// profile in a new tab natively, so this never calls preventDefault(). `e`
// is optional and only needed when the link sits inside another clickable
// element (a Grid cell's onclick opens the contact drawer) that a bare
// click would otherwise also trigger.
//
// Removes their Today's Actions card immediately if one is currently
// rendered (rather than waiting on the round trip below, or leaving it to
// flip to a "Generate message" card mid-view) and, in the background,
// advances both their account-level Journey Stage and (via the
// sequenceStage branch in PATCH /api/context/contact-fields) every
// campaign they're pending a connection in to "Connection Pending" -
// which also stamps Connection Sent Date on those Campaign Contacts rows
// (see search-server.js) - then refreshes this campaign's cached Sequence
// Stage map and repaints so the Grid cell's colour and Today's Actions both
// reflect it.
async function handleContactLinkedInOpened(cid, e){
  if(e) e.stopPropagation();
  const cardEl = document.getElementById('todaysAction-' + cid);
  if(cardEl) cardEl.remove();
  delete (window.__todaysActions || {})[cid];

  const c = state.contacts.find(x => x.id === cid);
  if(!c) return;
  if(!isAirtableRecordId(cid)){
    console.warn('Skipping Airtable Journey Stage sync - contact has no Airtable record id yet:', cid);
    toast('LinkedIn opened, but this contact hasn\'t synced to Airtable yet - press "Sync to Airtable" first.', 'warn');
    return;
  }

  try {
    const res = await fetch('/api/context/contact-fields', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ contactId: cid, journeyStage: 'Connection Pending', sequenceStage: 'Connection Pending' })
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || 'Request failed');

    c.state = 'connectionPending';
    const campaign = activeCampaignForContact(c);
    if(campaign) await loadCampaignSequenceStages(campaign);
    renderPage();
  } catch(err){
    console.warn('Could not update stage to Connection Pending:', err.message);
    toast('LinkedIn opened, but could not update stage: ' + err.message, 'warn');
  }
}

// Resolves which campaign a Skip click should exclude the contact from -
// the Grid's linked campaign when on the Grid page (currentGridCampaignName,
// only resolves when the grid is linked to exactly one), the Roadmap's
// scoped campaign when viewing one (window.__roadmapCampaignId), or
// whichever live campaign the contact is actually in otherwise (same
// fallback handleContactLinkedInOpened uses).
function campaignForSkipContext(c){
  if(window.__roadmapCampaignId){
    const camp = state.campaigns.find(x => x.id === window.__roadmapCampaignId);
    if(camp) return camp;
  }
  if(state.currentPage === 'grid'){
    const gridCampaignName = currentGridCampaignName();
    const camp = gridCampaignName ? state.campaigns.find(x => x.name === gridCampaignName) : null;
    if(camp) return camp;
  }
  return activeCampaignForContact(c);
}

// "Skip" on a Grid cell or Roadmap card (renderGridCell/renderGridCellHTML/
// renderKCard) - opens a reason modal (openSkipReasonModal) rather than
// skipping immediately, so the actual exclude (removing from
// state.contacts, POST .../exclude with Sequence Stage "Excluded") only
// happens once the user picks a reason in confirmSkipContact below.
function handleSkipContact(cid, e){
  if(e) e.stopPropagation();
  const c = state.contacts.find(x => x.id === cid);
  if(!c) return;
  openSkipReasonModal(cid);
}

function openSkipReasonModal(cid){
  const c = state.contacts.find(x => x.id === cid);
  if(!c) return;
  const optionLabelStyle = 'text-transform:none;font-weight:600;color:var(--text);display:flex;align-items:center;gap:8px;margin-bottom:0;cursor:pointer;';
  const body = `
    <div class="field">
      <label>Why are you skipping ${esc(c.name)}?</label>
      <div style="display:flex;flex-direction:column;gap:12px;margin-top:8px;">
        <div>
          <label style="${optionLabelStyle}"><input type="radio" name="skipReason" value="wrongTitle" style="width:auto;" onchange="updateSkipReasonFields()"> Wrong job title for this campaign</label>
          <input type="text" id="skipWrongTitle" placeholder="Correct job title" style="margin-top:6px;display:none;">
        </div>
        <div>
          <label style="${optionLabelStyle}"><input type="radio" name="skipReason" value="alreadyConnected" style="width:auto;" onchange="updateSkipReasonFields()"> Already connected</label>
        </div>
        <div>
          <label style="${optionLabelStyle}"><input type="radio" name="skipReason" value="hasHistory" style="width:auto;" onchange="updateSkipReasonFields()"> Already has messaging history</label>
          <select id="skipHistoryStage" style="margin-top:6px;display:none;">
            <option value="Messaging">Messaging</option>
            <option value="Warm">Warm</option>
            <option value="Campaign Ready">Campaign Ready</option>
          </select>
        </div>
        <div>
          <label style="${optionLabelStyle}"><input type="radio" name="skipReason" value="other" style="width:auto;" onchange="updateSkipReasonFields()"> Other</label>
          <textarea id="skipOtherNote" rows="2" placeholder="Note" style="margin-top:6px;display:none;"></textarea>
        </div>
      </div>
    </div>
  `;
  const footer = `
    <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
    <button class="btn btn-danger" onclick="confirmSkipContact('${cid}')"><i class="ti ti-player-skip-forward"></i> Skip contact</button>
  `;
  openModal(`Skip contact`, body, footer);
}

function updateSkipReasonFields(){
  const checked = document.querySelector('input[name="skipReason"]:checked');
  document.getElementById('skipWrongTitle').style.display = checked && checked.value === 'wrongTitle' ? 'block' : 'none';
  document.getElementById('skipHistoryStage').style.display = checked && checked.value === 'hasHistory' ? 'block' : 'none';
  document.getElementById('skipOtherNote').style.display = checked && checked.value === 'other' ? 'block' : 'none';
}

async function confirmSkipContact(cid){
  const c = state.contacts.find(x => x.id === cid);
  if(!c) return;
  const reasonEl = document.querySelector('input[name="skipReason"]:checked');
  if(!reasonEl){ toast('Pick a reason first', 'warn'); return; }
  const reason = reasonEl.value;

  let reasonLabel, note = '', newJobTitle = '';
  if(reason === 'wrongTitle'){
    newJobTitle = (document.getElementById('skipWrongTitle').value || '').trim();
    if(!newJobTitle){ toast('Enter the correct job title', 'warn'); return; }
    reasonLabel = 'Wrong job title for this campaign';
    note = `Job title updated to "${newJobTitle}"`;
  } else if(reason === 'alreadyConnected'){
    reasonLabel = 'Already connected';
  } else if(reason === 'hasHistory'){
    reasonLabel = 'Already has messaging history';
    note = document.getElementById('skipHistoryStage').value;
  } else {
    reasonLabel = 'Other';
    note = (document.getElementById('skipOtherNote').value || '').trim();
  }

  closeModal();

  const campaign = campaignForSkipContext(c);
  state.contacts = state.contacts.filter(x => x.id !== cid);
  renderPage();

  if(!isAirtableRecordId(cid)){
    console.warn('Skipping Airtable writes - contact has no Airtable record id yet:', cid);
    toast(`${c.name} skipped locally, but hasn't synced to Airtable yet - press "Sync to Airtable" first.`, 'warn');
    return;
  }

  try {
    if(reason === 'wrongTitle'){
      await fetch('/api/context/contact-fields', {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contactId: cid, jobTitle: newJobTitle })
      });
    } else if(reason === 'alreadyConnected'){
      await fetch('/api/context/contact-fields', {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contactId: cid, journeyStage: 'Connected' })
      });
    }

    if(!campaign){
      toast(`${c.name} skipped, but no linked campaign was found to exclude them from in Airtable`, 'warn');
      return;
    }

    const res = await fetch(`/api/campaign/${encodeURIComponent(campaign.name)}/contacts/${cid}/exclude`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ reason: reasonLabel, note })
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || 'Request failed');
    toast(`${c.name} skipped and excluded from ${campaign.name}`, 'success');
  } catch(err){
    console.warn('Could not process skip:', err.message);
    toast(`${c.name} skipped locally, but could not update Airtable: ` + err.message, 'warn');
  }
}

// "Generate message" on a fast-action card - drafts the next message in
// this contact's specific campaign sequence (not an account-level
// template) via POST /api/campaign/:name/contacts/:id/generate-message,
// then swaps the button area for the draft plus "Copy & mark sent".
async function handleGenerateFastMessage(cid){
  const action = (window.__todaysActions || {})[cid];
  const area = document.getElementById('fastActionArea-' + cid);
  if(!action || !action.campaignName || !area) return;
  area.innerHTML = '<span class="muted" style="font-size:12.5px;"><i class="ti ti-loader-2"></i> Generating message...</span>';

  try {
    const res = await fetch(`/api/campaign/${encodeURIComponent(action.campaignName)}/contacts/${cid}/generate-message`, { method: 'POST' });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || 'Request failed');

    // Cache the original AI draft so "Copy & mark sent" can diff the
    // textarea against it later to work out Draft Outcome.
    window.__fastActionOriginalDraft = window.__fastActionOriginalDraft || {};
    window.__fastActionOriginalDraft[cid] = data.message;

    area.innerHTML = `
      <textarea id="fastActionDraft-${cid}" rows="4" style="width:100%;margin-bottom:8px;">${esc(data.message)}</textarea>
      <button class="btn btn-primary btn-sm" onclick="handleCopyAndMarkSent('${cid}')"><i class="ti ti-check"></i> Copy &amp; mark sent</button>
    `;
  } catch(err){
    console.warn('Could not generate message:', err.message);
    toast('Could not generate message: ' + err.message, 'warn');
    area.innerHTML = `<button class="btn btn-primary btn-sm" onclick="handleGenerateFastMessage('${cid}')"><i class="ti ti-sparkles"></i> Generate message</button>`;
  }
}

// "Copy & mark sent" - copies the drafted message to the clipboard, then
// POSTs it to /api/campaign/:name/contacts/:id/mark-sent which logs a
// Touch Point, advances Sequence Stage to the next stage, and clears the
// now-stale Next Message Draft. Refreshes the Sequence Stage map and
// re-renders so the card updates to the next stage's action (or
// disappears if the sequence is now exhausted).
async function handleCopyAndMarkSent(cid){
  const action = (window.__todaysActions || {})[cid];
  const textarea = document.getElementById('fastActionDraft-' + cid);
  const message = textarea ? textarea.value : '';
  if(!action || !action.campaignName) return;

  const originalDraft = (window.__fastActionOriginalDraft || {})[cid] || '';

  // Discarded - the draft was cleared rather than sent. Record that as
  // feedback on the Campaign Contacts row (PATCH .../draft) without
  // advancing the sequence or logging a Touch Point, since nothing was
  // actually sent.
  if(!message.trim()){
    try {
      await fetch(`/api/campaign/${encodeURIComponent(action.campaignName)}/contacts/${cid}/draft`, {
        method: 'PATCH',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ draftOutcome: 'Discarded' })
      });
    } catch(err){
      console.warn('Could not log discarded draft:', err.message);
    }
    toast('Draft cleared - nothing to send', 'warn');
    return;
  }

  try {
    await navigator.clipboard.writeText(message);
  } catch(err){
    textarea.focus();
    textarea.select();
    document.execCommand('copy');
  }

  const area = document.getElementById('fastActionArea-' + cid);
  if(area) area.innerHTML = '<span class="muted" style="font-size:12.5px;"><i class="ti ti-loader-2"></i> Logging and advancing stage...</span>';

  // Diff against the original AI draft cached when it was generated -
  // 'Sent verbatim' if untouched, 'Sent edited' if Marcus rewrote it. Real
  // feedback signal on how good the draft actually was.
  const draftOutcome = message === originalDraft ? 'Sent verbatim' : 'Sent edited';

  try {
    const res = await fetch(`/api/campaign/${encodeURIComponent(action.campaignName)}/contacts/${cid}/mark-sent`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ message, draftOutcome })
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || 'Request failed');

    toast('Message copied and logged - moved to ' + data.newStage, 'success');
    const c = state.contacts.find(x => x.id === cid);
    const campaign = c ? activeCampaignForContact(c) : null;
    if(campaign) await loadCampaignSequenceStages(campaign);
    renderPage();
  } catch(err){
    console.warn('Could not mark message sent:', err.message);
    toast('Message copied, but could not log it: ' + err.message, 'warn');
  }
}

async function generateContactBrief(cid){
  const c = state.contacts.find(x => x.id === cid);
  const action = (window.__todaysActions || {})[cid];
  if(!c || !action) return;

  const method = recommendedMethodForAction(action);
  const panel = document.getElementById('brief-' + cid);
  const btn = document.getElementById('briefBtn-' + cid);
  if(!panel) return;
  const original = btn ? btn.innerHTML : '';
  if(btn){ btn.disabled = true; btn.innerHTML = '<i class="ti ti-loader-2"></i> Generating...'; }
  panel.style.display = 'block';
  panel.innerHTML = '<div class="muted" style="font-size:12.5px;"><i class="ti ti-loader-2"></i> Generating brief...</div>';

  const touchHistory = (c.touchPoints || []).slice().sort((x,y)=>new Date(x.date)-new Date(y.date))
    .map(tp => `${tp.date} — ${tp.type}${tp.communicationMethod ? ' ('+tp.communicationMethod+')' : ''}: ${tp.notes || 'no notes'}${(tp.painPoints && tp.painPoints.length) ? ' [pain points: '+tp.painPoints.join(', ')+']' : ''}`)
    .join('\n') || 'No touch points logged yet.';

  const isMessage = method === 'LinkedIn message' || method === 'Email';

  let result;
  try {
    const v = state.settings.strategy;
    const res = await fetch('/api/contacts/generate-brief', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contact: { name: c.name, role: c.role, company: c.company, journeyStage: c.state, painPoints: c.painPoints || [] },
        action: { type: action.type },
        method,
        touchHistory,
        voice: { tone: v.tone, connLength: v.connLength, cadence: v.cadence, voiceInstructions: v.voiceInstructions }
      })
    });
    const data = await res.json();
    if(!res.ok || !data.success) throw new Error(data.error || 'Request failed');
    result = data.message;
  } catch(err){
    console.warn('Brief generation unavailable, using local fallback:', err.message);
    result = localBriefFallback(c, action, method, isMessage);
  }

  window.__contactBriefs = window.__contactBriefs || {};
  window.__contactBriefs[cid] = { result, isMessage, method };
  panel.innerHTML = renderBriefPanelHtml(cid, result, isMessage);
  if(btn){ btn.disabled = false; btn.innerHTML = original; }

  const date = isoDate(TODAY);
  const tpType = TOUCH_POINT_TYPES.includes(method) ? method : 'LinkedIn message';
  if(!c.touchPoints) c.touchPoints = [];
  c.touchPoints.push({ id: uid('tp'), date, type: tpType, communicationMethod: method, notes: 'Engine-generated brief', painPoints: [], aiBrief: result });

  {
    const briefTpFields = {
      contactName: c.name,
      company: c.company,
      date,
      type: tpType,
      notes: 'Engine-generated brief',
      outcome: 'No reply',
      communicationMethod: method,
      aiBrief: result
    };
    if(airtableWriteGuard('touchpoint', briefTpFields, ['contactName','type'])){
      fetch('/api/airtable/touchpoint', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(briefTpFields)
      }).catch(err => console.warn('Airtable brief sync failed:', err.message));
    }
  }

  toast('Brief generated', 'success');
}

function localBriefFallback(c, action, method, isMessage){
  const painPoint = (c.painPoints && c.painPoints[0]) || null;
  if(isMessage){
    const opener = painPoint
      ? `Last time we touched on ${painPoint.toLowerCase()}, keen to hear how that is tracking.`
      : `Keen to hear how things are tracking on your end.`;
    return `Hi ${firstName(c.name)}, following up given where things are with ${c.company}. ${opener}\n\nTwenty2 Collective`;
  }
  return [
    `- Cover: where things stand since the last touch point and next steps for ${c.company}.`,
    `- Reference: ${painPoint ? painPoint.toLowerCase() : 'their current priorities'}, which came up in an earlier conversation.`,
    `- Avoid: being pushy about next steps if they have not engaged much yet.`,
    `- Aim: leave with a clear next step or date to follow up.`
  ].join('\n');
}

function renderBriefPanelHtml(cid, text, isMessage){
  return `
    <div class="intel-draft">
      <div class="intel-draft-head">
        <div class="intel-draft-name">${isMessage ? 'Drafted message' : 'Call brief'}</div>
        <button class="btn btn-secondary btn-sm" onclick="copyContactBrief('${cid}')"><i class="ti ti-copy"></i> Copy</button>
      </div>
      <div class="intel-draft-text">${esc(text)}</div>
    </div>`;
}

async function copyContactBrief(cid){
  const entry = window.__contactBriefs && window.__contactBriefs[cid];
  if(!entry || !entry.result) return;
  try {
    await navigator.clipboard.writeText(entry.result);
  } catch(err){
    const ta = document.createElement('textarea');
    ta.value = entry.result;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  }
  toast('Brief copied to clipboard', 'success');
}

const SPREADSHEET_COLUMNS = [
  { key:'name', label:'Name' },
  { key:'company', label:'Company' },
  { key:'title', label:'Title' },
  { key:'journeyStage', label:'Journey Stage' },
  { key:'sequenceStage', label:'Sequence Stage' },
  { key:'touchPoints', label:'Touch Points', numeric:true },
  { key:'lastContact', label:'Last Contact', date:true },
  { key:'nextDraft', label:'Next Message Draft' },
  { key:'dms', label:'DMs Sent', numeric:true },
  { key:'calls', label:'Calls', numeric:true },
  { key:'coffee', label:'Coffee', numeric:true },
  { key:'email', label:'Email', numeric:true }
];

function gridViewMode(gridId){
  try { return localStorage.getItem('t2c_grid_view_'+gridId) === 'table' ? 'table' : 'grid'; }
  catch(e){ return 'grid'; }
}

function setGridViewMode(gridId, mode){
  try { localStorage.setItem('t2c_grid_view_'+gridId, mode); } catch(e){}
  window.__gridColumnsDropdownOpen = false;
  renderPage();
}

function gridVisibleColumns(gridId){
  try {
    const raw = localStorage.getItem('t2c_grid_columns_'+gridId);
    if(raw){
      const saved = JSON.parse(raw);
      if(Array.isArray(saved)) return saved;
    }
  } catch(e){}
  return SPREADSHEET_COLUMNS.map(c => c.key);
}

function toggleGridColumn(gridId, key){
  const visible = new Set(gridVisibleColumns(gridId));
  if(visible.has(key)) visible.delete(key); else visible.add(key);
  const ordered = SPREADSHEET_COLUMNS.map(c => c.key).filter(k => visible.has(k));
  try { localStorage.setItem('t2c_grid_columns_'+gridId, JSON.stringify(ordered)); } catch(e){}
  renderPage();
}

function toggleGridColumnsDropdown(){
  window.__gridColumnsDropdownOpen = !window.__gridColumnsDropdownOpen;
  renderPage();
}

// Contact tally shown in the toolbar shared by both Grid and Table view

// view) - same count/exclusion rule as the "Live · N contacts tracked
// across M companies" status-bar line further down the page, just visible

  return gridContacts(gridId).filter(c => !isContactExcludedFromGrid(c)).length;

// Contacts on this grid with no company set yet - e.g. an Apollo import
// that only came in with a job title. They can't occupy a (company, role)
// matrix cell (there's no company row for them to sit in), so they'd
// otherwise be invisible in Grid view even though they're really on this
// grid - see renderUnassignedGridRow, which surfaces them in their own row
// bucketed by role/column instead.
function unassignedGridContacts(gridId){
  return gridContacts(gridId).filter(c => !isContactExcludedFromGrid(c) && !(c.company||'').trim());
}

// Extra rows, above the normal company rows, holding every company-less
// contact on this grid - one row per contact (e.g. an Apollo import that
// only came in with a job title, no organisation), each placed in whichever
// column matches their role, same column set as the rest of the matrix, so
// two company-less contacts never collapse into the same row just because
// they share a role. Once "Run daily search" fills in a contact's company
// (see applyFillMissingFieldResult), they disappear from here and appear in
// their proper row on the next render.
function renderUnassignedGridRow(grid, cols){
  const unassigned = unassignedGridContacts(grid.id);
  if(!unassigned.length) return '';
  return unassigned.map(c => `
    <tr class="unassigned-row" style="background:var(--surface-2);">
      <td class="company-cell"><span class="muted" style="font-style:italic;">No company yet</span></td>
      ${cols.map(role => role === c.role ? `<td>${renderGridCellHTML(c)}</td>` : '<td><div class="cell-empty">—</div></td>').join('')}
    </tr>
  `).join('');
}

// A company can have more than one contact for the same role (see
// contactsForCell) - this gives it as many rows as its fullest column needs,
// each carrying the same company label, instead of the matrix only ever
// showing one contact per (company, role) pair.

  const rowCount = Math.max(1, ...cols.map(role => contactsForCell(company, role).length));
  const companyCell = `<td class="company-cell"><span style="cursor:pointer;" onclick="openCompanyDrawer('${esc(company)}')">${esc(company)}</span>${renderCompanyLinkedInIcon(company)}</td>`;
  let rowsHtml = '';
  for(let i = 0; i < rowCount; i++){
    rowsHtml += `<tr>${companyCell}${cols.map(role => renderGridCell(company, role, i)).join('')}</tr>`;
  }
  return rowsHtml;
}

function renderGridViewArea(grid, cols){
  ensureGridCampaignDataLoaded(grid.id);
  if(gridViewMode(grid.id) === 'table') return renderContactSpreadsheet(grid);
  return `
  <div class="grid-wrap">

      <tbody id="gridBody">
        ${renderUnassignedGridRow(grid, cols)}

    </table>

  <div class="legend">
    <div class="legend-item"><span class="legend-swatch" style="background:#e2f2fa;"></span> Found</div>
    <div class="legend-item"><span class="legend-swatch" style="background:#fdf1e2;"></span> Opened</div>
    <div class="legend-item"><span class="legend-swatch" style="background:#fdf0d9;"></span> Connection pending</div>
    <div class="legend-item"><span class="legend-swatch" style="background:#eaf7f0;"></span> Connected</div>
    <div class="legend-item"><span class="legend-swatch" style="background:rgba(139,92,246,0.08);"></span> Messaging</div>
    <div class="legend-item"><span class="legend-swatch" style="background:#fdf3d0;"></span> Booked</div>
