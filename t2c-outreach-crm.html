function onShotDragOver(e, kind){
  e.preventDefault();
  e.stopPropagation();
  const box = document.getElementById('shotbox-'+kind);
  if(box) box.classList.add('dragover');
}
function onShotDragLeave(e, kind){
  const box = document.getElementById('shotbox-'+kind);
  if(box) box.classList.remove('dragover');
}
function onShotDrop(e, kind){
  e.preventDefault();
  e.stopPropagation();
  const box = document.getElementById('shotbox-'+kind);
  if(box) box.classList.remove('dragover');
  const files = Array.from(e.dataTransfer.files || []).filter(f => f.type.startsWith('image/'));
  if(files.length) processShotFiles(files, kind);
}
function handleScreenshotUpload(event, kind){
  const files = Array.from(event.target.files || []);
  if(files.length) processShotFiles(files, kind);
  event.target.value = '';
}
function processShotFiles(files, kind){
  if(!window.__genCtx) return;
  const arrKey = kind === 'profile' ? 'profileImages' : 'convoImages';
  let pending = files.length;
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = () => {
      const match = String(reader.result).match(/^data:([^;]+);base64,(.*)$/);
      if(match){
        window.__genCtx[arrKey].push({ name: file.name, mediaType: match[1], base64: match[2] });
      }
      pending--;
      if(pending === 0){
        renderShotFiles(kind);
        toast(files.length+' screenshot'+(files.length===1?'':'s')+' attached', 'success');
      }
    };
    reader.readAsDataURL(file);
  });
}
function renderShotFiles(kind){
  const arrKey = kind === 'profile' ? 'profileImages' : 'convoImages';
  const list = (window.__genCtx && window.__genCtx[arrKey]) || [];
  const el = document.getElementById('shotfiles-'+kind);
  if(!el) return;
  el.innerHTML = list.map((f,i) => `<span class="shot-file-chip">${esc(f.name)}<button onclick="removeScreenshot('${kind}',${i})">&times;</button></span>`).join('');
}
function removeScreenshot(kind, idx){
  const arrKey = kind === 'profile' ? 'profileImages' : 'convoImages';
  window.__genCtx[arrKey].splice(idx,1);
  renderShotFiles(kind);
}

async function generateMessageForModal(cid, stageKey){
  const c = state.contacts.find(x=>x.id===cid);
  const seq = state.sequences.find(s=>s.id===c.seqId) || state.sequences[0];
  const st = STAGE_META.find(s=>s.key===stageKey);
  const notes = document.getElementById('genNotes') ? document.getElementById('genNotes').value : c.notes;

  const campaign = activeCampaignForContact(c);
  const campaignStageMap = { m1:'message1', m2:'followUp1', cta:'followUp2' };
  const campaignStage = campaign && campaignStageMap[stageKey] ? campaign.sequence[campaignStageMap[stageKey]] : null;
  const template = (campaignStage && campaignStage.content) ? campaignStage.content : (seq.stages[stageKey] || '');

  const profileImages = (window.__genCtx && window.__genCtx.profileImages) || [];
  const convoImages = (window.__genCtx && window.__genCtx.convoImages) || [];
  const images = [...profileImages, ...convoImages].map(f => ({ mediaType: f.mediaType, base64: f.base64 }));
  let imageNote = '';
  if(profileImages.length) imageNote += ` You've been given ${profileImages.length} screenshot(s) of the contact's LinkedIn profile — read their bio, posts and work history and weave in anything relevant.`;
  if(convoImages.length) imageNote += ` You've also been given ${convoImages.length} screenshot(s) of the conversation so far — read what they actually said and write a reply that responds to it naturally, rather than restating the template.`;
  const campaignNote = campaign ? `\n\nThis contact is part of the active campaign "${campaign.name}" (goal: ${campaign.goal}). Campaign strategy: ${campaign.strategyBrief || 'none recorded'}. Write in line with this strategy.` : '';

  const prompt = `Template for this stage:\n${template}\n\nContact: ${c.name}, ${c.role} at ${c.company}. Sequence stage: ${st.label} (message ${messageNumberForStage(stageKey) || 'n/a'} in the sequence). Profile notes: ${notes || 'none'}.\n\n${ctaStrategyNote(stageKey)}\n\n${voiceRulesText()}${imageNote}${campaignNote}\n\nWrite the actual message for this specific contact, replacing placeholders naturally. Return only the message text.`;
  const result = await callAI(prompt, 400, ()=>fillTemplate(template, c, stageKey), images);
  const out = document.getElementById('genOutput');
  if(out) out.value = result;
}
function fillTemplate(template, c, stageKey){
  const filled = (template || '')
    .replace(/{{first}}/g, firstName(c.name))
    .replace(/{{company}}/g, c.company)
    .replace(/{{role}}/g, c.role);
  return appendCtaNudge(filled, stageKey);
}
function regenerateMessage(cid, stageKey){
  const out = document.getElementById('genOutput');
  if(out) out.value = 'Generating...';
  generateMessageForModal(cid, stageKey);
}
async function copyGeneratedMessage(){
  const out = document.getElementById('genOutput');
  if(!out || !out.value || out.value === 'Generating...') return;
  try {
    await navigator.clipboard.writeText(out.value);
  } catch(err){
    out.focus();
    out.select();
    document.execCommand('copy');
  }
  toast('Message copied to clipboard', 'success');
}
function saveGeneratedMessage(cid, stageKey){
  const c = state.contacts.find(x=>x.id===cid);
  const output = document.getElementById('genOutput').value;
  c.generated[stageKey] = output;
  c.notes = document.getElementById('genNotes').value;
  if(stageKey==='connect'){ c.connReqDate = c.connReqDate || isoDate(TODAY); }
  if(stageKey==='m1'){ c.connDate = c.connDate || isoDate(TODAY); c.thread.connSent = c.thread.connSent || isoDate(TODAY); c.thread.m1 = { sent: isoDate(TODAY), replied:false }; c.state='messaging'; state.activity.unshift({ type:'message', text:`Message 1 sent to ${c.name} (${c.company})`, date: isoDate(TODAY) }); }
  if(stageKey==='m2'){ c.thread.m2 = { sent: isoDate(TODAY), replied:false }; state.activity.unshift({ type:'message', text:`Message 2 sent to ${c.name} (${c.company})`, date: isoDate(TODAY) }); }
  if(stageKey==='cta'){ c.thread.cta = c.thread.cta || CTA_OPTIONS[0]; }
  notifyWebhook(c);
  closeModal();
  toast('Message saved for '+c.name, 'success');
  if(window.__genCtx && window.__genCtx.onDone) window.__genCtx.onDone();
  else renderPage();
}

// Two views: the list (default) and the detail view for one campaign,
// tracked via window.__campaignView ('list' | 'chat' | 'detail'). "Paused"
// was mentioned once in the brief for the detail status pill, but the
// status model was deliberately simplified to exactly Draft/Live/Past in an
// earlier session at explicit user request - kept that 3-status model
// consistent everywhere here rather than reintroducing a 4th status.

const CAMPAIGN_STAGE_META = [['message1','Message 1'],['followUp1','Follow up 1'],['followUp2','Follow up 2']];
const CAMPAIGN_OPENING_MESSAGE = 'Tell me about the campaign you want to run. You can be as detailed or as brief as you like.';
const SEQUENCE_TOUCH_TYPES = ['LinkedIn message','Email','Call'];
const CAMPAIGN_STATUS_CLASS = { Draft:'campaign-status-draft', Live:'campaign-status-active', Past:'campaign-status-complete' };

function renderCampaigns(){
  const view = window.__campaignView || 'list';
  if(view === 'chat') return renderCampaignChatTab();
  if(view === 'detail') return renderCampaignDetail();
  return renderCampaignListView();
}

function campaignMetrics(campaign){
  const contacts = campaignContacts(campaign);
  const contactCount = contacts.length;
  let touchPoints = 0, replies = 0;
  contacts.forEach(c => {
    touchPoints += (c.touchPoints||[]).length;
    if(c.thread.m1 && c.thread.m1.replied) replies++;
    if(c.thread.m2 && c.thread.m2.replied) replies++;
  });
  const bookings = contacts.filter(c => c.thread.booked).length;
  const conversionRate = contactCount ? Math.round((bookings/contactCount)*100) : 0;
  const replyRate = touchPoints ? Math.round((replies/touchPoints)*100) : 0;
  return { contactCount, touchPoints, replies, replyRate, bookings, conversionRate };
}

function campaignContactStatus(c){
  if(c.thread.booked) return 'Booked';
  if((c.thread.m2 && c.thread.m2.replied) || (c.thread.m1 && c.thread.m1.replied)) return 'Replied';
  const lastTouch = lastTouchPointDate(c);
  if(lastTouch && daysBetween(lastTouch) > 14) return 'Unresponsive';
  return 'Active';
}

async function sendCampaignChatMessage(){
  const input = document.getElementById('campaignChatInput');
  const text = input ? input.value.trim() : '';
  if(!text) return;
  const chat = window.__campaignChat;
  chat.messages.push({ role:'user', content:text });
  chat.chips = [];
  renderPage();
  scrollCampaignChatToBottom();

  chat.messages.push({ role:'assistant', content:'...', pending:true });
  renderPage();
  scrollCampaignChatToBottom();
  const sendBtn = document.getElementById('campaignChatSendBtn');
  if(sendBtn) sendBtn.disabled = true;

  try {
    const res = await fetch('/api/campaign/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ conversationHistory: chat.messages.filter(m=>!m.pending).map(m=>({role:m.role, content:m.content})) })
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || ('Request failed with status '+res.status));

    chat.messages.pop();
    chat.messages.push({ role:'assistant', content: data.message });
    chat.chips = data.chips || [];
    chat.ready = !!data.ready;
    chat.progressPercent = typeof data.progressPercent === 'number' ? data.progressPercent : chat.progressPercent;

    renderPage();
    scrollCampaignChatToBottom();

    if(chat.ready) buildCampaignFromChat();
  } catch(err){
    chat.messages.pop();
    chat.messages.push({ role:'assistant', content: "Sorry, I couldn't process that - " + err.message });
    renderPage();
    scrollCampaignChatToBottom();
    toast('Campaign chat error: ' + err.message, 'warn');
  }
}

async function buildCampaignFromChat(){
  const chat = window.__campaignChat;
  chat.progressPercent = 100;
  renderPage();
  scrollCampaignChatToBottom();

  try {
    const res = await fetch('/api/campaign/build', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ conversationHistory: chat.messages.filter(m=>!m.pending).map(m=>({role:m.role, content:m.content})) })
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || ('Request failed with status '+res.status));
    chat.previewCampaign = data;
    renderPage();
    scrollCampaignChatToBottom();
  } catch(err){
    toast('Could not build campaign preview: ' + err.message, 'warn');
  }
}

// Contacts belonging to a campaign are the union of anything explicitly
// added via contactIds (the AI chat builder's matched contacts, or manual
// adds) and anyone sitting on a grid linked to the campaign via gridIds -
// grids are never duplicated, just referenced, so this is a live view, not
// a copy.
function campaignContacts(campaign){
  const ids = new Set(campaign.contactIds || []);
  (campaign.gridIds || []).forEach(gid => gridContacts(gid).forEach(c => ids.add(c.id)));
  return state.contacts.filter(c => ids.has(c.id));
}

async function loadCampaignSequenceStages(campaign){
  try {
    const res = await fetch(`/api/campaign/${encodeURIComponent(campaign.name)}/campaign-contacts`);

    if(!res.ok) throw new Error(data.error || ('Request failed with status '+res.status));

    window.__campaignSequenceStages[campaign.id] = map;

    console.warn('Could not load campaign sequence stages:', err.message);
    window.__campaignSequenceStages = window.__campaignSequenceStages || {};
    window.__campaignSequenceStages[campaign.id] = {};
  }
  if(window.__campaignView === 'detail' && window.__campaignDetailId === campaign.id && window.__campaignDetailTab === 'roadmap') renderPage();
}

// Campaign-specific only, never account-wide: everything here is computed
// from campaignContacts(campaign) and campaign.deals, not state.contacts as
// a whole. Charts render via Chart.js once the canvases exist in the DOM -
// see initCampaignAnalyticsCharts(), called from afterRender.

const CAMPAIGN_PERIOD_OPTIONS = [ ['thisWeek','This week'], ['lastWeek','Last week'], ['30d','Last 30 days'], ['60d','Last 60 days'], ['quarter','This quarter'] ];
const LEAD_STATUS_META = [ ['connected','Connected','#0084C5'], ['messaging','Messaging','#FFD05D'], ['warm','Warm','#FF834C'], ['booked','Booked','#44A574'], ['lost','Lost','#c44a2a'] ];

function startOfWeek(d){
  const date = new Date(d); const day = date.getDay();
  date.setDate(date.getDate() + ((day===0?-6:1)-day));
  date.setHours(0,0,0,0);
  return date;
}

function campaignPeriodBounds(periodKey){
  const today = new Date(TODAY); today.setHours(0,0,0,0);
  let start, end;
  if(periodKey === 'thisWeek'){ start = startOfWeek(today); end = today; }
  else if(periodKey === 'lastWeek'){ const ws = startOfWeek(today); end = new Date(ws); end.setDate(end.getDate()-1); start = new Date(ws); start.setDate(start.getDate()-7); }
  else if(periodKey === '30d'){ start = new Date(today); start.setDate(start.getDate()-29); end = today; }
  else if(periodKey === '60d'){ start = new Date(today); start.setDate(start.getDate()-59); end = today; }
  else { const q = Math.floor(today.getMonth()/3); start = new Date(today.getFullYear(), q*3, 1); end = today; }
  end = new Date(end); end.setHours(23,59,59,999);
  const spanMs = end - start;
  const prevEnd = new Date(start); prevEnd.setDate(prevEnd.getDate()-1); prevEnd.setHours(23,59,59,999);
  const prevStart = new Date(prevEnd.getTime() - spanMs);
  return { start, end, prevStart, prevEnd };
}

function inDateRange(dateStr, start, end){
  if(!dateStr) return false;
  const d = new Date(dateStr+'T12:00:00');
  return d >= start && d <= end;
}

function campaignLeadStatus(c){
  if(c.thread.booked) return 'booked';
  if(campaignContactStatus(c) === 'Unresponsive') return 'lost';
  if(c.state === 'messaging'){
    const replied = (c.thread.m1 && c.thread.m1.replied) || (c.thread.m2 && c.thread.m2.replied);
    return replied ? 'warm' : 'messaging';
  }
  if(c.state === 'connected') return 'connected';
  return null;
}

function buildCampaignSeries(campaign, periodKey){
  const { start, end } = campaignPeriodBounds(periodKey);
  const contacts = campaignContacts(campaign);
  const deals = campaign.deals || [];
  const totalDays = Math.round((end-start)/86400000)+1;
  const useDaily = totalDays <= 14;
  const bucketDays = useDaily ? 1 : 7;
  const buckets = [];
  let cursor = new Date(start);
  while(cursor <= end){
    const bEnd = new Date(cursor); bEnd.setDate(bEnd.getDate()+bucketDays-1); bEnd.setHours(23,59,59,999);
    buckets.push({ start:new Date(cursor), end: bEnd > end ? end : bEnd });
    cursor = new Date(cursor); cursor.setDate(cursor.getDate()+bucketDays);
  }
  const labels = buckets.map(b => useDaily ? fmtDateShort(isoDate(b.start)) : `${fmtDateShort(isoDate(b.start))}–${fmtDateShort(isoDate(b.end))}`);
  const contactIds = new Set(contacts.map(c=>c.id));
  const leads = buckets.map(b => contacts.filter(c => inDateRange(c.foundDate, b.start, b.end)).length);
  const meetings = buckets.map(b => state.bookings.filter(bk => contactIds.has(bk.contactId) && inDateRange(bk.date, b.start, b.end)).length);
  const won = buckets.map(b => deals.filter(d => d.outcome === 'won' && inDateRange(d.date, b.start, b.end)).length);
  return { labels, leads, meetings, won };
}

    window.__campaignInsights = data.insights || [];

  if(outcome === 'won') return 'tag-connected';
  if(outcome === 'lost') return 'tag-opened';
  return 'tag-messaging';
}

function renderCampaignSalesTab(campaign){
  const period = window.__salesPeriod || 'thisWeek';
  const { start, end, prevStart, prevEnd } = campaignPeriodBounds(period);
  const contacts = campaignContacts(campaign);
  const contactIds = new Set(contacts.map(c=>c.id));
  const deals = campaign.deals || [];

  const scorecardFor = (s,e) => ({
    leads: contacts.filter(c => inDateRange(c.foundDate, s, e)).length,

  });
  const current = scorecardFor(start, end);
  const previous = scorecardFor(prevStart, prevEnd);
  const deltaLabel = (a,b) => { const d = a-b; return d===0 ? 'No change vs last period' : (d>0 ? `+${d} vs last period` : `${d} vs last period`); };

      <div class="mini-card"><div class="num">${current.meetings}</div><div class="label">Meetings booked</div><div class="muted" style="font-size:11px;margin-top:4px;">${deltaLabel(current.meetings,previous.meetings)}</div></div>
      <div class="mini-card"><div class="num">${current.won}</div><div class="label">Deals closed</div><div class="muted" style="font-size:11px;margin-top:4px;">${deltaLabel(current.won,previous.won)}</div></div>
      <div class="mini-card"><div class="num">${current.lost}</div><div class="label">Deals lost</div><div class="muted" style="font-size:11px;margin-top:4px;">${deltaLabel(current.lost,previous.lost)}</div></div>
    </div>
  </div>

  <div class="card" style="margin-bottom:16px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
      <div class="section-title" style="margin-bottom:0;"><i class="ti ti-notes"></i> Sales log</div>

    </div>
    <div class="perf-table-wrap">
      <table class="perf-table">
        <thead><tr><th>Date</th><th>Contact</th><th>Company</th><th>Outcome</th><th>Deal value</th><th>Notes</th></tr></thead>
        <tbody>
          ${periodDeals.length ? periodDeals.map(d => `
            <tr>
              <td>${fmtDate(d.date)}</td>
              <td class="perf-name">${esc(d.contactName)}</td>
              <td>${esc(d.company)}</td>
              <td><span class="tag ${dealOutcomeTagClass(d.outcome)}">${esc(d.outcome)}</span></td>
              <td>${d.value ? '$'+Number(d.value).toLocaleString() : '—'}</td>
              <td>${esc((d.notes||'').slice(0,80))}${(d.notes||'').length>80?'…':''}</td>
            </tr>
          `).join('') : `<tr><td colspan="6"><span class="muted">No deals logged for this period.</span></td></tr>`}
        </tbody>
      </table>
    </div>
  </div>

  <div class="card">
    <div class="section-title"><i class="ti ti-file-text"></i> Sales conversation transcripts</div>
    <p class="muted" style="font-size:12.5px;margin-bottom:14px;">Paste a transcript or upload a file. Claude scores it against this campaign's Strategy (script adherence, CTAs used, objections raised) and saves the analysis to Airtable, tagged to this campaign so it feeds account-level intelligence.</p>

    <button class="btn btn-primary btn-sm" style="margin-top:10px;" id="analyzeTranscriptBtn" onclick="analyzeSalesTranscript('${campaign.id}')"><i class="ti ti-sparkles"></i> Score against Strategy</button>
    <div id="salesTranscriptResult" class="learning-result"></div>

    ${(campaign.transcriptAnalyses||[]).length ? `
    <div style="margin-top:18px;">
      <div style="font-weight:700;font-size:12px;margin-bottom:8px;">Past analyses</div>
      ${campaign.transcriptAnalyses.slice().reverse().map(a => `

function confirmAddDeal(){
  const campaign = state.campaigns.find(c => c.id === window.__addDealCampaignId);
  if(!campaign) return;
  const contactName = document.getElementById('dealContactName').value.trim();
  const company = document.getElementById('dealCompany').value.trim();
  const outcome = document.getElementById('dealOutcome').value;
  const value = document.getElementById('dealValue').value;
  const date = document.getElementById('dealDate').value || isoDate(TODAY);
  const notes = document.getElementById('dealNotes').value.trim();
  if(!contactName){ toast('Add a contact name', 'warn'); return; }

  if(!campaign.deals) campaign.deals = [];
  const deal = { id: uid('deal'), contactName, company, outcome, value: value ? parseFloat(value) : 0, notes, date };
  campaign.deals.push(deal);
  campaign.updatedAt = isoDate(TODAY);
  closeModal();
  renderPage();
  toast('Deal logged', 'success');

  fetch(`/api/campaign/${encodeURIComponent(campaign.name)}/sales/deal`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(Object.assign({ campaignId: campaign.id, campaignName: campaign.name }, deal))
  }).catch(err => console.warn('Sales log Airtable sync failed:', err.message));
}

function handleSalesTranscriptFile(event){
  const file = event.target.files && event.target.files[0];
  event.target.value = '';
  if(!file) return;
  if(file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf')){
    const reader = new FileReader();
    reader.onload = () => {
      const match = String(reader.result).match(/^data:([^;]+);base64,(.*)$/);
      if(match){
        window.__salesTranscriptFile = { mediaType:'application/pdf', base64: match[2], name:file.name };
        const el = document.getElementById('salesTranscriptFilePreview');
        if(el) el.innerHTML = `<span class="tag tag-connected">${esc(file.name)} attached</span> <button class="btn btn-ghost btn-sm" onclick="clearSalesTranscriptFile()"><i class="ti ti-x"></i></button>`;
      }
    };
    reader.readAsDataURL(file);
  } else {
    const reader = new FileReader();
    reader.onload = () => {
      const textEl = document.getElementById('salesTranscriptText');
      if(textEl) textEl.value = String(reader.result);
      window.__salesTranscriptFile = null;
      const el = document.getElementById('salesTranscriptFilePreview');
      if(el) el.innerHTML = `<span class="muted">${esc(file.name)} loaded into the text field</span>`;
    };
    reader.readAsText(file);
  }
}
function clearSalesTranscriptFile(){
  window.__salesTranscriptFile = null;
  const el = document.getElementById('salesTranscriptFilePreview');
  if(el) el.innerHTML = '';
}

async function analyzeSalesTranscript(campaignId){
  const campaign = state.campaigns.find(c => c.id === campaignId);
  if(!campaign) return;
  const text = (document.getElementById('salesTranscriptText')?.value || '').trim();
  const file = window.__salesTranscriptFile;
  if(!text && !file){ toast('Paste a transcript or upload a file first', 'warn'); return; }

  const btn = document.getElementById('analyzeTranscriptBtn');
  const original = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<i class="ti ti-loader-2"></i> Scoring against Strategy...';

  try {
    const res = await fetch(`/api/campaign/${encodeURIComponent(campaign.name)}/sales/analyze-transcript`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        campaignId: campaign.id,
        transcript: file ? undefined : text,
        fileBase64: file ? file.base64 : undefined,
        fileMediaType: file ? file.mediaType : undefined,
        strategy: {
          goal: campaign.goal,
          targetSegmentSummary: campaign.targetSegmentSummary,
          pitchAngle: campaign.pitchAngle,
          objectionHandling: campaign.objectionHandling,
          sequence: campaign.sequence
        }
      })
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || ('Request failed with status '+res.status));

    const analysis = { id: uid('ta'), date: isoDate(TODAY), summary: data.summary||'', scriptAdherence: data.scriptAdherence||'', ctasUsed: data.ctasUsed||[], objectionsRaised: data.objectionsRaised||[] };
    if(!campaign.transcriptAnalyses) campaign.transcriptAnalyses = [];
    campaign.transcriptAnalyses.push(analysis);

    toast('Transcript scored and saved to Airtable', 'success');
    const textEl = document.getElementById('salesTranscriptText');
    if(textEl) textEl.value = '';
    clearSalesTranscriptFile();
    renderPage();
  } catch(err){
    const resultEl = document.getElementById('salesTranscriptResult');
    if(resultEl) resultEl.innerHTML = `<p class="muted" style="font-size:12.5px;">Could not analyse: ${esc(err.message)}</p>`;
    toast('Could not analyse transcript: ' + err.message, 'warn');
    btn.disabled = false;
    btn.innerHTML = original;
  }
}

/* ---- Status transitions + Airtable sync ---- */

function publishCampaign(campaignId){
  const campaign = state.campaigns.find(c => c.id === campaignId);
  if(!campaign) return;
  campaign.status = 'Live';
  campaign.liveDate = isoDate(TODAY);
  campaign.updatedAt = isoDate(TODAY);
  syncCampaignStatusToAirtable(campaign);
  toast(`Campaign "${campaign.name}" is live — ${(campaign.contactIds||[]).length} contacts activated in Today's actions`, 'success');
  renderPage();
}

function pauseCampaign(campaignId){
  const campaign = state.campaigns.find(c => c.id === campaignId);
  if(!campaign) return;
  campaign.status = 'Draft';
  campaign.updatedAt = isoDate(TODAY);
  syncCampaignStatusToAirtable(campaign);
  toast(`Campaign "${campaign.name}" paused and moved back to Draft`, 'success');
  renderPage();
}

function completeCampaign(campaignId){
  const campaign = state.campaigns.find(c => c.id === campaignId);
  if(!campaign) return;
  campaign.status = 'Past';
  campaign.endedDate = isoDate(TODAY);
  campaign.updatedAt = isoDate(TODAY);
  syncCampaignStatusToAirtable(campaign);
  toast(`Campaign "${campaign.name}" marked complete`, 'success');
  renderPage();
}

function formatSequenceForAirtable(sequence){
  return CAMPAIGN_STAGE_META.map(([key,label]) => {
    const stage = sequence[key];
    if(!stage) return '';
    return `${label} (${stage.type || 'LinkedIn message'}, ${stage.timing || 'timing not set'}):\n${stage.content || ''}`;
  }).filter(Boolean).join('\n\n');
}

function syncCampaignToAirtable(campaign){
  const contactNames = state.contacts.filter(c => (campaign.contactIds||[]).includes(c.id)).map(c => c.name);
  fetch('/api/airtable/campaign', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      name: campaign.name,
      goal: campaign.goal,
      product: campaign.product || '',
      targetIcp: campaign.targetSegmentSummary,
      contactIds: contactNames,
      sequenceTemplates: formatSequenceForAirtable(campaign.sequence),
      strategyNotes: campaign.strategyBrief,
      pitchAngle: campaign.pitchAngle || '',
      objectionHandling: campaign.objectionHandling || '',
      successMetric: campaign.successMetric || '',
      startDate: campaign.createdAt,
      status: campaign.status
    })
  }).catch(err => console.warn('Airtable campaign sync failed:', err.message));
}

// Creates a Campaign Contacts junction row (Airtable) for each contact the
// moment they join a campaign, whether via the Grid tab (linking/creating a
// grid) or the Roadmap tab's Add contacts modal - so every campaign member
// has a Sequence Stage row from day one instead of only once a touch point
// or screenshot happens to create one.
function linkContactsToCampaignAirtable(campaign, contactNames){
  if(!contactNames.length) return;
  fetch(`/api/campaign/${encodeURIComponent(campaign.name)}/contacts/link`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ contactNames })
  }).catch(err => console.warn('Campaign Contacts link sync failed:', err.message));
}

function syncCampaignStatusToAirtable(campaign){
  fetch('/api/campaign/status', {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: campaign.name, status: campaign.status })
  }).catch(err => console.warn('Campaign status sync failed:', err.message));
}

/* ===================== CALENDAR PAGE ===================== */

function renderCalendar(){
  const y = state.calYear, m = state.calMonth;
  const first = new Date(y, m, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const monthLabel = first.toLocaleDateString('en-AU',{month:'long', year:'numeric'});
  const cells = [];
  for(let i=0;i<startDow;i++) cells.push(null);
  for(let d=1; d<=daysInMonth; d++) cells.push(d);

  return `
  <div class="cal-header">
    <div style="font-size:16px;font-weight:800;">${monthLabel}</div>
    <div class="cal-nav">
      <button class="btn btn-secondary btn-sm" onclick="calNav(-1)"><i class="ti ti-chevron-left"></i></button>
      <button class="btn btn-secondary btn-sm" onclick="calToday()">Today</button>
      <button class="btn btn-secondary btn-sm" onclick="calNav(1)"><i class="ti ti-chevron-right"></i></button>
    </div>
  </div>
  <div class="cal-grid">
    ${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}
    ${cells.map(d => {
      if(d===null) return '<div class="cal-cell empty"></div>';
      const dateStr = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const isToday = dateStr === isoDate(TODAY);
      const events = state.bookings.filter(b=>b.date === dateStr);
      return `<div class="cal-cell ${isToday?'today':''}">
        <div class="cal-date">${d}</div>
        ${events.map(ev => `<div class="event-chip ${eventColorClass(ev.service)}">${esc(firstName(ev.name))} · ${esc(ev.service)}
          <div class="event-tooltip">${esc(ev.name)} — ${esc(ev.company)}<br>${esc(ev.service)}, ${fmtDate(ev.date)}</div>
        </div>`).join('')}
      </div>`;
    }).join('')}
  </div>
  `;
}
function eventColorClass(service){
  const s = service.toLowerCase();
  if(/agile|sprint|scrum/.test(s)) return '';
  if(/team|reset|change/.test(s)) return 'blue';
  if(/training|certif|workshop/.test(s)) return 'peach';
  return 'grey';
}
function calNav(dir){
  state.calMonth += dir;
  if(state.calMonth < 0){ state.calMonth = 11; state.calYear--; }
  if(state.calMonth > 11){ state.calMonth = 0; state.calYear++; }
  renderPage();
}
function calToday(){ state.calMonth = TODAY.getMonth(); state.calYear = TODAY.getFullYear(); renderPage(); }

/* ===================== ANALYTICS PAGE ===================== */

function renderAnalytics(){
  const contacts = state.contacts;
  const totalFound = contacts.length;
  const connected = contacts.filter(c=>c.connDate).length;
  const acceptRate = totalFound ? Math.round(connected/totalFound*100) : 0;
  let repliesCount=0, sentCount=0;
  contacts.forEach(c=>{ if(c.thread.m1){sentCount++; if(c.thread.m1.replied) repliesCount++;} if(c.thread.m2){sentCount++; if(c.thread.m2.replied) repliesCount++;} });
  const replyRate = sentCount ? Math.round(repliesCount/sentCount*100) : 0;
  const booked = state.bookings.length;
  const conversionRate = connected ? Math.round(booked/connected*100) : 0;
  const h = computeHealth();
  const dropped = state.deadContacts.length;

  const toneRows = [
    { tone:'Peer to peer', sent: contacts.filter(c=>c.seqId==='seniorLeaders' && (c.thread.m1||c.thread.m2)).length, booked: state.bookings.filter(b=>state.contacts.find(c=>c.id===b.contactId)?.seqId==='seniorLeaders').length },
    { tone:'Warm consultant', sent: contacts.filter(c=>c.seqId==='digitalTech' && (c.thread.m1||c.thread.m2)).length, booked: state.bookings.filter(b=>state.contacts.find(c=>c.id===b.contactId)?.seqId==='digitalTech').length },
    { tone:'Low pressure', sent: 0, booked: 0 }
  ];
  const maxSent = Math.max(1, ...toneRows.map(r=>r.sent));

  const ctaCounts = {};
  CTA_OPTIONS.forEach(o => ctaCounts[o] = state.bookings.filter(b=>b.cta===o).length);

  const serviceCounts = {};
  state.settings.services.forEach(s => serviceCounts[s] = state.bookings.filter(b=>b.service===s).length);
  const maxServiceCount = Math.max(1, ...Object.values(serviceCounts));

  const speedBuckets = { '3':0, '9':0, '10':0 };
  contacts.forEach(c=>{
    if(!c.connReqDate || !c.connDate) return;
    const d = daysBetween(c.connReqDate, c.connDate);
    if(d<=3) speedBuckets['3']++; else if(d<=9) speedBuckets['9']++; else speedBuckets['10']++;
  });
  const maxSpeed = Math.max(1, ...Object.values(speedBuckets));

  return `
  <div class="an-stats">
    <div class="an-stat"><div class="num">${totalFound}</div><div class="label">Total found</div></div>
    <div class="an-stat"><div class="num">${connected}</div><div class="label">Connected</div><div class="sub">${acceptRate}% accept rate</div></div>
    <div class="an-stat"><div class="num">${repliesCount}</div><div class="label">Replies</div><div class="sub">${replyRate}% reply rate</div></div>
    <div class="an-stat"><div class="num">${booked}</div><div class="label">Booked</div><div class="sub">${conversionRate}% conversion</div></div>
    <div class="an-stat"><div class="num">${h.avgDays}d</div><div class="label">Avg days to connect</div></div>
    <div class="an-stat"><div class="num">${dropped}</div><div class="label">Dropped</div></div>
  </div>

  <div class="two-col">
    <div class="card">
      <div class="section-title"><i class="ti ti-message-2"></i> Strategy tally</div>
      ${toneRows.map(r => `
        <div class="bar-row">
          <div class="bar-row-head"><span>${r.tone}</span><span class="muted">${r.sent} sent · ${r.booked} booked</span></div>
          <div class="bar-track"><div class="bar-fill" style="width:${(r.sent/maxSent*100)}%"></div></div>
        </div>
      `).join('')}
    </div>
    <div class="card">
      <div class="section-title"><i class="ti ti-target-arrow"></i> CTA performance</div>
      ${CTA_OPTIONS.map(o => `
        <div class="cta-row"><span>${esc(o)}</span><span class="count-pill ${ctaCounts[o]>0?'has':''}">${ctaCounts[o]}</span></div>
      `).join('')}
    </div>
  </div>

  <div class="two-col">
    <div class="card">
      <div class="section-title"><i class="ti ti-briefcase"></i> Bookings by service</div>
      ${state.settings.services.map(s => `
        <div class="bar-row">
          <div class="bar-row-head"><span>${esc(s)}</span><span class="muted">${serviceCounts[s]}</span></div>
          <div class="bar-track"><div class="bar-fill secondary" style="width:${(serviceCounts[s]/maxServiceCount*100)}%"></div></div>
        </div>
      `).join('')}
    </div>
    <div class="card">
      <div class="section-title"><i class="ti ti-gauge"></i> Connection speed</div>
      <div class="bar-row"><div class="bar-row-head"><span>Within 3 days</span><span class="muted">${speedBuckets['3']}</span></div><div class="bar-track"><div class="bar-fill" style="width:${speedBuckets['3']/maxSpeed*100}%"></div></div></div>
      <div class="bar-row"><div class="bar-row-head"><span>4 to 9 days</span><span class="muted">${speedBuckets['9']}</span></div><div class="bar-track"><div class="bar-fill" style="width:${speedBuckets['9']/maxSpeed*100}%"></div></div></div>
      <div class="bar-row"><div class="bar-row-head"><span>10+ days</span><span class="muted">${speedBuckets['10']}</span></div><div class="bar-track"><div class="bar-fill" style="width:${speedBuckets['10']/maxSpeed*100}%"></div></div></div>
    </div>
  </div>

  <div class="card" style="margin-bottom:16px;">

    <table style="width:100%;border-collapse:collapse;">

        <th style="text-align:left;padding:8px;font-size:11.5px;color:var(--muted);border-bottom:1px solid var(--border);">CTA used</th>
      </tr></thead>
      <tbody>
      ${state.bookings.length ? state.bookings.map(b => `<tr>
        <td style="padding:8px;border-bottom:1px solid var(--border);font-weight:700;">${esc(b.name)}</td>

      </tr>`).join('') : '<tr><td colspan="3" class="empty-state">No bookings yet</td></tr>'}
      </tbody>
    </table>
  </div>

  <div class="card">
    <div class="section-title"><i class="ti ti-bulb"></i> Strategy insights</div>
    <button class="btn btn-primary" onclick="runAnalysis()" id="analyseBtn"><i class="ti ti-sparkles"></i> Analyse strategy</button>

  </div>
  <div class="muted" style="font-size:11.5px;margin-top:10px;">Analysis run ${a.runAt} · Based on ${a.notesCount} conversion note${a.notesCount===1?'':'s'}</div>

async function runAnalysis(){
  const btn = document.getElementById('analyseBtn');
  const resultEl = document.getElementById('analysisResult');
  if(!btn || !resultEl) return;
  btn.disabled = true;
  btn.innerHTML = '<i class="ti ti-loader-2"></i> Analysing...';
  resultEl.innerHTML = '<div class="empty-state">Crunching pipeline data...</div>';

  const contacts = state.contacts;
  const stageDist = {};
  contacts.forEach(c => { const k = getRoadmapColumn(c); stageDist[k] = (stageDist[k]||0)+1; });
  const strategyBreakdown = state.sequences.map(s => `${s.name}: ${contacts.filter(c=>c.seqId===s.id).length} contacts, voice "${s.voice}"`).join('; ');
  const serviceCounts = {};
  state.settings.services.forEach(s => serviceCounts[s] = state.bookings.filter(b=>b.service===s).length);

  const prompt = `Analyse this LinkedIn outreach pipeline for a Perth Agile/change consultancy.\n\nNumeric data: ${contacts.length} contacts found, ${contacts.filter(c=>c.connDate).length} connected, ${state.bookings.length} booked, ${state.deadContacts.length} dropped.\nStage distribution: ${JSON.stringify(stageDist)}.\nStrategy breakdown: ${strategyBreakdown}.\nBookings by service: ${JSON.stringify(serviceCounts)}.\nConversion notes from booked contacts: ${state.bookings.map(b=>`"${b.notes}" (${b.cta})`).join(' | ') || 'none yet'}.\n\nReturn ONLY valid JSON in this exact shape: {"wins": string[], "gaps": string[], "losses": string[], "recommendations": string[]}. 2-4 items per array, each a single short sentence, no markdown.`;

  const fallback = () => ({
    wins: [
      "The Change Value Check is converting: Stuart Williams booked a Workshop directly off it.",
      "Senior Leaders sequence is holding a strong reply rate on message 2 (Heath Harnden, Tenille Frichot both replied).",
      "Connection-to-accept speed is healthy across most of the pipeline, well inside the 10 day window."
    ],
    gaps: [
      "Digital and Tech sequence has no bookings yet despite active conversations with Craig Humphrey and Claire Hall.",
      "Several contacts are sitting in Connection made with no message sent, worth pushing into Messaging.",
      "CTA selection is inconsistent, a few messaging-stage contacts have no CTA logged yet."
    ],
    losses: [
      "Two contacts were archived after 10+ days with no acceptance, both from the Product Owner and Transformation Lead columns.",
      "Hume Saunders is currently flagged and at risk of the same outcome."
    ],
    recommendations: [
      "Prioritise a follow-up push on the Digital and Tech sequence to get its first booking.",
      "Set a CTA the moment message 2 goes out, don't leave it until the reply comes in.",
      "Revisit connection requests sitting past 7 days before they hit the 10 day cutoff."
    ]
  });

  const raw = await callAI(prompt, 1000, null);
  let parsed = null;
  if(raw){
    try {
      const jsonMatch = raw.match(/\{[\s\S]*\}/);
      parsed = JSON.parse(jsonMatch ? jsonMatch[0] : raw);
    } catch(e){ parsed = null; }
  }
  if(!parsed) parsed = fallback();

  parsed.runAt = TODAY.toLocaleString('en-AU',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
  parsed.notesCount = state.bookings.filter(b=>b.notes).length;
  state.lastAnalysis = parsed;

  resultEl.innerHTML = renderAnalysisBlocks(parsed);
  btn.disabled = false;
  btn.innerHTML = '<i class="ti ti-sparkles"></i> Analyse strategy';
  toast('Strategy analysis complete', 'success');
}

async function runIntelligence(){
  const btn = document.getElementById('runIntelBtn');
  const original = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<i class="ti ti-loader-2"></i> Running...';
  document.getElementById('intelMeta').textContent = '';

  try {
    const res = await fetch('/api/intelligence', { method: 'POST' });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || ('Request failed with status '+res.status));

    renderIntelList('intelCampaigns', data.campaignSuggestions, 'No campaign suggestions came back.');
    renderIntelList('intelColdContacts', data.coldContacts, 'No cold contacts flagged.');
    renderIntelList('intelRelationshipHealth', data.relationshipHealth, 'No relationship health notes came back.');
    renderIntelDrafts(data.messageDrafts);
    renderIntelList('intelLearningInsights', data.learningInsights, 'No learning insights came back.');
    renderIntelList('intelOptimisation', data.optimisationSuggestions, 'No optimisation suggestions came back.');
    renderCampaignPerformance(data.campaignPerformance);

    const generatedAt = data.generatedAt ? new Date(data.generatedAt).toLocaleString('en-AU') : '';
    document.getElementById('intelMeta').textContent = `Based on ${data.contactCount ?? '—'} contacts and ${data.touchPointCount ?? '—'} touch points from Airtable${generatedAt ? ' · '+generatedAt : ''}`;
    toast('Intelligence updated', 'success');
  } catch(err){
    console.warn('Intelligence request failed:', err.message);
    document.getElementById('intelMeta').textContent = 'Could not run intelligence: ' + err.message;
    toast('Could not run intelligence: ' + err.message, 'warn');
  } finally {
    btn.disabled = false;
    btn.innerHTML = original;
  }
}

function renderIntelList(elId, items, emptyMsg){
  const el = document.getElementById(elId);
  if(!el) return;
  const list = Array.isArray(items) ? items : [];
  el.innerHTML = list.length ? list.map(i=>`<li>${esc(i)}</li>`).join('') : `<li class="muted">${esc(emptyMsg)}</li>`;
}

function renderIntelDrafts(drafts){
  const el = document.getElementById('intelMessageDrafts');
  if(!el) return;
  const list = Array.isArray(drafts) ? drafts : [];
  window.__intelDrafts = list;
  if(!list.length){
    el.innerHTML = '<span class="muted" style="font-size:12.5px;">No drafts came back.</span>';
    return;
  }
  el.innerHTML = list.map((d,i) => `
    <div class="intel-draft">
      <div class="intel-draft-head">
        <div class="intel-draft-name">${esc(d.contactName || 'Unknown contact')}</div>
        <button class="btn btn-secondary btn-sm" onclick="copyIntelDraft(${i})"><i class="ti ti-copy"></i> Copy</button>
      </div>

    </div>
  `).join('');
}

async function copyIntelDraft(idx){
  const draft = (window.__intelDrafts || [])[idx];
  if(!draft || !draft.draft) return;
  try {
    await navigator.clipboard.writeText(draft.draft);
  } catch(err){
    const ta = document.createElement('textarea');
    ta.value = draft.draft;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  }
  toast('Draft copied to clipboard', 'success');
}

/* ---- Learning Data uploads ---- */

const LEARNING_CONFIG = {
  customers: { endpoint: '/api/learn/customers', btnId: 'learnCustomersBtn', resultId: 'learnCustomersResult', label: 'Customer' },
  deals: { endpoint: '/api/learn/deals', btnId: 'learnDealsBtn', resultId: 'learnDealsResult', label: 'Deal' }
};

function csvRowsToObjects(rows){
  if(rows.length < 2) return [];
  const headers = rows[0].map(h => h.trim());
  return rows.slice(1).map(row => {
    const obj = {};
    headers.forEach((h,i) => { obj[h || `col${i+1}`] = (row[i] || '').trim(); });
    return obj;
  });
}

function handleLearningUpload(event, kind){
  const file = event.target.files && event.target.files[0];
  event.target.value = '';
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const rows = parseCsv(String(reader.result));
    const records = csvRowsToObjects(rows);
    if(!records.length){ toast('That CSV looks empty', 'warn'); return; }
    runLearningAnalysis(kind, records);
  };
  reader.onerror = () => toast('Could not read that file', 'warn');
  reader.readAsText(file);
}

async function runLearningAnalysis(kind, records){
  const cfg = LEARNING_CONFIG[kind];
  const btn = document.getElementById(cfg.btnId);
  const resultEl = document.getElementById(cfg.resultId);
  const original = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<i class="ti ti-loader-2"></i> Analysing...';
  resultEl.innerHTML = '';

  try {
    const res = await fetch(cfg.endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ records })
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || ('Request failed with status '+res.status));
    renderLearningResult(kind, data, records.length);
    toast(`${cfg.label} analysis complete`, 'success');
  } catch(err){
    resultEl.innerHTML = `<p class="muted" style="font-size:12px;color:#b3413a;">Could not analyse that file: ${esc(err.message)}</p>`;
    toast('Learning upload failed: ' + err.message, 'warn');
  } finally {
    btn.disabled = false;
    btn.innerHTML = original;
  }
}

function learningListSection(title, items){
  if(!Array.isArray(items) || !items.length) return '';
  return `<h5>${esc(title)}</h5><ul>${items.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>`;
}

function renderLearningResult(kind, data, recordCount){
  const cfg = LEARNING_CONFIG[kind];
  const el = document.getElementById(cfg.resultId);
  if(!el) return;
  let html = data.summary ? `<p style="font-size:12.5px;">${esc(data.summary)}</p>` : '';
  if(kind === 'customers'){
    html += learningListSection('Top ICP profiles', data.icpProfiles);
    html += learningListSection('Deal characteristics', data.dealCharacteristics);
    html += learningListSection('Patterns', data.patterns);
  } else {
    html += learningListSection('Product-ICP fit', data.productIcpMatches);
    html += learningListSection('Touch points before close', data.touchPointsBeforeClose);
    html += learningListSection('Best industries', data.bestIndustries);
    html += learningListSection('Seasonal patterns', data.seasonalPatterns);
  }
  html += `<div class="learning-meta muted">Based on ${recordCount} uploaded rows &middot; saved to Airtable Learning Data</div>`;
  el.innerHTML = html;
}

/* ===================== ANTHROPIC API WRAPPER ===================== */

async function callAI(promptText, maxTokens, fallbackFn, images){
  try {
    const content = (images || []).map(img => ({
      type: 'image',
      source: { type: 'base64', media_type: img.mediaType, data: img.base64 }
    }));
    content.push({ type: 'text', text: promptText });
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-opus-4-6',
        max_tokens: maxTokens,
        messages: [{ role:'user', content }]
      })
    });
    if(!res.ok) throw new Error('API error '+res.status);
    const data = await res.json();
    const block = data.content && data.content.find(b => b.type === 'text');
    if(!block) throw new Error('No text content in response');
    return block.text.trim();
  } catch(err){
    console.warn('AI call unavailable, using local fallback:', err.message);
    return fallbackFn ? fallbackFn() : null;
  }
}
