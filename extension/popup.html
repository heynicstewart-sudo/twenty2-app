<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light; }
  body { width: 320px; margin: 0; padding: 14px; font: 13px/1.4 -apple-system, system-ui, sans-serif; color: #1a1a2e; background: #fff; }
  h1 { font-size: 13px; margin: 0 0 2px; }
  .muted { color: #777; font-size: 11.5px; }
  .row { display: flex; justify-content: space-between; align-items: center; margin: 8px 0; }
  button { font: inherit; border: 1px solid #d5d9dd; background: #f5f7f8; border-radius: 7px; padding: 7px 10px; cursor: pointer; }
  button.primary { background: #2A6B7C; color: #fff; border-color: #2A6B7C; }
  button:disabled { opacity: .5; cursor: default; }
  button.wide { width: 100%; margin-top: 6px; }
  .bar { height: 6px; background: #eef0f2; border-radius: 3px; margin-top: 6px; overflow: hidden; }
  .bar > div { height: 100%; background: #2A6B7C; width: 0; }
  #log { max-height: 130px; overflow: auto; border-top: 1px solid #eee; margin-top: 10px; padding-top: 6px; font-size: 11px; }
  #log div { padding: 2px 0; }
  .ok { color: #1a7a3a; } .bad { color: #b4432a; }
  a { color: #2A6B7C; }
  .caps { display: flex; gap: 10px; font-size: 11px; }
  .caps b { font-size: 13px; }
  hr { border: 0; border-top: 1px solid #eee; margin: 10px 0; }
  #status { font-size: 11.5px; }
</style>
</head>
<body>
  <h1>T2C Outreach — LinkedIn capture</h1>
  <div class="muted" id="acct">Not connected. <a href="#" id="openOpts">Set token</a></div>

  <div class="caps" style="margin-top:10px;">
    <div>Today <b id="capDay">–</b><span class="muted">/<span id="capDayMax">–</span></span></div>
    <div>This hour <b id="capHr">–</b><span class="muted">/<span id="capHrMax">–</span></span></div>
  </div>

  <hr>
  <div class="row"><strong>Batch capture</strong><span class="muted" id="queueN">–</span></div>
  <div class="muted">Opens each due profile in a background tab, one at a time, ~40s apart, reads About + Experience, syncs it. Read-only.</div>
  <button class="primary wide" id="startProfiles">Capture due profiles</button>
  <div class="bar"><div id="prog"></div></div>
  <div id="status" class="muted" style="margin-top:4px;"></div>
  <button class="wide" id="stop" style="display:none;">Stop batch</button>

  <hr>
  <button class="wide" id="syncConns">Sync recent connections</button>
  <button class="wide" id="syncThread">Sync the open conversation</button>

  <div id="log"></div>

  <script src="popup.js"></script>
</body>
</html>
